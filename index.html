   信号 = 0.55 * 本题平滑错误率 + 0.45 * 知识点平滑错误率。
   衰减 = max(0.18, 0.82 ^ 连续答对次数)，所以会下降但不会变成 0。
   未做题系数 = 1.35，已做题为 1。
   每一轮先按 exploreRatio 抽出未做题，其余按权重无放回抽取，同一轮不重复。 */
var SMART_ROUND_SIZE = 20;
var SMART_EXPLORE_RATIO = 0.25;
var SMART_MIN_WEIGHT = 0.18;
var SMART_STREAK_DECAY = 0.82;
var SMART_WEAK_MIN_ATTEMPTS = 3;
var SMART_WEAK_SMOOTHED = 0.34;
var SMART_STAT_MAX = 100000;

function emptySmartStats(){
  return {schema:1, questions:{}, points:{}};
}
function emptySmartStat(){
  return {attempts:0, wrong:0, correct:0, streak:0, lastPracticed:null};
}
function cloneSmartStat(rec){
  if(!rec) return null;
  return {
    attempts:rec.attempts,
    wrong:rec.wrong,
    correct:rec.correct,
    streak:rec.streak,
    lastPracticed:rec.lastPracticed==null?null:rec.lastPracticed
  };
}
function cloneSmartStats(stats){
  var out=emptySmartStats();
  var q=stats&&stats.questions||{};
  var p=stats&&stats.points||{};
  Object.keys(q).forEach(function(k){out.questions[k]=cloneSmartStat(q[k]);});
  Object.keys(p).forEach(function(k){out.points[k]=cloneSmartStat(p[k]);});
  return out;
}
function smartStatError(rec, label){
  if(!rec || typeof rec!=='object' || Array.isArray(rec)) return label+' 必须是对象';
  var allow={attempts:1,wrong:1,correct:1,streak:1,lastPracticed:1};
  var keys=Object.keys(rec);
  for(var i=0;i<keys.length;i++) if(!allow[keys[i]]) return label+' 含未知字段 '+keys[i];
  if(!Number.isInteger(rec.attempts)||rec.attempts<0||rec.attempts>SMART_STAT_MAX) return label+' 的作答次数无效';
  if(!Number.isInteger(rec.wrong)||rec.wrong<0||rec.wrong>rec.attempts) return label+' 的错误次数无效';
  if(!Number.isInteger(rec.correct)||rec.correct<0||rec.correct>rec.attempts) return label+' 的正确次数无效';
  if(rec.correct+rec.wrong!==rec.attempts) return label+' 的对错次数之和必须等于作答次数';
  if(!Number.isInteger(rec.streak)||rec.streak<0||rec.streak>rec.correct) return label+' 的连续答对次数无效';
  if(rec.lastPracticed!=null && (typeof rec.lastPracticed!=='number' || !Number.isFinite(rec.lastPracticed) || rec.lastPracticed<0)) return label+' 的最近练习时间无效';
  return '';
}
function validateSmartStats(stats, total, kpIds){
  if(!stats || typeof stats!=='object' || Array.isArray(stats)) return {ok:false, error:'统计必须是对象'};
  if(stats.schema!==1) return {ok:false, error:'统计版本不受支持'};
  if(!stats.questions || typeof stats.questions!=='object' || Array.isArray(stats.questions)) return {ok:false, error:'题目统计无效'};
  if(!stats.points || typeof stats.points!=='object' || Array.isArray(stats.points)) return {ok:false, error:'知识点统计无效'};
  var allowed={};
  if(Array.isArray(kpIds)) kpIds.forEach(function(id){allowed[id]=1;});
  else if(kpIds) Object.keys(kpIds).forEach(function(id){allowed[id]=1;});
  var qkeys=Object.keys(stats.questions);
  if(qkeys.length>total) return {ok:false, error:'题目统计数量异常'};
  for(var i=0;i<qkeys.length;i++){
    var key=qkeys[i];
    var idx=Number(key);
    if(!Number.isInteger(idx) || String(idx)!==key || idx<0 || idx>=total) return {ok:false, error:'题目下标无效：'+key};
    var err=smartStatError(stats.questions[key], '题目 '+key);
    if(err) return {ok:false, error:err};
  }
  var pkeys=Object.keys(stats.points);
  for(var j=0;j<pkeys.length;j++){
    if(!allowed[pkeys[j]]) return {ok:false, error:'未知知识点：'+pkeys[j]};
    var perr=smartStatError(stats.points[pkeys[j]], '知识点 '+pkeys[j]);
    if(perr) return {ok:false, error:perr};
  }
  return {ok:true};
}
function applySmartAnswer(stats, idx, correct, now, assign){
  var next=cloneSmartStats(stats||emptySmartStats());
  var key=String(idx);
  var q=next.questions[key]||emptySmartStat();
  q.attempts+=1;
  if(correct){q.correct+=1;q.streak+=1;}
  else{q.wrong+=1;q.streak=0;}
  q.lastPracticed=now;
  next.questions[key]=q;
  var kp=assign && assign[idx];
  if(kp){
    var p=next.points[kp]||emptySmartStat();
    p.attempts+=1;
    if(correct){p.correct+=1;p.streak+=1;}
    else{p.wrong+=1;p.streak=0;}
    p.lastPracticed=now;
    next.points[kp]=p;
  }
  return next;
}
function betterSmartStat(a, b){
  if(!a) return b?cloneSmartStat(b):null;
  if(!b) return cloneSmartStat(a);
  if(a.attempts!==b.attempts) return cloneSmartStat(a.attempts>b.attempts?a:b);
  var ta=a.lastPracticed||0, tb=b.lastPracticed||0;
  if(ta!==tb) return cloneSmartStat(ta>tb?a:b);
  if(a.wrong!==b.wrong) return cloneSmartStat(a.wrong>b.wrong?a:b);
  return cloneSmartStat(a);
}
function recomputeSmartPoints(questions, assign, localPoints, incomingPoints){
  var points={};
  Object.keys(questions).forEach(function(k){
    var kp=assign[Number(k)];
    if(!kp) return;
    if(!points[kp]) points[kp]=emptySmartStat();
    var q=questions[k];
    points[kp].attempts+=q.attempts;
    points[kp].wrong+=q.wrong;
    points[kp].correct+=q.correct;
    if(q.lastPracticed!=null && (points[kp].lastPracticed==null || q.lastPracticed>points[kp].lastPracticed))
      points[kp].lastPracticed=q.lastPracticed;
  });
  Object.keys(points).forEach(function(kp){
    var chosen=betterSmartStat(localPoints&&localPoints[kp], incomingPoints&&incomingPoints[kp]);
    var streak=chosen?chosen.streak:0;
    if(chosen && points[kp].wrong>chosen.wrong) streak=0;
    if(streak>points[kp].correct) streak=points[kp].correct;
    points[kp].streak=streak;
  });
  return points;
}
function mergeSmartStats(local, incoming, assign){
  var base=cloneSmartStats(local||emptySmartStats());
  if(!incoming) return base;
  var keys={};
  Object.keys(base.questions).forEach(function(k){keys[k]=1;});
  Object.keys(incoming.questions||{}).forEach(function(k){keys[k]=1;});
  var questions={};
  Object.keys(keys).forEach(function(k){
    questions[k]=betterSmartStat(base.questions[k], (incoming.questions||{})[k]);
  });
  return {
    schema:1,
    questions:questions,
    points:recomputeSmartPoints(questions, assign||[], base.points, incoming.points||{})
  };
}
function smoothedRate(rec){
  if(!rec || !rec.attempts) return 0;
  return (rec.wrong+1)/(rec.attempts+2);
}
function smartQuestionWeight(idx, stats, assign){
  stats=stats||emptySmartStats();
  var q=(stats.questions||{})[String(idx)]||emptySmartStat();
  var kp=assign?assign[idx]:null;
  var p=kp&&stats.points&&stats.points[kp]?stats.points[kp]:emptySmartStat();
  var signal=0.55*smoothedRate(q)+0.45*smoothedRate(p);
  var boost=1+3*signal;
  var decay=Math.max(SMART_MIN_WEIGHT, Math.pow(SMART_STREAK_DECAY, q.streak||0));
  var unseen=q.attempts?1:1.35;
  var weight=boost*decay*unseen;
  return weight>0?weight:SMART_MIN_WEIGHT;
}
function mulberry32(seed){
  var a=seed>>>0;
  return function(){
    a|=0; a=a+0x6D2B79F5|0;
    var t=Math.imul(a^a>>>15, 1|a);
    t=t+Math.imul(t^t>>>7, 61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
}
function pickWeighted(bag, rng){
  var total=0, i;
  for(i=0;i<bag.length;i++) total+=bag[i].weight;
  if(!(total>0)) return bag[Math.min(bag.length-1, Math.floor(rng()*bag.length))];
  var r=rng()*total, acc=0;
  for(i=0;i<bag.length;i++){
    acc+=bag[i].weight;
    if(r<acc) return bag[i];
  }
  return bag[bag.length-1];
}
function explainSmartPick(idx, stats, assign, tag){
  var q=(stats.questions||{})[String(idx)]||emptySmartStat();
  var kp=assign?assign[idx]:'';
  var p=kp&&stats.points&&stats.points[kp]?stats.points[kp]:emptySmartStat();
  var base='本题已记录作答 '+q.attempts+' 次、答错 '+q.wrong+' 次、连续答对 '+q.streak+' 次；该知识点作答 '+p.attempts+' 次、答错 '+p.wrong+' 次。';
  var tail={
    explore:'这一题占用本轮的未做题名额，避免只在错题里打转。',
    'weak-question':'本题自己的平滑错误率较高，所以权重大。',
    sibling:'同一知识点里其他题已经错得比较多，这道相关题会一起提高出现概率。',
    'weak-point':'该知识点平滑错误率较高，其中的题目会更多出现。',
    'keep-alive':'连续答对后权重按每次 0.82 下降，最低仍保留 0.18，不会消失。',
    review:'它目前没有明显高错误信号，仍以正的权重参加抽取，用来复习和探索。'
  };
  return base+(tail[tag]||tail.review);
}
function smartPickTag(idx, stats, assign, exploreIdx){
  var q=(stats.questions||{})[String(idx)]||emptySmartStat();
  var kp=assign?assign[idx]:'';
  var p=kp&&stats.points&&stats.points[kp]?stats.points[kp]:emptySmartStat();
  var qErr=smoothedRate(q), pErr=smoothedRate(p);
  if(exploreIdx.indexOf(idx)>=0) return 'explore';
  if(q.attempts>0 && qErr>=pErr && qErr>=0.45) return 'weak-question';
  if(q.attempts===0 && pErr>=0.45) return 'sibling';
  if(pErr>=0.45) return 'weak-point';
  if((q.streak||0)>=3) return 'keep-alive';
  return 'review';
}
function planSmartRound(opts){
  opts=opts||{};
  var count=opts.count==null?SMART_ROUND_SIZE:opts.count;
  var assign=opts.assign||[];
  var stats=opts.stats||emptySmartStats();
  var exploreRatio=opts.exploreRatio==null?SMART_EXPLORE_RATIO:opts.exploreRatio;
  var rng=opts.rng||Math.random;
  var pool=[], seen={};
  (opts.pool||[]).forEach(function(i){
    if(seen[i]||!Number.isInteger(i)) return;
    seen[i]=1; pool.push(i);
  });
  if(!pool.length||count<=0) return {items:[], note:pool.length?'请求题量为 0':'空池'};
  if(count>pool.length) count=pool.length;
  function attemptsOf(i){
    var rec=(stats.questions||{})[String(i)];
    return rec?rec.attempts:0;
  }
  function draw(source, n){
    var bag=source.filter(function(i){return !seenPick[i];}).map(function(i){
      return {idx:i, weight:smartQuestionWeight(i, stats, assign)};
    });
    var got=[];
    for(var k=0;k<n && bag.length;k++){
      var choice=pickWeighted(bag, rng);
      bag=bag.filter(function(x){return x.idx!==choice.idx;});
      seenPick[choice.idx]=1;
      got.push(choice.idx);
    }
    return got;
  }
  var seenPick={};
  var unseen=pool.filter(function(i){return attemptsOf(i)===0;});
  var exploreN=Math.min(Math.max(0, Math.round(count*exploreRatio)), unseen.length, count);
  var exploreIdx=draw(unseen, exploreN);
  var rest=draw(pool, count-exploreIdx.length);
  var order=exploreIdx.concat(rest);
  return {
    items:order.map(function(idx){
      var tag=smartPickTag(idx, stats, assign, exploreIdx);
      return {idx:idx, kp:assign[idx]||'', weight:smartQuestionWeight(idx, stats, assign), tag:tag, why:explainSmartPick(idx, stats, assign, tag)};
    }),
    note:order.length+' 题，其中未做题名额 '+exploreIdx.length+' 题'
  };
}
function weakKnowledgePoints(stats, catalog, minAttempts){
  if(minAttempts==null) minAttempts=SMART_WEAK_MIN_ATTEMPTS;
  var list=[];
  (catalog||[]).forEach(function(kp){
    var p=stats&&stats.points&&stats.points[kp.id];
    if(!p||p.attempts<minAttempts) return;
    var smoothed=smoothedRate(p);
    if(smoothed<SMART_WEAK_SMOOTHED) return;
    list.push({
      id:kp.id, name:kp.name, group:kp.group, attempts:p.attempts, wrong:p.wrong,
      correct:p.correct, streak:p.streak, lastPracticed:p.lastPracticed, smoothed:smoothed,
      why:'已有 '+p.attempts+' 次真实作答、答错 '+p.wrong+' 次。平滑错误率 '+Math.round(smoothed*100)+'%。少于 '+minAttempts+' 次的知识点不会出现在这张薄弱榜上。连续答对 '+p.streak+' 次后抽中概率下降，但不会降到 0。'
    });
  });
  list.sort(function(a,b){
    if(b.smoothed!==a.smoothed) return b.smoothed-a.smoothed;
    if(b.wrong!==a.wrong) return b.wrong-a.wrong;
    return a.id<b.id?-1:a.id>b.id?1:0;
  });
  return list;
}

/* 学习记录备份格式：精确保存原始四个键；身份哈希由构建器注入。 */
function rawLearningRecords(){
  var out={};RECORD_KEYS.forEach(function(k){out[k]=localStorage.getItem(k);});return out;
}
function recordCompatibilityNotice(){
  var v=localStorage.getItem('jiaoan_version');
  var text='原有题目顺序、下标和版本均未改变；浏览器记录不会因启动或重练而重置。';
  if(v!==null && v!=='v2') text='检测到旧/未知记录版本 '+v+'：原记录原样保留，不猜测题目映射。本轮可练习，但不会覆写历史；请先导出备份核对。';
  return '<p style="font-size:13px;color:var(--warning);line-height:1.8;">'+esc(text)+'</p>';
}
function decodeLearningRecords(storage){
  if(!storage || typeof storage!=='object' || Array.isArray(storage)) throw Error('缺少 storage 对象');
  var ks=Object.keys(storage).sort();
  if(JSON.stringify(ks)!==JSON.stringify(RECORD_KEYS.slice().sort())) throw Error('必须包含完整四个记录键，且不得含未知键');
  RECORD_KEYS.forEach(function(k){if(storage[k]!==null && typeof storage[k]!=='string')throw Error(k+' 必须为原始字符串或 null');});
  var version=storage.jiaoan_version;
  if(version!==null && (version.length>100 || /[\u0000-\u001f]/.test(version))) throw Error('版本字段无效');
  function json(key, fallback){
    if(storage[key]===null)return fallback;
    try{return JSON.parse(storage[key]);}catch(e){throw Error(key+' 不是合法 JSON');}
  }
  function validIdx(i){return Number.isInteger(i) && i>=0 && i<TOTAL;}
  var answered=json('jiaoan_answered',{}), wrong=json('jiaoan_wrong',[]), correct=json('jiaoan_correct',[]);
  if(!answered || typeof answered!=='object' || Array.isArray(answered))throw Error('answered 必须为对象');
  Object.keys(answered).forEach(function(k){
    var i=Number(k), a=answered[k];
    if(!validIdx(i) || String(i)!==k) throw Error('答题下标无效：'+k);
    if(typeof a!=='string' || !/^[A-E]{1,5}$/.test(a) || new Set(a).size!==a.length) throw Error('答案格式无效：'+k);
    var q=QDATA[i];
    if(q.t!=='多选题' && a.length!==1)throw Error('非多选题不能有多个选项：'+k);
    var choices=q.t==='判断题'?['A','B']:Object.keys(q.o||{});
    if(choices.length && a.split('').some(function(c){return choices.indexOf(c)<0;}))throw Error('答案选项不属于该题：'+k);
  });
  [wrong,correct].forEach(function(arr){
    if(!Array.isArray(arr) || arr.some(function(i){return !validIdx(i);}) || new Set(arr).size!==arr.length)throw Error('错题/正确题下标必须合法且不重复');
  });
  return {answered:answered,wrong:wrong,correct:correct,version:version};
}
function historyWritable(){
  try{
    var raw=rawLearningRecords();decodeLearningRecords(raw);
    if(raw.jiaoan_version!==null && raw.jiaoan_version!=='v2')return false;
    return true;
  }catch(e){return false;}
}
function exportLearningRecords(){
  var stats=null, statsRaw=null;
  if(typeof state!=='undefined' && state && state.smartLocked){
    try{statsRaw=localStorage.getItem('jiaoan_stats');}catch(e){statsRaw=null;}
  }else if(typeof state!=='undefined' && state && state.smart){
    stats=cloneSmartStats(state.smart);
  }
  var payload={format:'jiaoan-learning-records',schema:2,identity:BANK_IDENTITY,
    // 身份哈希确认当前题库文件，不能据此断言未知旧版记录映射正确。
    // stats 只含智慧刷题启用后的真实提交，不从旧的最后一次答案回填。
    exported_at:new Date().toISOString(),storage:rawLearningRecords(),stats:stats,
    stats_note:'统计只包含启用后的真实提交。旧记录的最后一次答案不会被换成多次错误。重复导入同一份备份不会把次数相加。'};
  if(statsRaw!=null) payload.stats_raw=statsRaw;
  downloadBlob('交安学习记录备份.json',JSON.stringify(payload,null,2),'application/json;charset=utf-8');
  return payload;
}
function compatibleRecordVersion(version){
  return version===null || version==='v2';
}
function validateLearningBackup(data){
  if(!data || data.format!=='jiaoan-learning-records' || (data.schema!==1 && data.schema!==2))throw Error('不是支持的学习记录备份');
  if(!data.identity || data.identity.sha256!==BANK_IDENTITY.sha256 || data.identity.count!==TOTAL)throw Error('题库身份不匹配：拒绝导入，不能猜测下标映射');
  var parsed=decodeLearningRecords(data.storage);
  var localVersion=null;
  try{localVersion=localStorage.getItem('jiaoan_version');}catch(e){localVersion=null;}
  // 题库身份哈希负责确认下标。null 与 v2 是同一代：本页启动和保存都不写版本键，旧备份中的原始字符串 v2 不能要求本机已经存着同一个键。
  if(!compatibleRecordVersion(parsed.version))throw Error('未知旧版本不能自动合并；原文件及记录均保留');
  if(!compatibleRecordVersion(localVersion))throw Error('本机记录版本未知，已原样保留；拒绝导入，请先核对旧题库映射');
  parsed.schema=data.schema;
  parsed.localVersion=localVersion;
  parsed.versionNote='';
  if(localVersion===null && parsed.version==='v2'){
    parsed.versionNote='本机原先没有 jiaoan_version。这份 v2 备份与当前题库身份一致，按原下标合并，不改题目顺序，也不把已做题换算成多次作答。合并成功后才写入 v2。';
  }else if(localVersion==='v2' && parsed.version===null){
    parsed.versionNote='备份没有版本键。题库身份与本机 v2 记录一致，按原下标合并；本机版本键保持 v2。';
  }
  parsed.stats=null;
  // 旧 schema 1 没有统计。即使文件里夹了 stats 也不读取，避免把历史最后答案或来历不明的次数算进来。
  if(data.schema===2 && data.stats!=null){
    var checked=validateSmartStats(data.stats, TOTAL, smartKpIds());
    if(!checked.ok) throw Error('统计无法合并：'+checked.error);
    parsed.stats=data.stats;
  }
  return parsed;
}
function mergeLearningBackup(data, explicitlyMerge){
  if(explicitlyMerge!==true)throw Error('必须明确选择安全合并，不会默认覆盖');
  var incoming=validateLearningBackup(data);
  var before=rawLearningRecords();
  var existing=decodeLearningRecords(before);
  var answered=Object.assign({},incoming.answered,existing.answered); // 本机冲突答案优先
  var wrong=Array.from(new Set(existing.wrong.concat(incoming.wrong))).sort(function(a,b){return a-b;});
  var correct=Array.from(new Set(existing.correct.concat(incoming.correct))).filter(function(i){return wrong.indexOf(i)<0;}).sort(function(a,b){return a-b;});
  // 校验通过后才备份并写入。失败时恢复四个记录键，不留下新的版本值。
  // 统计按题目保留次数较高的那一份，不把两份次数相加。没有 stats 的旧备份不改现有统计。
  exportLearningRecords();
  var beforeStats=null;
  try{beforeStats=localStorage.getItem('jiaoan_stats');}catch(e){beforeStats=null;}
  try{
    localStorage.setItem('jiaoan_answered',JSON.stringify(answered));
    localStorage.setItem('jiaoan_wrong',JSON.stringify(wrong));
    localStorage.setItem('jiaoan_correct',JSON.stringify(correct));
    if(incoming.stats){
      if(state.smartLocked) throw Error('本机统计格式异常，已保留原始统计，本次不合并统计');
      var mergedStats=mergeSmartStats(state.smart, incoming.stats, KMAP.assign);
      var checked=validateSmartStats(mergedStats, TOTAL, smartKpIds());
      if(!checked.ok) throw Error(checked.error);
      localStorage.setItem('jiaoan_stats',JSON.stringify(mergedStats));
      state.smart=mergedStats;
    }
    if(before.jiaoan_version===null && incoming.version==='v2') localStorage.setItem('jiaoan_version','v2');
  }catch(e){
    RECORD_KEYS.forEach(function(k){if(before[k]===null)localStorage.removeItem(k);else localStorage.setItem(k,before[k]);});
    if(beforeStats===null) localStorage.removeItem('jiaoan_stats');
    else localStorage.setItem('jiaoan_stats', beforeStats);
    if(beforeStats===null) state.smart=emptySmartStats();
    else {try{state.smart=JSON.parse(beforeStats);}catch(err){state.smart=emptySmartStats();}}
    throw Error('保存失败，已尝试恢复原记录：'+e.message);
  }
  state.answered=answered;state.wrong=wrong;state.correct=correct;state.quiz=null;
  return {answered:Object.keys(answered).length,wrong:wrong.length,correct:correct.length,versionNote:incoming.versionNote||''};
}

function shuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){

  }
  return a;
}

    html += '</div><div style="margin-top:12px;text-align:center;"><button class="btn btn-primary" id="submitMC" onclick="submitMC('+q.idx+')" disabled>确认答案</button></div>';
    html += '<div class="answer-reveal" id="answerReveal"></div>';
  } else if(q.t === '单选题'){
    if(q.o && Object.keys(q.o).length>0){
      var opts2 = q.o;

      html += '<div class="q-section">📝 '+esc(q.s)+'</div><span class="q-type-badge sc">单选题</span>';

        html += '<div class="option" data-key="'+k+'" onclick="answerSC('+q.idx+',\''+k+'\',this)"><div class="option-label">'+k+'</div><div class="option-text">'+esc(opts2[k]||'')+'</div></div>';
      });

    } else {
      html += '<div class="q-section">📝 '+esc(q.s)+'</div><span class="q-type-badge sc">单选题（答案速记）</span>';
      html += '<div class="q-text"><span class="q-num">'+cur+'.</span> '+esc(q.q)+'</div>';
      html += '<div style="text-align:center;padding:20px;"><button class="btn btn-primary btn-lg" onclick="revealSCAnswer('+q.idx+')">查看答案</button></div>';
      html += '<div class="answer-reveal" id="answerReveal"></div>';
    }
  }
  html += '</div><div class="quiz-nav"><button class="btn btn-default" onclick="quitQuiz()">退出</button><div style="display:flex;gap:8px;">';
  if(quiz.current>0) html += '<button class="btn btn-default btn-sm" onclick="prevQuestion()">上一题</button>';
  html += '<button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" style="display:inline-flex;">'+(cur<total?'下一题（可跳过）':'查看结果')+'</button></div></div>';
  document.getElementById('mainContent').innerHTML = html;
  if(roundAnswers()[q.idx] !== undefined) restoreAnswer(q);

}
function restoreAnswer(q){
  var ans = roundAnswers()[q.idx];
  var reveal = document.getElementById('answerReveal');
  var nextBtn = document.getElementById('nextBtn');
  if(q.t === '判断题'){
    var btns = document.querySelectorAll('.tf-btn');
    var uc = (ans === q.a);
    btns.forEach(function(b,i){
      var val = i===0?'A':'B';
      if(val === ans) b.classList.add(uc?'correct':'wrong');
      if(val === q.a) b.classList.add('correct');
      b.style.pointerEvents='none';
    });
    showReveal(reveal, uc, q, ans);
    if(nextBtn) nextBtn.style.display='inline-flex';
  } else if(q.t === '多选题'){
    var opts = document.querySelectorAll('.option');
    var ic = isCorrectAns(ans, q);
    opts.forEach(function(o){
      var k = o.dataset.key;
      if(ans.indexOf(k)>=0) o.classList.add(ic?'selected':'wrong');
      if(q.a.indexOf(k)>=0) o.classList.add('correct');
      o.style.pointerEvents='none';
    });
    var sb = document.getElementById('submitMC');
    if(sb) sb.style.display='none';
    showReveal(reveal, ic, q, ans);
    if(nextBtn) nextBtn.style.display='inline-flex';
  } else if(q.t === '单选题' && q.o && Object.keys(q.o).length>0){
    var opts3 = document.querySelectorAll('.option');
    var ic2 = ans === q.a;
    opts3.forEach(function(o){
      var k = o.dataset.key;
      if(k === ans) o.classList.add(ic2?'correct':'wrong');
      if(k === q.a) o.classList.add('correct');
      o.style.pointerEvents='none';
    });
    showReveal(reveal, ic2, q, ans);
    if(nextBtn) nextBtn.style.display='inline-flex';
  } else if(q.t === '单选题'){
    revealSCAnswer(q.idx);
  }
}
function showReveal(el, ic, q, userAns){

  if(!ic && q.t==='判断题') el.innerHTML += '<div class="ar-text" style="margin-top:4px;">你的答案：'+(userAns==='A'?'正确':'错误')+'</div>';

var mcSelected = [];
function answerTF(idx, isTrue, el){

function toggleOption(key, el){
  var qidx = state.quiz.questions[state.quiz.current].idx;
  if(roundAnswers()[qidx] !== undefined) return;
  var idx = mcSelected.indexOf(key);
  if(idx >= 0){mcSelected.splice(idx,1);el.classList.remove('selected');}

function submitMC(idx){
  if(roundAnswers()[idx] !== undefined || mcSelected.length === 0) return;

  recordAnswer(idx, userAns, q);
  var ic = isCorrectAns(userAns, q);
  var opts = document.querySelectorAll('.option');
  opts.forEach(function(o){
    o.style.pointerEvents='none';
    var k = o.dataset.key;
    if(userAns.indexOf(k)>=0) o.classList.add(ic?'selected':'wrong');
    if(q.a.indexOf(k)>=0) o.classList.add('correct');
  });

  mcSelected = [];
}
function answerSC(idx, key, el){
  if(roundAnswers()[idx] !== undefined) return;
  var q = copyQ(QDATA[idx], idx);
  recordAnswer(idx, key, q);
  var ic = key === q.a;
  var opts = document.querySelectorAll('.option');
  opts.forEach(function(o){
    o.style.pointerEvents='none';
    var k = o.dataset.key;
    if(k === key) o.classList.add(ic?'correct':'wrong');
    if(k === q.a) o.classList.add('correct');

  document.getElementById('nextBtn').style.display='inline-flex';

function revealSCAnswer(idx){

function recordAnswer(idx, userAns, q, isReadOnly){
  if(isReadOnly) return;
  roundAnswers()[idx] = userAns;
  if(!historyWritable()){showToast('原记录版本未知或格式异常：已保留原始记录，本轮不写历史，请先导出备份');return;}
  state.answered[idx] = userAns;
  var ic = isReadOnly || isCorrectAns(userAns, q);
  if(ic){
    if(state.correct.indexOf(idx)<0) state.correct.push(idx);
    var wi = state.wrong.indexOf(idx);
    if(wi>=0) state.wrong.splice(wi,1);
  } else {
    if(state.wrong.indexOf(idx)<0) state.wrong.push(idx);
    var ci = state.correct.indexOf(idx);
    if(ci>=0) state.correct.splice(ci,1);
  }
  saveState();
  if(state.smartLocked) return;
  state.smart=applySmartAnswer(state.smart, idx, isCorrectAns(userAns, q), Date.now(), KMAP.assign);
  try{localStorage.setItem('jiaoan_stats', JSON.stringify(state.smart));}catch(e){}
}

function renderQList(){
  var container = document.getElementById('qListContainer');
  var qs = QDATA.map(copyQ);

  if(qFilter.type!=='all') qs = qs.filter(function(q){return q.t===qFilter.type;});
  var kw = qFilter.kw;
  if(kw){
    qs = qs.filter(function(q){
      var txt = q.q + ' ' + q.s + ' ' + (q.bg||'');
      if(q.o) Object.keys(q.o).forEach(function(k){txt += ' '+q.o[k];});
      return txt.indexOf(kw)>=0;
    });
  }

function essStat(t){var done=0,ok=0;t.q.forEach(function(i){if(state.answered[i]!==undefined)done++;if(state.correct.indexOf(i)>=0)ok++;});return{done:done,ok:ok,total:t.q.length};}

function downloadBlob(filename, text, mime){
  var blob = new Blob([text], {type: mime || 'text/plain;charset=utf-8'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function buildWrongBankPayload(){
  var items = [];
  state.wrong.forEach(function(idx){
    var q = QDATA[idx];
    if(!q) return;
    var stem = (q.q || '').replace(/\n/g, ' ').trim();
    if(stem.length > 80) stem = stem.slice(0, 80) + '…';
    items.push({
      idx: idx,
      section: q.s,
      type: q.t,
      num: QUESTION_NUMBERS[idx],
      question: stem,
      answer: q.a
    });
  });
  return {
    wrong: state.wrong.slice(),
    items: items,
    updated_at: new Date().toISOString(),
    source: 'jiaoan_quiz_page',
    meta: { count: items.length, total_bank: TOTAL, version: localStorage.getItem('jiaoan_version') || '' }
  };
}
function computeWrongAnalysis(){
  var idxs = state.wrong.slice();
  var secWrong = {}, typeWrong = {}, secTot = {}, moduleWrong = {}, topicWrong = {};
  var unmatched = 0;
  var topicMap = {}; // idx -> topics[]
  ESS.topics.forEach(function(t){
    (t.q || []).forEach(function(i){
      if(!topicMap[i]) topicMap[i] = [];
      topicMap[i].push(t);
    });
  });
  QDATA.forEach(function(q){ secTot[q.s] = (secTot[q.s] || 0) + 1; });
  idxs.forEach(function(i){
    var q = QDATA[i];
    if(!q) return;
    secWrong[q.s] = (secWrong[q.s] || 0) + 1;
    typeWrong[q.t] = (typeWrong[q.t] || 0) + 1;
    var ts = topicMap[i] || [];
    if(!ts.length){ unmatched++; return; }
    var seenT = {}, seenM = {};
    ts.forEach(function(t){
      if(!seenT[t.id]){ topicWrong[t.id] = (topicWrong[t.id] || 0) + 1; seenT[t.id] = 1; }
      var g = t.g || '未分组';
      if(!seenM[g]){ moduleWrong[g] = (moduleWrong[g] || 0) + 1; seenM[g] = 1; }
    });
  });
  function entries(obj){
    return Object.keys(obj).map(function(k){ return {k:k, v:obj[k]}; }).sort(function(a,b){ return b.v - a.v; });
  }
  return {
    idxs: idxs,
    secWrong: entries(secWrong),
    typeWrong: entries(typeWrong),
    secTot: secTot,
    moduleWrong: entries(moduleWrong),
    topicWrong: entries(topicWrong),
    unmatched: unmatched,
    topicById: (function(){ var m={}; ESS.topics.forEach(function(t){m[t.id]=t;}); return m; })()
  };
}
function buildWrongTips(A){
  var tips = [];
  var total = A.idxs.length;
  A.secWrong.slice(0,3).forEach(function(x){
    tips.push('章节「'+x.k+'」错了 '+x.v+' 题，优先用「分章节练习」把该章过一遍，做错立刻回看选项差异。');
  });
  var mc = 0, tf = 0, sc = 0;
  A.typeWrong.forEach(function(x){
    if(x.k==='多选题') mc=x.v; if(x.k==='判断题') tf=x.v; if(x.k==='单选题') sc=x.v;
  });
  if(mc>0) tips.push('多选题错了 '+mc+' 道：务必逐项核对，少选/多选都不得分；提交前用「排除法」再扫一遍。');
  if(tf >= Math.max(1, Math.floor(total/4))) tips.push('判断题错误偏多：留意「绝对化」措辞（必须/不得/一律），对照法条原文记例外情形。');
  if(sc >= Math.max(1, Math.floor(total/3))) tips.push('单选题错误集中：易混选项用对比表记忆，刷完回看错因而不是只记答案字母。');
  A.topicWrong.slice(0,4).forEach(function(x){
    var t = A.topicById[x.k];
    if(!t) return;
    var keys = (t.keys || []).slice(0,3).join('；') || ((t.intro||'').slice(0,40));
    tips.push('考点「'+t.n+'」（模块：'+t.g+'）相关错题 '+x.v+' 道——必背：'+keys);
  });
  A.moduleWrong.slice(0,2).forEach(function(x){
    if(tips.some(function(t){ return t.indexOf(x.k)>=0; })) return;
    tips.push('精选模块「'+x.k+'」错题较多（'+x.v+'），建议进「精选题·考点突破」按模块集中练。');
  });
  tips.push('错题当天「再做一遍」+ 隔日「错题复习」各一次；连续两次做对再移出错题本，避免假掌握。');
  tips.push('导出 wrong_bank.json 放到题库目录后，运行 python3 analyze_wrong.py 或 python3 ingest_wrong.py wrong_bank.json 可离线入库分析。');
  var seen={}, out=[];
  tips.forEach(function(t){ if(seen[t]) return; seen[t]=1; out.push(t); });
  return out.slice(0,10);
}
function buildWrongReportMarkdown(A){
  var lines = [];

  var ts = now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate())+' '+pad(now.getHours())+':'+pad(now.getMinutes())+':'+pad(now.getSeconds());

  if(!A.idxs.length){
    lines.push('## 概览');
    lines.push('');
    lines.push('**暂无错题记录。**');
    lines.push('');
    return lines.join('\n');
  }
  var pct = function(n,t){ return t? (n*100/t).toFixed(1)+'%' : '0%'; };
  lines.push('## 1. 概览');
  lines.push('');
  lines.push('- 错题数：**'+A.idxs.length+'**');
  lines.push('- 涉及章节数：**'+A.secWrong.length+'**');

  lines.push('');
  lines.push('## 2. 按章节统计');
  lines.push('');
  lines.push('| 章节 | 错题数 | 占错题比 | 该章题量 | 错误密度 |');
  lines.push('|---|---:|---:|---:|---:|');
  A.secWrong.forEach(function(x){
    var tot = A.secTot[x.k] || 0;
    lines.push('| '+x.k+' | '+x.v+' | '+pct(x.v,A.idxs.length)+' | '+tot+' | '+pct(x.v,tot)+' |');
  });
  lines.push('');
  lines.push('## 3. 按题型统计');
  lines.push('');
  lines.push('| 题型 | 错题数 | 占错题比 |');
  lines.push('|---|---:|---:|');
  ['单选题','多选题','判断题'].forEach(function(t){
    var hit = A.typeWrong.filter(function(x){return x.k===t;})[0];
    if(hit) lines.push('| '+t+' | '+hit.v+' | '+pct(hit.v,A.idxs.length)+' |');
  });
  lines.push('');
  lines.push('## 4. 精选题考点 / 模块映射');
  lines.push('');
  var hit = A.idxs.length - A.unmatched;
  lines.push('- 命中精选题：**'+hit+'** 题；未命中精选题：**'+A.unmatched+'** 题。');
  lines.push('');
  if(A.moduleWrong.length){
    lines.push('### 错题最多的模块');
    lines.push('');
    lines.push('| 模块 | 错题数 |');
    lines.push('|---|---:|');
    A.moduleWrong.forEach(function(x){ lines.push('| '+x.k+' | '+x.v+' |'); });
    lines.push('');
  }
  if(A.topicWrong.length){
    lines.push('### 错题最多的考点（Top 10）');
    lines.push('');
    lines.push('| 考点 | 模块 | 错题数 |');
    lines.push('|---|---|---:|');
    A.topicWrong.slice(0,10).forEach(function(x){
      var t = A.topicById[x.k] || {};
      lines.push('| '+(t.n||x.k)+' | '+(t.g||'—')+' | '+x.v+' |');
    });
    lines.push('');
  }
  lines.push('## 5. 易错提醒');
  lines.push('');
  buildWrongTips(A).forEach(function(t,i){ lines.push((i+1)+'. '+t); });
  lines.push('');
  lines.push('## 6. 错题清单摘要');
  lines.push('');
  var show = A.idxs.slice(0,50);
  lines.push('共 '+A.idxs.length+' 题'+(A.idxs.length>50?'，下列最多列出 50 题：':'：'));
  lines.push('');
  lines.push('| # | 下标 | 章节 | 题型 | 题干摘要 |');
  lines.push('|---:|---:|---|---|---|');
  show.forEach(function(i,n){
    var q = QDATA[i];
    var stem = ((q&&q.q)||'').replace(/\n/g,' ').trim();
    if(stem.length>40) stem = stem.slice(0,40)+'…';
    stem = stem.replace(/\|/g,'\\|');
    lines.push('| '+(n+1)+' | '+i+' | '+((q&&q.s)||'')+' | '+((q&&q.t)||'')+' | '+stem+' |');
  });
  if(A.idxs.length>50){
    lines.push('');
    lines.push('> 另有 '+(A.idxs.length-50)+' 题未列出，完整下标见 wrong_bank.json / wrong.json。');
  }
  lines.push('');
  return lines.join('\n');
}

  if(state.wrong.length===0){ showToast('暂无错题'); return; }
  var md = buildWrongReportMarkdown(computeWrongAnalysis());
  downloadBlob('错题分析报告.md', md, 'text/markdown;charset=utf-8');
  showToast('已下载 错题分析报告.md');
}
function exportWrongIndices(){
  if(state.wrong.length===0){ showToast('暂无错题'); return; }
  downloadBlob('wrong.json', JSON.stringify(state.wrong.slice(), null, 2), 'application/json;charset=utf-8');
  showToast('已下载 wrong.json');
}
function exportWrongBank(){
  if(state.wrong.length===0){ showToast('暂无错题'); return; }
  var payload = buildWrongBankPayload();
  downloadBlob('wrong_bank.json', JSON.stringify(payload, null, 2), 'application/json;charset=utf-8');
  showToast('已下载 wrong_bank.json（可放入题库目录离线分析）');
}
function ingestAndAnalyze(){
  if(state.wrong.length===0){ showToast('暂无错题'); return; }
  var payload = buildWrongBankPayload();
  downloadBlob('wrong_bank.json', JSON.stringify(payload, null, 2), 'application/json;charset=utf-8');
  showWrongAnalysis();
  showToast('已导出入库文件，并打开分析页');
}

function smartLegacyNote(){
  var oldN=Object.keys(state.answered||{}).length;
  var newN=Object.keys((state.smart&&state.smart.questions)||{}).length;
  if(state.smartLocked) return '本机的新统计格式异常，原始内容已保留且不会被覆盖。请先导出备份。旧的最后一次答案仍然不会被换算成多次错误。';
  if(oldN>0 && newN===0) return '检测到旧的做题记录，里面只保存了每题最后一次选择。这些记录原样保留，但不会被换算成多次答错。智慧刷题的次数从接下来的真实提交开始累计。不同设备不会自动同步。';
  if(newN===0) return '还没有新的作答统计。本轮会抽出未做题，并给所有题保留正的权重。次数只在提交答案后增加。不同设备不会自动同步。';
  return '薄弱榜只显示至少作答 '+SMART_WEAK_MIN_ATTEMPTS+' 次、且平滑错误率达到 '+Math.round(SMART_WEAK_SMOOTHED*100)+'% 的知识点，避免一次失误被当成稳定短板。抽题仍会参考平滑后的错误率。不同设备不会自动同步。';
}
function showSmartPanel(){
  updateStats();
  var weak=weakKnowledgePoints(state.smart, KMAP.catalog, SMART_WEAK_MIN_ATTEMPTS);
  var qn=Object.keys(state.smart.questions||{}).length;
  var attempts=0;Object.keys(state.smart.questions||{}).forEach(function(k){attempts+=state.smart.questions[k].attempts||0;});
  var html='<div class="card"><div class="card-title"><span class="icon">🧠</span>智慧刷题</div>';
  html+='<p style="font-size:14px;line-height:1.75;">'+esc(smartLegacyNote())+'</p>';
  html+='<div class="ess-summary"><div><b>'+KMAP.assign.length+'</b> 题已归入知识点</div><div><b>'+KMAP.catalog.length+'</b> 个知识点</div><div><b>'+qn+'</b> 题有新统计</div><div><b>'+attempts+'</b> 次新作答</div></div>';
  html+='<p style="font-size:13px;color:var(--text2);line-height:1.7;">每一轮默认 20 题，约 25% 留给还没做过的题。其余按权重抽取：本题和它所在知识点错得越多，权重越大；连续答对会按 0.82 递减，最低仍有 0.18。同一轮不重复。旧错题本仍可从「错题复习」进入，不参与这里的次数。</p>';
  html+='<div class="ess-actions"><button class="btn btn-primary" onclick="startSmartRound()">开始 20 题</button><button class="btn btn-default" onclick="renderHome()">返回首页</button></div></div>';
  html+='<div class="card"><div class="card-title">薄弱知识点</div>';
  if(!weak.length){
    html+='<p style="font-size:14px;line-height:1.75;color:var(--text2);">现在没有可展示的薄弱知识点。可能是还没有足够的新作答，也可能是已有样本的平滑错误率不高。这不代表可以停止练习，本轮仍会抽到题目。</p>';
  }else{
    weak.forEach(function(item){
      html+='<div class="weak-item"><b>'+esc(item.name)+'</b> · '+esc(item.group)+'<div class="why">'+esc(item.why)+'</div></div>';
    });
  }
  html+='</div>';
  document.getElementById('mainContent').innerHTML=html;
  window.scrollTo(0,0);
}
function startSmartRound(){
  var pool=[];for(var i=0;i<TOTAL;i++) pool.push(i);
  var plan=planSmartRound({count:SMART_ROUND_SIZE, pool:pool, assign:KMAP.assign, stats:state.smart, exploreRatio:SMART_EXPLORE_RATIO, rng:mulberry32((Date.now()^((Math.random()*0x100000000)>>>0))>>>0)});
  if(!plan.items.length){showToast('没有可抽取的题目');return;}
  var qs=plan.items.map(function(item){
    var q=copyQ(QDATA[item.idx], item.idx);
    q.pick=item;
    return q;
  });
  state.quiz={questions:qs, current:0, startTime:Date.now(), mode:'practice', filter:{smart:true}, label:'智慧刷题 · '+plan.note, back:'smart'};
  mcSelected=[];renderQuiz();
}
try{
  if(typeof navigator!=='undefined' && navigator && 'serviceWorker' in navigator && typeof location!=='undefined' && (location.protocol==='https:' || location.hostname==='localhost' || location.hostname==='127.0.0.1')){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }
}catch(e){}
renderHome();
</script>
