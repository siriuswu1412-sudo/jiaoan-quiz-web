<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1677ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="交安刷题">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<title>交安考试刷题系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f5f7fa;color:#333;min-height:100vh;}
:root{--primary:#1677ff;--success:#52c41a;--danger:#ff4d4f;--warning:#faad14;--bg:#f5f7fa;--card:#fff;--border:#e8e8e8;--text:#333;--text2:#666;--text3:#999;}
.app{max-width:900px;margin:0 auto;padding:16px;}
.header{background:linear-gradient(135deg,#1677ff,#0958d9);color:#fff;border-radius:16px;padding:28px 24px;margin-bottom:16px;box-shadow:0 4px 12px rgba(22,119,255,.2);}
.header h1{font-size:24px;margin-bottom:6px;}
.header p{font-size:13px;opacity:.85;}
.header-stats{display:flex;gap:20px;margin-top:16px;flex-wrap:wrap;}
.header-stat{text-align:left;}
.header-stat .num{font-size:22px;font-weight:700;}
.header-stat .label{font-size:12px;opacity:.8;}
.card{background:var(--card);border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.06);}
.card-title{font-size:18px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:8px;}
.card-title .icon{font-size:22px;}
.mode-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
.mode-item{border:2px solid var(--border);border-radius:12px;padding:20px;cursor:pointer;transition:all .2s;text-align:center;}
.mode-item:hover{border-color:var(--primary);background:#f0f6ff;transform:translateY(-2px);box-shadow:0 4px 12px rgba(22,119,255,.1);}
.mode-item .m-icon{font-size:32px;margin-bottom:8px;}
.mode-item .m-title{font-size:16px;font-weight:600;margin-bottom:4px;}
.mode-item .m-desc{font-size:12px;color:var(--text3);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 24px;border:none;border-radius:8px;font-size:15px;font-weight:500;cursor:pointer;transition:all .2s;}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:hover{background:#0958d9;}
.btn-success{background:var(--success);color:#fff;}
.btn-danger{background:var(--danger);color:#fff;}
.btn-default{background:#f0f0f0;color:var(--text);}
.btn-default:hover{background:#e0e0e0;}
.btn-lg{padding:14px 32px;font-size:17px;}
.btn-sm{padding:6px 16px;font-size:13px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.progress-bar{height:8px;background:#e8e8e8;border-radius:4px;overflow:hidden;margin:8px 0;}
.progress-fill{height:100%;background:var(--primary);border-radius:4px;transition:width .3s;}
.progress-fill.success{background:var(--success);}
.progress-fill.danger{background:var(--danger);}
.quiz-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px;}
.quiz-info{font-size:13px;color:var(--text2);}
.quiz-timer{font-size:16px;font-weight:600;color:var(--primary);}
.q-type-badge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:500;margin-bottom:8px;}
.q-type-badge.sc{background:#e6f7ff;color:#1677ff;}
.q-type-badge.mc{background:#f6ffed;color:#52c41a;}
.q-type-badge.tf{background:#fff7e6;color:#fa8c00;}
.q-section{font-size:12px;color:var(--text3);margin-bottom:8px;}
.q-text{font-size:17px;line-height:1.7;margin-bottom:16px;font-weight:500;}
.q-num{color:var(--primary);font-weight:700;}
.options{display:flex;flex-direction:column;gap:10px;}
.option{display:flex;align-items:flex-start;gap:10px;padding:14px 16px;border:2px solid var(--border);border-radius:10px;cursor:pointer;transition:all .15s;}
.option:hover{border-color:var(--primary);background:#f0f6ff;}
.option.selected{border-color:var(--primary);background:#e6f7ff;}
.option.correct{border-color:var(--success);background:#f6ffed;}
.option.wrong{border-color:var(--danger);background:#fff1f0;}
.option-label{width:32px;height:32px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px;flex-shrink:0;}
.option.selected .option-label{border-color:var(--primary);background:var(--primary);color:#fff;}
.option.correct .option-label{border-color:var(--success);background:var(--success);color:#fff;}
.option.wrong .option-label{border-color:var(--danger);background:var(--danger);color:#fff;}
.option-text{font-size:15px;line-height:1.6;padding-top:4px;flex:1;}
.tf-options{display:flex;gap:12px;}
.tf-btn{flex:1;padding:24px;border:2px solid var(--border);border-radius:12px;text-align:center;cursor:pointer;font-size:18px;font-weight:600;transition:all .15s;}
.tf-btn:hover{border-color:var(--primary);}
.tf-btn.selected{border-color:var(--primary);background:#e6f7ff;color:var(--primary);}
.tf-btn.correct{border-color:var(--success);background:#f6ffed;color:var(--success);}
.tf-btn.wrong{border-color:var(--danger);background:#fff1f0;color:var(--danger);}
.answer-reveal{margin-top:16px;padding:16px;border-radius:10px;display:none;}
.answer-reveal.show{display:block;}
.answer-reveal.correct{background:#f6ffed;border:1px solid #b7eb8f;}
.answer-reveal.wrong{background:#fff1f0;border:1px solid #ffa39e;}
.answer-reveal .ar-title{font-size:15px;font-weight:600;margin-bottom:4px;}
.answer-reveal.correct .ar-title{color:var(--success);}
.answer-reveal.wrong .ar-title{color:var(--danger);}
.answer-reveal .ar-text{font-size:14px;color:var(--text2);line-height:1.6;}
.answer-reveal .ar-answer{font-weight:700;font-size:16px;margin-top:4px;}
.score-display{text-align:center;padding:20px;}
.score-circle{width:120px;height:120px;border-radius:50%;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:700;border:8px solid;}
.score-circle.pass{border-color:var(--success);color:var(--success);}
.score-circle.fail{border-color:var(--danger);color:var(--danger);}
.score-label{font-size:18px;font-weight:600;margin-bottom:8px;}
.score-detail{display:flex;justify-content:center;gap:24px;margin-top:16px;}
.score-detail-item{text-align:center;}
.score-detail-item .num{font-size:24px;font-weight:700;}
.score-detail-item .label{font-size:12px;color:var(--text3);}
.quiz-nav{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:12px;}
.stat-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);}
.stat-row:last-child{border-bottom:none;}
.stat-row .label{color:var(--text2);}
.stat-row .value{font-weight:600;}
.section-list{display:flex;flex-direction:column;gap:8px;}
.section-item{padding:16px;border:2px solid var(--border);border-radius:10px;cursor:pointer;transition:all .15s;display:flex;justify-content:space-between;align-items:center;}
.section-item:hover{border-color:var(--primary);background:#f0f6ff;}
.section-item .s-name{font-size:16px;font-weight:500;}
.section-item .s-count{font-size:13px;color:var(--text3);}
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center;}
.filter-chip{padding:6px 16px;border-radius:20px;border:2px solid var(--border);font-size:13px;cursor:pointer;transition:all .15s;}
.filter-chip.active{border-color:var(--primary);background:var(--primary);color:#fff;}
.filter-chip:hover:not(.active){border-color:var(--primary);}
.q-list{display:flex;flex-direction:column;gap:8px;}
.q-list-item{padding:12px 16px;border:1px solid var(--border);border-radius:8px;transition:all .15s;}
.q-list-item:hover{border-color:var(--primary);background:#f0f6ff;}
.q-list-item .qli-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
.q-list-item .qli-text{font-size:14px;color:var(--text2);line-height:1.5;}
.q-list-item.wrong-item{border-left:3px solid var(--danger);}
.q-list-item.correct-item{border-left:3px solid var(--success);}
.hidden{display:none!important;}
@media(max-width:600px){.mode-grid{grid-template-columns:1fr;}.header-stats{gap:12px;}.score-detail{gap:12px;}.tf-options{flex-direction:column;}}
.mc-hint{font-size:12px;color:var(--warning);margin-bottom:8px;background:#fffbe6;padding:6px 10px;border-radius:6px;}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 24px;border-radius:8px;font-size:14px;z-index:9999;opacity:0;transition:opacity .3s;}
.toast.show{opacity:1;}
.flashcard{background:#fff;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.1);padding:40px;min-height:300px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;cursor:pointer;transition:all .3s;}
.flashcard.flipped{background:#f0f6ff;}
.flashcard .fc-label{font-size:13px;color:var(--text3);margin-bottom:12px;}
.flashcard .fc-content{font-size:20px;line-height:1.7;margin-bottom:16px;}
.flashcard .fc-answer{font-size:18px;font-weight:700;color:var(--primary);margin-top:16px;padding:12px 24px;background:#e6f7ff;border-radius:8px;}
.flashcard .fc-hint{font-size:13px;color:var(--text3);margin-top:20px;}
/* 案例背景 */
.bg-box{margin-bottom:14px;border:1px solid #ffe7ba;border-radius:10px;background:#fffbe6;overflow:hidden;}
.bg-box summary{cursor:pointer;padding:10px 14px;font-size:13px;font-weight:600;color:#ad6800;list-style:none;user-select:none;}
.bg-box summary::-webkit-details-marker{display:none;}
.bg-box summary::before{content:'▸ ';}
.bg-box[open] summary::before{content:'▾ ';}
.bg-box .bg-text{padding:0 14px 12px;font-size:13px;line-height:1.7;color:var(--text2);max-height:220px;overflow:auto;}
/* 题库浏览：搜索与分页 */
.search-bar{display:flex;gap:8px;margin-bottom:14px;}
.search-bar input{flex:1;padding:9px 14px;border:2px solid var(--border);border-radius:8px;font-size:14px;outline:none;font-family:inherit;}
.search-bar input:focus{border-color:var(--primary);}
.pager{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:14px;font-size:13px;color:var(--text2);}
.dist-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px;}
.dist-table th,.dist-table td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:center;}
.dist-table th{color:var(--text2);font-weight:600;background:#fafafa;}
.dist-table td:first-child{text-align:left;}
.dist-table tr:last-child td{border-bottom:none;font-weight:600;}
/* 精选题 · 考点突破 */
.ess-hero{background:linear-gradient(135deg,#722ed1,#1677ff);color:#fff;border-radius:14px;padding:20px 22px;margin-bottom:16px;cursor:pointer;box-shadow:0 4px 14px rgba(114,46,209,.22);transition:transform .18s,box-shadow .18s;}
.ess-hero:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(114,46,209,.3);}
.ess-hero .eh-top{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:700;}
.ess-hero .eh-desc{font-size:13px;opacity:.9;margin:8px 0 12px;line-height:1.6;}
.ess-hero .eh-stats{display:flex;gap:22px;flex-wrap:wrap;}
.ess-hero .eh-stats b{font-size:20px;display:block;}
.ess-hero .eh-stats span{font-size:12px;opacity:.85;}
.ess-hero .eh-btn{display:inline-block;margin-top:14px;background:#fff;color:#722ed1;border-radius:20px;padding:7px 20px;font-size:13px;font-weight:600;}
.ess-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
.ess-tab{padding:7px 15px;border-radius:20px;border:2px solid var(--border);background:var(--card);font-size:13px;cursor:pointer;transition:all .15s;}
.ess-tab.active{border-color:#722ed1;background:#722ed1;color:#fff;}
.ess-tab:hover:not(.active){border-color:#722ed1;color:#722ed1;}
.ess-summary{display:flex;gap:18px;flex-wrap:wrap;background:#f9f0ff;border:1px solid #efdbff;border-radius:10px;padding:12px 16px;margin-bottom:16px;font-size:13px;color:#531dab;}
.ess-summary b{font-size:17px;}
.topic-card{border:2px solid var(--border);border-radius:12px;padding:16px;margin-bottom:10px;transition:all .15s;}
.topic-card:hover{border-color:#722ed1;background:#fcfaff;}
.topic-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;}
.topic-name{font-size:16px;font-weight:600;color:var(--text);}
.topic-meta{font-size:12px;color:var(--text3);margin-top:4px;}
.topic-intro{font-size:13px;color:var(--text2);line-height:1.7;margin:10px 0 12px;}
.topic-btns{display:flex;gap:8px;flex-wrap:wrap;}
.topic-prog{height:6px;background:#f0f0f0;border-radius:3px;margin-top:10px;overflow:hidden;}
.topic-prog i{display:block;height:100%;background:#722ed1;border-radius:3px;transition:width .3s;}
.intro-box{background:#f9f0ff;border:1px solid #efdbff;border-radius:12px;padding:18px;margin-bottom:16px;}
.intro-box .ib-title{font-size:16px;font-weight:700;color:#531dab;margin-bottom:10px;}
.intro-box .ib-text{font-size:14px;line-height:1.85;color:var(--text);}
.key-list{margin-top:14px;display:flex;flex-direction:column;gap:7px;}
.key-item{background:#fff;border-left:3px solid #722ed1;border-radius:6px;padding:8px 12px;font-size:13px;line-height:1.6;color:var(--text2);}
.exp-item{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:10px;}
.exp-item .ei-top{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap;}
.exp-item .ei-q{font-size:14px;line-height:1.7;font-weight:500;}
.exp-item .ei-ans{font-size:13px;color:var(--success);font-weight:600;margin-top:8px;}
.exp-item .ei-exp{font-size:13px;line-height:1.75;color:var(--text2);background:#f9f0ff;border-radius:8px;padding:10px 12px;margin-top:8px;}
.exp-item .ei-exp::before{content:'💡 解析：';font-weight:600;color:#722ed1;}
.exp-box{margin-top:12px;padding:12px 14px;background:#f9f0ff;border:1px solid #efdbff;border-radius:8px;font-size:13px;line-height:1.75;color:var(--text2);}
.exp-box b{color:#722ed1;}
.exp-box,.ei-exp{white-space:pre-line;}
.dist-table{display:block;overflow-x:auto;}
.dist-table tr:last-child td{font-weight:normal;}
.ess-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:16px;}
@media(max-width:600px){.ess-hero .eh-stats{gap:16px;}.ess-summary{gap:12px;}}
html,body{max-width:100%;overflow-x:hidden;}
body{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);padding-bottom:env(safe-area-inset-bottom);}
.app{overflow-x:hidden;}
.q-text,.option-text,.qli-text,.exp-box,.topic-intro,.ib-text,.ei-q,.bg-text,.ar-text{overflow-wrap:anywhere;word-break:break-word;}
img,svg,video,canvas,table,pre{max-width:100%;}
.toast{max-width:calc(100% - 24px);box-sizing:border-box;text-align:center;overflow-wrap:anywhere;}
.option,.tf-btn,.btn,.mode-item,.section-item,.filter-chip,.ess-tab{touch-action:manipulation;}
.option,.tf-btn,.btn{min-height:44px;}
.tf-btn{min-height:48px;}
input,select,textarea{font-size:16px;}
.header-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;}
.quiz-nav{flex-wrap:wrap;}
.quiz-nav .btn{min-height:44px;}
.kp-banner{margin:0 0 12px;padding:10px 12px;border-radius:10px;background:#f0f6ff;border:1px solid #bae0ff;font-size:13px;line-height:1.65;color:#0958d9;}
.kp-banner b{display:block;margin-bottom:4px;color:#003eb3;}
.smart-hero{background:linear-gradient(135deg,#0958d9,#13c2c2);color:#fff;border-radius:14px;padding:18px 16px;margin-bottom:16px;cursor:pointer;box-shadow:0 4px 14px rgba(9,88,217,.2);}
.smart-hero .eh-desc{font-size:13px;opacity:.95;margin:8px 0 12px;line-height:1.65;}
.smart-hero .eh-btn{display:inline-block;background:#fff;color:#0958d9;border-radius:20px;padding:8px 16px;font-size:13px;font-weight:700;}
.weak-item{border:1px solid var(--border);border-left:4px solid var(--danger);border-radius:10px;padding:12px;margin-bottom:10px;}
.weak-item .why{font-size:13px;color:var(--text2);line-height:1.7;margin-top:6px;}
@media(max-width:768px){
  .app{padding:10px;}
  .header{padding:18px 14px;border-radius:12px;}
  .header h1{font-size:22px;}
  .card{padding:14px;}
  .score-detail{flex-wrap:wrap;gap:12px;}
  .quiz-nav{flex-direction:column;align-items:stretch;}
  .quiz-nav>div{display:flex;gap:8px;}
  .quiz-nav .btn,.ess-actions .btn{flex:1;}
}
@media(min-width:769px){.header-stats{grid-template-columns:repeat(5,minmax(0,1fr));}}
@media(max-width:390px){
  .app{padding:8px;}
  .header h1{font-size:20px;}
  .q-text{font-size:16px;}
  .mode-item{padding:14px;}
  .flashcard{padding:20px;min-height:220px;}
}
</style>
</head>
<body>
<div class="app">
<div class="header">
<h1>交安考试刷题系统</h1>
<p id="headerSub">公路水运工程安全生产 · 目标60分以上</p>
<div class="header-stats">
<div class="header-stat"><div class="num" id="statTotal">—</div><div class="label">总题数</div></div>
<div class="header-stat"><div class="num" id="statDone">0</div><div class="label">已练习</div></div>
<div class="header-stat"><div class="num" id="statCorrect">0</div><div class="label">答对</div></div>
<div class="header-stat"><div class="num" id="statWrong">0</div><div class="label">错题</div></div>
<div class="header-stat"><div class="num" id="statAccuracy">—</div><div class="label">正确率</div></div>
</div>
</div>
<div id="mainContent"></div>
</div>
<div class="toast" id="toast"></div>
<script>
const QDATA = [{"s":"综合知识和能力","t":"单选题","q":"安全生产管理人员使用最多的辨识危险源的方法是（____）。","a":"C","o":{"A":"事故树分析法","B":"工作任务分析法","C":"现场调查法","D":"故障树分析法"}},{"s":"综合知识和能力","t":"单选题","q":"担任项目安全生产委员会主任的是（____）。","a":"A","o":{"A":"项目经理","B":"项目副总经理","C":"项目安全总监","D":"技术副总经理"}},{"s":"综合知识和能力","t":"单选题","q":"安全生产管理长效机制建构中，事故持续高发的阶段是（____）。","a":"B","o":{"A":"内容设计阶段","B":"要素构建阶段","C":"反馈完善阶段","D":"整合运行阶段"}},{"s":"综合知识和能力","t":"单选题","q":"安全系统工程最早起源于（____）。","a":"D","o":{"A":"经济管理部门","B":"交通建设部门","C":"道路运输部门","D":"航空部门"}},{"s":"综合知识和能力","t":"单选题","q":"一般中型以上的公路水运工程施工单位，应当（____）组织一次安全检查。","a":"A","o":{"A":"每一个季度","B":"每一个月","C":"每一年度","D":"每一星期"}},{"s":"综合知识和能力","t":"单选题","q":"生产安全事故应急管理的第一原则是（____）。","a":"A","o":{"A":"防止事故扩大，减少人员伤亡","B":"分工合作，落实责任","C":"以人为本、关爱生命","D":"服从命令，听从指挥"}},{"s":"综合知识和能力","t":"单选题","q":"应急管理的四个阶段依次为（____）。","a":"B","o":{"A":"接警、响应、准备、恢复","B":"预防、准备、响应、恢复","C":"启动、响应、准备、救援","D":"准备、响应、救援、恢复"}},{"s":"综合知识和能力","t":"单选题","q":"《公路水运工程“平安工地”考核评价标准（试行）》规定，“平安工地”考评等级分为达标、不达标与（____）三个等级。","a":"A","o":{"A":"示范","B":"优秀","C":"优良","D":"创建"}},{"s":"综合知识和能力","t":"单选题","q":"《公路水运工程施工企业项目负责人施工现场带班生产制度（暂行）》规定，公路水运工程施工企业应建立本企业项目负责人施工现场带班生产的责任考核制度，每（____）至少组织1次对所承揽工程项目经理部的定期检查考核。","a":"A","o":{"A":"半年","B":"一年","C":"一个季度","D":"一个月"}},{"s":"综合知识和能力","t":"单选题","q":"（____）应对安全技术措施内容是否符合强制性标准要求进行重点审查，审查合格后方可同意工程开工。","a":"D","o":{"A":"设计单位","B":"建设单位","C":"施工单位","D":"监理单位"}},{"s":"综合知识和能力","t":"单选题","q":"安全技术交底由（____）负责实施，实行逐级安全技术交底制度。","a":"B","o":{"A":"设计单位技术负责人","B":"施工单位项目部技术负责人","C":"施工单位专职安全员","D":"施工单位项目部班组长"}},{"s":"综合知识和能力","t":"单选题","q":"安全生产领域有一个“南风法则”，即北风和南风比威力，看谁把行人身上的大衣吹掉，北风呼啸,结果行人把大衣裹得更紧，南风徐徐，行人感到春意浓浓，最后脱掉大衣。这一法则反映出安全生产管理必须坚持（____）的理念。","a":"A","o":{"A":"以人为本","B":"综合治理","C":"预防为主","D":"本质安全"}},{"s":"综合知识和能力","t":"单选题","q":"各项安全管理制度的核心是（____）。","a":"D","o":{"A":"教育培训制度","B":"责任追究制度","C":"组织管理制度","D":"安全生产责任制度"}},{"s":"综合知识和能力","t":"单选题","q":"如果我们把一个企业、一个项目、一个班组看做一个系统，系统内部都有人、物、环境、关系四大要素，从管理哲学来看，安全生产管理着重是管理（____）。","a":"D","o":{"A":"系统中的人","B":"系统中的物","C":"系统所处的环境","D":"系统内外要素之间的关系"}},{"s":"综合知识和能力","t":"单选题","q":"安全生产管理的最高境界是（____）。","a":"D","o":{"A":"管理安全","B":"规范安全","C":"操作安全","D":"本质安全"}},{"s":"综合知识和能力","t":"单选题","q":"曾有“安全公理”之称的事故致因分析理论是（____）。","a":"B","o":{"A":"系统安全理论","B":"海因里希的因果连锁理论","C":"人机轨迹交叉理论","D":"破窗理论"}},{"s":"综合知识和能力","t":"单选题","q":"从安全生产法律体系的构成来看，2015年5月1日开始实施的《公路工程施工安全技术规范》属于（____）。","a":"C","o":{"A":"安全基本法","B":"行政法规","C":"部门规章","D":"国际条约"}},{"s":"综合知识和能力","t":"单选题","q":"2014年12月1日开始实施的新《安全生产法》第18条将生产经营单位的主要负责人的安全责任在原来6大责任基础上增加到7大责任，下面属于新增加的是（____）。","a":"D","o":{"A":"建立、健全本单位安全生产责任制","B":"及时、如实报告生产安全事故","C":"保证本单位安全生产投入的有效实施","D":"组织制定并实施本单位安全生产教育和培训计划"}},{"s":"综合知识和能力","t":"单选题","q":"《建筑法》第四十八条规定:建筑施工企业应当依法为职工参加工伤保险缴纳工伤保险费。鼓励企业为从事危险作业的职工办理意外伤害保险，支付保险费。建筑工人意外伤害保险属于（____）。","a":"B","o":{"A":"法定保险","B":"选择性保险","C":"强制保险","D":"责任保险"}},{"s":"综合知识和能力","t":"单选题","q":"有机溶剂的应用日趋广泛，围绕人们的衣食住行，都可以观察到有机溶剂的踪影，如四氯乙烯广泛用于纺织品的干洗，汽车防冻液、汽车轮胎制造等领域与有机溶剂密不可分。有机溶剂种类和用量的不断增加改善了人们的生活质量，同时也会给人们带来健康方面的损害。规避有机溶剂的伤害重在预防。对生产环节中可能存在的有机溶剂必须做好密闭化管理。存在有机溶剂的工作场所，应当定期检测空气中各种有机溶剂的浓度，使其符合国家职业卫生标准。家庭装修使用的有机溶剂，除了购买安全环保产品外，在人住前应当充分开窗通风，将空气中的有机溶剂控制在安全的剂量水平。这段文字意在强调（____）。","a":"A","o":{"A":"避免有机溶剂伤害的方法","B":"有机溶剂的用途十分广泛","C":"有机溶剂造成伤害可以避免","D":"有机溶剂可能伤害人的健康"}},{"s":"综合知识和能力","t":"单选题","q":"由细颗粒物造成的灰霾天气对人体健康的危害甚至要比沙尘暴更大。粒径10微米以上的颗粒物，会被挡在人的鼻子外面；粒径在2.5微米至10微米之间的颗粒物，能够进人上呼吸道，但部分可通过痰液等排出体外，另外也会被鼻腔内部的绒毛阻挡，对人体健康危害相对较小；而粒径在2.5微米以下的细颗粒物吸人人体后会进人支气管，干扰肺部的气体交换，引发包括哮喘、支气管炎和心血管病等方面的疾病。这些颗粒还会进人血液，其中的有害气体、重金属等溶解在血液中，对人体健康的伤害更大。这段文字意在说明（____）。","a":"D","o":{"A":"重金属等会溶解于血液中危及人体健康","B":"不同粒径的颗粒物对人体健康的不同影响","C":"灾害天气中各种尺寸颗粒物的致病机理","D":"灰霾天气中的细颗粒物对人体健康伤害大"}},{"s":"综合知识和能力","t":"单选题","q":"某公司三名销售人员2011年的销售业绩如下：甲的销售额是乙和丙销售额的1.5倍，甲和乙的销售是丙的销售额的5倍，已知乙的销售额是56万元，问甲的销售额是（____）","a":"D","o":{"A":"140万元","B":"98万元","C":"112万元","D":"144万元"}},{"s":"综合知识和能力","t":"单选题","q":"企业社会响应是指企业受社会伦理道德标准的引导满足社会某种普遍需要。根据上述定义，下列选项不属于企业社会响应的是（____）。","a":"D","o":{"A":"某工厂发生污染事故，周边企业出资垫付事故赔偿金","B":"工程队在工地周围铺设防尘网，减少粉尘造成的污染","C":"某企业捐赠3亿股企业股票给慈善组织设立专项基金","D":"某公司按照《残疾人保障法》的规定安排残疾人就业"}},{"s":"综合知识和能力","t":"单选题","q":"小王、小张、小李、小顾四位舍友预测某次考试的结果。小王：我想这次大家都能过吧！小张：怎么可能？你没看见我乌云密布吗？小李：小顾肯定是没问题的。小顾：拜托！要是我没问题，大家就都没问题。成绩公布后，证明四人中只有一个人的说法是错误的。说法错误的是（____）。","a":"B","o":{"A":"小王","B":"小张","C":"小李","D":"小顾"}},{"s":"综合知识和能力","t":"单选题","q":"下列法律法规中，第一次详细规定各参建单位的安全责任以及政府部门监管责任的是（____）。","a":"C","o":{"A":"《安全生产法》","B":"《安全生产许可证条例》","C":"《建设工程安全生产管理条例》","D":"《建筑法》"}},{"s":"综合知识和能力","t":"单选题","q":"2008年3月5日下午某时，某在建公路发生坍塌事故，死亡31人，重伤55人，直接经济损失4900多万元，请问该事故应在（____）小时内报至当地政府。","a":"D","o":{"A":"5","B":"7","C":"9","D":"1"}},{"s":"综合知识和能力","t":"单选题","q":"风险识别的结果是（____）。","a":"A","o":{"A":"建立风险清单","B":"确定风险因素","C":"估计风险概率","D":"估算风险损失"}},{"s":"综合知识和能力","t":"单选题","q":"心理学研究表明，一种良好的安全行为习惯的形成，需要（____）次行为的反复。","a":"B","o":{"A":"10","B":"21","C":"30","D":"11"}},{"s":"综合知识和能力","t":"单选题","q":"某公司董事长由上一级单位总经理张某兼任，张某长期在外地，不负责该公司日常工作。该公司总经理安某在国外脱产学习，期间日常工作由常务副总经理徐某负责，分管安全生产工作的副总经理姚某协助其工作。根据安全生产法有关规定，此期间对该公司的安全生产工作全面负责的人是（____）。","a":"C","o":{"A":"安某","B":"张某","C":"徐某","D":"姚某"}},{"s":"综合知识和能力","t":"单选题","q":"重大隐患排查治理的责任主体是（____）","a":"B","o":{"A":"建设单位","B":"施工单位","C":"设计单位","D":"监理单位"}},{"s":"综合知识和能力","t":"多选题","q":"风险管理包括策划、组织、领导、协调和控制等方面的工作，其工作流程应包括（____）步骤。","a":"ABCD","o":{"A":"风险辨识","B":"风险分析","C":"风险控制","D":"风险转移","E":"风险规避"}},{"s":"综合知识和能力","t":"多选题","q":"构成安全隐患的因素有（____）。","a":"BCD","o":{"A":"致害物","B":"不安全状态+起因物","C":"不安全状态+不安全行为+起因物","D":"不安全行为+起因物","E":"起因物"}},{"s":"综合知识和能力","t":"多选题","q":"以下物体（品）中，既是起因物又是致害物的是（____）。","a":"BCD","o":{"A":"架空高压裸线","B":"雷击、导电物体","C":"易燃物","D":"—氧化碳、瓦斯和其他有毒气体","E":"水泥浆"}},{"s":"综合知识和能力","t":"多选题","q":"公路工程施工行业的生产经营单位新进场的从业人员，必须进行（____）的三级安全培训教育。","a":"BCD","o":{"A":"区域级","B":"公司","C":"项目经理部（或工区、工程队等）","D":"作业队（或班组等）","E":"国家级"}},{"s":"综合知识和能力","t":"多选题","q":"《公路水运工程施工企业项目负责人施工现场带班生产制度（暂行）》规定现场带班的方式是（____）。","a":"AC","o":{"A":"现场巡视检查","B":"现场工作例会","C":"蹲点带班生产","D":"现场专题讲座","E":"典型经验介绍"}},{"s":"综合知识和能力","t":"多选题","q":"下列属于安全生产管理的基本原理的是（____）。","a":"ABCD","o":{"A":"系统原理","B":"强制原理","C":"预防原理","D":"人本原理","E":"破窗原理"}},{"s":"综合知识和能力","t":"多选题","q":"下列属于海因里希因果连锁理论所提到的关键性因素的是（____）。","a":"ABC","o":{"A":"人的缺点","B":"遗传与社会环境","C":"人的不安全行为与物的不安全状态","D":"管理缺陷","E":"现场失误"}},{"s":"综合知识和能力","t":"多选题","q":"下列属于第一类危险源的是（____）。","a":"ABCD","o":{"A":"吊起重物的势能","B":"噪声的声能","C":"机械和车辆的动能","D":"高处坠落的势能","E":"未正确佩戴安全防护用品"}},{"s":"综合知识和能力","t":"多选题","q":"人的不安全行为大多是因为对安全不重视、态度不正确、技能或知识不足、健康或生理状态不佳和劳动条件不良等因素造成的。下列属于人的不安全行为的是（____）。","a":"ABCD","o":{"A":"使用不安全设备","B":"以手工取代工具","C":"冒险进人危险场所","D":"不安全装束","E":"未贯彻落实安全管理法律法规"}},{"s":"综合知识和能力","t":"多选题","q":"辨识危险源除了主要使用现场调查法之外，还采用以下（____）方法。","a":"ABC","o":{"A":"事故树分析法","B":"安全检查表法","C":"危险与可操作性研究法","D":"具体实践法","E":"专家论证法"}},{"s":"综合知识和能力","t":"多选题","q":"安全理念发展的主要动力是（____）。","a":"ACD","o":{"A":"生产社会化程度的提高","B":"生产自动化、信息化水平的提升","C":"科学技术的进步","D":"人类生命与健康意识的增强","E":"人类生产力水平的提高"}},{"s":"综合知识和能力","t":"多选题","q":"迄今为止，安全理念经历的三大转化是（____）。","a":"ABD","o":{"A":"从宿命理念向可控理念转化","B":"从关注单一安全因素向关注系统安全转化","C":"从关注财产安全向关注生命安全转化","D":"从关注安全向关注生命与健康并举转化","E":"从“物本”安全向“人本”安全转化"}},{"s":"综合知识和能力","t":"多选题","q":"下列费用可以在安全生产费用中列支的有（____）。","a":"BCD","o":{"A":"购买消防车的费用","B":"设置围挡的费用","C":"购买用电专用开关的费用","D":"施工单位组织对重大隐患进行评估的费用","E":"施工单位的招待费用"}},{"s":"综合知识和能力","t":"多选题","q":"以下属于较大安全生产事故的是（____）。","a":"ACD","o":{"A":"造成3人以上10人以下死亡的事故","B":"造成10人以上30人以下死亡的事故","C":"造成10人以上50人以下重伤的事故","D":"造成1000万元以上5000万元以下直接经济损失的事故","E":"造成恶劣社会影响的事故"}},{"s":"综合知识和能力","t":"多选题","q":"特种设备出厂时，应当随附安全技术规范要求的（____）相关技术资料和文件，并在设备显著位置设置产品铭牌、安全警示标志及其说明。","a":"ABCD","o":{"A":"设计文件","B":"产品质量合格证明","C":"安装及使用维护保养说明","D":"监督检验证明","E":"使用说明书"}},{"s":"综合知识和能力","t":"多选题","q":"习近平总书记十八大以来一直强调，在安全生产工作中要贯彻的思维是（____）。","a":"ABC","o":{"A":"底线思维","B":"红线思维","C":"人本思维","D":"效益思维","E":"历史思维"}},{"s":"综合知识和能力","t":"多选题","q":"安全生产领域有一个“市场法则”，即1:8:25。也就是说，一个人如果对安全工作满意,他会向8个人表达，如果不满意，就会向25个人表达。下列对这一法则理解正确的是（____）。","a":"ABC","o":{"A":"安全管理必须不断加强安全文化建设","B":"安全管理必须提升员工的安全满意度","C":"生产安全事故影响大，影响坏，好事不出门，坏事传千里","D":"安全工作没有终点，只有起点","E":"每一个安全事故都是可以预防的"}},{"s":"综合知识和能力","t":"多选题","q":"《中央企业安全生产监督管理暂行办法》第十三条规定：中央企业应当建立健全安全生产管理体系，积极推行和应用国内外先进的安全生产管理方法、体系等，实现安全生产管理的规范化、标准化、科学化、现代化。下列属于中央企业安全生产管理体系的有（____）。","a":"ABCD","o":{"A":"监督保证体系","B":"教育培训体系","C":"安全责任体系","D":"组织制度体系","E":"技术开发体系"}},{"s":"综合知识和能力","t":"多选题","q":"责任追究制度提出的“四不放过”是指（____）。","a":"ABCD","o":{"A":"原因没有查清不放过","B":"责任人没有受到严肃处理不放过","C":"广大群众没有受到教育不放过","D":"防范措施没有落实不放过","E":"赔偿资金不到位不放过"}},{"s":"综合知识和能力","t":"多选题","q":"下列关于应急救援的表述正确的是（____）。","a":"BC","o":{"A":"应急预案应该2年修订一次","B":"启动应急预案应该做好相关记录","C":"应急预案应该定期进行演练","D":"综合应急预案是最有整体性、科学性、针对性的应急预案","E":"应急救援应该在安全生产委员会统一领导下进行"}},{"s":"综合知识和能力","t":"多选题","q":"在事故中，一座大桥的一个桥墩坏了，我们上报损失时往往只报一个桥墩的损失，但是实际上，整个桥梁都坏了。这一桥墩法则说明（____）。","a":"ABCD","o":{"A":"事故的损失不仅仅是直接的有形损失，还包括无形的间接损失","B":"事故的真正损失是长期的、全局的、潜在的","C":"在看待事故损失时应有系统的、整体的思维","D":"预防事故发生是安全管理的重心所在","E":"这属于谎报瞒报事故"}},{"s":"综合知识和能力","t":"多选题","q":"下列关于生产安全事故档案管理表述正确的是（____）。","a":"ABC","o":{"A":"凡造成人员死亡或者重伤的事故档案必须永久保管","B":"造成1000万元以上直接经济损失的事故档案必须永久保管","C":"造成1000万元直接经济损失的事故档案必须永久保管","D":"未造成人员死亡或者重伤，且直接经济损失在1000万元以下的事故档案为30年保管","E":"任何安全生产事故的档案都应永久保存"}},{"s":"综合知识和能力","t":"多选题","q":"根据《安全生产许可证条例》，下列属于取得安全生产许可证所必须具备的条件是（____）。","a":"ABCD","o":{"A":"安全投人符合安全生产要求","B":"主要负责人和安全生产管理人员经考核合格","C":"依法进行安全评价","D":"依法参加工伤保险，为从业人员缴纳保险费","E":"应该具有较高安全技术水平"}},{"s":"综合知识和能力","t":"多选题","q":"下列属于安全0标的表述形式的有（____）。","a":"ABD","o":{"A":"绝对数表达法，如本企业职工年死亡人数不高于0.2%","B":"相对数表达法，如较大事故起数下降30%","C":"模糊表达法，如切实提高安全生产管理水平","D":"远景描述法，如百亿元产值安全事故死亡率低于同行业平均水平","E":"事故描述法，如详细描述某一事故的发生情况"}},{"s":"综合知识和能力","t":"多选题","q":"企业持有安全生产标准化达标证书，但是具有如下情况的应实施附加考评（____）。","a":"ABCD","o":{"A":"发生重特大安全生产事故的","B":"一年内企业连续发生二次及以上较大安全责任事故的","C":"企业被举报并经核实其安全生产管理存在重大安全问题的","D":"主管机关认为确实有必要进行附加考评的","E":"企业没有持续进行安全技术开发的"}},{"s":"综合知识和能力","t":"多选题","q":"下列属于国内外建筑行业必须普遍遵循的职业道德准则是（____）。","a":"AD","o":{"A":"诚实信用","B":"遵纪守法","C":"廉洁自律","D":"公平公正","E":"忠诚勇敢"}},{"s":"综合知识和能力","t":"多选题","q":"2015年印发的《国家安全监管总局特别重大生产安全事故调查处理工作程序》规定，特别重大事故调查处理的工作程序包括（____）。","a":"ABC","o":{"A":"调查准备阶段","B":"调查结案阶段","C":"评估与归档阶段","D":"反思与总结阶段","E":"整改提高阶段"}},{"s":"综合知识和能力","t":"多选题","q":"预防生产安全事故有三大支柱，简称“3E”，它们是（____）。","a":"ABD","o":{"A":"技术手段","B":"教育手段","C":"经济手段","D":"管理手段","E":"行政手段"}},{"s":"综合知识和能力","t":"多选题","q":"安全管理人员不但应该遵守法律规范，还应该遵守职业道德规范。下列属于违反职业道德规范的行为是（____）。30公路工程安全生产工作目前面临的独特性主要表现为（____）。","a":"ABCD","o":{"A":"不如实报告事故死亡人数","B":"不及时认真学习安全知识，掌握安全技能","C":"不公正处理安全事故","D":"不努力提升安全管理能力","E":"强令工人冒险作业"}},{"s":"综合知识和能力","t":"多选题","q":"2015年5月1日开始实施的《公路工程安全施工技术规范》贯彻的三大理念是（____）。","a":"ABC","o":{"A":"本质安全理念","B":"以人为本，安全发展理念","C":"安全第一，预防为主，综合治理理念","D":"安全与健康并举理念","E":"系统安全理念"}},{"s":"综合知识和能力","t":"多选题","q":"《公路工程施工安全技术规范》的修订主要基于（____）四大矛盾。","a":"ABCD","o":{"A":"公路工程总规模的新变化与原来规程的矛盾","B":"公路工程项目空间布局的新变化与原来规程的矛盾","C":"公路工程技术的新变化与原来规程的矛盾","D":"公路工程设备新变化与原来规程的矛盾","E":"公路工程总需求与总供给的矛盾"}},{"s":"综合知识和能力","t":"多选题","q":"消防人员的“四个能力”建设是指（____）。","a":"ABCD","o":{"A":"检查消除火灾隐患的能力","B":"扑救初级火灾的能力","C":"组织疏散逃生能力","D":"消防宣传教育能力","E":"有效处理事故能力"}},{"s":"综合知识和能力","t":"多选题","q":"安全生产管理有三种境界，分别为（____）。","a":"ABC","o":{"A":"以无人员伤亡为目标的基本安全","B":"以生命与健康并举为目标的规范安全","C":"以消除事故发生可能性为目标的本质安全","D":"以提高整体安全性能为目标的系统安全","E":"以提高安全科技水平为目标的科技安全"}},{"s":"综合知识和能力","t":"多选题","q":"德国人海恩提出的一个在航空界关于飞行安全的法则叫做海恩法则，它表明每一起严重事故的背后，必然有29次轻微事故，300起未遂先兆，1000起事故隐患。这一法则表明（____）。","a":"ABCD","o":{"A":"任何一起事故都是有原因的，并且是有征兆的","B":"安全生产是可以控制的，安全事故是可以避免的","C":"事故的发生是量的积累的结果","D":"再好的技术，再完美的规章，在实际操作层面，也无法取代人自身的素质和责任心","E":"安全责任是安全生产管理的灵魂"}},{"s":"综合知识和能力","t":"多选题","q":"2015年8月31日，山东滨源化学有限公司发生重大爆炸事故，2015年9月15日，公司负责人李倍祥被捕，在法庭上，李倍祥忏悔道：“这次事故，像是挥之不去的梦魇，如毒蛇般时刻吞噬着我的心灵，时刻围绕在我的眼前。如果能用我的生命去换回他们的生命，我都愿意去做。”这一事故教训告诉我们（____）。","a":"ABDE","o":{"A":"每一位企业老总在安全问题上都不要心存侥幸","B":"安全领域内没有亡羊补牢的机会","C":"他人今天的事故就是故事","D":"再沉痛的忏悔也改变不了生命逝去、家庭破碎的现实","E":"企业每一位员工都应成为优秀的安全员"}},{"s":"综合知识和能力","t":"多选题","q":"下列属于可能引发高处作业风险的是（____）。","a":"ABC","o":{"A":"高处作业人员不熟悉作业环境","B":"未佩戴防坠落防滑用品","C":"作业人员患有恐高症、高血压等职业禁忌症","D":"基坑开挖作业未按照规定配备通信联络工具","E":"未召开安全工作会议"}},{"s":"综合知识和能力","t":"多选题","q":"在进行吊装作业时，应注意（____）。","a":"BC","o":{"A":"吊装指挥人员应该由生产经营单位主要负责人担任","B":"斜拉重物不能起吊","C":"起吊指挥信号必须明确、统一、专业","D":"起吊重物不能超过5m","E":"应加强安全检查"}},{"s":"综合知识和能力","t":"多选题","q":"在进行动土作业时，为了化解作业风险，必须（____）。","a":"ACD","o":{"A":"动土临近地下隐蔽设施时，禁止使用
