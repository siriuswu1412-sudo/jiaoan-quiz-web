B硬化C排水防陷车湿滑，D高金属设备防雷，E料墙外警戒防堆料侧压坍塌，全需落实。硬化不等于承重无限，料仓墙应按设计限高，不能紧贴墙外建休息棚。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1259": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "BC远人群并防静电、D防雷、E遮阳控暴晒形成储油风险防线。A近码头不应成为通用选址要求，水运方便不能抵油泄漏火灾蔓延污染风险。接地连续有效还应测检，挂禁烟牌并不使未经许可动火可以进行。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1260": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "AB水域开阔岸稳、C流浪小、E陆路方便利船位系泊和物资人员转运。D一味选浅水会搁浅影响安全，不是越浅越好。还应根据潮差水深船型与冲淤核定，临时码头也不能省结构承载和防撞救生设施。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1261": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "AB自重车载决定承力，C波浪动力与D腐蚀影响海水环境长期剩余截面，按原题都应考虑。E路基土侧压力不是一般栈桥码头同组作用，有挡土等具体构件时另验。把腐蚀作为耐久影响考虑，不等同将其当一股外力简单相加。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1262": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A限速防碰边坠落、B船舶碰撞防护、D落水救生、E用电防触电均贴合栈桥场景。C防爆破不是所有普通栈桥统一必设专项项，附近确有爆破则另加。标志和救生器材需可见可取，不能被堆料车辆遮住。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1263": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "ADE二氧化碳、适用干粉、适用黄沙可用于相应电气初起火，避免导电喷流。B高压水枪未断电有触电危险，C普通灭火器未指明类型不保证适配。先报警和安全断电，二氧化碳在密闭场所也防窒息，不可无保护进入浓烟。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1264": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "ABCE遵临电规范、TN-S、两级漏保、三级配电分别对应技术依据与供配电保护。D不是只能架空，合规直埋等也可。选型布局需按现场荷载环境设计，不能以架空就免机械防护或把保护零线接成工作中性线。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1265": {"status": "explained", "source": "原有精选精讲", "text": "三级配电四项规则是分级分路、动照分设、压缩配电间距、环境安全；「控制线路长度」不是独立规则。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1266": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "BE是原题触发用电组织设计的两个最低条件：设备5台及以上或总容量50千瓦及以上，任一满足即可。A3台D30千瓦未达门槛，C8台当然也须编但不是所问最低数。未达两门槛仍须制定安全用电措施，不能私拉乱接。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1267": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "ABCDE泥石流滑坡雪崩落石洪水均可突然大范围冲击，严禁在其影响区布驻地。不能因眼前天气晴或以前未发灾就占沟口坡脚，勘查应考虑季节和极端事件。避险路线与报警仍须准备，安全选址不是取消应急预案的理由。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1268": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\nABDE场地便道办公生产按风险配消防，但C生活区有住宿厨房和用电，同样须配满足要求的有效消防器材。原ABDE漏C与消防常识及其他题居住设施消防要求冲突，不能把生活区排除安全体系，保留原分数待核。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1269": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "ABCDE加工运输、办公警卫、给排水、防火设施共同构成总平面协调，标示有助识别人车火水风险接口。E消防通道设施不能只画图不落地，现场变更要更新并交底，避免图上有栓实际被料堆或围墙封住。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1270": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "ABCD燃点闪点自燃点和爆炸极限决定储运点火与浓度控制，说明书须可靠标明相应危险数据。E浓度极限泛称不替可燃物爆炸上下限。数据还要结合温压与介质状态使用，不能认为低于闪点就无静电和受热危险。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1271": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "ABCDE强降水积雪雾台风大风会降低视线防滑稳性，原题针对不具安全条件的露天施工应停。不是室内试验等一切工作都必须停，也不能只按预报风级忽视现场阵风。停工前固设备、清危险悬物并安排安全撤人。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1272": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "ABCDE进出口、吊机、临电、洞口洞内各有车流、吊物、电气和坠落窒息风险，应警示并有必要实体设施。E不能只在洞口贴牌洞内全无引导。标志须与实际危险相匹配，不能一块“注意安全”替具体防护。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1273": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "AB交叉口脚手架、C基坑边、D危险品库、E孔洞均需专门警示和隔离护栏盖板等相应防护。标牌防误入但不能承人载荷，孔盖要固定承载并识别。危险变化或施工转场后应检查移设，不能让标牌指向已经不存在的通道。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1274": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "ABCDE防护隔绝运动危险、监测获取状态、警示报警提示超限、保险限位阻止失控，按机型配齐有效。存在装置不等于发挥作用，禁短接限位或屏蔽报警，故障应停修。监测与报警可联动也不能替合格人员操作。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1275": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\nAB超载超速、C装载机擅吊非设计功能机具、E随意扩用途应禁。但D“自卸汽车螺纹钢筋”缺动词，无法确定是运输、吊运还是其他行为，原排D无法作有效判断。应核原页补全，不自行替用户原题加字改变身份。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1276": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\nAB可区分单位制度与司炉资格，但C以“锅炉、压力”截断，D“容器安全监察机构年检”是同一句后半，被误切成两个选项。年检机构周期及证件口径亦须核版本，原ACDE不能当四个完整命题评分，先保留并待原页恢复。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1277": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n题干将锅炉登记整句与起重机安全问题连在同一下标，前段机构名称程序与后段选项无对应。BCDE不带运行维修、危险区禁人、不得过人和司机留岗有安全含义，但不能因此认整道混题已完整解释；须分离题源后核原答案，当前不改索引评分。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1278": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "斜井牵引速度越高，停车距离、脱轨和碰撞后果越难控制，因此需设上限，原库将5m/s作为该题控制值而判A。这里仅解释限速的制动和稳定机理，不能把这一旧题数值通用于所有斜井车辆、载人运输或设备型号，实际应核方案与设备条件。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1279": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n泵能力应覆盖全部来水并留余量，但题面“能力应大于排水量的20%”按字面只要求大于0.2倍来水，不能排净；若原意是“比所需排量大20%”，则应为至少约1.2倍，两者相差很大。原库A不能掩盖数量关系歧义，须核原句，不将推测改写当确定规范。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1280": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n题干中“3mVmhi”“0.15ni/s”等单位已明显乱码，风量与风速量纲也必须区分。虽原库A，不能将乱码数字当可执行通风指标。合理原则是满足人员和作业所需风量并控制粉尘气体，需核对原规范完整数值、单位和断面适用条件后再形成可靠解析。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1281": {"status": "explained", "source": "原有精选精讲", "text": "氧气下限数值正确，但严禁用纯氧通风换气——纯氧会显著提高火灾与爆炸风险，故整句错误。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1282": {"status": "explained", "source": "原有精选精讲", "text": "隧道作业地段照明电压不宜大于 36V，成洞段和不作业地段宜采用 220V，灯具宜采用冷光源，故正确。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1283": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "富水破碎围岩既怕水流软化、冲蚀，也怕盲目强排破坏地层稳定；防、排、堵、截组合能分别减少入渗、导排残水、封堵通道和拦截地表来水，原库A。不是任意挑一种方法通用，具体需依水压、围岩和环境影响制定治水方案。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1284": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在后半“高于0.5%每15分钟”，JTG F90—2015第9.11.8相应检测规定为高于0.5%应随时检测，异常及时报告并加密。瓦斯可快速积聚，固定等15分钟可能漏过危险变化；低于阈值的常规频次不能挪来充高浓度保障。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1285": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在“串联通风”。前一个工作面的废气、粉尘和瓦斯会被送到后一个工作面，一处异常还可能传播影响，故B。应按方案保证作业面独立有效获得新鲜风流，不能把有风流通过等同于空气质量合格。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1286": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n原库B可能涉及开挖进尺上限，但题干既有合理的偏压侧加强支护、及时封闭，也给“两榀间距”数值；未取得适用围岩条件下的原限值，不能随意改为另一数字。已明确的风险是偏压及长时间暴露，应缩短进尺并及时闭合，具体错项待核。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1287": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n两洞先后顺序同时受净距、偏压、围岩等级和支护等条件影响，题干只说“地质不同”，原库B不足以支持反向一概规定“必须先挖差洞”。不能以一个旧评分键形成普遍施工顺序，需恢复适用的隧道类型和原条文限定。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1288": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在把办公生活区电炉、碘钨灯取暖视为加措施即可普遍使用。这类高热源容易引燃临时建筑内可燃物，原库要求不能如此随意取暖；煤炉还存在一氧化碳风险，所以整句B。后半段煤炉防火防中毒合理，不能使前半段禁止项变为允许。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1289": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "冰雪影响导向部件、制动和电缆活动，可能引起滑移、运行故障，停用并把梯笼置于底层可降低悬空坠落及风雪暴露风险，故A。停用后还需断电管理和复用前检查，不能冰雪刚融化就不经确认直接启动。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1290": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在用明火或开水直接处理冻结瓶体阀管。局部急热会使压力及材料状态突变，氧气环境还会放大燃烧风险，故B。应按气瓶和设备允许的方法缓慢、安全解冻，不用“采取措施”这一泛称为危险加热方式兜底。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1291": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "强风可使连接松动，大雨可冲刷基础、使地基软化，支架和临建即使上部看似完整也可能因基础变化失稳，所以检查基础必要，A。还应结合设备、连系和用电状态全面确认，不能只擦干外表就恢复使用。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1292": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "夜间视认差，孔洞、上下口和沟槽易被人员或车辆忽略，警示标志与灯光让危险边界可识别，故A。两者仍应配合盖板、栏杆等实体防护，不能用灯光代替封闭开口，也不能只依赖人员熟悉现场。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1293": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "能见度差时单靠目视发现船舶、施工区会延迟避让，声响与灯光提供互补警示，原库按红光等规定信号判A。信号应与适用航行规则一致，不能随意设灯造成误认；达到停航或停工条件时不能仅增大警报继续作业。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1294": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在信号旗灯仅“高于10米”，核对JTG F90—2015第12.9.1应为高于15米，使风沙环境中更易识别驻地。防风防沙本身正确，信号设施还要牢固、防风并保持可见，不能只竖得高却倒伏失灯；此为旧标准口径未宣称现行未变。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1295": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在8小时和6小时，已核对JTG F90—2015第12.10.6原页为野外每日不宜超过6小时、隧道内不宜超过4小时。高海拔低氧加上洞内通风负担需缩短暴露，并配体检供氧救援；限时不是出现高原反应仍可硬撑到点。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1296": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "沙漠环境方向参照少、救援远，结伴及通信可在迷失、缺水或突发不适时相互协助并求援，原库按每组至少3人判A。人数和通信不替代路线、水源、防晒及返回时限计划，具体编组标准仍按适用安排确定。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1297": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n句中解除“后锚固”后就推进，但未说明替代抗倾覆约束、行走状态和受力转换，存在关键安全前提缺失；“沿箱梁两端向中轴线”也未说明是前移还是合龙阶段。原库B不能只靠0.5m数字解释，应核完整挂篮移动工序，不能照此解除唯一锚固。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1298": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "吊物会因风和起停惯性摆动，设置合适缆风绳等软约束便于在安全位置控制姿态与摆幅，原库A。软固定不应由人员站在吊物下方拉扯，更不能替代吊点、吊索和起重机稳定条件，控制绳布置也需防缠绕。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1299": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "猫道是主缆架设期间的工作通道，其线形接近空载主缆可使施工接近和操作条件较一致，减少大幅高差，原库A。平行描述的是设计线形关系，并不表示猫道可承受主缆荷载；通道、防滑和防坠设施仍需独立满足要求。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1300": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "施工方法与设计的围岩、支护假定关联，地质改变后原方法可能不再安全，及时变更设计能重新建立受力与工序依据，所以A。不能由现场凭经验擅自改法再补手续；突发危险应先停工防护和报告，防止等待变更期间继续冒险。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1301": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "压力容器储存高压能量，误操作可能导致超压、泄漏，专门培训及相应从业条件用于保证操作人员识别工况和异常处置，原库A。具体资格项目与适用设备范围须按当期制度核对，不能仅持一般安全培训签到表就认为满足专业要求。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1302": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在“低压在上、高压在下”。按原题库线路层次，高压线应在上、低压在下，以减少人员接近高压及交叉影响；干线/支线、动力/照明另按规定分层，故B。不能因其余两组层次正确就忽略第一组倒置，层次也不代替净距和绝缘要求。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1303": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错误在只“分别制订”而缺少统一协调。多单位或多专业交叉会相互影响，安全措施需结合接口、时序和警戒统一安排，不能各自文件合格却互相冲突，故B。各方仍要履行自身责任，但应在共同协调机制下落实。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1304": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在把汽油动力设备进洞视为补写措施即可允许。汽油废气与可燃蒸气在受限通风环境中增加中毒、着火风险，原库对此类洞内施工使用予以限制/禁止，故B。不能把露天发动机的使用条件直接搬入隧道，更不能用有通风机作普遍豁免。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1305": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在把多类油料、炸药雷管在施工洞内存放说成只需“制订措施”。这些物品会引入火灾和连锁爆炸风险，应按专门储存制度及地点管理，原库B。临时放一会儿、有人看管也不能自动将洞内变成合格库房。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1306": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在认为煤炉洞内取暖通过写安全措施即可普遍使用。燃烧耗氧并产生一氧化碳，隧道通风受限容易积聚致毒，故原库B。应采用适合洞内环境的供暖方式，并对能源、通风及火源控制专门设计，而不是靠工人感觉空气尚可。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1307": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "洞内光照低、设备与车辆交错，反光标识帮助驾驶员及人员提前识别机械轮廓，减少碰撞，故A。标识不能替代照明、设备灯和交通组织；污损后不反光也就失去作用，需要维护而非贴上即永久合格。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1308": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "先完成截排水可在洞口开挖前控制地表来水，避免水冲刷边仰坡或灌入隧道；排水顺接且不冲刷邻近设施则避免转移风险，故A。土沟随挖随砌有助防止沟体冲坏，不能等大面积开挖后再补排水。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1309": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "开挖扰动和降雨可能让上方表土、危石滑落，先清理可减少人员设备在洞口受落石、坍滑打击的暴露，故A。清理本身也要按方案分区防护，不能让人员站在可能滑塌体下方徒手处理。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1310": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在笼统“先开挖后支护”，易变成先大范围挖开再支护。洞口工程应按设计及时、分层防护与开挖衔接，必要先行加固，原库B。自上而下分层这一部分合理，但不能用它消除前句省略及时支护的危险含义。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1311": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "相邻钢架通过纵向连接形成整体，使其不易各自倾斜失稳，也有利于支护共同受力，故A。只把每榀单独立稳而不连系，可能在围岩不均匀荷载下逐榀倒塌；连接仍需按设计规格、位置和质量实施。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1312": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在将洞内加工钢筋当作一般可加措施的工序。加工占据有限断面并带来机械、火花和运输交叉等风险，原库要求加工在规定场所组织而非洞内随意设点，故B。洞内按方案安装已加工钢筋与集中机械加工是不同作业，不能混同。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1313": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "重车进洞制动和避让条件差，宜更低速度；空车及出洞爬坡也有相应限速，原库按8、15、20km/h三个值判A。限速是上限，不是在低能见度、狭窄会车时必须跑到该速度；设备和实际交通方案有更严格要求时仍应服从。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1314": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "滑坡减重会改变滑体应力和支撑条件，牵引式滑坡若削弱下部可能促使上部继续滑动，膨胀性土的变形机理也不是简单去重可解决，故原库A。应按滑坡类型、水和地质条件综合治理，不能只看土越少似乎越轻就盲目挖除。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1315": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在先墙后桩。原方案逻辑是先以抗滑桩形成主要深部抗滑约束，再衔接挡墙等支挡，避免建墙开挖先扰动尚未约束的滑体，故B。实际仍需专项设计确定桩墙先后和分段工序，不能把表面看得见的墙优先当普遍做法。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1316": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "冰雪融化会增加入渗、软化及孔隙水压力，使滑体稳定性降低，此时再开挖卸去支撑会叠加失稳风险，故A。应结合监测、水情和设计安排施工窗口，不能只以天气变暖、机械方便作业就决定开挖。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1317": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n“夜间开挖滑坡体”与“消解石灰站下风侧”两道判断拼接，选项A正确B错误C错误，原答案AB作为多选无法映射独立单题。前者应按夜间风险规定，后者应上风位防尘热浆；须还原原页两题，保留现评分但不把AB冒充单题解析。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1318": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在用手搬卡料。碎石机卡滞时可能突然恢复运动、夹入手臂，处理应先停机隔离能量、确认安全再用合适方法，故B。仅按停止按钮或认为石料卡死不会转，都不等于已控制误启动与残余机械能。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1319": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在把基坑边缘地表水直接当坑内集水井降水。地表来水应优先在坑外截流、导排，防止冲刷边坡和灌坑；集水井主要处理坑内汇水，故B。混用会让水先穿越不稳定边坡再排出，增加渗流和坍塌风险。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1320": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "流砂会随渗流涌动、掏空边坡和坑底，围堰或板桩等措施可隔水、挡土并为开挖创造相对稳定条件，原库A。具体需验算水土压力、抗渗和稳定，不能只插几块板就继续挖，也不能安排人员在涌砂点徒手堵塞。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1321": {"status": "explained", "source": "原有精选精讲", "text": "桥梁基坑深度超过 1.5m 且不加支撑时，必须按土质情况放坡或采取支护措施防止坍塌，故正确。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1322": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "冻结法利用土中水结冰提高临时强度并控制渗流，按层形成满足条件的冻结体再逐层开挖，可减少未冻结土暴露，原库A。低温天气不等于已达到工程冻结要求，温度、厚度和承载条件仍须按设计监测确认。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1323": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "浮运套箱会占航道且受水深、流速、拖带姿态影响，监管协调避免与航运冲突，专门牵引方案控制浮运稳定与路线，故A。拖船马力足并不表示任何水位或流速下都安全，实施前还需检查套箱浮力与连接条件。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1324": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "孔内可能缺氧或积聚有毒气体，机械通风置换能降低入孔暴露风险，因此题干这一步措施A。通风不是空气检测的替代品，仍应按规定检测确认、监护和准备救援；不能鼓风几分钟就凭感觉判断可进入。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1325": {"status": "explained", "source": "原有精选精讲", "text": "吊装前须检查旧钢丝绳，每一节距内折断钢丝不得超过 5%；大型构件、重构件宜使用检验合格的新钢丝绳。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1326": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "预应力锚具承受较大集中力，裂纹、配合不良等缺陷可能在张拉时突然失效，使用前检查试验用于确认其性能，故A。外观新并不证明合格，检验应与批次、规格和配套夹具相对应，不能用不同系统随意拼装。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1327": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "平稳均匀进回油可使张拉力和卸荷可控，压力表同步变化有助识别卡滞、泄漏与突变，故A。出现压力异常不能猛开阀门追数值，应停查原因；读数合适也需与实际伸长等控制指标配合。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1328": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在“雨季宜”。雨水会使工作坑和地基软化、增加积水及设备滑移风险，顶进更难保持稳定和方向控制，故B。宜避开不利水情，必须施工时应有专门排水、支护和监测措施，不能把赶工需要当季节适宜性结论。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1329": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在“1/4”，JTG F90—2015第8.15.10规定冲钉粗制螺栓总数至少孔数1/3，数量不足会使拼装过渡节点传力不可靠。冲钉比例、最少个数和悬臂工况另有限制，不能只满足一个比例就摘钩卸载；本题按旧规范更正。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1330": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在把悬臂吊机用来随意调整梁段缝宽和高程。这可能给吊机和已架梁施加非设计水平力、偏载或扭转，应采用设计认可的定位调整装置和工序，原库B。能吊起梁段不等于可将吊机当顶推、拉拽或强行校正工具。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1331": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "转体到位后仍可能受风、临时支承及偏心影响，及时约束固定防止继续转动或失稳，再按设计封固球铰转换为永久受力体系，故A。到达角度只是几何到位，不等于永久连接和承载体系已经完成。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1332": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在从拱脚向拱顶拆。拱架卸落需按方案对称、分级，使拱体逐步受力；从两端先失去支承可能破坏整体稳定，原库B。一般控制方向与分区应由拱型和支架设计确定，不能把拆普通直梁支架的习惯直接套到拱架。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1333": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "高塔易受雷击，顶部防雷系统降低雷电损害；人员通过合格电梯或爬梯上下可避免无保护攀爬，故A。防雷装置不能让雷雨时攀塔变得安全，爬梯也需相应防坠与休息条件，不是只有一排踏棍即可。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1334": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在永久连接稳固“前”拆临时固定。临时约束承担施工阶段稳定，只有永久连接形成设计所需承载条件后才可按程序解除，否则存在无约束时间窗，故B。构件已放到支座上或螺栓只穿入未紧固，不等于永久固定完成。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1335": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在让零星物件随构件起吊后仅临时绑扎。起吊前应清除无关散件，必须随吊者须专门可靠固定，避免振动或倾斜时落物，原库B。不能把任意几件杂物捆一下当作合格吊装组合，吊物上方也不得站人。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1336": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "不得沿立杆栏杆攀登这一部分正确，但“项目部每天安排体检”不是题库要求的适岗健康管理频次，整句B。应按岗位要求进行健康检查并关注当天状态，不是把每日出勤询问等同医学体检；登高应走规定通道。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1337": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "安全绳打结会改变受力、降低有效强度，额外挂钩也可能损伤绳体或形成非设计连接，所以题干禁止这类用法，原库A。连接应使用系统规定的挂点和连接件，不能用结扣替代合格调节器或将工具随意挂在生命绳上。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1338": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "作业面缺少合适吊点时，按设计设安全带母索可提供连续可靠的连接路径，减少人员无保护移动，故A。母索仍须验算端锚、挠度、坠落净空和允许人数，不是随手拉根钢丝绳就能当生命线。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1339": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错误在大型构件作业的主要上下通道“宜用绳梯”。绳梯晃动、转身传物与救援条件差，应采用可靠固定的梯道、爬梯或规定升降设施，原库B。能攀上去不等于适合作为频繁通行的安全通道。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1340": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在允许自行制作吊篮经自检后使用。吊篮是载人高处作业设备，需要符合产品标准和相应制造、检测要求，自制后现场看一看不等于合格定型产品，故B。前句要求专业厂家定型产品，后句又放开自制，本身已有条件冲突。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1341": {"status": "explained", "source": "原有精选精讲", "text": "施工船舶应配备规定的定位与通信设备；手机通信不可靠，不能替代法定船岸通信设备，故错误。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1342": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "雨雾霾使船员难以及时看清施工界区和相向船舶，规定信号补充识别，风险超过可控条件就停航停工，故A。不能因已有雷达或灯光就忽略现场能见度限制，也不能把信号装置当持续作业的自动许可。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1343": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "爆破会影响周边人员、交通及设施，审批用于事前确认资质、方案与安全条件，故A。批准后仍须按实际风险落实警戒、人员清退和器材管理，不能把一份批文视为任何时间地点均可自行起爆的授权。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1344": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在仅“当天”公告且只在项目部张贴。公告必须让可能受影响人员提前知晓地点、时间、警戒范围，内部张贴不能覆盖公众，故B。具体提前时限与公告范围应核所适用规定，这里不编造一个未经核验天数。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1345": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "爆破危险来自飞石、冲击、振动等，警戒区和专人防止误入，起爆前清退并发出警示让暴露人员撤离，故A。发了信号但未确认清场不等于可起爆，警戒解除同样应按程序确认安全后进行。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1346": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "地下水会降低边坡土体强度并产生渗流冲蚀，先控制和导排再开挖可减少失稳，故A。排水也须有序，不能在未稳住边坡时大流量抽排造成新的水土流失；发现突涌水应先避险报告。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1347": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "同一安全桩挂多根安全绳会增加合计载荷且形成共因失效，一处锚固损坏就可能同时伤及多人，原库据此禁止而判A。各锚固点需按设计承载，不能只看桩粗或绳子拴得下就随意共用。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1348": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "化纤衣物摩擦可产生并积累静电，放电火花可能引燃敏感爆破器材，故原库A。适当着装还需与防静电环境、器材分开操作和轻拿轻放结合，不能换了衣服就忽视撞击、火源等其他起爆因素。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1349": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在允许“一人同时搬运”。炸药和雷管应按规定分开搬运，雷管敏感且可引爆炸药，简单在一个人身上隔开并未消除共同受撞、跌落的风险，故B。搬运路线、数量和容器仍需服从专门管理要求。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1350": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在把“整治为辅”作为滑坡治理的普遍原则，易弱化已经存在滑坡的系统治理。应结合预防和治理，按地质、水文及稳定性采取排水、支挡等有效措施，原库B。预防重要不等于已发生的变形只需少量辅助整治。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1351": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "滑坡位移、裂缝和地下水变化可在失稳前提供信号，专人监测有助于及时预警停工撤离，故A。专人不是只肉眼偶尔看一下，还需按方案确定点位、频率、触发阈值与报告链，监测不能代替必要治理。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1352": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "排架竖立是临时受力和倾覆敏感阶段，统一指挥避免多人反向用力，整体竖立有利于保持构件关系、减少空中拼装，原库A。整体重量和临时约束应按方案设计，不能把“整排为宜”当成可超出吊机能力整体硬吊。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1353": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错误是“消除弹性变形”。预压可消除或减少支架非弹性沉降并测得弹性变形供预拱度等控制使用，弹性变形随荷载会恢复或再发生，不能被一次预压消灭，故B。承载能力稳定性检验这一目的正确，不使后半句变正确。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1354": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "模板支撑与供人员作业的脚手架承担不同功能，随意相连可能把走动、搬料荷载和振动传给模板，也可能在模板拆装时拉倒架体，故原库A。是否允许某种一体化系统必须有专门设计，不能现场随手搭接当可靠支撑。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1355": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "专人统一指挥能保证起升、回转、落放信号一致，合格起重工能识别吊索、吊点和作业限制，所以A。多人同时喊指令或仅凭普通工人熟悉现场不能替代职责与能力要求，出现紧急停信号仍应按规定立即响应。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1356": {"status": "explained", "source": "原有精选精讲", "text": "起重吊装警戒区必须不小于起吊物坠落影响范围，题干「不得大于」会缩小警戒范围，故错误。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1357": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错误在“五级”。原教材高处作业按高度分为四个级别，常用界点为2、5、15、30m等，故B。级别、环境类别和具体作业种类是不同分类维度，不能把某种特殊作业再当第五个高度级别。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1358": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "分级标记用于把高度等风险信息与作业种类准确传递给组织者，原题在一般高处作业的标记中写明级别、种类而判A。应按所采用标准的完整标记规则填写，不能只写“登高”就代替高度级别，标准版本变化需另核。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1359": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "金属支架若受漏电或雷电作用可能带危险电位，可靠接地可形成预定泄流/保护通路，故A。接地本身还需与电气系统、等电位及其他保护配合，不能随意找一段埋地钢筋搭一下就认为达到接地条件。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1360": {"status": "explained", "source": "原有精选精讲", "text": "支架预压荷载应为需承受全部荷载的 1.05～1.10 倍，用以消除非弹性变形并检验承载力，0.75～0.80 倍不足，故错误。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1361": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错误在支撑固定未完成就根据情况移动或升降吊钩。吊钩此时仍承担临时稳定作用，贸然卸荷或拖动可能使模板倾倒，故B。应先形成可靠支撑和连接，确认稳定后按指挥解除吊装约束。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1362": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "横向同时、纵向对称均衡卸落，是让模板支承荷载平稳转移，避免一侧突然失去支撑产生扭转、偏载或局部过载，原库A。具体卸落分级和顺序仍需施工方案确定，不能把“同时”理解为所有支点瞬间全部拆除。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1363": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "两处不准：JTG F90—2015第5.3.5是超过2米设置脚手架或平台，并强调骨架足够“稳定性”，而非只有材料强度。钢筋够强仍可能整体倾倒，需可靠临时固定。门槛不表示2米以下可无视实际坠落风险，原题强度不能替换稳定。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1364": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在所有转动部件一律设“制动”。转动传动部位首先需要防护罩等隔离，制动装置用于控制特定运动和停止，二者功能不能互换，故B。设备需要的制动仍须有效，但不能以一个刹车代替齿轮、皮带等防卷入屏护。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1365": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在利用电缆、软管拖拉或吊挂振捣器。其接头和外皮不是设备承重吊点，拉力会损坏绝缘、漏电或使机器掉落，故B。应使用规定的提手、吊点和搬运方法，不能只做到不刮伤外皮就认定这种搬运方式安全。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1366": {"status": "explained", "source": "原有精选精讲", "text": "预留孔洞周围须设安全护栏或盖板并设警示标志，且不得随意挪动，以防人员失足坠落。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1367": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错误在稳固“水平放置”。气瓶特别是含溶解气体者按规定保持合适竖立和防倾倒状态，卧放可能影响阀门及介质安全，原库B。专用车架不能成为任意瓶型横放的通用许可，实际姿态与防晒防热等均须按气瓶要求执行。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1368": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "高处火花、熔渣可能落到远处或下方的可燃物上，周围及下方防火、配器材和专人巡视共同防止余火扩散，故A。只清理脚边而忽略孔洞下方、夹层内可燃物不够，作业结束后也需确认没有阴燃。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1369": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n题干要求防滑鞋、安全帽和超过2m时设网，这些措施本身并非显然错误，但原库判B，未说明错在高度、强制范围还是遗漏安全带。安全网与个人防坠不能互相替代，然而“未写安全带”不等于明确允许不系；需核原文后定位错词，不能硬造阈值。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1370": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "大重构件、新结构或新工艺的受力、制动、同步和指挥条件未经实际验证，先在受控条件试吊有助发现不平衡或连接问题，故A。试吊应按方案离地少量观察并检查，不是直接吊到工作高度后说已完成试验。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1371": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n原库B，但“选额定荷载相同或相近、合理分配负载”有安全合理性，并不能单凭字面判错。双机抬吊还需机型性能、同步控制、降载等条件，仅容量接近不足以保证安全，但缺少条件不等同该建议必错。需核原题是否将“性能”误改为“荷载”。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1372": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在把非施工船舶也列为可由现场人员指挥靠泊对象。施工栈桥码头的承载、系泊和作业区按施工用途控制，不能据此允许无关船随意进入，原库B。专人管理应落实准入和通航隔离，不是有管理人员就可兼作开放码头。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1373": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "同一供电系统内随意混用保护接地、接零，可能导致故障时保护动作和外壳电位互相影响，应按统一接地系统设计协调，故原库A。题干不是禁止任何经设计的不同系统分区，而是禁止在同一回路里未经分析任意混接保护方式。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1374": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错误是把PE当N穿入漏保。PE承担保护功能，正常不应流工作电流；与N混用会破坏剩余电流检测和外壳保护关系，所以B。TN-S正是要求保护与工作中性导体分开，接到一个孔位能通电不等于接法正确。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1375": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "独立开关箱对应一台设备，使故障隔离和启停对象明确，避免一闸多机误启动及保护参数不匹配，故A。设备并排很近、功率合计不大，也不能因此把独立控制要求取消；维修一台时不应被其他设备用电牵制。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1376": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "设备外观、静音或指示灯熄灭都不能证明无电，按规程确认前作有电对待可防止误触，故A。谨慎并非允许随意带电操作，而是要求先隔离、验电并防误送，确认后才能进入相应作业程序。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1377": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "在既有配电装置上临时挂接设备易绕过规定开关、保护及容量控制，造成松接、过载和误操作，故原库禁止而判A。新增用电应经合规配置、接线和检查，不是把一根线搭上能运行就视为临时用电手续完成。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1378": {"status": "explained", "source": "原有精选精讲", "text": "开关箱必须装设隔离开关及短路、过载、漏电保护器，严禁设置分路开关，且每台设备独立设箱，故正确。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1379": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在主进线采用插头插座活动连接。主回路松脱会引起发热、拉弧或保护线失联，应采用符合箱体设计的可靠固定连接，故B。末端工具按规定使用插接件与配电箱电源进线端不是一个层级，不能相互套用。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1380": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "前句动、照分箱合理，错在合箱时“共路”。即使共用箱体也应分路供电和控制，避免动力故障、检修导致照明同时中断，故B。物理上放在一个箱里不等于电气回路可合在一起。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1381": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "水泥细粉易扬尘，密闭可减少逸散；砂石覆盖可降低风吹、装卸时的扬尘，故A。控制措施需适应材料和搬运过程，不能只在停工时盖上，装卸和清扫仍任粉尘扩散；有降雨也不代表长期无需覆盖。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1382": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "定人明确操作者和保养责任，定机减少设备混用及状态不明，定岗位明确工作边界和职责，原库A。它不是禁止依法交接轮班，而是要求交接、检查和责任清晰，避免机器出了故障人人说不归自己管。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1383": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "集中停放区存在燃油、电气和可燃材料，消防通道使救援能接近，器材用于处置初起火情，因此A。停车不能堵住消防车道，配了灭火器也不能免除油料泄漏和充电火源管理。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1384": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错误在仅凭“培训熟练工人”就允许特种设备装拆。该作业还需相应单位条件、人员资格和专门方案，熟练不能替代法定准入与程序，故B。题干不是说熟练技术没有用，而是条件不完整时不能据此安排上岗。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1385": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在一概“从左至右、整体”。拆除要依据受力体系自上而下、按方案分段逐步实施并控制支撑，不能用平面左右顺序代替结构安全顺序，故B。不得立体交叉作业这一部分合理，不能使前半段错误变正确。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1386": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "拆旧桥涵时照明和警示用于隔离危险、提醒绕行，不是“方便车辆行人继续通行”的许可，原库B。拆除会改变结构承载且有落物风险，应按交通组织封闭或安全导改，不能有灯就让公众从不稳定结构下或上方通过。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1387": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "跨线防护棚本身也是道路环境中的固定物和净空边界，轮廓、警示、爆闪等设施帮助车辆提前识别、减速避让，所以A。灯光不能替代棚体承载、净高、限速和交通组织设计，安装位置也不能干扰正常驾驶视线。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1388": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在“必须等于”。落物防护范围需结合坠落高度、轨迹、道路宽度和棚体布置确定，棚长不能仅等同一个半径数值，故B。半径是空间影响范围参数，而棚体长度是沿线路尺度，几何对象不同且可能需额外覆盖。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1389": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在将业主、监理检验等同规定的特种设备检验检测。专业设备安装后的合格确认需由具备相应条件的检验检测等程序完成，不能仅双方自查代替，故B。使用过程检查维护记录是必要的，但不能补偿投用前法定/专业确认缺失。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1390": {"status": "explained", "source": "原有精选精讲", "text": "在带压管道、盛装易燃易爆物品的容器及受力构件上焊接切割易引发爆炸或结构失效，属明令禁止行为。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1391": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "高于洪水位只解决部分洪水风险，背靠山坡脚还可能受滑坡、崩塌、泥石流和落石影响，故题干一概选址方式B。驻地应同时避开地质灾害和排洪风险，不能因“山后挡风”就认为山脚天然安全。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1392": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错误在“下风侧”。粉尘烟雾会随主要风向输送，下风侧更易受污染，布置办公生活区应尽量避让并选择有利风向、采取必要隔离，故B。必须先控制污染源，不能只移动宿舍就忽略超标排放。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1393": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "取弃土场有车辆频繁进出、扬尘及堆体边坡失稳等风险，驻地场站避开可降低人员长期暴露和相互干扰，故A。不是离得越远越好即可，还需满足交通、排水、地质和环境条件，由选址方案综合确定。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1394": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在生产、生活、办公“一起集中”，三者风险不同，需按功能和危险源分区保持必要间距，故B。爆破距离也须按设计及适用要求计算，不能用句中一个500m数字抵消混设带来的火灾、噪声和车辆风险。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1395": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错误在用建设监理批准让货车载人成为合法。货运车辆不是合格人员运输工具，批准不能改变车厢防护和乘员安全条件，故B。赶工、路程短或工人自愿均不能代替适用的载人车辆和运输组织要求。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1396": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n原库B，但木板并非在任何条件下都绝对不能作洞口盖板；关键是盖板承载、尺寸、防移位和固定是否满足要求，竹跳板随意铺盖通常不能证明这些条件。题干只说“盖好”未给设计与固定细节，需核错项，不能把材料名称本身当唯一判错依据。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1397": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "公共场所附近人员可能不熟悉工地，实体防护防误入，夜间照明与红色警示提高可见性，三者共同降低跌落和车辆冲撞，故A。指示标志不能代替围护，围护也不能让暗处障碍自动可见。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1398": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "防护、保险限位和安全信息装置分别承担隔离、边界保护和状态警示作用，缺失或失效会削弱多道屏障，因此A。检查不应只数有没有部件，还要验证功能；为了方便操作短接限位或拆罩运行不符合齐全有效。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1399": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "轻型钢结构棚便于形成稳定受力体系，配套防雨雪、防风可降低物料受潮、积雪超载和棚体倾覆风险，原库A。轻型不等于可随意减少连接和锚固，风雪地区仍须按荷载设计并及时检查清理。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1400": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "料仓墙承担散料侧压力，强度稳定不足会倒塌，外围警戒区使人避开可能落块与倾覆影响，原库按不小于两倍墙高判A。具体范围还与墙型和工况相关，不应把这个旧题比例当免验算或免防撞的万能尺寸。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1401": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n题干先说储油罐远离明火，却又说“毗邻人员密集区、建筑物集中区”，与控制火灾暴露风险的方向相冲突，疑似漏字/错字。原库判A不能直接作为安全操作依据，防火间距15m也未经现行规范核验，须核对原文。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1402": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n题干包括车道宽度和错车道视野两部分，原库判B，但未给出错项理由。不能凭空编造现行宽度阈值；应查原题库所用便道标准及适用条件后再解释。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1403": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "交叉口存在车辆交汇、夜间识别不足以及超高车辆碰撞风险。照明提升可见性，警示标志提醒交叉冲突，限高架在有限高条件时阻挡超高进入，各措施分别对应该处风险，故原题库判A。B会整体否定这些匹配的安全措施；本解释不据此推导限高架的具体尺寸。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1404": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在对多种敏感设施一概选“上游”。临时码头位置需避开通航、漂浮物、污染和设施安全影响，上游布置可能把事故后果带向下游桥梁或取水点，故原库B。具体上/下游及距离应逐项论证，不能只满足一个“有安全距离”泛称。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1405": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "案例已有44人死亡，超过原分级30人这一特别重大死亡指标，不能称为重大事故，故B。直接损失2035万元较低也不会把等级降下来，多项指标取达到的较高等级；11名伤者情况不影响44死已满足的分级结论。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1406": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n原库A认为风筒口距掌子面30m、送风超1400m错误，但仅凭距离不能判定长距离送风不安全，还需有效风量、漏风、风阻、瓦斯条件和通风方式。页面案例又截断，缺乏测量依据，不能编造一个通用最大送风距离或把所有30m布置判错。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1407": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "C短路火花在已积聚瓦斯环境中引燃，是本题最贴近爆炸触发的原因。A说明气体来源地质与塌方背景，B违规分包、D培训资格缺失更属组织管理链。火源与爆炸浓度必须同时控制，不能只修一个插头就宣布瓦斯隧道安全。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1408": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "D违规分包是组织管理层失控，间接造成风险控制和人员能力不足。A塌方涌气、B达到爆炸浓度、C火花点燃是事故物理过程和直接条件，与间接制度缺陷层次不同。找管理原因不是否认瓦斯和火源，而是追问为何未被有效控制。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1409": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "完整原文作业平台21米，落在15米以上至30米的三级高处范围，故C。A/B较低、D超过30米档不合；不能用立柱本节高11.4米或已浇10.4米代实际坠落基准面高度。分类用于制定保护，三级也不能靠安全帽替防坠系统。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1410": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "该立柱模板倒塌4人死亡，按3至不足10人死亡档为B较大。A低于伤亡档，C/D无更高指标证据；事故在21米平台发生不直接决定事故等级，高处作业等级和生产事故等级是两套不同分类不能混淆。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1411": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "C泵送是正常工法，关键是泵送速度和量未协调、局部偏载，并非用泵本身必然致事故。A连接破坏、B材料缺陷与梯子附模、D疲劳损伤及节点装配缺陷均在案例事故链。不能禁用工法替代修正设备、组织和荷载控制。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1412": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n模板钢板有夹层、生锈直接显示材料/设备质量和维护检验问题，不能仅由这些事实必然推出“施工设计缺陷”。案例确有其他受力和施工组织问题，但原库A把两层概念直接等同，需核调查结论或原题用词，不能拿“设计包括一切”强行解释。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1413": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "没有试验方案、加载程序和统一指挥，是组织与程序控制缺陷，属于间接管理层原因，题干把它们直接称直接原因不妥，故B。直接失效还应看钢管壁厚不足、地基和具体加载过程等，原因重要与原因层次不是同一个维度。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1414": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n监理漏查漏制止可构成责任，但是否“主要责任”要依据各方职责与具体因果认定；现有案例仍显示施工方无设计、地基未处理等严重问题。原库B可理解为不能把主要责任当然转给监理，缺少完整责任认定时不编造比例或断言监理无责。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1415": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n业主资格审查是否不严应有资质和审查事实，当前案例只见施工方案、支架及加载问题，没有足够证据把它定为主要原因。原库B可保留，但不能反推业主必无过错或资质审查完全无关，需要完整调查事实定位主要责任。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1416": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "完整荷载试验案3人死亡、7人受伤，死亡恰达较大事故下限，B。A一般不能覆盖3死，C/D不足更高条件；“20多人坠河”不是全部死亡，加载到90%也不是按90%折算事故等级，伤亡损失须据实际核定。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1417": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "钢箱梁侧翻案7人死亡，处3至不足10人区间，B较大。A一般过低、C/D过高，桥下3人轻伤不另把等级抬到重大。支座未锚固与偏载是技术事故链，级别则以法定伤亡经济指标判断，不能按桥梁造价推测。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1418": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "思想麻痹、赶工和安全意识薄弱属于决策与管理层原因；真正使钢梁失稳的直接环节是未形成锚固及压重条件就施工加偏载，故题干将意识问题叫直接原因，B。不能用负责人主观态度一句话替代对受力失效链的分析。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1419": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n原库B说明不能仅凭设计文件和交底不足就把主要责任指定给设计单位；案例还存在施工方擅改程序、未锚固和未浇压重等行为。当前信息不足以完成各方责任排序，故不编造设计单位免责或责任比例，待核完整调查结论。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1420": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "建设单位组织把握设计安全要求，有助于识别特殊技术环节并确保向设计方提出必要约束，题干这一管理义务方向原库A。提出要求不等于代替设计单位进行专业设计，也不免除施工方按设计程序组织实施的责任。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1421": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "洞内储存炸药和雷管会把爆炸物集中到相对受限空间，爆炸冲击及连锁引爆后果严重，且增加施工活动干扰储存的风险；题干说这种做法“是错误的”，按原题库应判A。B相当于认可在施工洞内随意存放爆破器材，不能据此作为可接受的储存方案；实际存放还须按适用民爆制度专门设计管理。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1422": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "爆炸案例20人死亡，按原分级为重大事故而非较大，题干B。起爆器材混装、无资质承接解释事故成因，不改变先按死亡、重伤和损失指标判级的方法；不能把“较大”当对严重事故的日常形容词使用。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1423": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "C起爆器材受机械能触发进而引爆乳化炸药，描述直接能量释放链。ABD违法分包、管理不到位、教育不足解释防线为何失效，属更上层管理原因。原因区分不表示只处理司机即可，器材混运、制度执行等仍须追责整改。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1424": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n题目问“间接原因”却标B雷管与炸药同车运输，该项是现场不安全行为；D违法分包更符合组织管理缺陷类别。须结合完整事故调查口径核对原题与答案，不把原库B无条件解释为组织管理原因。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1425": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n现有案例只叙述赵某使用电钻触电，未给绝缘用品、设备漏电及责任调查完整信息；能确认违章需要具体防护要求和实际行为证据，且“主要责任”更不能只由死亡者身份推出。原库A保留评分，但不据截断案例认定死者当然负主要责任。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1426": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n漏电保护失灵是保护装置的物理不安全状态，常属事故直接技术因素；原题却将其称“间接原因”并判A。若要追到未检测、未维修的管理缺陷才是更深层原因，题干未这样表述，与同库直接/间接分类冲突，需核原答案。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1427": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "C绝缘鞋与绝缘手套配合减少电流经人体入地风险，AB/D不是此题Ⅰ类电钻标准个人防护搭配。个人绝缘不替保护接零、漏保与工具检查；试了一下能转不证明绝缘正常，故障应断电交专业人员维修。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1428": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A为TN-S，工作零N与保护PE自电源相应位置分开，配合三级配电两级漏保形成临电基本结构。B/C/D非题定规范系统名。不得末端N和PE混接或在PE上接开关熔断器，名称正确也要实测保护连续有效。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1429": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "拆除可能危及周边并改变原结构稳定，建设单位事前报送备案材料便于主管部门掌握项目、承接主体与安全安排，原库A。备案不等于审批机关替业主选择合格承包者，也不免除提供图纸、审查资质及落实拆除方案的责任。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1430": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "D拆除人员应有独立可靠脚手架或平台，不能站在正被破坏的楼板上敲砸。A/B简单推倒、C有吊车配合都不能替代拆除方案与安全作业面。临时围挡警示还需承载拆除工况，不能只围一圈就允许野蛮拆。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1431": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "B自上而下逐层分段，保持剩余结构可控稳定。A左右顺序忽略承重传递，C/D立体交叉使下方人员暴露落物和坍塌。不得先拆承重墙使楼盖悬空，拆下料及时受控清运不超载堆在剩余楼板上。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1432": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "完整钢梁吊装案2名工人被坠梁击中死亡，未给更高损失指标，原按A一般事故。B较大死亡门槛3人，C/D更高；18米吊高或钢梁大不直接升级。一般事故也可有严重刑事与行政责任，不能将一般理解为可不报不查。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1433": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "恶劣天气后冰雪会降低摩擦、增加附加载荷，潮湿又可降低电气绝缘，复工前清除并落实防漏电措施是对应的风险控制，故A。它只是复工检查的一部分，能见度、风速等仍不满足时不能因清了雪就吊装。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1434": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "B合法专业分包这一行为本身不当然致事故，风险在分包后无资质培训、违章和管理失控，应查具体行为。A大雾未试吊、C违规操作指挥、D人员穿危险吊区都直接关联事故链。总包劝阻未果也不等于已尽全部统一管理义务。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1435": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在截断后“接长处理”起重钢丝绳。严重断丝等缺陷已削弱承载可靠性，接长不能恢复原连续绳的设计性能和使用条件，应按报废/更换要求处理，故B。润滑保养针对可继续使用的绳，不是让超报废标准的绳重新合格。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1436": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "安全阀依靠阀芯受压与弹簧等机构动作，垂直安装有利于按设计方向启闭和回座，原库选A。B水平、C30°、D45°均使受力姿态偏离题设安装要求，不能把普通管道可转弯安装的做法套到安全阀。本题解释安装方向原则，具体型号仍应遵产品要求。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1437": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n防护目的确实指向C套管：标桩和方位标志不能承受机械挤压，防潮材料也不能替代机械保护。但“从0m高到地下0.2m”疑似缺失地面以上高度，不能把这组范围当完整的可靠安装尺寸。原选项判断可理解，数字表述须核原规范，暂列待核验。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1438": {"status": "explained", "source": "原有精选精讲", "text": "施工现场专用的中性点直接接地电力线路必须采用 TN-S 接零保护系统，即工作零线 N 与保护零线 PE 全程分开。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1439": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "按原题库色标，A/B/C相依次黄、绿、红，中性线N淡蓝，保护线PE黄绿双色，故B。其他组合把专用保护线色混到相线或中性线上，可能造成检修误认。色标用于识别功能，不能只凭颜色就认定无电，仍需执行隔离验电等程序。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1440": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "临时用电安装、维护直接接近带电部分，最有针对性的防护是A防触电用品。B防滑、C防毒、D防强光针对其他危险，不能替代绝缘防护；实际如同时有高处、焊接等风险还需相应组合防护。配戴用品也不意味着可以省去断电作业。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1441": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n原库选D总配电箱，但该题只问系统“何处须重复接地”，未说明只取起始点；同题库1445又把总配电箱及分配电箱均列作重复接地位置。重复接地并非只能在总箱设置，C亦可能符合条件。需补全系统位置和规范限定，不能唯一化为D。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1442": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A中人体同时接相线和中性线，电流可经人体从相线流出再经中性线返回，保护器所测剩余电流可能为零，因而不能指望它动作。B/C/D均有经大地或接地金属分流的路径，达到动作条件时可被检测。木桌绝缘不消除A的相—零电击危险，故选A。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1443": {"status": "explained", "source": "原有精选精讲", "text": "外部防雷装置由接闪器、引下线、接地装置组成；电涌保护器用于限制瞬态过电压，属内部防雷措施。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1444": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "直击雷防护要先接闪再引流入地，A避雷针属于接闪器。B电涌保护器、C间隙、D阀型避雷器主要限制或泄放电气系统过电压，不能代替建筑或外场设施的直击雷接闪系统。题目用直击雷区分接闪装置与电路浪涌保护，故A。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1445": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "重复接地为保护导体提供附加对地通路，有助于降低故障时外壳电位，原题限值取B不大于10Ω。A40、C30放宽了该限值；D5更严格但不是题目问的规定最大值。该数值是旧题库记忆口径，不能以“测得≤10Ω”代替对整个故障保护系统的检验。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1446": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "带电设备灭火要避免灭火介质形成导电通路，四项中C干粉更符合这一条件。A泡沫、B酸碱、D清水均含可导电液体，未断电直接施放可能伤人。现场应先安全断电、报警，按设备和介质适用范围选型，不能仅有灭火器就随意近距离带电喷射。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1447": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "原高处作业定义从可能坠落的基准面算起，达到含2m这一界点选B；不是从作业人员脚下某个局部台面随意另算。A3m、D4m漏掉了较低但已达定义的作业；C1.5m不是该定义界值。低于2m仍可能有坠伤风险，不等于无需任何防护。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1448": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "吊物不仅会竖直坠落，还会随起重臂回转、摆动，故危险隔离不能只按下方1/2/3m小圈，原库选C回转半径内。A/B/D给固定距离而未考虑吊运轨迹，容易遗漏实际落物范围；实际还须按方案划定吊装警戒区，禁止人员站在吊物下方。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1449": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "题目问10kV以下架空线边线与起重机部件/吊物的最小水平距离，原库取C2m。A1m少于题库界值，B20、D10虽远但不是所问最小值。水平距离不能与垂直距离混用，还要考虑回转和摆动；数值仅按原库，不作为现场电压等级与净距设计依据。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1450": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "焊接弧光包含强可见光及紫外、红外辐射，需要与焊接条件匹配的B滤光镜。A普通墨镜、C平光镜、D茶色镜不能仅凭深色外观证明具有焊接辐射防护能力。应看专用防护性能，而不是“看起来不刺眼”就认为安全。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1451": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "该题用35kV条件和“垂直距离”限定原库答案C4m。A1m不足题库限值，B20、D10不是问的最小规定值；不要把上一水平距离2m套到此题。线路弧垂、设备高度和运动范围均影响实际净空，题库数字未经现行分电压等级表核验。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1452": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "通道附近基坑即使已围挡，夜间识别条件仍会下降，题库采用D红色警示灯提醒危险边界。A绿容易被理解为可通行，C蓝与此危险警示功能不符，B黄并非本题指定灯色。灯光是对栏杆围挡的补充，不是可以用一盏灯替代防护。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1453": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "线盘有转动惯性，放线速度突变或停止时若不能制动，会继续转动放出多余缆索甚至甩动伤人，所以选A制动设施。B启动只使其运动，C防滑主要限制底座位移，D防雷不解决收放线惯性控制问题；底座稳固和制动应同时满足。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1454": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "张紧器与钢丝绳连接处若脱开，会沿受力方向产生回弹，A前方是主要危险路径，B右方、C左方也未说明与受力线的关系，都可能处于打击路径。D侧后方用于避开主要回弹线，故选D。还须划警戒区，不得把“侧后方”理解为无论距离多近都安全。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1455": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "高边坡、陡崖外缘护栏还未成形时，人员和作业平台面临临边失稳风险，首先匹配B防坠落。A防潮、C防火、D防砸不能阻断人员越过临边的坠落路径；需配套可靠作业平台、临边防护和相应防坠系统，不能只戴安全帽替代。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1456": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "变配电室事故可能伴随烟气、热量或人员急撤离，门向外开启可减少疏散时被室内人流、设备阻挡的风险，选D。A随意、B两边不是确定疏散方向，C向内开可能阻碍撤离。采用防火材料与保持出口通畅同样不能缺少。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1457": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "原临电制度把漏电保护设置在总配电箱和开关箱两个层次，末端就近动作、上级提供补充保护，故B两级。A仅一级缺少分级保护；C/D更多级不是本题最低规定值，且保护器参数须协调，不能把简单多装等同于可靠选择性。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1458": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "送电从电源侧逐步向负荷侧，总箱→分配箱→开关箱，便于分段确认供电状态，故A。B是由末端向上，近似停电时的反向次序；C/D跨级操作可能使下游已合闸回路突然带电。送电顺序不能代替先确认线路和负载安全。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1459": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "绝缘电阻通常很高，需要专用仪表施加规定试验电压进行测量，C兆欧表与这一用途匹配。B测接地通路电阻，A/D普通万用表电阻档不能等同规定的绝缘试验。测试前隔离电源、放电并保护敏感元件，不能在线带电直接摇测。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1460": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "下底进出线减少雨水沿开口重力流入、也便于做密封与弯水处理，所以选A。B顶面开口最易进水，C侧面、D后面开口也不能自动防雨防尘。线口在下方并不等于不需护口、密封与固定，箱体防护须整体考虑。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1461": {"status": "explained", "source": "原有精选精讲", "text": "危险潮湿场所照明及手持照明灯具必须采用安全电压供电（一般 36V 及以下，特别潮湿处 12V）。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1462": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "消防泵需在普通用电总开关切断时仍保持救火供电，专线从总断路器上端引出，原库选B。A漏保、C总箱、D分配箱只给设备或箱体名称，不能准确表达不被普通总闸切断的取电位置。专线仍需按消防设计配置保护，不能理解为允许无保护乱接。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1463": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "移动和手持工具由人直接接触，绝缘破损时更易形成触电通路，需A漏电保护装置在出现剩余电流时切断电源。B设施、C装备是泛称，D“漏电保护闸刀”不是本题规范装置名称；本题考专用器件，不是普通闸刀就能检测漏电。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1464": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "三级配电按总箱、分配箱、开关箱分层供电；两级漏电保护按上级和末端协调配置，故C。A/B把漏电保护级数扩为四五级，D仅一级不足原制度要求。配电层级数与漏保层级数是两个概念，不能见“三级”就把两者都选三级。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1465": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "隔离栅的钢丝、网片、切口可能扎伤或割伤手，A防穿刺手套直接针对这一伤害机理。B防寒、C防辐射、D防火针对别的暴露，不能保证能抵御尖锐网端。还需使用合适工具，不能以戴手套为由直接徒手压住受力钢丝。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1466": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "涂料及其溶剂可能具有可燃性，运输储存时应隔绝点火源并控制容器泄漏，故C防火最匹配。A防潮、B防坠落、D防砸不能单独控制蒸气遇火燃烧风险；是否需要防爆、通风及相容储存还要看具体材料安全资料。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1467": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "塑料防眩板集中堆存时可形成一定可燃负荷，原库着重要求C防火。A防潮、B防坠、D防砸不能替代对火源和堆放环境的控制；防眩板也会有机械损伤风险，但本题是在这组材料储运要求中识别主要防火措施，并不代表可忽略其他风险。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1468": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "上下行桥之间的空隙是可能直接坠落的部位，装防眩板时应先解决B防坠落。A防潮、C防火、D防砸都不能关闭这个坠落通道。装好的防眩板本身也不能未经设计就当作承重护栏或安全带挂点。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1469": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "熔料加热会膨胀并可能产生翻动，釜体需留出自由空间以减少溢料烫伤，原库最大装料量为A的4/5。B1/2、C3/5、D2/5均不是题目所问上限，实际少装可能允许但不等于规定值。具体设备应服从铭牌和说明书，不能以题库比例替代制造商装料要求。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1470": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "金属护栏安装时，人员临边且未完全固定构件易翻落，两者都要有可靠防坠措施，故B。A防潮不解决失稳，D防砸主要保护下方人员，不能代替防止人和构件掉落本身。固定完成前不能让构件靠临时扶持承受作业荷载。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1471": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A添加剂和E增湿提高表面导电性，B接地把电荷导走，D工艺控制减少摩擦分离起电，与题干的中和器共同控制静电积聚。C惰化主要降低环境可燃性，未必减少电荷产生或积累，因此在“静电控制”这个狭义分类中原库选ABDE。湿度措施也须兼顾电气设备条件。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1472": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A车辆缺陷、B司机能力不足、C作业环境复杂、D管理缺位分别从机、人、环境和管理四方面解释事故发生，故ABCD。E未制定应急预案主要影响事故准备和后果控制，不是本题列举车辆碰撞、倾翻等事故的直接发生分类；实际仍应编制与风险相适应的应急安排。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1473": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A无证驾驶、B违章载人、C违章作业、E设备故障都能明确对应典型车辆事故触发类别，原库选ABCE。D“违反作息时间”不能在未说明疲劳等具体状态时直接对应典型事故分类名称；不等于认可疲劳驾驶，只是不能把不同层次的表述混列。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1474": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A达到题设深度的基坑涉及坍塌风险，B起重机械安装、D非常规且达题设重量的吊装涉及失稳、落物风险，原库列为ABD。C机房普通设备安装、E紧急电话安装未给出上述危险条件，不能仅因属于机电施工就一概列危大工程。3m、10kN只是原题口径，实际范围应核适用清单。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1475": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "B经常性检查及时发现日常损伤，C专业性检查核验电气保护，D季节性检查适应雷雨、潮湿等环境变化，故BCD。A安全性、E可靠性描述检查目标或属性，不是这里要求的检查类型名称；不能因词语正面就把所有形容词都选进制度目录。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1476": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A桥架、B埋地、C电缆沟、D管道均可在符合设计和保护要求时构成电缆敷设路径。E脚手架会随施工移动、拆装，且易受机械损伤，不宜作为沿线电缆的依托，故ABCD。可采用某方式并不表示无需净距、载流量、防水和防机械损伤设计。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1477": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n原答案ACE竟把E“施工人员主观防范”列为基本措施，却排除B防护设施和D停用外电线路。保持净距、合规防护、迁改或停电隔离均可实质控制外电风险，不能用主观注意替代工程措施；原组合与电气安全原则矛盾，需核题与答案，不硬编ACE理由。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1478": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A组织设计说明系统依据，B检查验收确认初始条件，C复查追踪状态，D测试数据量化绝缘接地性能，E电工工作记录覆盖安装维护拆除，合起来形成可追溯档案，故全选。不能只留一张验收表就认为后续运行中的隐患和整改已有记录。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1479": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A分级分路便于分段保护，B动力与照明分设避免互扰，C压缩间距有利于就近控制，E环境安全减少受潮碰撞等外部风险，故ABCE。D仅一级漏保与本题原临电两级保护要求冲突，不是三级配电应遵的规则。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1480": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "电伤重点是电能转化为热等能量后的局部组织损伤，B皮肤肌肉伤和C表面明显痕迹是题库强调的可见特征。A小电流即可致命更典型地提示电击心脏等生理效应；D/E也可能影响损伤程度，但没有说明电伤区别于电击的主要表征，故原库BC，不能据此认为烧伤与电流大小无关。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1481": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A短路使电流剧增、发热增加；B集中漏电可在局部形成热源；C对运行中的某些电机，低电压会导致电流增大或堵转发热，故都可能产生危险温度。D/E明确在额定状态下运行，不能仅凭运行时间或间歇方式推定异常过热；题干问“可能”，并非所有低压负载都会发热。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1482": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A异常涡流增加铁损，C三次谐波可在中性线上叠加，D接头恶化增大接触电阻，E过电压击穿产生电弧，都能形成引燃源，故ACDE。B错在“不会产生危险温度”，短路同时有热效应和电动力效应，不能只看到机械破坏而忽略发热。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1483": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "TN-S、TN-C-S、TN-C分别描述保护导体与中性导体全程分开、部分合一后分开或合一的不同TN系统，原题问一般低压系统的分类，故ABC。D TN-S-C、E TN-TT-C不是本题采用的规范分类名称。不能据此推出施工临电可任意用TN-C，具体施工系统要求应另行满足。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1484": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "安全电压降低人体承受的电压，剩余电流保护在符合动作条件时能切断异常电流，二者可同时涉及直接、间接接触场景，故原库CE。A绝缘、B间距主要阻止直接碰到带电体，D TT主要通过接地及配合保护处理外壳故障。剩余电流保护存在相零同时接触等盲区，并非万能。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1485": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n题干末尾已列“工业产品生产许可证”，E选项又重复同名项目；原答案ABCE同时把认证与许可一概要求到所有电气产品，也缺少目录适用范围。CCC、生产许可、进口商检各有适用条件，不能据此认定任何电气产品都同时必须具有这几种证件，题干目录与重复项待核对。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1486": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "安装B、维修D会改变接线及保护状态，需由具备相应资格的电工操作，原库BD。A“建立”、E设计是组织或设计层面工作，C使用包括普通操作者按规程启停，不宜理解为每次用电设备启停都必须电工代劳。普通使用者也不得擅自拆箱接线。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1487": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "公路外场长期暴露于降雨和雷电，B防雨保护绝缘及箱体，D防雷控制雷击过电压，所以原库选BD。A防砸、C防撞、E防坠在特定位置也可能必要，但不是题干这组外场电气环境通用要求的核心二项；不能因此免除现场实际存在的碰撞风险防护。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1488": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "外部防雷的电流路径是A接闪器接收雷击，经C引下线引到D接地装置泄入大地，所以ACD。B电涌保护器、E等电位连接主要处理内部雷电过电压和电位差，不属于此题所定义的外部三部分。各环节应连成完整系统，单装一根接闪杆并不等于防雷完整。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1489": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "一台设备A有独立开关B、开关箱C及漏电保护D，可就地停机并避免一处操作误带其他设备，故ABCD。E锁是箱体管理要求，不属于题目“一机一闸一箱一漏”四项配套口令；不选E不能解读为任何时候都无需锁或专人管理。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1490": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "带电状态要避免介质成为人体与带电体之间的导电路径，A二氧化碳及适用型号C干粉可用于相应电气初起火灾。B水有导电危险；D“四氧化碳”不是该灭火剂规范名称，E二氧化氮有毒且非这种常规灭火剂，故AC。先安全断电并保持适当施放条件仍优先。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1491": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "限位器、限制器是接近危险边界时的保护屏障，不应在每个操作循环中被当作正常停车控制使用，否则保护失效后就无后备余量。因此A，正常操作应由操纵机构控制，在保护动作前停止或调整；装了限位并不等于可以不观察吊物位置。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1492": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "吊物越出已控制的施工区域，会把坠落、摆动风险转移到未警戒的道路或人员活动区，原库据此判A。应按吊装方案控制回转和吊运路径，不以“吊物没有落地”为由越过边界；涉及跨道路或邻接区域施工须另行取得相应防护和组织条件。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1493": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "起重臂或吊物下方是坠落与摆击高后果区域，吊具或制动任何一处失效都可能伤及下方人员，故A。即使吊物已捆牢、人员戴了安全帽，也不能用这些防护替代人货空间隔离；运输路径同样不得从人员头顶经过。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1494": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "吊索在松弛、摆动或改变受力方向时可能从吊钩口滑脱，防脱装置用于阻止这种意外退出，所以A。它不能弥补超载、钩体裂纹或错误挂索，也不能用铁丝临时绑住来替代合格装置；重点是保持承载连接可靠。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1495": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "独立开关便于发现故障后单独隔离焊机，外壳保护接零或接地用于防止绝缘损坏时外壳长期带危险电位，因此原库A。保护方式必须与供电系统相适配，不是把工作零线随意搭到外壳；普通开关也不能替代所有漏电和过流保护。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1496": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "一次侧线短可减少高电压引线受损的暴露范围，二次侧去、回两根焊接电缆到位使电流沿专用回路返回，避免借道钢结构产生杂散电流和发热，原库A。5m是题库界值，不据此替代焊机说明书和适用安装规程。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1497": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在“地线可借用结构钢筋”。焊接回路电流应由专用回路线返回，借钢筋可能在连接处发热打火、损伤结构并把电流带到非预期位置，所以B。注意焊接二次回路线与设备外壳保护接地不是同一根线，不能把两者混叫“地线”后随意搭接。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1498": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "泄放出口应朝安全处，避免排放伤人；若隔离阀误关，安全阀再完好也无法泄压，因此题设要求铅封并锁全开，原库A。题目不能被理解为所有系统都可任意加截止阀，是否允许及封锁管理仍须按相应设备规范和设计确认。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1499": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "管道强度/严密性试验压力可能高于安全阀整定动作压力，若不拆下或隔离就会误泄放、影响试验并可能损伤阀件，故A。隔离只针对按方案实施的试压阶段，试验后必须恢复保护并确认状态，不能把试压隔离长期带入运行。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1500": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "吹缆依靠压缩空气，软管或接头破裂会甩动、喷射伤人，故人员避开输气管和硅芯管危险路径；空压机远离人孔也减少噪声、排气及空间作业互扰，原库A。远离不能替代紧固连接和控制压力，仍需可靠联络与停机手段。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1501": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "吹缆操作需要稳定站姿应对设备振动、牵引和紧急操作，松软地面易下陷使人失稳，因此A。应先改善地基或设置合适稳固操作平台，而不是用人体去扶住不稳定机器；设备本身也应有可靠固定。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1502": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "压缩空气带来的作用力会使松动接头喷脱，导致软管甩击和压力突然释放，加压前紧固所有接头可消除明显泄漏/脱开点，故A。紧固后还要按设备要求检查和试运，不得在仍带压力时用手靠近泄漏处寻找喷口。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1503": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在“保持其内的压力”。拆接前应停机、隔离压力来源并释放残余压力，确认无压后再操作，故B。仅关闭某个阀门不等于下游已经无压；带压松接头可能被气流和甩管击伤。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1504": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在“不需要值守”。末端人员负责观察光缆到达、异常甩动并与操作端及时联络，缺岗会使过送、人员误入等情况不能及时停机，故B。值守也应避开管口喷射方向，并非站在出口正前方用手接带压光缆。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1505": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "题干强调吹缆机按设计的气路和气块组件配合使用，不能拆除组件后让传送带无条件硬推硬拉，可能造成打滑挤压和光缆损坏，故原库A。能推动光缆不等于这种脱离设备设计条件的方式合格，须遵具体机型操作要求。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1506": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "涂料及溶剂蒸气可能与空气形成可燃混合物，储存时泄漏积聚、作业时挥发均可能被明火引燃，故A。现场禁火需与通风、静电和容器管理配合，不能认为只要罐盖盖住就可以在旁边点火。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1507": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "釜内热料上方可能有挥发物、油气及可燃残留，明火位于上方也可能点燃蒸气而非必须直接碰到液面，因此A。应把加热装置的设计火源控制与釜上方随意出现火焰区分，不能拿“设备本来要加热”作开放点火的理由。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1508": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "车辆未停稳时车厢相对地面运动会使装卸者跌落、被挤；立柱是易滚动物件，堆放无止挡会滚落伤人，两项分别控制运动和储料风险，故A。装卸快并不能替代驻车稳定，重物自重大也不能替代防滚措施。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1509": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错误在用“能独立完成”免除看护。顶端安装涉及登高、通行干扰、落物等风险，独立操作能力不等于发生失稳或车辆闯入时可以自行监护，所以B。应按方案安排监护和作业区隔离，而不是只看个人熟练程度。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1510": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "蓄电池在充电等条件下可能释放气体，变压器运行发热，良好通风有助于避免气体积聚和过热，故A。通风不能以把有害气体排向人员处为代价，也不能替代适用的防火、防爆和设备温控要求。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1511": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "裸露带电体和箱外无屏护元件可能被人员误触或被金属工具短接，防护外壳/屏护用于切断这种直接接触路径，故A。并非只保护箱门内侧即可，安装在外表面的元件同样需要可靠屏护和适当的操作方式。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1512": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在把“室内”当成免戴安全帽的理由。室内仍可能存在顶部安装、工具坠落、碰撞等风险，不能仅按是否有屋顶决定，故原库B。个人防护应与实际作业危险和现场规定匹配，而不是认为室内机房当然没有落物。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1513": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "接闪杆和引下线在雷击时会承受很大瞬时电流，附近可能出现侧闪及地面电位梯度，远离能减少二次放电、跨步电压伤害，故A。避雷装置保护建筑不等于其周边在雷击时适合人靠近、扶靠或避雨。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1514": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "户外焊机受雨水影响可能降低绝缘，日晒和坠物也会损伤设备，防护棚对应这些环境风险；焊接火花可能引燃周围物质，所以还需灭火器具，故A。棚不能做成闷闭积热，也不能妨碍安全操作与通风。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1515": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n本题判A“正常使用中合电后箱门上锁”，但同库1524又把“作业中锁开关箱以免非电工启停”判B，二者对运行时锁箱的条件、紧急分断可达性没有区分。关门防护、专人保管和锁死应急操作口并非同一回事，须核原文与箱型，不能同时无条件照做。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1516": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在“可以吸烟”。焊接区本已存在火花、热件和可燃物，做好部分防火措施不等于消除烟头等新增点火源，故B。应执行禁火禁烟和动火管理，不能用“我会小心”或附近有灭火器替代对点火源的限制。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1517": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在把分离敷设的额外导线当作五芯电缆等效替代。保护导体与相应回路应按系统设计成套可靠敷设，随意外加易断、漏接或误识别，故原库B。导线总根数相同不等于机械防护、识别和连接可靠性相同。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1518": {"status": "explained", "source": "原有精选精讲", "text": "隧道照明灯具维修属高处/带电作业，不得少于两人以便互相监护，且严禁酒后操作和闲谈打闹。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1519": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "隔离使人无法触及带电体，屏护阻挡误入，安全间距在空间上保持分离，均用于直接接触电击防护，故A。它们不能替代对金属外壳故障的间接接触保护，也不是让人员跨过屏障后继续带电操作的授权。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1520": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在未判断带电状态就直接用消防栓水扑救。水流可能形成导电通路，先应安全切断电源、报警并使用适用灭火剂，故B。电气火灾不意味着永远不能用水，而是不能按题干所说不加条件直接喷水。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1521": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "木质箱体和底板易燃，且受潮、老化后性能不稳定，无法作为题设配电箱可靠防护外壳，故B。应采用符合要求的金属或适用阻燃绝缘材料并满足防护等级；不能仅以“木头干燥时绝缘”判断其适合长期现场使用。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1522": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "手持工具直接由手握持，绝缘故障时人体容易进入电流路径，按规定穿戴绝缘用品能增加防护屏障，所以A。还需合格工具、保护线路和合适电源；绝缘用品有检验和适用条件，不能把普通胶鞋等同电工绝缘防护。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1523": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "题干意在通过可靠的多点保护连接降低单点松脱后外壳失去保护的可能，原库按“不少于两处”判A。应把PE保护线与工作零线区分，保护连接不能串接代替。两处数量仅沿用原题，没有据此推定所有手持工具都要自行改造外壳或增加接点。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1524": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n原库判B可理解为防止作业中锁死控制箱而妨碍紧急断电，但1515又把正常使用中合闸后锁箱判A。题干未区分门锁、控制手柄、指定人员与应急分断可达性，不能只凭“运行”二字给相反操作结论，和1515一起待核对原文。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1525": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "起重操作需持续注意、判断并控制设备，登高更需平衡和对高度的适应；相关禁忌健康状况可能增加突发失能、眩晕风险，故原库A。不能把一份普通体检结果或“自己感觉没事”替代适岗评估，具体禁忌范围依实际岗位要求确定。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1526": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在“允许两人在梯子上作业”和“不需要监护”。两人同时在梯上增大荷载与晃动，上下传物还可能使人失去三点接触，故B。应使用适当工具袋、传递方式及监护安排，不能以戴好安全帽为理由省略梯具稳定与人员限制。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1527": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "水性并不意味着可以无防护喷涂，涂料雾滴仍可能刺激眼睛皮肤或被吸入，挡护和适用个人防护可减少飞溅暴露，故A。防飞溅还应兼顾压力设备和通风，不能因溶剂可燃性较低就等同没有健康风险。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1528": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "桩机重心较高，地面不平或靠近沟槽可能导致倾覆；移动碰到架空线还会触电或拉倒线路，故安装稳固、移动避障两要求都合理，判A。不能只盯地上障碍而不看地基承载和架空净距，也不能在移动中让人去扶倾斜机身。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1529": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在“不需要及时固定”。波形梁板靠临时搭放可能滑移、翻落，在风力或人员接触下失稳，故B。安装到位后应按顺序可靠连接固定，未完成前保持临时支撑和警戒，不能把位置摆正当成结构已经稳固。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1530": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "张拉把较大弹性能储存在缆索中，紧邻跨中立柱两侧可能处于回弹、甩索和连接件弹出路径，禁止站人是让人员避开主要释放区域，故A。仅戴安全帽不能抵挡高能量回弹，隔离区域应按张拉布置确定。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1531": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "柴油机废气含一氧化碳等有害成分，通风不良会积聚并导致中毒，因此选择通风良好位置是必要的，判A。不能把发电机放在人孔、隧道口附近向里排气，也不能只靠“闻不到味道”判断没有一氧化碳。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1532": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n原库判A，但“中性线保护”容易被误解为将N工作中性线接外壳；保护接零应是符合系统要求的专用保护导体连接，不能与工作N混接，且不同绝缘类别工具保护方式不同。题干缺少类别和系统条件，不能作为“所有电钻外壳均接N”的操作依据。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1533": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n原库A强调绝缘隔离有助防触电，但“胶皮手套、胶布鞋、干燥木板”并不自动具有合格电气绝缘性能，旋转电钻使用松散手套还可能卷入。须核工具类别和原规程要求，不能把普通胶用品、木板当作替代断电和专用绝缘防护的通用许可。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1534": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "一台设备由独立箱、隔离/控制开关和漏保管理，可以就地切断故障设备，避免一闸多机造成误启停与保护失配，故A。四个“一”强调独立控制关系，不能把同一箱内塞多个插座带多台设备当作满足要求。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1535": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "户外箱体需要门阻挡直接接触、适当锁具和管理防止擅自操作，防雨防尘则保护绝缘和开关机构，故A。具有这些外观配置还不等于防护等级和内部接线已合格；作业与检修时也必须确保所需紧急隔离可实现。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1536": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在进线端“插头插座活动连接”。箱体主进线应可靠固定连接，活动接点易松脱、发热，拔插还可能使保护导体先断开或暴露带电端，故原库B。末端合规插座供电与配电箱进线连接不是同一场景，不能混用。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1537": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "检修本级箱体时，上级隔离可切断本级内部电源；挂牌则警示他人不得误送电，两者共同防止检修人员触电，故A。挂牌不等同物理隔离，分闸后还需按规程验电、必要放电和防误合措施，不能只贴标牌就动手。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1538": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在用“经验丰富”替代停电隔离条件。人的熟练程度不能消除带电体的能量和误操作后果，检修应按规定断电、验电并防误送，故B。特殊带电作业须有专门条件和程序，不是现场个人凭经验自行决定。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1539": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在把原要求“两级”说成至少三级。总配电箱与末端开关箱构成原库两级漏保，而总箱、分配箱、开关箱构成三级配电，这两个级数不能混同，所以B。是否增加保护及参数协调须经设计，不是越多级越安全。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1540": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在把“地面明设”与埋地、架空同列为可随意选择方式。地面电缆易被车辆碾压、物料挤砸和人员踩绊，应采用合规埋地或架空等有保护的路径，故B。临时线路也不等于可把软电缆直接铺在通道地面。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1541": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "淡蓝色用于N，黄绿双色用于PE，两者功能和运行电流不同，混用可能把工作电流引入外壳保护回路或在检修时误断保护，故B。即使临时缺某颜色导线，也不能以“通电能用”为由互换功能。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1542": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在相线不经开关。若只切断中性线或让相线常接，灯具和设备虽停转仍可能内部带电，检修误触危险，故B。应在正确回路位置实现有效隔离和控制，不能以设备不工作就推断无电。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1543": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "名称用途、分路标记帮助人员辨认控制对象，接线图说明回路关系，可减少误分、误合和错接，故A。标记必须与实际接线保持一致，改线后不更新图纸会使原本的防误措施反而造成误导。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1544": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "接线盒是绝缘和连接的薄弱点，进水积尘可漏电，撞击会破坏接点，周围易燃易爆腐蚀环境又会放大失效后果，所以A。防护箱体仍需正确密封、固定及选型，不能只把盒盖盖上就免除环境控制。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1545": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错误在“可以堆材料和机具”。外电线下堆料会使人或机械举升后更接近导线，还会占据净空、妨碍抢修，故B。禁止作业不能被偷换成允许任何堆放，应按电压、净距和线路保护要求整体控制下方区域。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1546": {"status": "explained", "source": "原有精选精讲", "text": "外场监控摄像机安装多属高处作业，人员须年满 18 周岁并经身体检查合格后方可上岗。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1547": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "门架横梁未必具备安全作业平台、栏杆和防滑条件，直接站梁上可能失足坠落，因此B。应使用设计认可的工作平台和登高设施，并配置相应防坠系统；梁的结构承载足够并不等于其可作为无防护走道。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1548": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错点是把“普通口罩”视为足够的呼吸防护。热熔作业除高温飞溅外还可能有烟气和有害蒸气，应依材料及暴露选择适用的呼吸防护，普通口罩不能保证过滤这些危害，故B。护服、护目镜和手套有作用，但不能补偿不适用的口罩。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1549": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在“有围挡夜间不用灯”。围挡控制接近通道，警示灯帮助驾驶员和行人在暗处提前识别边界，两者功能互补，不能相互取消，故B。夜间基坑还需检查照明、围挡连续性和安全通行路径。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1550": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "支撑结构安装会向基础施加自重、吊装和风等荷载，混凝土强度未达到设计条件时，锚固和抗倾覆能力可能不足，故应等达要求后安装，判A。不是只要浇筑表面变干或达到某固定天数就能代替强度确认。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1551": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在“任意”。登高措施需与高度、位置、荷载和环境相适配，并有可靠防坠、支撑与通行条件，故B。随意踩设备、叠料或爬未固定构件即使能达到安装点，也不构成合格登高方案。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1552": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在“材料垫高”。梯脚应直接落在可靠稳定的支承面，临时垫块可能滑移、翻倒，材料硬不等于组合稳定，故B。高度不够应换合适梯具或平台，不能通过加垫而使梯具超出其设计使用状态。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1553": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "梯具角度影响抗滑与后倾稳定，档距适中且不缺档有利于保持连续踏步和支撑，故原库按70°~80°、30cm判A。过陡易后翻、过缓易滑，缺档易踏空；这些数值仅为旧题口径，现场以适用梯具标准及产品说明为准。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}}};
