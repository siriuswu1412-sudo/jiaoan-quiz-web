源"}},{"s":"安全生产管理","t":"多选题","q":"生产经营单位负责人接到事故报告后，应当迅速（____），并按照国家有关规定立即如实报告当地负有安全生产监督管理职责的部门，不得隐瞒不报、谎报或者拖延不报，不得故意破坏事故现场、毁灭有关证据。","a":"ABCD","o":{"A":"组织抢救","B":"采取有效措施","C":"防止事故扩大","D":"减少人员伤亡和财产损失","E":"开展善后处理工作"}},{"s":"安全生产管理","t":"多选题","q":"在孕育过程事故中，可能出现的征兆有（____）。","a":"ABCD","o":{"A":"结构节点和连接件出现开裂、松脱、拔出等损伤和初期破坏情况","B":"结构、机械、设备的状态急剧改变","C":"部分杆配件、零部件发生位置变化或破坏","D":"出现异常的烟雾、气味和声响","E":"基坑沟槽边坡发现不断发展的渗水、涌沙、裂纹、剥落和塌方"}},{"s":"安全生产管理","t":"多选题","q":"根据《生产过程危险和有害因素分类与代码》（GB/T13861-2009）的规定，将生产过程中的危险、有害因素分为（____）。","a":"ACDE","o":{"A":"人的因素","B":"自然因素","C":"物的因素","D":"环境因素","E":"管理因素"}},{"s":"安全生产管理","t":"多选题","q":"人员伤害及财物损坏统称为损失，其中人员的伤害包括（____）。","a":"BCD","o":{"A":"感冒","B":"工伤","C":"职业病","D":"精神创伤","E":"死亡"}},{"s":"安全生产管理","t":"多选题","q":"“破窗原理”包含的安全管理理念有（____）。","a":"ABCD","o":{"A":"人的行为会接受周围环境的暗示","B":"发现违章操作就要及时对其制止和进行教育","C":"抓安全生产必须未雨绸缪、防微杜渐","D":"任何管理上的疏忽都可能酿成大的祸端","E":"人的缺点是使人产生不安全行为的原因"}},{"s":"安全生产管理","t":"多选题","q":"风险管理包括策划、组织、领导、协调和控制等方面的工作,其工作流程应包括（____）步骤。","a":"ABDE","o":{"A":"风险辨识","B":"风险分析","C":"风险排查","D":"风险控制","E":"风险转移"}},{"s":"安全生产管理","t":"多选题","q":"风险等级评估时，以下状况为m级风险的是（____）。","a":"ADE","o":{"A":"风险级別（或发生概率）很大而后果为轻度损失","B":"风险级别（或发生概率）很大而后果为中度损失","C":"风险级别（或发生概率）中等而后果为重大损失","D":"风险级别（或发生概率）中等而后果为中度损失","E":"风险级别（或发生概率）极小而后果为重大损失"}},{"s":"安全生产管理","t":"多选题","q":"按照不安全行为的表现形式分类，以下属于违反上岗身体条件规定的有（____）。","a":"ACDE","o":{"A":"高血压患者从事高空作业","B":"无证人员从事需证岗位作业","C":"未成年工从事禁止和不适合的作业","D":"疲劳作业","E":"带病作业"}},{"s":"安全生产管理","t":"多选题","q":"以下物体（品）中，既是起因物又是致害物的是（____）。","a":"BCD","o":{"A":"架空高压裸线","B":"雷击、导电物体","C":"易燃物","D":"一氧化碳、瓦斯和其他有毒气体","E":"超重的吊物"}},{"s":"安全生产管理","t":"多选题","q":"以下属于第二类危险源控制方法的是（____）。","a":"BDE","o":{"A":"消除危险源","B":"增加安全系数","C":"限制能量或危险物质","D":"提高可靠性","E":"设置安全监控系统"}},{"s":"安全生产管理","t":"多选题","q":"诱发事故的三大原因是（____）。","a":"ABC","o":{"A":"工艺设备故障","B":"人的操作失误","C":"生产安全管理的缺陷","D":"安全科技水平低下","E":"安全意识薄弱"}},{"s":"安全生产管理","t":"多选题","q":"本质安全是指设备、设施或技术工艺含有内在的能从根本上防止事故发生的功能，具体内容包括（____）。","a":"BD","o":{"A":"生产管理功能","B":"失误安全功能","C":"事后补偿功能","D":"故障安全功能","E":"故障修复功能"}},{"s":"安全生产管理","t":"多选题","q":"海因里希提出的事故因果连锁过程中的要素有（____）。","a":"ACDE","o":{"A":"遗传及社会环境","B":"管理缺陷","C":"事故","D":"人的不安全行为与物的不安全状态","E":"伤害"}},{"s":"安全生产管理","t":"多选题","q":"危险源识别的方法有（____）。","a":"ABCDE","o":{"A":"现场调查方法","B":"工作任务分析法","C":"安全检查表法","D":"危险性树分析法","E":"故障树分析法"}},{"s":"安全生产管理","t":"判断题","q":"施工单位应当向作业人员提供安全防护用具和安全防护服装，并书面告知危险岗位的操作规程和违章操作的危害。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"安全生产管理","t":"判断题","q":"生产经营单位在事故隐患治理过程中，应当采取相应的安全防范措施，防止事故发生。事故隐患排除前或者排除过程中无法保证安全的，应当从危险区域内撤出作业人员，并疏散可能危及的其他人员。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"安全生产管理","t":"判断题","q":"从业人员发现事故隐患或者其他不安全因素，应当立即向现场人员或者本单位负责人报告。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"安全生产管理","t":"判断题","q":"安全生产专项费用应做到专款专用，按照“投人多少支付多少”的原则实施，当施工单位实际投人少于投标时安全生产专项费用报价时，经监理单位核实，余额部分不予支付。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"安全生产管理","t":"判断题","q":"安全生产专项费用管理应坚持“规范计取，合理计划，计量支付，确保投人”的原则，公路水运工程安全生产专项费用的提取标准为不低于建筑安装工程造价1.5%的比例计取，且不作为竞争性报价，在成本中列支。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"安全生产管理","t":"判断题","q":"安全技术交底应优先交底采用的新的安全技术方法和技术措施。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"安全生产管理","t":"判断题","q":"建设工程施工企业提取的安全费用列人工程造价，在竞标时，不得删减，列人标外管理。国家对基本建设投资概算另有规定的，从其规定。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"安全生产管理","t":"判断题","q":"人的不安全行为大多是因为对安全不重视、态度不正确、技能或知识不足、健康或生理状态不佳和劳动条件不良等因素造成的。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"安全生产管理","t":"判断题","q":"总包单位应当将安全费用按比例直接支付分包单位并监督使用，分包单位不再重复提取。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"安全生产管理","t":"判断题","q":"企业应当加强安全费用管理，编制年度安全费用提取和使用计划，纳人企业财务预算。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"安全生产管理","t":"判断题","q":"特种作业人员未按照规定经专门的安全作业培训，未取得相应资格而上岗作业导致事故的，应追究生产经营单位有关人员的责任。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"安全生产管理","t":"判断题","q":"依照《安全生产法》的规定，安全生产监督检查人员对检查发现的问题应做出书面记录，并由检查人员和被检查单位的负责人签字，这样可避免安全检查不走过场。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"安全生产管理","t":"判断题","q":"生产经营单位可以短期将生产经营项目、场所、设备发包或者出租给不具备安全生产条件或者相应资质的单位或者个人。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"安全生产管理","t":"判断题","q":"生产经营场所和员工宿舍应当设有符合紧急疏散要求、标志明显、保持畅通的出口，禁止锁闭、封堵生产经营场所或者员工宿舍的出口。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"安全生产管理","t":"判断题","q":"职业安全健康管理体系审核的策划和准备主要包括确定审核范围、指定审核组长并组成审核组、制订审核计划以及准备审核工作文件等工作内容。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"安全生产管理","t":"判断题","q":"重大事故的应急救援行动涉及许多部门，因此应该先明确在应急救援中承担相应任务的组织机构及其职责。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"安全生产管理","t":"判断题","q":"安全检查的内容包括软件系统和硬件系统，具体是查思想、查管理、查隐患、查整改、查事故处理。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"安全生产管理","t":"判断题","q":"事故应急救援系统中的后勤保障组织主要负责应急救援所需的各种设备、设施、物资以及生活、医药等的后勤保障。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"安全生产管理","t":"判断题","q":"企业应当将安全费用优先用于满足安全生产监督管理部门对企业安全生产提出的整改措施或达到安全生产标准所需支出。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"安全生产管理","t":"判断题","q":"企业应当建立健全内部安全费用管理制度，明确安全费用使用、管理的程序、职责及权限，接受安全生产监督管理部门和财政部门的监督。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"安全生产管理","t":"判断题","q":"发生生产安全事故，为一般事故的，处十万元以上二十万元以下的罚款。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"安全生产管理","t":"判断题","q":"发生生产安全事故，为较大事故的，处五十万元以上一百万元以下的罚款。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"安全生产管理","t":"判断题","q":"安全生产责任制是一项最基本的安全生产制度，是其他各项安全规章制度得以切实实施的基本保证。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"安全生产管理","t":"判断题","q":"所有生产经营单位都必须将本单位的重大危险源报当地人民政府负责安全生产监督管理的部门备案。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"安全生产管理","t":"判断题","q":"建设单位应将拆除工程发包给具有相应资质等级的施工单位。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"安全生产管理","t":"判断题","q":"施工单位对列人建设工程概算的安全作业环境及施工安全措施所需费用，可以挪作他用。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"安全生产管理","t":"判断题","q":"生产和生活过程中接触粉尘、毒物、噪声、辐射等物理、化学危害因素达到一定的危害程度，将会导致职业病。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"安全生产管理","t":"判断题","q":"生产经营单位使用被派遣劳动者的，不必对被派遣劳动者进行岗位安全操作规程和安全操作技能的教育和培训。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"安全生产管理","t":"判断题","q":"生产经营单位必须依法参加工伤保险，为从业人员缴纳保险费。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"安全生产管理","t":"判断题","q":"生产经营单位为从业人员提供劳动防护用品时，可根据情况采用货币或其他物品替代。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"安全生产管理","t":"判断题","q":"组织或者参与本单位安全生产教育和培训，是生产经营单位机构以及安全生产管理人员的工作职责。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"安全生产管理","t":"判断题","q":"公路水运工程建设重大事故隐患是指在公路水运工程施工过程中，存在因违法违规行为可能导致重大以上生产安全事故，或造成重大经济损失和恶劣社会影响的人的不安全行为或物的不安全状态。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"安全生产管理","t":"判断题","q":"国务院交通运输主管部门监督指导各地交通运输主管部门开展公路水运工程重大事故隐患排查治理的督办工作。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"安全生产管理","t":"判断题","q":"公路桥梁和隧道工程施工安全风险等级分为I级（低度风险）、11级（中度风险）、111级（高度风险）、1V级（极高风险）。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"安全生产管理","t":"判断题","q":"交通运输部负责对全国公路水运工程“平安工地”考核评价工作的指导，对高速公路和大型水运工程项目考核评价结果进行汇总、分析、公示和抽查。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"安全生产管理","t":"判断题","q":"从业人员是事故隐患排查、治理和防控的责任主体，因而生产经营单位不是事故隐患排查、治理和防控的责任主体。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"安全生产管理","t":"判断题","q":"生产经营单位主要负责人对本单位事故隐患排查治理工作全面负责。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"安全生产管理","t":"判断题","q":"任何单位和个人发现事故隐患，均有权向安全监管监察部门和有关部门报告。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"安全生产管理","t":"判断题","q":"施工单位对编制的专项施工方案必须组织专家进行论证、审查。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"安全生产管理","t":"判断题","q":"生产经营单位应当定期组织人员、工程技术人员和其他相关人员排查本单位的事故隐患。对排查出的事故隐患，应当按照事故隐患的等级进行登记，建立事故隐患信息档案，并按照职责分工实施监控治理。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"安全生产管理","t":"判断题","q":"企业为职工提供的职业病防治、工伤保险、医疗保险所需费用应在安全费用中列支。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"安全生产管理","t":"判断题","q":"不需专家论证的危险性较大工程专项施工方案，经项目监理工程师审核通过、签字后，由施工单位项目经理批准实施。（____）会。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"安全生产管理","t":"判断题","q":"对已经按要求治理的事故隐患及时销号，解除监控。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"安全生产管理","t":"判断题","q":"对于检查中发现重大隐患，不能够立即解决的，应下达停工指令。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"安全生产管理","t":"判断题","q":"确定危险源时，更重要的是要充分考虑施工活动三种时态（过去、现在、将来）和三种状态（正常、异常、紧急）下潜在的各种危险。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"安全生产管理","t":"判断题","q":"安全费用应按照“企业提取、政府监管、确保需要、规范使用”的原则进行管理。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"安全生产管理","t":"判断题","q":"“博德事故因果连锁理论”被称作“工业安全公理”。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"安全生产管理","t":"判断题","q":"“人机轨迹交叉理论”强调人的因素和物的因素在事故发生中具有同等重要的地位。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"安全生产管理","t":"判断题","q":"在风险管理的工作流程中，风险辨识是对各种风险衡量其风险量。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"安全生产管理","t":"判断题","q":"故障树分析是指根据系统可能发生的或已经发生的事故结果，去寻找与事故发生有关的原因、条件和规律。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"安全生产管理","t":"判断题","q":"我国现阶段安全生产工作格局是:政府统一领导、部门依法监管、企业全面负责、群众参与监督、社会广泛支持。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"安全生产管理","t":"判断题","q":"事故是指造成人员死亡、伤害、职业病、财产损失或其他损失的意外事件。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"安全生产管理","t":"判断题","q":"施工安全的“三宝”是指安全帽、安全鞋、安全网。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"安全生产管理","t":"判断题","q":"危险、有害物质和能量失控主要体现为人的不安全行为、物的不安全状态、管理缺陷三个方面。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"安全生产管理","t":"判断题","q":"人机轨迹交叉理论作为一种事故致因理论，强调人的因素在事故致因中的地位比物的因素更重要。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"安全生产管理","t":"判断题","q":"危险源识别的方法中，危险与可操作性研究是安全管理人员采取的主要方法。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"安全生产管理","t":"判断题","q":"海因里希认为事故的发生产生于人的不安全行为和物的不安全状态。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"安全生产管理","t":"判断题","q":"职业健康安全管理体系的主动性绩效测量，是指监视是否符合职业健康安全管理方案、运行准则和适用的法规要求。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"安全生产管理","t":"判断题","q":"我国现阶段的方针是“安全第一、预防为主”。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"安全生产管理","t":"判断题","q":"节点和连接件出现破坏迹象是脚手架坍塌的早期征兆。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"安全生产管理","t":"判断题","q":"从防止事故的角度，安全隐患是一定要设法排除的，以阻止事故发生；而尽早发现事故征兆采取措施则有可能阻止事故发生，即使不能阻止事故发生也可以及时撤离以减少伤害和损失。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"安全生产管理","t":"判断题","q":"危险性较大工程的专项施工方案必须由工程师组织论证并形成论证会议纪要，参加论证的人员包括公司工程管理部门及项目经理和项目安全员，论证后的专项施工方案报公司总工程师审批后实施。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"安全生产管理","t":"判断题","q":"已批准的专项施工方案，不得随意变动，实施方案所需的安全技术措施经费不得挪作他用。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"安全生产管理","t":"判断题","q":"生产经营单位应当建立安全生产教育和培训档案，如实记录安全生产教育和培训的时间、内容、参加人员以及考核结果等情况。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"安全生产管理","t":"判断题","q":"生产经营单位的负责人对本单位的安全生产工作全面负责，但可以通过内部T:作分工，确定其只部分负责。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"安全生产管理","t":"判断题","q":"从业人员发现直接危及人身安全的紧急情况时，有权停止作 "A","o":{"A":"自上而下","B":"自下而上","C":"自左而右","D":"自右而左"}},{"s":"安全生产技术","t":"单选题","q":"摊铺机用其他车辆牵引时，只允许用（____）。","a":"B","o":{"A":"弹性拖杠","B":"刚性拖杠","C":"钢丝绳","D":"钢绞线"}},{"s":"安全生产技术","t":"单选题","q":"在搅拌楼的拌和锅内清理黏结混凝土，无电视监控时，必须（____）方可进行。","a":"B","o":{"A":"有一人以上","B":"有两人以上","C":"半自动控制","D":"全自动控制"}},{"s":"安全生产技术","t":"单选题","q":"水泥路面切缝机锯缝时，错误的做法是（____）。","a":"C","o":{"A":"切缝前应先打开冷却水","B":"喷洒薄膜养护的溶剂时，人员应站在上风处","C":"切缝时，刀片要快速切入，并注意切人深度指示器","D":"切缝机刀片夹板的螺母应紧固，各连接部位和安全防护罩应检查"}},{"s":"安全生产技术","t":"单选题","q":"关于起重船作业安全要求，错误的说法是（____）。","a":"B","o":{"A":"作业前，人员应熟悉吊装方案，明确联系方式和指挥信号","B":"根据吊装要求，驳船应指导起重船选择锚位和系缆位置","C":"吊装前，吊钩升降、吊臂仰俯、制动性能应良好，安全装置应正常有效","D":"吊装结束后，起重船应退离安装位置，并对起重吊钩进行封钩"}},{"s":"安全生产技术","t":"单选题","q":"关于爆破作业安全要求，错误的说法是（____）。","a":"A","o":{"A":"经审批的爆破作业项目，爆破作业单位应于施工当天发布公告，并在作业地点张贴","B":"爆破作业单位实施爆破项目前，应按规定办理审批手续，批准后方可实施爆破作业","C":"从事爆破工作的爆破员应按照有关规定经专业机构培训，并取得相应的从业资格","D":"爆破作业必须设警戒区和警戒人员"}},{"s":"安全生产技术","t":"单选题","q":"爆破施工出现盲炮时，正确的处理方法是（____）。","a":"C","o":{"A":"肓炮检查应在爆破后立即实施","B":"发现盲炮后应立即在爆破点5m范围安全警戒","C":"及时报告并由原爆破人员处理","D":"电力起爆发生盲炮时应立即切断电源，爆破网络不能置于短路状态"}},{"s":"安全生产技术","t":"单选题","q":"关于爆破作业安全要求的说法中，错误的是（____）。","a":"B","o":{"A":"雷电、暴雨雪天不得实施爆破作业","B":"强电场区爆破作业必须使用电雷管","C":"遇能见度不超过100m的雾天等恶劣天气时不得露天爆破作业","D":"水下电爆网路的主线和连接线应强度高、电阻小、防水、柔韧、绝缘"}},{"s":"安全生产技术","t":"单选题","q":"关于公路施工弃方作业的说法，错误的是（____）。","a":"A","o":{"A":"弃方作业应遵循“边支护，边弃土”的原则","B":"涵洞口处不得弃方","C":"弃土场四周均应设立警戒标志","D":"在施工完毕的桥域台处不得弃土"}},{"s":"安全生产技术","t":"单选题","q":"边坡开挖中如遇到地下水涌出，应（____）。","a":"A","o":{"A":"先排水，后开挖","B":"先开挖，后排水","C":"边排水，边开挖","D":"开挖时不用排水"}},{"s":"安全生产技术","t":"单选题","q":"关于高陡边坡处施工，下列说法错误的是（____）。","a":"B","o":{"A":"开挖作业应与装运作业面相互错开，严禁上、下双重作业","B":"现场监理人员负责随时观察高边坡是否有滑动的可能并及时采取安全措施","C":"作业人员要系安全带、戴安全帽","D":"弃土下方和有滚石危险的区域，应设警告标志，下方有道路时，作业时严禁通过"}},{"s":"安全生产技术","t":"单选题","q":"关于消解石灰，下列说法错误的是（____）。","a":"A","o":{"A":"消解石灰时，应在浸水的同时边投料、边翻拌","B":"在灰堆内消解石灰，脚下必须垫木板","C":"向灰堆内插水管，严禁喷水管对向人","D":"消解石灰时，人员应站在上风侧"}},{"s":"安全生产技术","t":"单选题","q":"在滑坡体上开挖路堑和修筑抗滑支挡结构时，下列说法错误的是（____）。","a":"D","o":{"A":"应分段跳槽开挖，严禁大段拉槽开挖","B":"开挖与砌筑时应加强支撑和临时锚固，并随时监测其受力状态","C":"抗滑桩、锚杆施工应从两端逐步向滑坡主轴方向进行","D":"采用抗滑桩、挡土墙共同支挡时，应先做挡土墙后做抗滑桩"}},{"s":"安全生产技术","t":"单选题","q":"滑坡地段的开挖，应从滑坡体（____）进行。","a":"D","o":{"A":"中部向两侧自上而下","B":"中部向两侧自下而上","C":"两侧向中部自下而上","D":"两侧向中部自上而下"}},{"s":"安全生产技术","t":"单选题","q":"批量运输爆破器材要使用专用运输工具，在（____）的押运下进行。","a":"D","o":{"A":"业主安质部门","B":"施工单位安质部门","C":"安全质量监督局","D":"公安部门"}},{"s":"安全生产技术","t":"单选题","q":"大型推土机在深沟、基坑或陡坡地区作业时，应有专人指挥，其垂直边坡深度一般不超过（____），否则应放出安全边坡。","a":"D","o":{"A":"0.5m","B":"1.0m","C":"1.5m","D":"2.0m"}},{"s":"安全生产技术","t":"单选题","q":"装炮作业中，（____）可以作为炮棍装药。","a":"C","o":{"A":"铝质棍子","B":"铜质棍子","C":"木棍","D":"不锈钢棍子"}},{"s":"安全生产技术","t":"单选题","q":"压路机在坡道上纵队行驶时，其间距不得小于（____）。","a":"D","o":{"A":"5m","B":"10m","C":"15m","D":"20m"}},{"s":"安全生产技术","t":"单选题","q":"下列关于电焊机施工安全规定，错误的是（____）。","a":"A","o":{"A":"电焊机一次侧电源线长度不得大于15m","B":"二次侧焊接电缆线应采用防水绝缘橡胶护套铜芯软电缆，长度不宜大于30m","C":"电焊机进出线处应设置防护罩","D":"露天使用电焊机应设防雨、防潮装置"}},{"s":"安全生产技术","t":"单选题","q":"下列关于焊接施工安全规定，正确的是（____）。","a":"A","o":{"A":"电焊机外壳接地电阻不得大于40","B":"接地线应利用建（构）筑物的金属结构、管道、轨道或其他金属物体搭接形成焊接","C":"宜使用交流电焊机，使用交流电焊机时，不应在开关箱内装设一次侧漏电保护器","D":"密闭空间内实施焊接及切割，气瓶及焊接电源应置于密闭空间内"}},{"s":"安全生产技术","t":"单选题","q":"下列关于焊接施工安全规定，错误的是（____）。","a":"D","o":{"A":"密闭空间焊接作业应设置通风、绝缘、照明装置和应急救援装备","B":"密闭空间焊接作业应设专人监护，金属容器内照明设备的电压不得超过12V","C":"高处电焊、气割作业，作业区周围和下方应采取防火措施","D":"雨天露天电焊作业应穿雨衣"}},{"s":"安全生产技术","t":"单选题","q":"下列关于起重吊装施工安全规定，错误的是（____）。","a":"C","o":{"A":"起重作业人员应穿防滑鞋、戴安全帽","B":"高处作业时应按规定佩挂安全带","C":"吊装作业应设警戒区，警戒区不得大于起吊物坠落影响范围","D":"作业前应检查起重设备安全装置、钢丝绳、滑轮、吊索、卡环、地锚等"}},{"s":"安全生产技术","t":"单选题","q":"关于起重钢丝绳吊索的安全系数，正确的要求是（____）。","a":"D","o":{"A":"当利用吊索上的吊钩、卡环钩挂重物上的起重吊环时，安全系数不得小于1.5","B":"当利用吊索上的吊钩、卡环钩挂重物上的起重吊环时，安全系数不得小于3","C":"当用吊索直接捆绑重物时，吊索与重物棱角间应采取妥善的保护措施","D":"当用吊索直接捆绑重物时，安全系数不得小于6"}},{"s":"安全生产技术","t":"单选题","q":"关于流动式起重设备安全施工，正确的做法是（____）。","a":"B","o":{"A":"在平整地基上吊装时支腿不应铺设垫木","B":"吊装前支腿应全部打开","C":"吊装前只需前支腿打开","D":"吊装前只需后支腿打开"}},{"s":"安全生产技术","t":"单选题","q":"关于起重吊装安全规定，错误的是（____）。","a":"A","o":{"A":"双机抬吊时单机载荷不得超过额定起重量","B":"双机抬吊宜选用同类型或性能相近的起重机，负载分配应合理","C":"吊装大、重、新结构构件和采用新的吊装工艺应先进行试吊","D":"高空吊装梁等大型构件应在构件两端设溜绳"}},{"s":"安全生产技术","t":"单选题","q":"关于缆索吊机系统施工安全规定，错误的是（____）。","a":"D","o":{"A":"主缆宜采用钢丝绳，安全系数不得小于3","B":"吊塔、扣塔塔架前后及侧向应设置缆风索，缆风索安全系数应大于2","C":"塔架顶部应设置可靠的避雷装置","D":"人员上下塔架应配备符合要求的电梯或爬梯，徒手攀爬时不得携带物件"}},{"s":"安全生产技术","t":"单选题","q":"关于起重吊装作业的做法，错误的是（____）。","a":"C","o":{"A":"严禁斜拽、斜吊","B":"严禁超载吊装","C":"作业人员严禁在已吊起的构件上或起重臂下旋转范围外作业或通行","D":"严禁吊装起吊重量不明、埋于地下或黏结在地面上的构件"}},{"s":"安全生产技术","t":"单选题","q":"关于高处作业的安全规定，错误的是（____）。","a":"A","o":{"A":"上下交叉作业时应设好防护","B":"作业人员不得沿立杆或栏杆攀登","C":"作业人员应定期进行体检","D":"下方警戒区设置应符合现行国家标准《高处作业分级》的有关规定"}},{"s":"安全生产技术","t":"单选题","q":"关于高处作业场所临边安全防护栏杆，正确的要求是（____）。","a":"C","o":{"A":"应能承受500N的可变荷载","B":"防护栏杆下方不得有人员或车辆通行或作业","C":"防护栏杆应由上、下两道横杆组成","D":"横杆长度大于2m时，应加设栏杆柱"}},{"s":"安全生产技术","t":"单选题","q":"关于高处作业安全带的使用，错误的是（____）。","a":"B","o":{"A":"安全带除应定期检验外，使用前也应进行检查","B":"安全带应低挂高用，并应扣牢在牢固的物体上","C":"安全带的安全绳不得打结使用，安全绳上不得挂钩","D":"缺少或不易设置安全带吊点的工作场所宜设置安全带母索"}},{"s":"安全生产技术","t":"单选题","q":"关于水上作业安全要求，错误的说法是（____）。","a":"D","o":{"A":"开工前，应根据施工需要设置安全作业区，并办理水上水下施工作业许可证","B":"水上作业人员应正确穿戴救生衣等个人安全防护用品","C":"运输船舶装货时必须均匀加载，严禁超载、超宽、偏载","D":"在宽阔水道和船舶来往频繁的水域施工时，不需安排人员值守"}},{"s":"安全生产技术","t":"单选题","q":"下列关于模板施工安装安全规定，正确的是（____）。","a":"B","o":{"A":"模板吊环不得采用热轧钢筋","B":"模板吊环不得采用冷拉钢筋","C":"模板拉杆接头必须焊接，不得绑扎","D":"吊环的计算拉应力不得小于50MPa"}},{"s":"安全生产技术","t":"单选题","q":"下列关于模板安装安全规定，错误的是（____）。","a":"D","o":{"A":"吊装模板前，应检查模板和吊点","B":"模板未固定前，不得实施下道工序","C":"模板安装完成后节点连接应牢固","D":"模板应按设计要求准确就位，且应与脚手架连接成整体"}},{"s":"安全生产技术","t":"单选题","q":"下列关于模板、支架拆除安全规定，错误的是（____）。","a":"A","o":{"A":"模板、支架的拆除应遵循先拆承重模板、后拆非承重模板的原则","B":"应遵循自上而下、分层分段拆除的顺序","C":"承重模板应横向同时、纵向对称均衡卸落","D":"拆除人员应使用稳固的登高工具、防护用品"}},{"s":"安全生产技术","t":"单选题","q":"下列关于模板、支架拆除安全规定，正确的是（____）。","a":"D","o":{"A":"承重模板应横向对称、纵向同时均衡卸落","B":"简支梁、连续梁结构模板宜从支座向跨中方向依次循环卸落","C":"悬臂梁结构模板宜从固定端开始顺序卸落","D":"拆除人员应使用稳固的登高工具、防护用品"}},{"s":"安全生产技术","t":"单选题","q":"下列关于模板存放安全规定，错误的是（____）。","a":"B","o":{"A":"大型模板应存放在专用模板架内或卧倒平放","B":"大型模板应直靠其他模板或构件","C":"清理模板或刷脱模剂时，模板应支撑牢固","D":"两片模板间应留有足够的人行通道"}},{"s":"安全生产技术","t":"单选题","q":"下列关于钢筋施工安全规定，错误的是（____）。","a":"C","o":{"A":"钢筋加工机械所有转动部件应设有防护罩","B":"钢筋冷弯作业时，弯曲钢筋的作业半径内和机身不设固定销的一侧不得站人或通行","C":"钢筋冷拉作业区四周不应装设防护挡板","D":"冷拉钢筋卷扬机应置于视线良好位置并应设置地锚"}},{"s":"安全生产技术","t":"单选题","q":"下列关于钢筋对焊机施工安全规定，错误的是（____）。","a":"A","o":{"A":"多台并列安装对焊机的间距不得小于lm","B":"钢筋对焊机应安装在室内或防雨棚内","C":"现场应设可靠的接地、接零装置","D":"对焊作业闪光区四周应设置挡板"}},{"s":"安全生产技术","t":"单选题","q":"混凝土施工中维修、保养或检查清理搅拌系统、供料系统时，错误的做法是（____）。","a":"C","o":{"A":"应悬挂“严禁合闸”安全警示标志","B":"应封闭下料门，切断电源","C":"应不设安全保护装置","D":"应派专人看守"}},{"s":"安全生产技术","t":"单选题","q":"水泥人库时袋装水泥应交错整齐码放，高度不得超过（____）袋。","a":"A","o":{"A":"10","B":"12","C":"14","D":"16"}},{"s":"安全生产技术","t":"单选题","q":"下列关于泵送混凝土施工安全规定，错误的是（____）。","a":"B","o":{"A":"泵送前应检查泵送和布料系统","B":"首次泵送前应进行管道抗扭试验","C":"输送栗出料软管应设专人牵引、移动，布料臂下不得站人","D":"混凝土输送管道接头拆卸前，应释放输送管内剩余压力"}},{"s":"安全生产技术","t":"单选题","q":"下列关于混凝土振捣施工安全规定，错误的是（____）。","a":"D","o":{"A":"作业停止，应切断电源","B":"不得用电缆线、软管拖拉或吊挂振捣器","C":"装置振捣器的构件模板应坚固牢靠","D":"带电检修振捣器时应有专人监护"}},{"s":"安全生产技术","t":"单选题","q":"下列关于电焊与气焊施工安全规定，错误的是（____）。","a":"B","o":{"A":"电工、焊接作业人员应按照有关规定经专业机构培训，并应取得相应的从业资格","B":"热切割作业人员应经过项目经理部的教育培训，合格以后才能上岗","C":"电工、焊接作业人员应按规定正确佩戴、使用劳动防护用品","D":"热切割作业人员应按规定正确佩戴、使用劳动防护用品"}},{"s":"安全生产技术","t":"单选题","q":"储存、搬运、使用氧气瓶、乙炔瓶时，正确的做法是（____）。","a":"D","o":{"A":"气瓶、阀门、焊具、胶管等应均匀涂抹油脂","B":"压力表、安全阀、橡胶软管和回火保护器等不必定期校验或试验","C":"气瓶与实际焊接或切割作业点的距离应大于5m","D":"气割作业氧气瓶与乙炔瓶之间的距离不得小于5m"}},{"s":"安全生产技术","t":"单选题","q":"起重吊装作业中，正确的做法是（____）。","a":"A","o":{"A":"各种起重机具不得超负荷使用","B":"吊装作业应由项目技术负责人统一指挥","C":"吊装作业后必须严格检查起重设备各部件的可靠性和安全性","D":"地锚要牢固，缆风绳应绑扎在电杆或脚手架上"}},{"s":"安全生产技术","t":"单选题","q":"轮胎式起重机和履带式起重机作业时，应做到（____）。","a":"D","o":{"A":"回转半径内障碍物高度不超过2.5m","B":"作业中宜悬吊重物行走","C":"起重机吊人作业时应确保安全","D":"配备必要的灭火器，驾驶室内不得存放易燃品"}},{"s":"安全生产技术","t":"单选题","q":"按照国际规定，凡在坠落高度基准面（____）及以上有可能坠落的高处进行的作业均称为高处作业。","a":"A","o":{"A":"2.0m","B":"3.0m","C":"4.0m","D":"5.0m"}},{"s":"安全生产技术","t":"单选题","q":"在下列（____）天气条件下可以进行露天高处作业。","a":"C","o":{"A":"雷电","B":"暴雨","C":"四级风速","D":"大雾"}},{"s":"安全生产技术","t":"单选题","q":"关于模板支立及拆除的安全控制要点，下列说法错误的是（____）。" :"车辆不得进入","C":"非施工人员不得进人","D":"非施工船舶不得靠泊"}},{"s":"安全生产技术","t":"单选题","q":"工程货运车辆（____）用于运送施工人员。","a":"A","o":{"A":"严禁","B":"适合","C":"根据需要","D":"批准后"}},{"s":"安全生产技术","t":"单选题","q":"六级及以上大风和大雨、大雪、大雾等恶劣天气下，不得进行（____）","a":"D","o":{"A":"张拉记录整理","C":"混凝土强度试验","B":"混凝土配合比试验","D":"满堂支架搭"}},{"s":"安全生产技术","t":"多选题","q":"不良地质隧道地段应遵循（____）的原则施工。","a":"ABC","o":{"A":"早预报","B":"预加固","C":"弱爆破","D":"长进尺","E":"弱支护"}},{"s":"安全生产技术","t":"多选题","q":"燧道内严禁存放的是（____）。","a":"ABCDE","o":{"A":"汽油","B":"柴油","C":"煤油","D":"雷管","E":"炸药"}},{"s":"安全生产技术","t":"多选题","q":"以下用汽车运送爆破器材的规定中，正确的是（____）。","a":"ABCD","o":{"A":"炸药和雷管应分别装在两辆车内由专车运送","B":"两车间距应大于50m,并派专人护送","C":"运行中应显示红旗或红灯","D":"汽车排气口应加防火罩"}},{"s":"安全生产技术","t":"多选题","q":"以下严禁装药爆破的情况是（____）。","a":"ABCDE","o":{"A":"照明不足","B":"开挖面围岩破碎尚未支护","C":"出现流沙、流泥未经处理","D":"有大量溶洞水及高压水涌出，尚未治理","E":"尚未警戒好"}},{"s":"安全生产技术","t":"多选题","q":"以下竖井施工的规定中，正确的是（____）。","a":"ABDE","o":{"A":"井口应配量井盖","B":"井口应设防雨设施","C":"井口周围应设防护栏杆和安全门，防护栏杆的高度不得小于0.8m","D":"竖井井架应安装避雷装置","E":"竖井吊桶、罐笼升降作业应制订操作规程，并严格执行"}},{"s":"安全生产技术","t":"多选题","q":"以下连拱隧道施工规定中，正确的是（____）。","a":"BCDE","o":{"A":"应根据中导洞探察的岩层情况确定合理的施工方案，主洞上拱部开挖应在中隔墙混凝土施工后立即进行","B":"中导洞不得作为爆破临空面","C":"应在先行洞模筑衬砌混凝土达到设计要求的强度后进行后行洞的开挖和衬砌","D":"主洞开挖时，左右两洞开挖掌子面错开距离宜大于30m","E":"应监测连拱隧道中隔墙的位移"}},{"s":"安全生产技术","t":"多选题","q":"雨季施工，现场的（____）等作业面应采取防滑措施。","a":"ABDE","o":{"A":"脚手架","B":"起重设备","C":"跳板","D":"模架","E":"徵台"}},{"s":"安全生产技术","t":"多选题","q":"冬季施工现场的（____）应采取防滑措施，及时清除冰雪。","a":"ABCDE","o":{"A":"道路","B":"工作平台","C":"斜坡道","D":"脚手板","E":"船舶甲板"}},{"s":"安全生产技术","t":"多选题","q":"冬季来临前，下列（____）设备设施需要检修、保养，并应采取防冻措施。","a":"ABCDE","o":{"A":"船机","B":"设备","C":"机具及防护","D":"消防设施","E":"救生设施"}},{"s":"安全生产技术","t":"多选题","q":"以下关于隧道排水作业的规定中，正确的是（____）。","a":"ACDE","o":{"A":"隧道内反坡排水方案应根据距离、坡度、水量和设备情况确定","B":"抽水机排水能力应大于排水量的10%，并应有备用台数","C":"隧道顺坡排水沟断面应满足隧道排水需要","D":"膨胀岩、土质地层、围岩松软地段应铺砌水沟或采用管槽排水","E":"遇渗漏水面积或水量突然增加，应立即停止施工，人员撤至安全地点"}},{"s":"安全生产技术","t":"多选题","q":"浅埋段适宜采用的开挖方法有（____）。","a":"BCDE","o":{"A":"全断面法","B":"台阶法","C":"环形开挖留心土法","D":"中隔壁法","E":"双侧壁导坑法"}},{"s":"安全生产技术","t":"多选题","q":"以下关于盾构过站、掉头及解体的规定中，正确的是（____）。","a":"ABCDE","o":{"A":"过站、掉头托架或小车的强度、刚度和稳定性应满足需要","B":"盾构过站、掉头应观察盾构转向或移动状态","C":"举升盾构机应同步、平稳","D":"牵引平移盾构应缓慢平稳，钢丝绳应牢固","E":"盾构解体前应关闭各个系统，各个部件应支撑牢固"}},{"s":"安全生产技术","t":"多选题","q":"隧道施工应配备（____）。","a":"ABCDE","o":{"A":"应急救援机械设备","B":"监测仪器","C":"交通工具","D":"医疗设备和药品","E":"生活保障和救援物资"}},{"s":"安全生产技术","t":"多选题","q":"超前地质预报和监控量测方案应包括（____）","a":"ABCDE","o":{"A":"工程简介","B":"监测目的","C":"监测项目","D":"监测机构","E":"监测方法"}},{"s":"安全生产技术","t":"多选题","q":"以下关于钻眼作业的规定中，正确的是（____）","a":"ABCD","o":{"A":"钻眼前，应检查工作环境的安全状态","B":"带支架的风架钻眼时，必须将支架安置稳妥","C":"电钻钻眼应检查把手胶套的绝缘是否良好","D":"在工作面内不得拆卸、修理风钻、电钻","E":"在残眼中继续钻眼要采取相应的安全措施"}},{"s":"安全生产技术","t":"多选题","q":"以下关于仰拱开挖施工的规定中，正确的是（____）。","a":"ABCDE","o":{"A":"IV级及以上围岩仰拱每循环开挖长度不得大于3m,不得分幅施作","B":"仰拱与掌子面的距离，DI级围岩不得超过90m，IV级围岩不得超过50m,V级以上围岩不得超过40m","C":"底板欠挖硬岩应采用人工钻眼松动，弱爆破方式开挖","D":"开挖后应立即施作初期支护","E":"栈桥等架空设施的强度、刚度和稳定性应满足施工要求"}},{"s":"安全生产技术","t":"多选题","q":"以下关于钢架施工的规定中，正确的是（____）。","a":"ABDE","o":{"A":"钢架底脚基础应坚实、牢固","B":"相邻的钢架应连接成整体","C":"已安装的钢架发生扭曲变形时，应及时逐榀更换，同时更换相邻的钢架要采取相应的安全措施","D":"下部开挖后，钢架应及时接长、落底，钢架底脚不得左右同时开挖","E":"拱脚不得脱空，不得有积水浸泡"}},{"s":"安全生产技术","t":"多选题","q":"以下关于施工通风的规定中，正确的是（____）。","a":"ABCD","o":{"A":"隧道施工通风应纳入工序管理，由专人负责","B":"隧道施工通风应能提供洞内各项作业所需要的最小风量，风速不得大于6mA","C":"长及特长的隧道应配备备用通风机和备用电源","D":"通风机应装有保险装置，发生故障时应自动停机","E":"通风管沿线应每150〜200m设立警示标志或色灯"}},{"s":"安全生产技术","t":"多选题","q":"黄土險道施工前,应查明黄土的（____）。","a":"ABCD","o":{"A":"年代","B":"成因","C":"含水率","D":"强度","E":"各向异性程度"}},{"s":"安全生产技术","t":"多选题","q":"以下关于盾构掘进的规定中，正确的是（____）。","a":"ABCDE","o":{"A":"盾构应在始发段50~100m进行试掘进","B":"土压平衡盾构掘进，幵挖土体应充满土仓，并应核算排土量和开挖量","C":"盾构机不宜长时间停机","D":"盾构刀具检查和更换地点应选择地质条件好，地层稳定的地段","E":"维修刀盘应对刀盘前方土体采取加间措施或施作竖井"}},{"s":"安全生产技术","t":"多选题","q":"以下关于盾构洞门、联络通道施工规定中，正确的是（____）。","a":"ABCDE","o":{"A":"洞口负环拆除前应二次注浆","B":"联络通道施工应编制专项施工方案","C":"联络通道施工前，应加固开挖范围及上方地层","D":"拆除联络通道交叉口管片前，应加固管片壁后土体和联络通道处管片","E":"隧道内施工平台应与机车运输系统保持安全间距"}},{"s":"安全生产技术","t":"多选题","q":"以下属于隧道监控量测必测项目的是（____）。","a":"AB","o":{"A":"周边位移","B":"拱顶下沉","C":"钢架内力","D":"围岩压力","E":"锚杆轴力"}},{"s":"安全生产技术","t":"多选题","q":"以下关丁隧道施工的规定中，正确的是（____）。","a":"ABCDE","o":{"A":"隧道内施工不得使用以汽油为动力的机械设备","B":"通风机、抽水机等隧道安全设备应配备备用设备","C":"隧道内应按要求配备消防器材","D":"施工隧道内不得明火取暖","E":"超前地质预报和监测方案编制应作为必要工序统一纳人施工组织管理"}},{"s":"安全生产技术","t":"多选题","q":"下列情况应编制应急预案的是（____）。","a":"ABCDE","o":{"A":"隧道坍塌","B":"突水突泥","C":"触电","D":"火灾","E":"爆炸"}},{"s":"安全生产技术","t":"多选题","q":"以下属于瓦斯检测方法的有（____）。","a":"ABCDE","o":{"A":"瓦斯压力法","B":"综合指标法","C":"钻屑指标法","D":"钻孔瓦斯涌出初速度法","E":"R值指标法"}},{"s":"安全生产技术","t":"多选题","q":"以下关于小净距隧道施工的规定中，正确的是（____）。","a":"ABD","o":{"A":"洞口切坡宜保留两隧道间原土体","B":"两隧道工作面应错开施工","C":"先行洞与后行洞掌子面错开距离应大于1倍隧道开挖宽度","D":"后行隧道应根据围岩情况先加固中岩墙","E":"宜采用预裂爆破技术，并应采用高威力、高爆速炸药"}},{"s":"安全生产技术","t":"多选题","q":"下列设施中，（____）严禁明火烘烤或开水加热。","a":"ABCDE","o":{"A":"储气罐","B":"氧气瓶","C":"乙炔瓶","D":"阀门","E":"胶管"}},{"s":"安全生产技术","t":"多选题","q":"大风、大雨后，应检查（____）等设施的基础。","a":"ABCDE","o":{"A":"支架","B":"脚手架","C":"起重设备","D":"临时用电工程","E":"临时房屋"}},{"s":"安全生产技术","t":"多选题","q":"台风季节施工，以下（____）应做防风加间，排水沟渠应通畅。","a":"ABCDE","o":{"A":"在建工程","B":"施工机械设备","C":"临时设施","D":"生活用房","E":"办公用房"}},{"s":"安全生产技术","t":"多选题","q":"以下关于隧道施工作业的规定中，正确的是（____）。","a":"ABCD","o":{"A":"隧道洞内通风应编制专项施工方案，并按批准的方案配置通风设施","B":"隧道施工时应做好洞内排水，保证积水能及时、顺畅排出","C":"隧道施工时应按照要求检测有毒有害气体","D":"高瓦斯隧道应配置防爆设备和设施","E":"隧道内坑洞、临边部位等不应设立防护栏，但要设立醒目的安全警示标志"}},{"s":"安全生产技术","t":"多选题","q":"以下关于盾构始发的规定中，正确的是（____）。","a":"ACDE","o":{"A":"盾构始发前应验算盾构反力架及其支撑的刚度和强度","B":"应拆除刀盘不能直接破除的围护结构，拆除时应将洞门围护结构整体拆除","C":"洞门围护结构拆除后，盾构刀盘应及时靠紧开挖面","D":"盾构始发时，始发基座应稳定，盾构不得扭转","E":"千斤顶应均匀顶进，反力架受力应均匀"}},{"s":"安全生产技术","t":"多选题","q":"膨胀岩土地质隧道施工前，主要应查明（____）。","a":"CDE","o":{"A":"年代","B":"成因","C":"岩土岩性","D":"规模","E":"吸水性"}},{"s":"安全生产技术","t":"多选题","q":"以下关于含瓦斯隧道施工的说法中，正确的是（____）。","a":"ABDE","o":{"A":"应配置两套电源供电，并应采用双电源线路","B":"应按规定设置灭火器","C":"应采用干式钻孔开挖","D":"爆破母线应呈短路状态，并包覆绝缘体","E":"起爆网络应由工作面向起爆站依次连接"}},{"s":"安全生产技术","t":"多选题","q":"进人隧道施工前，应检测瓦斯浓度的部位包括（____）。","a":"ABCDE","o":{"A":"开挖面及附近200m范围内","B":"断面变化处","C":"导坑上部","D":"初砌台车内部","E":"拱部塌穴"}},{"s":"安全生产技术","t":"多选题","q":"冻土隧道施工前，应查明冻土的（____）。","a":"CDE","o":{"A":"年代","B":"成因","C":"冻土类别","D":"含水率及分布规律","E":"结构特征"}},{"s":"安全生产技术","t":"多选题","q":"根据《公路工程施工安全技术规范》（JTGF90—2015），采用架桥机安装构件时，应符合（____）。","a":"ABCE","o":{"A":"架桥机的抗倾覆稳定系数不得小于1.3","B":"架桥机纵向移动应一次到位，不得中途停顿","C":"起吊天车提升与携梁行走不得同时进行","D":"架梁和湿接缝施工期间不能设置母索系统","E":"停止作业的架桥机应临时锚固"}},{"s":"安全生产技术","t":"多选题","q":"根据《公路工程施工安全技术规范》（JTGF90—2015），悬臂浇筑采用挂篮施工时，应遵守（____）。","a":"BCDE","o":{"A":"挂篮组拼后，应检查验收，并应按最大施工组合荷载的1.2倍做动载试验","B":"挂篮行走前应检查走行系统、吊挂系统、模板系统","C":"挂篮行走滑道铺设应平顺，锚固应稳定","D":"墩两侧挂篮应对称平稳移动","E":"雨雪天或风力超过挂篮设计移动风力时，不得移动挂篮"}},{"s":"安全生产技术","t":"多选题","q":"预应力钢束（钢丝束、钢绞线）张拉施工前，应做好的工作有（____）。","a":"ABCD","o":{"A":"张拉作业区，应设置警告标志","B":"高压油泵与千斤顶之间的连接点各接口必须完好无损，螺母拧紧","C":"锚环和锚塞使用前，应认真仔细检查及试验，经检验合格后方可使用","D":"油泵开动时，进、回油速度与压力表指针升降应保持一致，并平稳、均匀","E":"压力表应每天进行检定"}},{"s":"安全生产技术","t":"多选题","q":"基坑、井坑开挖过程中，出现坍塌的先兆有（____）。","a":"BCDE","o":{"A":"地下水渗出","B":"支撑有折断","C":"突发流沙、涌沙","D":"边坡出现剪切裂缝","E":"支撑有走动"}},{"s":"安全生产技术","t":"多选题","q":"隧道施工前应开展安全风险评估，辨识施工过程中的主要危险源及危害因素，制订安全防护措施，并应根据（____）对隧道工程实施动态风险控制和跟踪处理。","a":"ABCDE","o":{"A":"工程建设条件","B":"技术复杂程度","C":"地质与环境条件","D":"施工管理模式","E":"工程建设经验"}},{"s":"安全生产技术","t":"多选题","q":"关于不良地质隧道施工应遵循的原则，正确的说法有（____）。","a":"DE","o":{"A":"长进尺","B":"弱支护","C":"晚封闭","D":"勤量测","E":"快衬砌"}},{"s":"安全生产技术","t":"多选题","q":"洞口附近存在建（构）筑物且使用爆破掘进的，应采用控制爆破技术，应监测的内容包括（____）。","a":"BDE","o":{"A":"振动波长","B":"振动波速","C":"振动频率","D":"建（构）筑物的沉降","E":"建（构）筑物的位移"}},{"s":"安全生产技术","t":"多选题","q":"以下关于明洞施工的规定中，错误的是（____）。","a":"BD","o":{"A":"明洞开挖前，洞顶及四周应设防水、排水设施","B":"明洞应自下而上开挖","C":"开挖松软地层边、仰坡应随挖随护","D":"衬砌强度未达到设计的50%，防水层未完成时，不得回填","E":"明洞槽不宜在雨天开挖"}},{"s":"安全生产技术","t":"多选题","q":"以下关于双侧壁导坑法施工的规定中，错误的是（____）。","a":"CD","o":{"A":"及时施工初期支护并尽早封闭成环","B":"侧壁导坑形状应近似于矩形断面","C":"导坑跨度宜为隧道跨度的1/2","D":"左右导坑前后距离不宜小于30m","E":"导坑与中间土体同时施工时，导坑应超前30〜50m"}},{"s":"安全生产技术","t":"多选题","q":"以下关于仰拱与掌子面距离的说法，正确的是（____）。","a":"ACE","o":{"A":"IE级围岩不得超过90m","B":"ID级围岩不得超过120m","C":"IV级围岩不得超过50m","D":"IV级围岩不得超过80m","E":"V级及以上围岩不得超过40m"}},{"s":"安全生产技术","t":"多选题","q":"以下关于斜井与竖井排水规定的说法，正确的是（____）。","a":"ABCE","o":{"A":"斜井应边掘进边排水","B":"竖井、斜井和井底应设置排水泵站","C":"排水栗站应设在铺设排水管的井身附近","D":"排水泵站应远离主变电所","E":"水箱、集水坑处应挂设警示牌"}},{"s":"安全生产技术","t":"多选题","q":"含瓦斯隧道施工前，应编制（____）。","a":"ABCDE","o":{"A":"专项施工方案","B":"超前地质预报方案","C":"通风设计方案","D":"瓦斯监测方案","E":"应急预案"}},{"s":"安全生产技术","t":"多选题","q":"拱架须经验算，必须经试验或预压，并满足（____）等安全要求。","a":"ABDE","o":{"A":"防洪","B":"流水","C":"防火","D":"排水","E":"航运"}},{"s":"安全生产技术","t":"多选题","q":"挂篮施工应经常检查（____）等是否完好可靠。","a":"ABCD","o":{"A":"后锚固筋","B":"千斤顶","C":"手拉葫芦","D":"张拉平台","E":"风缆"}},{"s":"安全生产技术","t":"多选题","q":"为防止模板发生（____），滑模施工宜采用油压千斤顶，并保持同步提升。","a":"BD","o":{"A":"拉伸","B":"倾斜","C":"翘曲","D":"扭转","E":"弯折"}},{"s":"安全生产技术","t":"多选题","q":"滑模施工时，当模板提升到2m高以后，应（____）。","a":"ABCD","o":{"A":"安装好内外吊架","B":"安装好脚手架","C":"铺好脚手板","D":"挂设安全网","E":"安装好限位开关"}},{"s":"安全生产技术","t":"多选题","q":"钻孔灌柱粧钻孔过程中，必须设有专人，按规定指标，保持（____），以防坍孔。","a":"AD","o":{"A":"孔内水位的高度","B":"钢筋笼的位置","C":"导管的抽拔","D":"泥浆的稠度","E":"连续灌注"}},{"s":"安全生产技术","t":"多选题","q":"钻孔灌柱粧施工，当钻机就位后，应全面检查（____）等是否完好正常。","a":"ACDE","o":{"A":"卷扬机","B":"钢护筒","C":"浮吊车","D":"钻头","E":"泥浆泵"}},{"s":"安全生产技术","t":"多选题","q":"模板支立及拆除施工中，正确的做法有（____）。","a":"AC","o":{"A":"基坑内支模时，应先检查基坑有无塌方现象","B":"模板支撑钉在脚手架上有助于整体稳定","C":"向基坑内运送材料，不得抛掷","D":"机械吊运模板时，人员在下方等待","E":"可使用强度较好的脆性垫块作基础"}},{"s":"安全生产技术","t":"多选题","q":"浇筑混凝土前，对支架进行预压试验的目的有（____）。","a":"ABD","o":{"A":"检验支架的承载能力","B":"检验支架的稳定性","C":"消除弹性变形","D":"消除非弹性变形","E":"提_承载能力"}},{"s":"安全生产技术","t":"多选题","q":"拆除脚手架时，周围应设置护栏或警戒标志，并应（____）。","a":"BCD","o":{"A":"从下而上拆除","B":"从上而下拆除","C":"不得上下双层作业","D":"拆除的脚手杆、板等严禁随意抛掷","E":"自内向外拆除"}},{"s":"安全生产技术","t":"多选题","q":"以下关于缆索吊装的安全要求，正确的有（____）。","a":"ABDE","o":{"A":"主索道和塔架的拆除应在拆除方案中制订安全技术措施","B":"滑轮组应共同承受荷载，受力不均时，应进行调整","C":"钢丝绳必须选用新钢丝绳","D":"主索道两端应设置限位器","E":"缆索塔架应按设计图组拼"}},{"s":"安全生产技术","t":"多选题","q":"套箱围堰采用沉浮式双壁钢套箱时，应具备的性能包括（____）。","a":"BCDE","o":{"A":"能非对称沉浮","B":"能组拼","C":"能分解","D":"能注水下沉","E":"能排水上浮"}},{"s":"安全生产技术","t":"多选题","q":"以下关于人工挖孔桩安全控制要点，正确的有（____）。","a":"ABDE","o":{"A":"所用电气设备，必须装设漏电保护装置","B":"孔内照明应使用36V电压的灯具","C":"孔深不宜超过20m，孔径不宜小于1.2m","D":"孔内挖土人员的头顶部应设置护盖","E":"起吊设备必须有限位器、防脱钩器等装置"}},{"s":"安全生产技术","t":"多选题","q":"运土车辆必须遵守交通法规，不得（____），驾驶室内不得超员。","a":"ABCD","o":{"A":"超载","B":"超高","C":"偏载","D":"人货混装","E":"载人"}},{"s":"安全生产技术","t":"多选题","q":"以下关于挖掘机作业时的说法，正确的是（____）。","a":"BCD","o":{"A":"除驾驶员外，其他人禁止上下机械和传递物件","B":"不得随便调节发动机、调速器以及液压系统、电气系统","C":"要注意选择和创造合理的工作面，严禁掏洞挖掘","D":"如遇较大石块或坚硬物体，应先清除再继续作业","E":"可使用挖掘机的铲斗击碎坚硬的石块等"}},{"s":"安全生产技术","t":"多选题","q":"膨胀土（岩）地段路基施工时，必须及时做好（____）的砌筑，并应随挖随砌，严防渗漏。","a":"BCD","o":{"A":"蒸发池","B":"天沟","C":"侧沟","D":"排水沟","E":"渗井"}},{"s":"安全生产技术","t":"多选题","q":"沥青操作人员均应进行体检，凡患有（____），不宜从事沥青作业。","a":"CDE","o":{"A":"心脏病","C":"结膜炎","B":"高血压","D":"皮肤病","E":"对沥青过敏反应者"}},{"s":"安全生产技术","t":"多选题","q":"沥青混合料摊铺作业时，正确的做法包括（____）。","a":"BCD","o":{"A":"脚踏板宽度必须小于摊铺机宽度","B":"驾驶员不得擅离岗位","C":"换挡必须在摊铺机完全停止时进行","D":"弯道作业时，熨平装置的端头与路缘石的间距不得小于10cm","E":"必须先启动鼓风机后，才允许燃烧器点火"}},{"s":"安全生产技术","t":"多选题","q":"水泥混凝土搅拌站施工时，正确的做法包括（____）。","a":"BD","o":{"A":"搅拌站搭设在电力架空线路下方时，净空必须满足要求","B":"搅拌机等机械旁应设置机械操作程序牌","C":"混凝土拌和过程中，严禁非作业人员进人储料区和卸料斗下方","D":"袋装水泥应按层码垛整齐，高度不得超过10袋","E":"搅拌站设置的各种电气设备必须由电焊工引接、拆除"}},{"s":"安全生产技术","t":"多选题","q":"套箱围堰采用沉浮式双壁钢套箱时，应具备（____）的性能。","a":"BCDE","o":{"A":"能非对称沉浮","B":"能组拼","C":"能分解","D":"能注水下沉","E":"能排水上浮"}},{"s":"安全生产技术","t":"多选题","q":"基坑开挖中，遇到（____）现象发生时，应立即采取防护加固措施。","a":"ABDE","o":{"A":"流沙","B":"涌水","C":"积水","D":"涌沙","E":"基坑边坡不稳定"}},{"s":"安全生产技术","t":"多选题","q":"挂篮在安装、行走及使用中，应严格控制荷载，防止过大的（____）。","a":"ABDE","o":{"A":"变形","B":"冲击","C":"扭转","D":"振动","E":"应力"}},{"s":"安全生产技术","t":"多选题","q":"张拉操作中，若出现（____）等异常现象，应立即停机进行检查。","a":"ABCD","o":{"A":"油表振动剧烈","B":"漏油","C":"电机声音异常","D":"发生断丝、滑丝","E":"油表指针抖动"}},{"s":"安全生产技术","t":"多选题","q":"缆索吊装大型构件时，应事先检查（____）等机具设备。","a":"ABCDE","o":{"A":"塔架","B":"地锚","C":"扣架","D":"滑车","E":"钢丝绳"}},{"s":"安全生产技术","t":"多选题","q":"挖掘机行走过程中，遇（____）时，须有专人指挥。","a":"AB","o":{"A":"电线","B":"交叉道","C":"行人","D":"车辆","E":"民房"}},{"s":"安全生产技术","t":"多选题","q":"路堑开挖应（____）。","a":"AD","o":{"A":"采取临时排水措施","B":"上下同时开挖","C":"掏底开挖","D":"自上而下开挖","E":"及时排除地表水"}},{"s":"安全生产技术","t":"多选题","q":"关于路基石方工程，说法正确的是（____）。","a":"ACE","o":{"A":"爆破作业前应设置警戒区","B":"远边坡部分宜采用硐室爆破","C":"近边坡部分宜采用光面爆破或预裂爆破","D":"边坡坡度可根据施工方便确定","E":"应及时施作临时排水设施"}},{"s":"安全生产技术","t":"多选题","q":"有关砂浆喷射机作业安全控制要点，正确的是（____）。","a":"ABD","o":{"A":"砂浆喷射机、砂浆输送栗等发生故障时，必须先停机后检查","B":"输送管道各接头应连接牢固，并设有牢固的支撑","C":"输送泵作业前应空运转，然后，向泵内注人砂浆","D":"工作停歇时，喷嘴不得朝向有人的方向","E":"工作时可以朝向有人的地方，但是人员必须距离喷嘴3m以外"}},{"s":"安全生产技术","t":"多选题","q":"挡土墙施工除应符合现行《公路路基施工技术规范》的有关规定外，尚应符合（____）。","a":"CDE","o":{"A":"回填作业应在挡土墙墙身的强度达到设计强度的65%后实施","B":"墙背0.5m以内不宜使用重型振动压路机碾压","C":"挡土墙施工应设置警戒区","D":"锚杆挡土墙施工前，应清除岩面松动石块","E":"锚杆挡土墙施工前，应整平墙背坡面"}},{"s":"安全生产技术","t":"多选题","q":"强夯施工应符合（____）。","a":"AD","o":{"A":"吊锤机械驾驶室前应设置防护网","B":"吊锤机械驾驶员应佩戴防护镜","C":"吊锤机械驾驶员应系安全带","D":"夯锤提升0.5m检查整机稳定性","E":"夯锤提升1.0m检查整机稳定性"}},{"s":"安全生产技术","t":"多选题","q":"防排水设施应（____）。","a":"ABCD","o":{"A":"沟底平整","B":"排水畅通","C":"无冲刷现象","D":"无阻水现象","E":"沟底不露水，但沟身可以露水"}},{"s":"安全生产技术","t":"多选题","q":"严禁在滑坡影响范围（____）。","a":"ACDE","o":{"A":"设置临时生产设施","B":"设置围挡","C":"设置生活设施","D":"堆放机具","E":"停放机械"}},{"s":"安全生产技术","t":"多选题","q":"在滑坡体上开挖路堑和修筑抗滑支挡结构时，应符合（____）。","a":"ACD","o":{"A":"分段跳槽开挖","B":"大段拉槽开挖","C":"随挖、随砌、随填并夯实","D":"采用抗滑桩、挡土墙共同支挡时，应先做抗滑桩后做挡土墙","E":"抗滑桩、锚杆（索）施工应从滑坡主轴逐步向两端进行"}},{"s":"安全生产技术","t":"多选题","q":"推土机在上下斜坡时，可以（____）。","a":"AD","o":{"A":"直接向上行驶","B":"横向行驶","C":"对角线行驶","D":"直接向下行驶","E":"利用钢丝绳拖行"}},{"s":"安全生产技术","t":"多选题","q":"拖式铲运机靠近路堤边缘填土时，必须保持（____）。","a":"AC","o":{"A":"外侧高、内侧低","B":"外侧低、内侧高","C":"纵向基本平顺","D":"横向基本平顺","E":"外侧内侧一样高"}},{"s":"安全生产技术","t":"多选题","q":"装载机在通过桥涵时，应避免（____）。","a":"ABCD","o":{"A":"加速","B":"减速","C":"制动","D":"停车","E":"匀速"}},{"s":"安全生产技术","t":"多选题","q":"下列关于水上作业的安全要求中，正确的有（____）。","a":"ABC","o":{"A":"遇雨、雾、霾等能见度不良天气时，工程船舶和施工区域应显示规定的信号","B":"遇大风天气，船舶应按规定及时驶进避风锚地或港池","C":"靠泊船舶上下人或两船间倒运货物时，应搭设跳板、扶手及安全网","D":"交通船舶必须配有救生设备，载人超过乘员定额时应报告","E":"定位船及抛锚作业船，作业人员应在锚链、锚缆滚滑区域指挥"}},{"s":"安全生产技术","t":"多选题","q":"下列关于起重船作业的安全要求中，正确的有（____）。","a":"AC","o":{"A":"作业前，人员应熟悉吊装方案，明确联系方式和指挥信号","B":"根据吊装要求，驳船应指导起重船选择锚位和系缆位置","C":"吊装前，吊钩升降、吊臂仰俯、制动性能应良好","D":"安全装置应设置在醒目位置","E":"吊装结束后，起重船应进驻停泊位置，并对起重吊钩进行检查"}},{"s":"安全生产技术","t":"多选题","q":"下列关于打粧船作业，正确的安全要求有（____）。","a":"BC","o":{"A":"打粧船作业应服从船长指挥","B":"打桩架上的活动物件应放稳、系牢","C":"打桩架上的工作平台应设有防护栏杆和防滑装置","D":"穿越群桩的前缆应选定合适位置，绞缆应快速操作","E":"缆绳两侧5m范围内不得有工程船舶或作业人员进人"}},{"s":"安全生产技术","t":"多选题","q":"下列关于水中围堰（套箱）和水中作业平台作业，正确的安全要求有（____）。","a":"ACDE","o":{"A":"应设置船舶靠泊系统和人员上下通道","B":"临边应设置高度不低于0.8m的防护栏杆","C":"四周挂设安全网和救生圈","D":"四周应设置警示标志和夜间航行警示灯光信号","E":"通航密集水域应配备警戒船和应急拖轮"}},{"s":"安全生产技术","t":"多选题","q":"下列关于爆破作业，正确的安全要求有（____）。","a":"BC","o":{"A":"从事爆破工作的员工应经项目经理部培训教育，并取得相应的培训资格","B":"爆破作业单位实施爆破项目前，应按规定办理审批手续","C":"审批手续批准后，方可实施爆破作业","D":"经审批的爆破作业项目，爆破作业单位应于施工当天发布公告","E":"爆破作业公告应在项目经理部张贴"}},{"s":"安全生产技术","t":"多选题","q":"爆破作业施工公告内容应包括工程名称、建设单位、设计施工单位和（____）。","a":"BCE","o":{"A":"安全监督单位","B":"安全评估单位","C":"安全监理单位","D":"班组长及联系方式","E":"爆破作业时限等"}},{"s":"安全生产技术","t":"多选题","q":"爆炸源与人员、其他保护对象的安全距离的确定，应考虑以下（____）爆破效应分别计算。","a":"ABE","o":{"A":"地震波","B":"冲击波","C":"辐射波","D":"电磁波","E":"飞散物"}},{"s":"安全生产技术","t":"多选题","q":"下列关于爆破作业安全要求的说法，正确的有（____）。","a":"ACD","o":{"A":"钻孔装药应拉稳药包提绳，配合送药杆进行","B":"在雷管和起爆药包放入之前发生卡塞时，应用短送药杆处理","C":"装人起爆药包后，不得使用任何工具冲击和挤压","D":"水下爆破引爆前，警戒区内不得滞留船舶","E":"水下爆破引爆前，警戒区内作业人员应服从指挥"}},{"s":"安全生产技术","t":"多选题","q":"下列关于爆破作业的安全要求中，正确的有（____）。","a":"BE","o":{"A":"雷电、暴雨雪天实施爆破作业时应有专人指挥","B":"电力起爆发生盲炮时应立即切断电源","C":"爆破网络不能置于短路状态","D":"强电场区爆破作业必须使用电雷管","E":"水下电爆网路的主线和连接线应强度高、电阻小、防水、柔韧、绝缘"}},{"s":"安全生产技术","t":"多选题","q":"弃方除应符合现行《公路路基施工技术规范》的有关规定外，还应符合（____）。","a":"ABDE","o":{"A":"弃土场四周应设置警示标志","B":"涵洞口处不得弃方","C":"弃方作业应遵循“边支护，边弃土”的原则","D":"桥墩、桥台处不得弃土","E":"暗河口处不得弃土"}},{"s":"安全生产技术","t":"多选题","q":"高填方路堤施工应符合（____）。","a":"ABCD","o":{"A":"路堤预留宽度应符合设计要求","B":"应及时施作边坡临时排水设施","C":"作业区边缘应设置明显的警示标志","D":"应进行位移监测","E":"应进行不平整度检测"}},{"s":"安全生产技术","t":"多选题","q":"现场调运推土机、平地机、压路机等机械时，正确的做法是（____）。","a":"ABD","o":{"A":"应设专人指挥","B":"地面无障碍物","C":"必须由专用挂车调运进场","D":"指挥人员应事先踏勘行驶道路，确认道路平坦、坚实、畅通","E":"沿途的桥涵等构造物有足够的承载力，能满足机械通行安全要求"}},{"s":"安全生产技术","t":"多选题","q":"下列关于安全网质量，正确的要求有（____）。","a":"ACDE","o":{"A":"安全网安装应系挂受力主绳","B":"安全网安装应系挂网格绳","C":"安全网安装或拆除应根据现场条件采取防坠落安全措施","D":"作业面与坠落高度基准面高差超过2m且无临边防护装置时，临边应挂设水平安全网","E":"作业面与水平安全网之间的高差不得超过3.0m"}},{"s":"安全生产技术","t":"多选题","q":"下列关于安全带使用，正确的要求有（____）。","a":"ABDE","o":{"A":"安全带除应定期检验外，使用前尚应进行检查","B":"安全带的安全绳不得打结使用，安全绳上不得挂钩","C":"安全带应低挂高用，并应扣牢在牢固的物体上","D":"安全带的各部件不得随意更换或拆除","E":"安全绳有效长度不应大于2m"}},{"s":"安全生产技术","t":"多选题","q":"下列关于高处作业，正确的安全要求有（____）。","a":"CD","o":{"A":"安全绳用作悬吊绳时应经现场负责人同意","B":"安全绳应与悬吊绳共用连接器","C":"新更换安全绳的规格及力学性能必须符合规定，并加设绳套","D":"高处作业上下通道应根据现场情况选用钢斜梯、钢直梯、人行塔梯等","E":"高处作业上下通道选用绳梯时高度不超过30m"}},{"s":"安全生产技术","t":"多选题","q":"下列关于钢斜梯使用，正确的要求有（____）。","a":"BD","o":{"A":"长度不宜大于15m","B":"扶手高度宜为0.9m","C":"踏步高度不宜大于1.2m","D":"梯宽宜为0.6〜1.1m","E":"长度大于15m时应设梯间平台，并连续设梯"}},{"s":"安全生产技术","t":"多选题","q":"下列关于钢直梯使用，正确的要求有（____）。","a":"ABC","o":{"A":"攀登高度不宜大于8m","B":"踏棍间距宜为0.3m，梯宽宜为0.6〜1.lm","C":"高度大于2m时应设护笼","D":"护笼间距宜为1.5m,直径宜为0.75m，并设横向连接","E":"高度大于15m时应设一梯间平台，平台应设防护栏杆"}},{"s":"安全生产技术","t":"多选题","q":"下列关于人行塔梯安装，正确的要求有（____）。","a":"ABE","o":{"A":"顶部和各节平台应满铺防滑面板并牢固固定，四周应设置安全护栏","B":"塔梯连接螺栓应紧固，并应采取防退扣措施","C":"人行塔梯高度超过10m时应设连墙件","D":"用电线路宜装设在塔梯上","E":"人行塔梯通往作业面通道的两侧宜采用钢丝网封闭"}},{"s":"安全生产技术","t":"多选题","q":"下列关于脚手架施工，正确的安全要求有（____）。","a":"AD","o":{"A":"脚手架的强度、刚度和稳定性应能承受施工期间可能产生的各项荷载","B":"脚手架的强度、刚度和稳定性应能承受运营期间可能产生的各项荷载","C":"搭设高度12m及以上的落地式钢管脚手架的钢管、扣件应进行抽样检测","D":"脚手架设计计算应以钢管抽样检测的壁厚及力学性能为依据","E":"脚手架设计计算应以钢管抽样检测的管径及力学性能为依据"}},{"s":"安全生产技术","t":"多选题","q":"下列关于脚手架拆除施工，错误的安全要求有（____）。","a":"BCD","o":{"A":"必须由上而下逐层进行","B":"必须由下而上逐层进行","C":"必须上下同时进行","D":"连墙件必须提前拆除","E":"连墙件必须随脚手架逐层拆除"}},{"s":"安全生产技术","t":"多选题","q":"下列关于高处作业的安全要求中，正确的有（____）。","a":"ABCE","o":{"A":"架子工应按照有关规定经专业机构培训，并应取得相应的从业资格","B":"作业时应戴安全帽、穿防滑鞋、系安全带","C":"高处作业现场所有可能坠落的物件均应预先撤除或固定","D":"随身作业工具和物料应手提，不得向上抛掷物料","E":"雨雪季节应采取防滑措施"}},{"s":"安全生产技术","t":"多选题","q":"下列关于水上作业，正确的安全要求有（____）。","a":"ACE","o":{"A":"应及时了解当地气象、水文、地质等情况","B":"开工后，根据施工进度设置安全作业区","C":"办理水上水下施工作业许可证","D":"施工期间发布船舶禁止航行通告","E":"水上作业人员应正确穿戴救生衣等个人安全防护用品"}},{"s":"安全生产技术","t":"多选题","q":"下列关于水上作业安全要求的说法，正确的有（____）。","a":"ACD","o":{"A":"工程船舶必须持有效的船检证书","B":"船员必须培训考核，持安全生产考核证书上岗","C":"工程船舶应按规定配备有效的消防、救生、堵漏和油污应急设施","D":"施工船舶应安装船舶定位设备，保证有效的船岸联系","E":"工程船舶甲板、通道和作业场所应根据需要设有防水防冻设施"}},{"s":"安全生产技术","t":"多选题","q":"下列关于水上作业，错误的安全要求有（____）。","a":"BCDE","o":{"A":"工程船舶必须在核定航区和作业水域内作业","B":"工程船舶作业、航行或停泊时，应按规定配置号灯或号型","C":"水上工况条件超过施工船舶作业性能时，才能开始作业","D":"在宽阔水道施工时，白天应安排人员值守通信频道","E":"工程船舶在核定作业水域内施工时应封闭通航"}},{"s":"安全生产技术","t":"多选题","q":"泵送混凝土施工应符合下列（____）安全规定。","a":"BCD","o":{"A":"首次栗送前应进行管道耐拉试验","B":"混凝土输送泵接头和卡箍应密封、紧固","C":"泵送混凝土时，操作人员应随时监视各种仪表和指示灯，发现异常应立即停机检查","D":"混凝土输送管道接头拆卸前，应释放输送管内剩余压力","E":"清理管道时应设警戒区，管道出口端前方20m内不得站人"}},{"s":"安全生产技术","t":"多选题","q":"储存、搬运、使用氧气瓶、乙炔瓶应符合下列（____）安全规定。","a":"ABDE","o":{"A":"压力表、安全阀、橡胶软管和回火保护器等均应定期校验或试验，标识应清晰","B":"使用的气瓶应稳固竖立或装在专用车（架）或固定装置上","C":"气瓶与实际焊接或切割作业点的距离应大于5m，无法达到的应设置耐火屏障","D":"气割作业氧气瓶与乙炔瓶之间的距离不得小于5m","E":"电、气焊作业点和气瓶存放点应按规定配备灭火器材"}},{"s":"安全生产技术","t":"多选题","q":"下列关于电焊机安全操作，正确的做法有（____）。","a":"BDE","o":{"A":"电焊机二次侧焊接电缆线应采用防水绝缘橡胶护套铝芯软电缆","B":"进出线处应设置防护罩","C":"电焊钳的电缆芯线外露时必须保护","D":"电焊机外壳接地电阻不得大于4n","E":"露天使用电焊机应设防雨、防潮装置，移动电焊机时应切断电源"}},{"s":"安全生产技术","t":"多选题","q":"下列关于焊接作业，正确的做法有（____）。","a":"BCD","o":{"A":"密闭空间内实施焊接及切割，气瓶及焊接电源应置于密闭空间内","B":"金属容器内照明设备的电压不得超过12V","C":"潮湿区域作业人员必须在干燥绝缘物体上焊接作业","D":"高处电焊、气割作业，作业区周围和下方应采取防火措施","E":"密闭空间焊接作业应在外面设置警示标牌"}},{"s":"安全生产技术","t":"多选题","q":"下列关于起重吊装作业，正确的做法有（____）。","a":"ABDE","o":{"A":"起重作业人员应穿防滑鞋、戴安全帽","B":"高处吊装作业时应按规定佩挂安全带","C":"吊装作业应设警戒区，警戒区应小于起吊物坠落影响范围","D":"作业前应检查起重设备安全装置、钢丝绳、滑轮、吊索、卡环、地锚等","E":"起重机械司机、起重信号司索工、起重机械安装拆卸工应取得相应的从业资格"}},{"s":"安全生产技术","t":"多选题","q":"下列关于起重吊装作业，错误的做法有（____）。","a":"AC","o":{"A":"高空吊装梁等大型构件应在构件一端设溜绳","B":"流动式起重设备通行的道路、作业场地应平整坚实，吊装前支腿应全部打开","C":"吊点位置应符合设计规定,设计无规定的应经估算确定","D":"吊装大、重、新结构构件和采用新的吊装工艺应先进行试吊","E":"起重机与架空输电线的安全距离应满足现行《施工现场临时用电安全技术规范》的规定"}},{"s":"安全生产技术","t":"多选题","q":"下列关于缆索吊机系统施工，正确的做法有（____）。","a":"CDE","o":{"A":"吊塔、扣塔及相应索具、风缆、锚碇均应进行刚度验算","B":"安全系数应满足施工工况要求","C":"主缆宜采用钢丝绳，安全系数不得小于3","D":"吊塔、扣塔塔架前后及侧向应设置缆风索","E":"塔架顶部应设置可靠的避雷装置"}},{"s":"安全生产技术","t":"多选题","q":"下列关于起重吊装作业的做法，正确的有（____）。","a":"ABD","o":{"A":"起重机严禁吊人","B":"吊起的构件上堆放或悬挂零星物件应临时固定","C":"作业人员在已吊起的构件下或起重臂下旋转范围内作业或通行时，必须听从指挥","D":"吊装作业临时固定工具应在永久固定的连接稳固后拆除","E":"雨、雪后，吊装前应清理积水或积雪，并应采取防滑和防漏电措施"}},{"s":"安全生产技术","t":"多选题","q":"下列关于高处作业，正确的做法有（____）。","a":"BCDE","o":{"A":"高处作业施工时上下交叉作业现场应有专人指挥进行","B":"高处作业人员不得沿立杆或栏杆攀登","C":"高处作业人员应定期进行体检","D":"高处作业场所临边应设置安全防护栏杆","E":"高处作业场所的孔、洞应设置防护设施及警示标志"}},{"s":"安全生产技术","t":"多选题","q":"下列关于高处作业安全防护栏杆，正确的安全要求有（____）。","a":"CD","o":{"A":"防护栏杆应能承受500N的可变荷载","B":"防护栏杆下部不应设置挡脚板","C":"防护栏杆上杆离地高度应为1.2m","D":"防护栏杆下杆离地高度应为0.6m","E":"横杆长度大于3m时，应加设栏杆柱"}},{"s":"安全生产技术","t":"多选题","q":"下列关于缆索吊装的安全要求，正确的有（____）。","a":"ABDE","o":{"A":"主索道和塔架的拆除应在拆除方案中制订安全技术措施","B":"滑轮组应共同承受荷载，受力不均时，应进行调整","C":"钢丝绳必须选用新钢丝绳","D":"主索道两端应设置限位器","E":"缆索塔架应按设计图组拼"}},{"s":"安全生产技术","t":"多选题","q":"高处作业的级别有（____）。","a":"ABCE","o":{"A":"一级高处作业","B":"二级高处作业","C":"三级高处作业","D":"四级高处作业","E":"特级高处作业"}},{"s":"安全生产技术","t":"多选题","q":"下列高处作业中，属于特殊高处作业的是（____）。","a":"BCDE","o":{"A":"特级高处作业","B":"悬空高处作业","C":"异温高处作业","D":"带电高处作业","E":"抢救高处作业"}},{"s":"安全生产技术","t":"多选题","q":"根据《公路工程施工安全技术规范》（JTGF90—2015），应编制爆破设计方案的工程爆破有（____）。","a":"ABCE","o":{"A":"预裂爆破","B":"光面爆破","C":"大型土石方爆破","D":"松动爆破","E":"水下爆破"}},{"s":"安全生产技术","t":"多选题","q":"支架、模板应按照现行《公路桥涵施工技术规范》（JTC/TF50-2011）进行设计并验算，设计验算主要包括（____），水中支架基础尚应考虑水流冲刷的影响。","a":"ABE","o":{"A":"强度","B":"刚度","C":"压实度","D":"针入度","E":"稳定性"}},{"s":"安全生产技术","t":"多选题","q":"支架支撑体系应符合下列（____）安全规定。","a":"BDE","o":{"A":"支架应设置可靠的接零装置","B":"支架应设置可靠的接地装置","C":"软土基础应有防冻胀措施","E":"支架基础应根据所受荷载、搭设高度、搭设场地地质等情况进行设计及验算","D":"D遇洪水或大雨浸泡后，应重新检验支架基础、验算支架受力"}},{"s":"安全生产技术","t":"多选题","q":"模板安装应符合下列（____）安全规定。","a":"BC","o":{"A":"吊装模板前，应检查地基和排水","B":"模板未固定前，不得实施下道工序","C":"模板应按设计要求准确就位，且不宜与脚手架连接","D":"模板安装就位后，应立即换撑和预压"}},{"s":"安全生产技术","t":"多选题","q":"需要编制专项施工方案的模板、支架及脚手架工程有（____）。","a":"ACE","o":{"A":"各类工具式模板","B":"3m高度支架","C":"13m跨度支架","D":"13m高度落地式钢管脚手架","E":"吊篮脚手架"}},{"s":"安全生产技术","t":"多选题","q":"模板、支架拆除应符合下列（____）安全规定。","a":"BD","o":{"A":"应先拆承重模板，后拆非承重模板","B":"应遵循自上而下拆除","C":"应遵循自下而上拆除","D":"应分层分段拆除","E":"承重模板、支架，应在混凝土强度达到设计要求前拆除"}},{"s":"安全生产技术","t":"多选题","q":"钢筋施工应符合下列（____）安全规定。","a":"ACDE","o":{"A":"钢筋加工机械所有转动部件应有防护罩","B":"钢筋冷弯作业时，弯曲钢筋的作业半径外不得站人或通行","C":"钢筋冷弯作业时，弯曲钢筋的机身不设固定销的一侧不得站人或通行","D":"冷拉钢筋卷扬机应置于视线良好位置并应设置地锚","E":"钢筋对焊机应安装在室内或防雨棚内，并应设可靠的接地、接零装置"}},{"s":"安全生产技术","t":"多选题","q":"下列关于混凝土施工，错误的做法有（____）。","a":"ABCE","o":{"A":"袋装水泥应平齐码放","B":"米用吊斗灌注混凝土时攀爬吊斗应有专人指挥","C":"袋装水泥靠墙码放时不得超过墙高","D":"水泥隔离垫板的刚度及稳定性应满足要求","E":"混凝土浇筑的顺序、速度的更改应经过班组长同意"}},{"s":"安全生产技术","t":"多选题","q":"机械设备使用的“三定”制度包括（____），是机械使用负责制的表现形式。","a":"ABE","o":{"A":"定人","B":"定机","C":"定时","D":"定工","E":"定岗位"}},{"s":"安全生产技术","t":"多选题","q":"在居民点或公共场所附近开挖沟槽时，应设置（____）。","a":"ABCE","o":{"A":"防护设施","B":"安全警示标志","C":"夜间照明灯","D":"搭设竹跳板供通行","E":"夜间警示灯"}},{"s":"安全生产技术","t":"多选题","q":"拆除工程施工应（____）。","a":"ACD","o":{"A":"从上至下","B":"从左至右","C":"逐层实施","D":"分段实施","E":"立体交叉作业"}},{"s":"安全生产技术","t":"多选题","q":"下列关于跨线施工桁架式安全防护棚安全控制要求的说法，正确的有（____）。","a":"ABCDE","o":{"A":"周边路段设置导行设施","B":"周边路段设置减速带","C":"两端支墩立柱贴红白相间的反光膜或涂反光漆","D":"钢管立柱侧面张挂安全网","E":"按坠落半径设置挑檐长度"}},{"s":"安全生产技术","t":"多选题","q":"跨线施工防护棚应设置（____）等设施。","a":"ABCD","o":{"A":"照明灯","B":"轮廓灯","C":"警示灯","D":"爆闪灯","E":"指路灯"}},{"s":"安全生产技术","t":"多选题","q":"塔式起重机安全装置包括（____）等。","a":"ABCD","o":{"A":"力矩限制器","B":"起重量限制器","C":"塔式起重机起升限位","D":"制动器","E":"平衡器"}},{"s":"安全生产技术","t":"多选题","q":"露天作业的门式起重机，当遇六级及以上大风时，正确的做法有（____）。","a":"BDE","o":{"A":"松开夹轨器","B":"将吊钩升到顶端位置","C":"吊钩上悬挂重物","D":"停止作业","E":"抗台风时加设缆风绳"}},{"s":"安全生产技术","t":"多选题","q":"以下属于高处作业安全“三宝”的是（____）。","a":"ABD","o":{"A":"安全帽","B":"安全带","C":"防护栏","D":"安全网","E":"安全梯"}},{"s":"安全生产技术","t":"多选题","q":"遇有六级及以上强风、浓雾等恶劣天气，不得进行（____）","a":"ABDE","o":{"A":"露天局处","B":"起重吊装","C":"混凝土配合比试验","D":"打桩","E":"滑模施工"}},{"s":"安全生产技术","t":"多选题","q":"旧路改扩建施工中，下列保通人员的行为正确的是（____）","a":"ABE","o":{"A":"制止非施工车辆进入作业区","B":"制止施工人员穿越高速公路","C":"在高速公路上拦截、搭乘过往车辆","D":"穿公司制服指挥交通堵塞","E":"制止施工车辆在高速公路上掉头"}},{"s":"安全生产技术","t":"多选题","q":"模板支立及拆除施工中，正确的做法有（____）。","a":"ACE","o":{"A":"基坑内支模时，应先检查基坑有无塌方现象","B":"模板支撑钉在脚手架上有助于整体稳定","C":"向基坑内运送材料，不得抛掷","D":"机械吊运模板时，人员在下方等待", const ESS = {"topics":[{"id":"t1","g":"法规与责任","n":"安全生产方针与责任体系","intro":"《安全生产法》确立「安全第一、预防为主、综合治理」方针，强调以人为本、坚持安全发展，并强化生产经营单位主体责任。主要负责人是本单位安全生产第一责任人，对安全生产工作全面负责；2014 年修订后其法定职责由 6 项增至 7 项，新增「组织制定并实施本单位安全生产教育和培训计划」。在各类安全管理制度中，安全生产责任制度是核心，教育培训、检查、奖惩等制度都围绕它展开。","keys":["方针：安全第一、预防为主、综合治理","机制：单位负责、职工参与、政府监管、行业自律、社会监督","主要负责人 7 项职责，新增项为教育培训计划","安全管理制度的核心＝安全生产责任制度"],"q":[300,530,12,17,28]},{"id":"t2","g":"法规与责任","n":"安全生产法核心条款","intro":"《安全生产法》的高频数字与权利条款：矿山、金属冶炼、建筑施工、道路运输及危险物品单位应设置安全生产管理机构或配备专职人员；其他单位从业人员超过 100 人的同样需要设置。从业人员发现直接危及人身安全的紧急情况有权停止作业或撤离，单位不得因此降薪、解约。民事责任优先于罚款、罚金。事故发生后不立即组织抢救，处上一年年收入 80% 罚款；对重大、特别重大事故负有责任的主要负责人，终身不得担任本行业单位主要负责人。","keys":["100 人：非高危单位设置安全管理机构的门槛","紧急撤离权：不得降薪、不得解除劳动合同","民事赔偿优先于罚款、罚金","不立即组织抢救 → 上一年年收入 80% 罚款","重大/特别重大事故主要责任人 → 终身行业禁入"],"q":[307,267,161,185,202]},{"id":"t3","g":"法规与责任","n":"安全生产许可与三类人员","intro":"《安全生产许可证条例》确立企业安全生产准入制度：颁发管理机关自收到申请之日起 45 日内审查完毕；许可证有效期 3 年，需延期的应于期满前 3 个月向原颁证机关办理。取得许可证须满足安全投入符合要求、设置安全管理机构、主要负责人与安全管理人员考核合格、依法参加工伤保险、依法进行安全评价等条件。建筑施工企业「三类人员」（企业主要负责人、项目负责人、专职安全生产管理人员）须经主管部门考核合格后方可任职。首次详细规定各参建单位安全责任与政府监管责任的是《建设工程安全生产管理条例》。","keys":["45 日审查 / 有效期 3 年 / 期满前 3 个月延期","三类人员＝企业主要负责人、项目负责人、专职安全员","「较高安全技术水平」不是取得许可证的法定条件","《建设工程安全生产管理条例》首次细化参建单位责任"],"q":[198,572,52,24,155]},{"id":"t4","g":"法规与责任","n":"安全生产费用与投入","intro":"建设工程施工企业以建筑安装工程造价为基数计提安全费用：港口与航道、公路工程 1.5%；房屋建筑、水利水电、电力、铁路、城市轨道交通 2.0%；矿山工程 2.5%。安全费用列入工程造价、竞标时不得删减、列入标外管理，由建设单位在编制招标文件（工程概算）时确定。使用范围含安全防护设施完善改造、应急救援器材与演练、重大危险源与隐患评估监控整改、安全设施及特种设备检测检验等；职业病防治、工伤保险、医疗保险费用以及专职安全人员工资不得在安全费用中列支。","keys":["公路/港口航道 1.5%，房建/水利/电力/铁路/轨交 2.0%，矿山 2.5%","列入工程造价，竞标不得删减，标外管理","优先用于满足监管部门提出的整改措施","不含：工伤保险、医疗保险、专职安全人员工资"],"q":[201,591,90,91,599]},{"id":"t5","g":"管理制度","n":"教育培训与安全技术交底","intro":"施工单位应对管理人员和作业人员每年至少进行一次安全生产教育培训，并记入个人工作档案；待岗、转岗、换岗人员重新上岗前安全培训不得少于 20 学时。安全技术交底实行逐级交底制度，由施工单位项目部技术负责人负责实施；施工任务书及对应的安全技术交底书由总工程师签发，并对安全性负责。交底内容应包括作业危险特点与重大危险源、具体预防措施、特殊工序操作方法与规程标准、事故发生后的自救避险与紧急救援措施，不包括安全费用使用情况。","keys":["每年至少 1 次全员教育培训，记入个人档案","待岗/转岗/换岗重新上岗 ≥ 20 学时","项目部技术负责人交底；总工程师签发任务书与交底书","交底四要素：危险点、预防措施、操作规程、应急自救"],"q":[141,97,10,725,790]},{"id":"t6","g":"管理制度","n":"专项施工方案与专家论证","intro":"对达到一定规模的危险性较大分部分项工程（基坑支护与降水、土方开挖、模板、起重吊装、脚手架、拆除爆破等）应编制专项施工方案并附安全验算结果，经施工单位技术负责人、监理工程师审查签字后实施，由专职安全生产管理人员现场监督。只有「超过一定规模」的危大工程才需专家论证，论证会由施工单位组织，而非建设单位或监理单位；并非所有专项方案都要专家审查。公路水运工程中滑坡和高边坡处理、高瓦斯隧道、爆破工程、水下焊接等均属危大工程。方案一经批准不得随意变动，所需安全技术措施经费不得挪作他用。","keys":["专项方案：施工单位技术负责人 + 监理工程师签字，专职安全员监督","仅「超过一定规模」的危大工程需专家论证","专家论证会由施工单位组织","公路水运危大工程：滑坡高边坡、高瓦斯隧道、爆破、水下焊接","方案不得随意变动，经费不得挪用"],"q":[177,98,92,883,439]},{"id":"t7","g":"管理制度","n":"风险辨识与隐患排查","intro":"危险源辨识最常用、最直接的方法是现场调查法。第一类危险源指系统中存在、可能意外释放的危险物质或能量本身；第二类危险源是导致约束或控制失效的各种不安全因素。风险管理流程通常为风险辨识、风险分析、风险评价、风险控制。重大隐患排查治理的责任主体是施工单位，生产经营单位主要负责人对本单位隐患排查治理工作全面负责；本单位重大危险源及安全措施、应急措施应向当地负有安全生产监督管理职责的部门备案。","keys":["辨识首选方法：现场调查法","第一类危险源＝危险物质/能量；第二类＝失控因素","重大隐患排查治理责任主体：施工单位","主要负责人对隐患排查治理全面负责","重大危险源须向监管部门备案"],"q":[0,730,29,857,844]},{"id":"t8","g":"管理制度","n":"安全检查与平安工地","intro":"一般中型以上公路水运工程施工单位应每季度组织一次安全检查。安全检查既查软件系统也查硬件系统，概括为查思想、查管理、查隐患、查整改、查事故处理「五查」；班前班后岗位安全检查属于经常性（日常）检查，不属于定期检查。「平安工地」考核评价等级分为达标、不达标、示范三个等级；创建达标单位包括建设、施工、监理和分包单位，不含材料供应单位。","keys":["中型以上施工单位：每季度一次安全检查","五查：思想、管理、隐患、整改、事故处理","班前班后检查＝经常性检查，非定期检查","平安工地等级：达标 / 不达标 / 示范","创建达标单位：建设、施工、监理、分包"],"q":[4,7,837,74,436]},{"id":"t9","g":"管理制度","n":"参建单位与分包责任","intro":"建设单位在编制工程概算时应确定安全作业环境及安全施工措施所需费用，不得单方面压缩合同约定的工期。依法批准开工报告的工程，应自开工报告批准之日起 15 日内将保证安全施工的措施报送有关部门备案；拆除工程施工 15 日前，须报送施工单位资质等级证明、拟拆除建筑物及可能危及毗邻建筑的说明、拆除施工组织方案、堆放清除废弃物措施备案（不含预算费用明细）。实行施工总承包的，总承包单位对施工现场安全生产负总责，总承包与分包单位对分包工程的安全生产承担连带责任，而非对「整个施工现场」负连带责任。","keys":["两个 15 日：开工报告批准后 15 日、拆除工程施工 15 日前","拆除备案材料不含工程预算费用明细","不得单方面压缩合同工期","总承包负总责，总分包对分包工程承担连带责任","安全施工措施费用由建设单位在概算中确定"],"q":[87,86,85,452,585]},{"id":"t10","g":"事故与应急","n":"事故等级与报告调查","intro":"事故分四级：特别重大（死亡≥30 人，或重伤≥100 人，或直接经济损失≥1 亿元）；重大（10～29 人死亡，50～99 人重伤，5000 万～1 亿元）；较大（3～9 人死亡，10～49 人重伤，1000 万～5000 万元）；一般（3 人以下死亡等）。单位负责人接报后 1 小时内向县级以上主管部门报告，每级上报时间不得超过 2 小时；特别重大、重大事故逐级上报至国务院。调查权限：特别重大由国务院，重大由省级，较大由设区的市级，一般由县级人民政府。事故调查组应自事故发生之日起 60 日内提交调查报告，特殊情况经批准可延长，最长不超过 60 日。伤亡人数变化补报：一般事故 30 日内，道路交通事故、火灾事故 7 日内。","keys":["四级死亡人数界线：30 / 10 / 3 人","单位 1 小时内上报，每级上报 ≤ 2 小时","较大事故 → 设区的市级人民政府调查","调查报告 60 日内提交，延长最长 60 日","补报：30 日（一般）/ 7 日（道路交通、火灾）"],"q":[611,711,621,137,615,88]},{"id":"t11","g":"事故与应急","n":"应急管理与应急预案","intro":"应急管理是全过程管理，四个阶段依次为预防、准备、响应、恢复。生产安全事故应急管理的第一原则是防止事故扩大、减少人员伤亡。生产经营单位主要负责人负责组织制定并实施本单位的生产安全事故应急救援预案，但不必亲自讲授培训课程。应急救援体系中的后勤保障组织负责救援所需设备、设施、物资以及生活、医药等保障；按题库口径，国家安全生产事故灾难应急预案的应急领导机构为国务院安全生产监督管理部门。","keys":["四阶段：预防 → 准备 → 响应 → 恢复","第一原则：防止事故扩大、减少人员伤亡","主要负责人组织制定预案，不必亲自授课","后勤保障组织＝设备设施物资 + 生活医药"],"q":[5,6,283,838,707]},{"id":"t12","g":"事故与应急","n":"事故致因理论与安全理念","intro":"本质安全是安全生产管理的最高境界，指设备、设施或系统本身具有内在的、从根本上防止事故发生的功能，即使误操作也不致造成伤害。海因里希事故因果连锁理论被称为「工业安全公理」「安全公理」，强调人的不安全行为和物的不安全状态是事故的直接原因；人机轨迹交叉理论则强调人的因素与物的因素在事故发生中具有同等重要地位。《公路工程施工安全技术规范》贯彻本质安全、以人为本安全发展、安全第一预防为主综合治理三大理念。","keys":["最高境界＝本质安全","海因里希因果连锁理论＝工业安全公理","轨迹交叉理论：人因与物因同等重要","三大理念：本质安全 / 以人为本安全发展 / 安全第一预防为主综合治理"],"q":[14,15,757,93,96]},{"id":"t13","g":"现场通用技术","n":"劳动防护与职业健康","intro":"《职业病防治法》自 2002 年 5 月 1 日起施行；用人单位应保障职业病防治所需资金投入，不得挤占、挪用，并对投入不足导致的后果承担责任；职业健康检查须由省级以上人民政府卫生行政部门批准的医疗卫生机构承担。对产生严重职业病危害的作业岗位，应在醒目位置设置警示标志和中文警示说明，载明危害种类、后果、预防措施和应急救治措施。施工安全「三宝」是安全帽、安全带、安全网，不包括安全鞋或安全手册。","keys":["《职业病防治法》2002 年 5 月 1 日施行","职业健康检查机构：省级以上卫生行政部门批准","警示说明四要素：种类、后果、预防、应急救治","三宝＝安全帽 + 安全带 + 安全网"],"q":[148,146,147,430,736]},{"id":"t14","g":"现场通用技术","n":"临时用电安全","intro":"施工现场临时用电必须采用 TN-S 接零保护系统（三相五线制），实行三级配电、两级保护和「一机一闸一漏一箱」：每台用电设备必须独立设置开关箱，箱内必须装设隔离开关及短路、过载、漏电保护器，严禁设置分路开关，严禁用一个开关箱控制多台设备。三级配电系统应遵守分级分路、动照分设、压缩配电间距、环境安全四项规则。PE 保护线不得当作 N 线接入漏电保护器。危险潮湿场所照明及手持照明灯具必须采用安全电压供电；隧道作业地段照明电压不宜大于 36V。","keys":["TN-S 三相五线制 + 三级配电两级保护","一机一闸一漏一箱，严禁分路开关","开关箱：隔离开关 + 短路/过载/漏电保护","危险潮湿场所、手持灯具：安全电压","PE 线不得当 N 线接入漏电保护器"],"q":[1438,1086,1378,1246,1265,1461]},{"id":"t15","g":"现场通用技术","n":"高处作业与临边防护","intro":"凡在坠落高度基准面 2m 及以上有可能坠落的高处进行的作业即为高处作业；按高度分为一级（2～5m）、二级（5～15m）、三级（15～30m）、特级（30m 以上）。临边防护栏杆应由上、下两道横杆及栏杆柱组成，并满足承载力要求。安全带应高挂低用，扣牢在牢固结构上，安全绳不得打结、不得挂钩。施工安全「三宝」为安全帽、安全带、安全网。起重机械等自升式架设设施应自验收合格之日起 30 日内向建设主管部门登记。","keys":["≥2m 即为高处作业","分级：2-5 / 5-15 / 15-30 / >30m","安全带「高挂低用」，不是低挂高用","三宝＝安全帽、安全带、安全网","起重机械验收合格后 30 日内登记"],"q":[1040,1044,1022,1023,873]},{"id":"t16","g":"现场通用技术","n":"消防与动火作业","intro":"《消防法》规定消防工作贯彻「预防为主、防消结合」方针。消防「四个能力」：检查消除火灾隐患能力、扑救初起火灾能力、组织疏散逃生能力、消防宣传教育能力。修建道路、停电停水、截断通信线路可能影响消防队灭火救援的，有关单位必须事先通知当地公安机关消防机构。乙炔瓶严禁与氧气瓶及易燃物品同车运输。电弧焊接时，严禁在运输中的压力管道、装有易燃易爆物品的容器及受力构件上进行焊接和切割。","keys":["方针：预防为主、防消结合","四个能力：查隐患、灭初火、会疏散、能宣传","影响灭火救援的施工必须事先通知消防机构","乙炔瓶不得与氧气瓶同车运输","严禁在带压管道、易燃易爆容器、受力构件上焊割"],"q":[229,61,203,1046,1390]},{"id":"t17","g":"现场通用技术","n":"特种设备与起重机械","intro":"特种设备安全工作坚持「安全第一、预防为主、节能环保、综合治理」原则。特种作业人员须经专门安全作业培训并取得特种作业操作资格证书方可上岗。施工起重机械和整体提升脚手架、模板等自升式架设设施，应自验收合格之日起 30 日内向建设行政主管部门登记；使用前应由施工总承包、分包、出租、安装单位共同验收，而非由监理单位验收。特种设备一般事故由设区的市级人民政府负责特种设备安全监督管理的部门会同有关部门组织调查。遇 6 级及以上大风或大雨、大雪、大雾等恶劣天气，应停止高处露天、缆索吊装及大型构件起重吊装作业。","keys":["特种作业须持「特种作业操作资格证书」上岗","起重机械验收合格后 30 日内登记","使用前由总承包/分包/出租/安装单位共同验收","特种设备一般事故 → 设区的市级部门调查","6 级及以上大风停止露天吊装作业"],"q":[134,84,154,160,978]},{"id":"t18","g":"专项工程","n":"隧道与爆破作业","intro":"隧道作业环境空气中氧气含量不得低于 19.5%，严禁用纯氧通风换气。瓦斯隧道瓦斯含量高于 0.5% 时应随时检测并加强通风、按预案处置；隧道作业地段照明电压不宜大于 36V，成洞段和不作业地段宜采用 220V，灯具宜用冷光源。隧道逃生通道距离开挖掌子面不得大于 20m。爆破后必须经不少于 15min 通风排烟，检查人员方可进入工作面检查有无盲炮；爆破作业必须设置警戒区和警戒人员，起爆前撤出人员并发出声、光警示信号。","keys":["氧气 ≥19.5%，严禁纯氧通风","瓦斯 >0.5% → 随时检测","作业段照明 ≤36V，成洞段 220V","逃生通道距掌子面 ≤20m","爆破后通风排烟 ≥15min 方可进入；须设警戒与声光信号"],"q":[922,1281,957,1282,938,940]},{"id":"t19","g":"专项工程","n":"桥梁、支架与吊装","intro":"六级及以上大风、大雨、大雪、大雾等恶劣天气不得进行满堂支架搭设等露天高处作业。支架使用前应预压，预压荷载宜为支架需承受全部荷载的 1.05～1.10 倍，而非 0.75～0.80 倍。吊装前应检查旧钢丝绳破损程度，每一节距内折断钢丝不得超过 5%；大型构件、重构件吊装宜使用检验合格的新钢丝绳。滑模施工模板提升到 2m 高以后，应安装好内外吊架、脚手架、铺好脚手板并挂设安全网。架桥机等自行式架设设施使用前由相关参建单位共同验收，不是由监理单位单独验收。","keys":["支架预压荷载：全部荷载的 1.05～1.10 倍","钢丝绳每一节距断丝 ≤5%","滑模提升 2m 后：吊架、脚手架、脚手板、安全网","六级及以上恶劣天气停止支架搭设","架桥机等由相关单位共同验收，非监理单独验收"],"q":[1105,1360,1325,1156,633]},{"id":"t20","g":"专项工程","n":"基坑、围堰与水上作业","intro":"桥梁基坑深度超过 1.5m 且不加支撑时，应按要求放坡。钢板桩围堰插打顺序为从上游依次对称向下游插打；围堰内施工遇有流水应立即撤出人员；基坑抽水时应安排专人经常检查土层变化；基坑支撑拆除应与回填土进程配合，严禁站在正在拆除的支撑上作业。水上作业开工前应设置安全作业区并办理水上水下施工作业许可证，人员正确穿戴救生衣，运输船舶均匀加载、严禁超载超宽偏载；在宽阔水道和船舶往来频繁水域施工必须安排专人值守。施工船舶应按规定配备定位、通信设备，不能用手机替代。","keys":["基坑深 >1.5m 无支撑 → 放坡","钢板桩围堰：上游 → 对称 → 下游","支撑拆除与回填配合，严禁站在待拆支撑上","水上作业须办许可证、设作业区、穿救生衣、专人值守","手机不能替代船舶定位通信设备"],"q":[1321,976,975,1024,1341]},{"id":"t21","g":"交通机电与标志","n":"安全标志与作业警戒","intro":"安全警示标志必须符合国家标准；改建公路时施工单位应在施工路段两端设置明显的施工标志、安全标志。公路养护人员作业时应穿着统一的安全标志服。混凝土覆盖养护时预留孔洞周围应设置安全护栏或盖板并设置警示标志，不得随意挪动。起重吊装作业应设警戒区，警戒区应「不小于」起吊物坠落影响范围；爆破作业必须设警戒区和警戒人员，起爆前撤出人员并发出声、光警示信号。配电箱、开关箱检修时必须将前一级电源隔离开关分闸断电，并悬挂「禁止合闸、有人工作」停电标志牌。","keys":["安全警示标志必须符合国家标准","改建公路：施工路段两端设施工标志 + 安全标志","警戒区应「不小于」坠落影响范围","孔洞：护栏或盖板 + 警示标志","检修停电挂牌「禁止合闸、有人工作」"],"q":[132,259,519,1366,1356]},{"id":"t22","g":"交通机电与标志","n":"交通机电设施施工安全","intro":"高速公路隧道照明灯具维修、保养作业不得少于两人，严禁酒后操作和闲谈打闹；外场监控摄像机安装人员必须年满 18 周岁、经身体检查合格后方可从事安装作业。沙漠等荒漠地区外出作业每组不得少于 3 人，并应配备通信设备。危险潮湿场所照明及手持照明灯具必须采用安全电压。外部防雷装置由接闪器、引下线、接地装置组成，电涌保护器（SPD）属于内部防雷装置。在搅拌楼拌和锅内清理黏结混凝土且无电视监控时，必须有两人以上方可进行。","keys":["隧道照明维修 ≥2 人，严禁酒后作业","外场摄像机安装：年满 18 周岁 + 体检合格","沙漠外出每组 ≥3 人 + 通信设备","外部防雷＝接闪器 + 引下线 + 接地装置；SPD 属内部防雷","拌和锅清理无监控时 ≥2 人"],"q":[1518,1546,959,1443,996]}],"exp":{"300":"《安全生产法》第三条明确方针为「安全第一、预防为主、综合治理」。「以人为本」「群防群治」是理念或工作要求，不是法定方针表述。","530":"2014 年修订后的《安全生产法》第三条即为此表述：以人为本、坚持安全发展，强化和落实生产经营单位主体责任，故判断正确。","12":"安全生产责任制度把安全责任分解到每个岗位、每个人，是教育培训、检查、奖惩等其他制度的基础与核心。","17":"新增项是「组织制定并实施本单位安全生产教育和培训计划」；建立责任制、如实报告事故、保证安全投入均属原有 6 项职责。","28":"主要负责人对安全生产工作全面负责。董事长、总经理均不在岗时，实际主持日常工作的常务副总经理徐某即为该期间的全面责任人。","307":"《安全生产法》规定：高危行业以外的生产经营单位，从业人员超过 100 人的应设置安全生产管理机构或配备专职人员；100 人以下可配专职或兼职。","267":"从业人员享有紧急撤离权，单位不得因此降低工资、福利或解除劳动合同，故应允许该行为。","161":"《安全生产法》确立「民事赔偿优先」：财产不足以同时支付民事赔偿与罚款、罚金时，先承担民事赔偿责任。","185":"事故发生后不立即组织抢救的，对主要负责人处上一年年收入 80% 的罚款；迟报、漏报为 40%～60%，擅离职守另有规定。","202":"对重大、特别重大生产安全事故负有责任的主要负责人，终身不得担任本行业生产经营单位的主要负责人。","198":"《安全生产许可证条例》第九条：有效期 3 年，期满需延期的应于期满前 3 个月向原颁发管理机关办理延期手续。","572":"条例规定颁发管理机关应自收到申请之日起 45 日内审查完毕，符合条件即颁发安全生产许可证，故正确。","52":"法定条件含安全投入、管理与人员考核合格、依法安全评价、依法参加工伤保险等；「应具有较高安全技术水平」并非法定条件。","24":"《建设工程安全生产管理条例》首次全面、详细规定建设、勘察、设计、施工、监理等参建单位安全责任及政府监管责任。","155":"三类人员（主要负责人、项目负责人、专职安全生产管理人员）须经建设行政主管部门或其他有关部门考核合格后方可任职。","201":"《企业安全生产费用提取和使用管理办法》规定，港口与航道、公路工程类别按建筑安装工程造价的 1.5% 提取。","591":"安全费用列入工程造价，竞标时不得删减，列入标外管理，由建设单位在编制招标文件时确定所需费用，故正确。","90":"办法明确企业应将安全费用优先用于满足安全生产监督管理部门提出的整改措施，或达到安全生产标准所需支出。","91":"职业病防治、工伤保险、医疗保险等费用应按规定另行列支，不得挤占安全费用，故错误。","599":"各类工程提取标准并不统一：矿山 2.5%，房建、水利水电、电力、铁路、城市轨道交通 2.0%，公路与港口航道 1.5%，故「均为 2.0%」错误。","141":"《建设工程安全生产管理条例》：施工单位应对管理人员和作业人员每年至少进行一次安全生产教育培训，情况记入个人工作档案。","97":"待岗、转岗、换岗人员重新上岗前须接受一次安全培训，时间不得少于 20 学时，故正确。","10":"安全技术交底实行逐级交底制度，由施工单位项目部技术负责人负责实施，而非班组长或专职安全员。","725":"公路施工企业施工任务书及对应的安全技术交底书由总工程师签发，并对其安全性负责。","790":"交底内容包括危险特点与重大危险源、具体预防措施、特殊工序操作规程、事故后自救与紧急救援；安全费用使用情况不属交底内容。","177":"需专家论证的专项施工方案，论证、审查工作由施工单位组织召开专家论证会，建设单位、监理单位参与但不组织。","98":"论证会由施工单位组织，题干说由建设单位组织召开，故错误。","92":"只有超过一定规模的危险性较大工程才需专家论证审查，一般专项方案经技术负责人和监理工程师审查签字即可实施。","883":"已批准的专项施工方案不得随意变动，修改须重新履行审批；方案所需安全技术措施经费不得挪作他用。","439":"依《公路水运工程安全生产监督管理办法》，滑坡和高边坡处理、高瓦斯隧道、爆破工程、水下焊接需编专项方案；一般涵洞基础不在其列。","0":"现场调查法直观、简便、可操作性强，是安全生产管理人员辨识危险源使用最多的方法；事故树、故障树多用于系统安全分析。","730":"第一类危险源是系统中存在、可能发生意外释放的危险或有害物质与能量；「失去控制」描述的是第二类危险源的作用结果。","29":"《公路水运工程安全生产监督管理办法》明确施工单位是重大隐患排查治理的责任主体。","857":"《安全生产事故隐患排查治理暂行规定》：生产经营单位主要负责人对本单位事故隐患排查治理工作全面负责。","844":"生产经营单位应将本单位重大危险源及有关安全措施、应急措施报当地负责安全生产监督管理的部门备案。","4":"一般中型以上公路水运工程施工单位应当每季度组织一次安全检查；项目部、作业队另有更频繁的周检、日检要求。","7":"《公路水运工程「平安工地」考核评价标准（试行）》规定考评等级为达标、不达标、示范三个等级。","837":"安全检查既查软件（思想、管理、制度、整改与事故处理）又查硬件（设备、防护设施），「五查」表述正确。","74":"班前、班后岗位安全检查属于经常性（日常）检查；定期检查是按固定周期统一组织的检查，故错误。","436":"平安工地创建达标单位包括建设单位、施工单位、监理单位和分包单位，材料供应单位不属于考核评价对象。","87":"总承包单位对施工现场安全生产负总责；总分包是对「分包工程」的安全生产承担连带责任，题干扩大到整个施工现场，故错误。","86":"《建设工程安全生产管理条例》：建设单位在编制工程概算时应确定建设工程安全作业环境及安全施工措施所需费用。","85":"「不得压缩合同约定的工期」指建设单位不得单方面压缩；经协商一致并履行程序调整的不在此限。","452":"备案材料为施工单位资质等级证明、拟拆除建筑物及可能危及毗邻建筑的说明、拆除施工组织方案、堆放清除废弃物措施；预算费用明细不需备案。","585":"依法批准开工报告的建设工程，建设单位应自开工报告批准之日起 15 日内将保证安全施工的措施报送备案，故正确。","611":"较大事故为造成 3 人以上 10 人以下死亡，或 10 人以上 50 人以下重伤，或 1000 万元以上 5000 万元以下直接经济损失；题干把起点写成 5 人，故错误。","711":"3 人死亡属较大事故，由事故发生地设区的市级人民政府负责组织调查；重大由省级、特别重大由国务院组织。","621":"《生产安全事故报告和调查处理条例》：调查报告应自事故发生之日起 60 日内提交；特殊情况经批准可延长，延长期限最长不超过 60 日。","137":"道路交通事故、火灾事故自发生之日起 7 日内伤亡人数发生变化的应及时补报；其他生产安全事故为 30 日内。","615":"安全生产监督管理部门逐级上报事故情况，每级上报时间不得超过 2 小时，不是 24 小时；单位负责人接报后 1 小时内上报。","88":"特别重大事故、重大事故应逐级上报至国务院安全生产监督管理部门和负有安全生产监督管理职责的有关部门，故正确。","5":"应急处置首要目标是控制事态、防止事故扩大并最大限度减少人员伤亡；其余选项属于组织保障或工作要求，不是第一原则。","6":"应急管理依次为预防、准备、响应、恢复四阶段；「接警」「启动」「救援」只是响应阶段内的具体动作。","283":"主要负责人法定职责是「组织制定并实施本单位的生产安全事故应急救援预案」，亲自为职工授课并非法定职责。","838":"后勤保障组织的职责正是提供救援所需设备、设施、物资以及生活、医药等保障，故正确。","707":"按题库口径，国家安全生产事故灾难应急预案的应急领导机构为国务院安全生产监督管理部门。","14":"本质安全通过设计使系统本身具备自动防止事故的能力，即使发生误操作也不致造成伤亡，是安全管理追求的最高境界。","15":"海因里希因果连锁理论最早系统提出事故致因链条，被称为「安全公理」；破窗理论属于管理与犯罪心理学范畴。","757":"事故因果连锁理论（多米诺骨牌理论）由海因里希提出，故有「工业安全公理」之称。","93":"海因里希理论把事故直接原因归结为人的不安全行为和物的不安全状态，故正确。","96":"轨迹交叉理论认为事故是人的不安全行为与物的不安全状态在时间与空间上交叉的结果，两者同等重要。","148":"《中华人民共和国职业病防治法》于 2001 年 10 月通过，自 2002 年 5 月 1 日起施行。","146":"用人单位是职业病防治责任主体，应保障所需资金投入、不得挤占挪用，并对投入不足导致的后果承担责任。","147":"职业健康检查应由省级以上人民政府卫生行政部门批准的医疗卫生机构承担，县级、市级、区级均不符合要求。","430":"《职业病防治法》规定警示说明应载明危害种类、后果、预防措施和应急救治措施；「效果」不在法定内容中。","736":"施工安全「三宝」指安全帽、安全带、安全网，安全手册属于管理资料而非防护用品。","1438":"施工现场专用的中性点直接接地电力线路必须采用 TN-S 接零保护系统，即工作零线 N 与保护零线 PE 全程分开。","1086":"「一机一闸一漏一箱」要求每台用电设备必须设置独立开关箱，不得多台设备共用一个开关箱。","1378":"开关箱必须装设隔离开关及短路、过载、漏电保护器，严禁设置分路开关，且每台设备独立设箱，故正确。","1246":"开关箱应装设隔离开关、短路保护器、过载保护器和漏电保护器；分路开关（B）为明令禁止，不应选。","1265":"三级配电四项规则是分级分路、动照分设、压缩配电间距、环境安全；「控制线路长度」不是独立规则。","1461":"危险潮湿场所照明及手持照明灯具必须采用安全电压供电（一般 36V 及以下，特别潮湿处 12V）。","1040":"国家标准规定：凡在坠落高度基准面 2m 及以上有可能坠落的高处进行的作业，均称为高处作业。","1044":"作业高度为桥墩 20m + 箱梁 4m = 24m，落在 15～30m 区间，属于三级高处作业。","1022":"临边防护栏杆应由上、下两道横杆及栏杆柱组成并满足承载力要求；「下方不得有人通行」并非规范规定。","1023":"安全带应高挂低用并扣牢在牢固物体上；低挂高用会增大坠落距离与冲击力，是错误做法。","873":"施工安全「三宝」是安全帽、安全带、安全网，不含安全鞋，故错误。","229":"《消防法》第二条：消防工作贯彻预防为主、防消结合的方针，实行消防安全责任制。","61":"消防安全「四个能力」为检查消除火灾隐患、扑救初起火灾、组织疏散逃生、消防宣传教育；「有效处理事故」不在其列。","203":"可能影响消防队灭火救援的，必须事先通知当地公安机关消防机构；事后通知或酌情通知均不符合要求。","1046":"乙炔为易燃气体、氧气为强助燃气体，同车运输一旦泄漏极易形成爆炸性混合物，故严禁混装运输。","1390":"在带压管道、盛装易燃易爆物品的容器及受力构件上焊接切割易引发爆炸或结构失效，属明令禁止行为。","134":"《安全生产法》规定特种作业人员必须经专门的安全作业培训并取得「特种作业操作资格证书」，方可上岗作业。","84":"《特种设备安全法》确立的原则为安全第一、预防为主、节能环保、综合治理，故正确。","154":"《建设工程安全生产管理条例》：自施工起重机械等自升式架设设施验收合格之日起 30 日内，向建设行政主管部门登记。","160":"特种设备特别重大、重大、较大、一般事故分别由国务院（或授权部门）、国务院特种设备部门、省级、设区的市级部门组织调查。","978":"六级及以上大风和大雨、大雪、大雾等恶劣天气下，应停止高处露天、缆索吊装及大型构件起重吊装等作业。","922":"隧道施工规范规定作业环境空气中氧气含量不得低于 19.5%（体积比），低于此值须加强通风。","1281":"氧气下限数值正确，但严禁用纯氧通风换气——纯氧会显著提高火灾与爆炸风险，故整句错误。","957":"瓦斯隧道瓦斯浓度超过 0.5% 时必须立即加强通风、随时检测并按预案处置，不能按固定时间间隔巡检。","1282":"隧道作业地段照明电压不宜大于 36V，成洞段和不作业地段宜采用 220V，灯具宜采用冷光源，故正确。","938":"隧道逃生通道（逃生管道）距开挖掌子面不得大于 20m，以保证突发坍塌时人员能迅速撤离。","940":"爆破后必须经不少于 15min 通风排烟，确认无盲炮及有害气体超限等异常后，检查人员方可进入工作面。","1105":"六级及以上大风和大雨、大雪、大雾等恶劣天气下，不得进行满堂支架搭设等露天高处作业；室内试验不受此限。","1360":"支架预压荷载应为需承受全部荷载的 1.05～1.10 倍，用以消除非弹性变形并检验承载力，0.75～0.80 倍不足，故错误。","1325":"吊装前须检查旧钢丝绳，每一节距内折断钢丝不得超过 5%；大型构件、重构件宜使用检验合格的新钢丝绳。","1156":"滑模提升到 2m 后应及时安装内外吊架、脚手架、铺好脚手板并挂设安全网，形成完整作业平台与防护。","633":"架桥机、滑模爬模等自升式架设设施使用前，应由施工总承包、分包、出租、安装单位共同验收，监理单位不是验收主体。","1321":"桥梁基坑深度超过 1.5m 且不加支撑时，必须按土质情况放坡或采取支护措施防止坍塌，故正确。","976":"钢板桩围堰应从上游开始、依次对称向下游插打，以利合龙并减小水流冲击影响。","975":"基坑支撑拆除应与回填土进程配合，严禁站在正在拆除的支撑上作业；D 项做法危险且错误。","1024":"在宽阔水道、船舶往来频繁水域施工必须安排专人值守与警戒，「不需安排人员值守」错误。","1341":"施工船舶应配备规定的定位与通信设备；手机通信不可靠，不能替代法定船岸通信设备，故错误。","132":"《建设工程安全生产管理条例》规定安全警示标志必须符合国家标准，不得自行设计或用企业、地方标准替代。","259":"《公路法》规定改建公路时，施工单位应在施工路段两端设置明显的施工标志和安全标志。","519":"公路养护人员进行养护作业时应穿着统一的安全标志服，便于车辆驾驶人识别、减速避让，故正确。","1366":"预留孔洞周围须设安全护栏或盖板并设警示标志，且不得随意挪动，以防人员失足坠落。","1356":"起重吊装警戒区必须不小于起吊物坠落影响范围，题干「不得大于」会缩小警戒范围，故错误。","1518":"隧道照明灯具维修属高处/带电作业，不得少于两人以便互相监护，且严禁酒后操作和闲谈打闹。","1546":"外场监控摄像机安装多属高处作业，人员须年满 18 周岁并经身体检查合格后方可上岗。","959":"沙漠等荒漠地区外出作业风险高，每组不得少于 3 人并配备通信设备，故正确。","1443":"外部防雷装置由接闪器、引下线、接地装置组成；电涌保护器用于限制瞬态过电压，属内部防雷措施。","996":"无电视监控时清理拌和锅内黏结混凝土必须有两人以上，一人作业、一人监护，防止误启动造成伤害。"}};
