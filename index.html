“三违”，应即时制止防险。A纯合同违约不一定涉安全，C违章设计有专业审查纠正程序而非本句三违分类。安全员发现设计明显危险也应报告，不能因C未选就放任施工。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "446": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "CE全面负责且有生产经营决策权体现主要负责人实质能力，能决定资源与组织。A组织领导、B全面规划、D规范管理单独措辞过泛，普通部门长也可能承担部分。不能靠换职称把实际控制人的总责转给无权调资源的名义安全员。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "447": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "ABC经理副经理总工是题引项目负责人群体，分别统筹组织、分管和技术。D作业队长、E专职安全员有对应现场职责，但不自动等同项目层负责人。岗位安全责任不能因不列负责人就被免除，带班范围还须按具体制度明确。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "448": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\nABDE条件、守法、预案、培训均应检查，但C安全专项费用落实也是安全条件及行业监督的重要内容，原排C缺少合理依据。若题仅问某条文逐字列项需说明，不能将费用作为无需监督事项教给项目；原答案漏C待核。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "449": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "BCD条件信用和保障措施可在招标阶段筛选履约安全能力，不能只比报价。A既往演练、E费用使用程序可能用于具体管理，却非本题指定三类招标明确要求；招标约定也不得压缩合理安全费用或要求投标者承诺违法赶工。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "450": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "ACE企业层组织制度、投入和定期专项检查体现主要负责人责任。B按具体工程组织安全措施通常属项目负责人，D现场专职检查对应安全管理人员；有分工不代表负责人可不督促现场整改，也不能让安全员替自己决定投入。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "451": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "ABC现场检查发现问题、及时报告、制止违章是专职安全员现场核心职责。D全面落实法规、E编制更新制度更多为机构综合职责，非题句三项。机构与个人职责有协作重叠，但不能用写制度代替现场发现制止直接危险。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "452": {"status": "explained", "source": "原有精选精讲", "text": "备案材料为施工单位资质等级证明、拟拆除建筑物及可能危及毗邻建筑的说明、拆除施工组织方案、堆放清除废弃物措施；预算费用明细不需备案。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "453": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\nBCD死亡重伤直接经济损失是条例一般分级指标，A轻伤不独立定档，E社会影响不能按这三个量化档任意加减。严重社会影响可影响提级调查等程序，不等于该条例常规分级要素，原BCDE把两类制度混淆，待核。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "454": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "ACD分别死亡3至不足10、重伤10至不足50、直接损失1000万至不足5000万元，为较大事故三指标。B死亡10至不足30属重大，E损失不足1000万属一般档。原文“以下”按制度不含本数理解，不能把临界10死仍归较大。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "455": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在把50万至100万元放到一般事故。按原题库采用的旧法，该区间对应较大事故而非一般，故B。事故等级、单位罚款与负责人个人年收入比例须分别判断；不据此给出现行一般事故罚款数额。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "456": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "题目限定特别重大且情节特别严重，原库将其对应更高档的1000万至2000万元单位罚款，故A。不是所有特别重大事故都无条件取此档，也不是对每个责任人各罚同数；金额只属于本题旧法口径。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "457": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在用降工资福利补企业因紧急避险产生的损失。若符合法定停止作业、撤离条件，单位不能借经济惩罚剥夺避险权，故B。应优先保护生命，损失处理不能迫使人员在直接危险中继续工作。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "458": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错误是“无权再赔偿”。工伤保险给付不当然消灭劳动者依法仍可主张的民事赔偿权利，故B。是否另有赔偿、如何避免重复计算应按具体法律关系确定，不能简单说领了保险后单位永不担责。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "459": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "评价检测会影响风险判断和安全决策，机构要有相应能力资质并对结果负责，才能防止无能力出具报告、虚假证明逃责，故A。委托单位不能因报告合格就停止履行现场主体责任，机构也不能用“仅供参考”免除法定责任。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "460": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错误是把国家安全、社会治安也整体纳入生产安全法的专门管理范围。该法核心调整生产经营活动中的安全生产问题，国家安全和治安有各自法律制度，故B。名称里都有安全，不等于法律对象相同。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "461": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在按资本来源排除外商投资单位。领域内从事生产经营活动的安全义务不因国有、集体或外资而有无不同，故B。企业组织形式影响经营关系，不使其员工和公众免受同样安全保障。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "462": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错误在以怕恐慌为由隐瞒危险。真实告知让从业人员能正确操作、防护和避险，是安全知情权的基础，故B。应配合讲清控制办法和应急措施，而不是夸大吓人或只说没危险，两种极端都不利于有效防控。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "463": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错误是用技术、业务保密拒绝依法检查。单位应依法配合，检查人员同时承担相应保密责任，商业秘密不能成为拒绝监管的通用挡箭牌，故B。依法检查与无关信息任意外传应区分，保密义务不是取消检查权。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "464": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "不同行业事故机理和后果不同，按职责制定重大隐患判定标准可统一识别、便于监管执法，原库A。标准由有权限部门分工制定，不是某个企业可自行降低重大隐患门槛以免治理；部门名称沿用原题历史表述。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "465": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在否定工会监督权。工会可依法对安全设施与主体工程同时设计、施工、投用的落实情况监督，故B。监督不等于代替专业设计审查或工程验收，也不是工会独自承担建设单位安全责任。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "466": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "安全管理人员若因依法制止违章而被降薪解雇，会削弱独立履职和隐患报告，题干禁止此类报复，故A。保护针对依法履职行为，不是让人员脱离岗位规则随意行事；单位应提供落实安全职责的条件。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "467": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "派遣劳动者可能到不同单位工作，派遣单位必要基础教育能提高其识险能力，因此A。使用单位还需具体岗位培训，两方职责并不互相替代，不能因派遣方讲过常识就省掉现场设备、工序交底。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "468": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "监管发现隐患应及时责令排除，以防在知情后继续暴露，原库A。立即排除指向及时处置义务，若技术上不能当场治好则需控制风险、必要撤人停工并落实整改，不能理解为口头说立即就可不管后续。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "469": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "关闭严重影响单位经营并涉及行政权限，应按规定由监管报请有权政府决定，不能检查人员当场随意宣布，原库A。报请程序不妨碍先采取依法必要的停工、撤人等即时风险控制，关闭与临时处置不是同一措施。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "470": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n“安全三同时”初期设施投资与企业后续按规定提取的安全生产费用，在经费来源和核算范围上可能不同，不能只因都用于安全就等同。原库A未给适用费用办法，与常见新改扩建初期投资单列的口径有冲突，需核原制度，不据此重复列支。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "471": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在将救援配合义务只限事故有关者。事故抢救需要社会资源和现场协作，有关单位个人应依法提供支持，不得以无关系为由一概拒绝，故B。配合不等于无防护冒险施救，应服从专业指挥和自身能力条件。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "472": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "协议无效这一部分正确，问题在所列2万至5万元并非本题采用的完整旧罚款区间，所以整句B。题目把法律后果和处罚金额捆绑，不能只见“协议无效”就判对；现行金额须另核，不编造替代数字。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "473": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n“委托单位”通常指发出委托的生产经营单位，该主体责任并不因购买服务转移，因此按字面句子应合理，原库却B。若原题想指受托服务机构，应写“受委托单位”；该主体称谓有歧义，和503的明确受托负责说法不能混为一谈。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "474": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "居民村民组织更贴近区域现场，报告隐患有助发现监管盲区，故A。报告权不意味着其有权自行替代专业执法或强制拆除设备，应向有处理权限的部门提供线索并配合后续核查。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "475": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n题干在“意”字处截断，不能把不完整句当作完整法律命题。可识别的疑点是“只需听取主要负责人”，安全决策还应依法听取相关安全管理人员意见，但原后半句缺失，待恢复原题，不擅自补写全文作为既有内容。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "476": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n题干在“安全教育和培”处截断，无法确认完整用途限定。安全费不只支持教育培训，还可依法用于其他安全条件措施，但不能据残句断言原命题完整内容；保留原库B，待恢复题干后逐项核定范围。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "477": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n句子在“监督管”截断，虽已露出“各部门在职责范围依法监管”的合理方向，仍缺完整谓语和对象限定。不能把补写想象当作原题全文，原库A只保留评分，待恢复后再确认为完整法规解析。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "478": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "教育培训计划需要组织、资源和持续执行，主要负责人负有统筹制定实施的责任，故A。可以由培训、安全部门具体执行，但不能把工作分出去就认为主要负责人不再负责计划是否切合实际和落实。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "479": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "未经教育培训不能证明人员知道岗位危险及操作要求，直接上岗易把无知转化为事故，因此原库A。培训不止签到，依法还要符合岗位内容并达到相应要求；持其他单位证明也不自动熟悉新现场。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "480": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在考核“可以收费”。本题所述主管部门的安全知识管理能力法定考核，按原库不得收费，故B。培训服务费用与行政部门履行法定考核职责的收费不是同一事项，不能混用。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "481": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "地方可结合本地区具体生产条件，对国家目录以外仍危及安全的工艺设备依法公布淘汰，原库A。这是依权限补充风险治理，不是地方可降低国家已经设定的淘汰要求，也不是任意个别人员口头宣布即生效。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "482": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在把危险物品场所与宿舍同楼视为有距离即可。火灾、爆炸或泄漏可能通过共同建筑传播，原制度禁止这种混设，故B。楼内隔几间房不能替代建筑层面的分隔和安全距离要求。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "483": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "发包出租后不同队伍互相影响，统一协调管理与定期检查能控制交叉风险，发现问题应督促整改，故A。合同转移施工任务不等于发包方失去监督责任，承包承租方也仍承担自身现场安全责任。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "484": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在以“自愿”让法定伤亡责任可免除。安全保障是不能任意私约排除的义务，员工同意并不使违规免责约定有效，故B。保险、工资补偿或签过自担风险书也不当然代替单位应承担责任。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "485": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "保险保障与依法产生的其他赔偿请求可能基于不同关系，法律仍赋予请求权时可向单位主张，因此A。不是无限叠加赔偿或所有损失必可重复领，具体项目需按适用规定判断。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "486": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "被派遣者在使用单位实际作业，同样应获知危险、接受保护，并遵守操作规程和报告隐患，故A。合同签在派遣方不使其成为现场安全法律关系的局外人，权利和义务应随实际用工落实。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "487": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错误是罚款后不再承担连带赔偿。行政罚与对受害人的民事赔偿功能不同，虚假证明造成损害的责任不因交罚款被买断，故B。是否达到连带责任条件要看法律和因果事实，但不能一概以已缴罚款拒赔。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "488": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "原法表述是“一切单位和个人”，题目改成“部门”使组织范围缩窄，原库按法定措辞判B。保护环境的义务不只行政部门，企业、其他组织及个人均在内；不能只把环保当监管机关的工作。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "489": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "研究、开发和应用能改善监测、污染治理和资源利用能力，支持产业与信息化是提高环境治理技术水平的路径，因此A。技术进步仍需与守法排放和真实数据结合，购买新设备不当然免除排放责任。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "490": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n本句“各级政府加大投入”与环保财政保障原则一致，原库B可能在“使用效率”与原法“使用效益”的用词差别。效率与综合效益确非同义，但不能据此解释为各级政府不该增加环保投入；须核是否纯原文措辞题，原判错理由不够明确。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "491": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在把法定奖励主体写为环境保护主管部门。原题所引奖励表述对应人民政府，环保部门可具体组织有关工作，但不能任意替换法定主体，故B。考主体名称而非否认环保部门能够开展其他依法授权的表彰活动。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "492": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错误在制定主体被改为省级“环保主管部门”。原题口径是省级人民政府制定相应地方标准，技术主管部门组织工作不等于享有完全相同制定权限，故B。未规定项目可补充、已有项目可更严的方向不能抵消主体错位。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "493": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "环评用于在实施规划、开工建设之前识别环境影响并确定约束，跳过法定程序将失去事前预防作用，故A。补办文件不能自动使此前擅自开工合法，具体项目是否属于应评价范围仍需按相应制度认定。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "494": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "达标是法定底线，进一步减排还产生公共环境收益，财政税收价格采购等正向激励可鼓励超额改进，因此A。政策支持不等于企业可用减排承诺换取其他违法排放，也不保证每项减排都自动获得某固定补贴。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "495": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "为改善环境依法转产、搬迁、关闭会有调整成本，政府予以相应支持可促进污染结构治理，题干A。支持依规定而非无限兜底，企业仍需依法处理污染清理、职工及债务等事项。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "496": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "污染防治设施与主体同步建成投用，才能避免生产先启动、污染后治理；按批准环评要求设置并防擅停可保持持续控制，故A。设施摆在现场但不运行，不等于已履行污染防治义务。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "497": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "公开评价文件和补充征求公众意见能使受影响者参与、发现遗漏风险，同时依法保护国家及商业秘密，原库A。征求意见不是只放一个公告走程序，也不是必须公开依法保密的全部技术资料。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "498": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "未提交或未经批准就开工，破坏了环评事前审查的约束，停止建设、罚款及按条件恢复原状用于纠正并承担后果，原库A。不同项目具体执法主体和处罚适用须依法核定，不能把本题当现场个人自行强拆的权限。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "499": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "环境服务机构弄虚作假会误导治理和监管，若对污染破坏负有责任，除自身受处罚，还可能与其他责任者共同承担赔偿，故A。第三方报告并非天然免责，连带责任仍须以相应法律条件和事实为依据。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "500": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n原法常见表述是“构成犯罪依法追究刑事责任”，题干增加“和行政责任”后原库B。但这不能推导刑事责任与所有行政责任绝对不能并存，不同种类有各自适用及不重复处罚规则。应核题是否原文辨识，不能用互斥论强解释判错。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "501": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "从业人员享有安全保障，同时要遵规、正确使用防护并报告隐患，权利与义务共同构成安全法律关系，故A。强调个人义务不免除单位保障，强调保障权也不意味可拒绝一切合理操作要求。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "502": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在“一概无权监督检查”。基层政府及派出机构可依法按职责监督、协助有关部门履行安全职责，原库B。具体执法处罚权限仍需授权和法律依据，不能因可检查就推定有所有行政强制权。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "503": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错误是把主体责任转给受托服务机构。购买技术、管理服务可以补能力，不能转移生产经营单位保证安全的责任，故B。机构对自己服务质量仍负责，与单位对生产组织全面负责可同时成立。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "504": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在法定考核可以收费，且不能把所有生产经营单位不加区分套入同一主管部门强制考核程序，原库B。具备相应知识能力是基础要求，哪些行业人员须由部门考核及费用规则还需依法区分，内部培训与行政考核不同。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "505": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "最后把“未经培训合格不得上岗”倒成了“经培训合格不得上岗”，是明显条件反转，故B。前面列的知识、规程、技能、应急和权利义务均是合理培训内容，不能被这些正确前提掩盖最后一句的否定错误。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "506": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "危化品生产涉及燃烧、爆炸和毒害等高后果风险，建设期先做安全评价及安全设施设计，可在设备工艺定型前控制风险，故A。投产后再补一份报告不能替代事前安全设计，具体审查程序按项目适用规定执行。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "507": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "重大责任事故罪并非只限持证干部或正式职工，无证作业、包工头等实际参与生产作业并符合构成条件者也可成为主体，原库A。一般主体不等于任何路过者都犯罪，仍需责任行为、后果及因果等要件。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "508": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错误是把受侵害的生产安全称为“主体”。主体是实施犯罪并可承担责任的人，客体才是受保护又被侵害的社会关系，故B。题中后半描述指向生产安全这一客体，法律术语不能因内容相关就互换。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "509": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n原库B，但题干列举建设、设计、施工、监理及责任人员，究竟错在单位/自然人主体分类、遗漏要件还是“仅限”范围，现有教材依据不明。工程重大安全事故罪相关主体有专门限定，不能凭答案擅增勘察等单位或断言所有列举主体均不适用，待核原定义。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "510": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错误在排除生产性辅助设施。职业安全卫生不仅包括直接防事故装置，还涉及劳动卫生和必要辅助条件，更衣、卫生和饮水等可与健康保护直接相关，故B。辅助并不等于可有可无，具体配置仍应匹配职业暴露和工作条件。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "511": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "违章指挥、强令冒险会把人员置于不当危险，拒绝这种要求是依法行使安全权利，而不是拒绝一切劳动安排，故A。劳动合同不能让员工预先放弃生命健康保护，单位也不能以不服从为由当然处罚。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "512": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错误是资料失实致损仍不能索赔。建设方对其应提供资料的真实性、准确性和完整性承担相应责任，若其违约等造成可证明损失，施工方可依法主张，故B。是否赔及赔多少仍要看合同义务、过错、因果和损失证据，不是资料一错就无限赔。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "513": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "描述“安全设施或条件不合规定”指向重大劳动安全事故等构成，不能直接替作工程重大安全事故罪定义；后者着重工程相关单位违反规定、降低工程质量标准并造成严重后果，原库B。名称相近不能混，主体和行为要件要逐一对应。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "514": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在排除临时聘用人员。只要在单位实际从事生产经营工作，就不能因合同期限、用工名义而剥夺其培训、防护等保障，故B。统计从业者不能只数正式编制；管理技术人员也在安全责任体系中。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "515": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "《安全生产法》针对生产经营安全确立综合性制度和各方职责，原教材因此称其为第一部全面规范安全生产的专门法律，A。这里是法律发展史与调整范围评价，不是说此前没有任何行业安全法规。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "516": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "非高危行业并非完全不需要安全管理，只是可按人数及适用条件设置机构、配人员，故A。不能把高风险行业更严格配置误解为其他单位零配置；具体数量和专兼职要求按相应时期规定核定。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "517": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "养护作业为完成道路维修可能需采用不同于普通通行的路线方向，原题以不影响过往通行等条件赋予特定例外，判A。例外不免除设置警示、交通组织和避让义务，也不是作业车在任何路段可逆行抢道的许可。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "518": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在说“没有备案”。重大危险源需要登记建档并按规定向有关部门备案，便于监管与应急掌握高后果风险，故B。企业自行保存台账不当然等于完成外部备案，备案也不能替代日常监控。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "519": {"status": "explained", "source": "原有精选精讲", "text": "公路养护人员进行养护作业时应穿着统一的安全标志服，便于车辆驾驶人识别、减速避让，故正确。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "520": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "原事故分类及相应报告调查规则的制定权限在国务院等法律规定层级，不能把“事故类型划分标准”全交给原安全监管总局自行决定，故B。行业监管机构可依授权细化技术管理，但不能随意改法定事故等级门槛。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "521": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n题干引号和句式混乱，“一时不达标限制规模、预期不达标限期治理”未说明适用时期及准确出处。限产、治理和不得超标排放的关系不能按这串旧引文任意推导；原库B保留，须先核完整来源，不凭空替换为某条现行环保法原文。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "522": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "工人在一线可最先发现设备、工序或环境危险，报告义务覆盖从业人员而不只安全员，故A。报告不是要求个人擅自修复一切隐患；无能力安全处理时应报告并采取相应避险，不把发现者变为唯一治理责任人。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "523": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "环境法同时关注污染防治、公众健康、生态与可持续发展，题中各目标互相联系，原库A。不能把环保只理解为清扫垃圾或企业末端治污，它还约束开发建设对生态和长期资源条件的影响。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "524": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "资源循环和节约减少源头压力，经济技术政策把环境目标纳入发展决策，体现发展与保护协调，故A。协调不等于可先无条件污染再等富裕后治理，也不是要求所有生产活动一律停止。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "525": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错误是漏掉“保护优先”。原题库列的原则还包括保护优先，与预防、综合治理、公众参与、损害担责组成完整表述，故B。现有四项方向并非错，而是原文完整性不足，需识别这种漏项型判断题。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "526": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n主要负责人全面负责是合理原则，但把安全总监与董事长总经理一概并列为主要负责人不够准确。是否实际行使全面组织管理职权比职务名更关键，专职分管安全不自动成为全单位最高负责人；原库A需核当时行业定义和限定。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "527": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "共同区域的施工活动会彼此引入风险，安全协议明确各方职责、接口及防范措施，可避免交叉作业无人管，故A。签约不能代替现场统一协调和落实，也不能在协议中免除本方法定责任。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "528": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在将法定义务写成可根据情况选择。单位应依法参加工伤保险缴费，不能以项目小、预算紧或工人不愿参保免除，故B。与可另行投保的商业险区分，参保仍不替代工程防护措施。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "529": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "该目的同时包含事故预防、生命财产保障和持续健康发展，三者并非单纯追求少罚款或不影响工期，原库A。强调经济发展不意味允许以重大事故风险换进度，安全制度正是让生产可持续的基础。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "530": {"status": "explained", "source": "原有精选精讲", "text": "2014 年修订后的《安全生产法》第三条即为此表述：以人为本、坚持安全发展，强化和落实生产经营单位主体责任，故判断正确。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "531": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错误词是“技术指导”。工会在这项规定中的法定定位是依法监督安全生产，技术设计审查和专业指导是不同职责，故B。工会可以提出改进建议，但不能因此把监督职能改称行政技术管理。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "532": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在建筑施工须超过200人才配置。建筑施工本身是应强化专门安全管理的行业，不能套用一般单位的人数门槛来免设机构或专职人员，故B。小项目人员少仍存在高后果风险，具体配备数应按工程和制度确认。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "533": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "被派遣者在同一设备工序上面对同类风险，统一管理和岗位规程技能培训能防用工形式造成保障空档，因此A。用工单位不能说派遣合同不在自己手里就不负责岗位交底和安全监督。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "534": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "重大隐患通常涉及较高后果、跨环节资源，督办制度用于追踪治理责任和进度，促使单位真正消除而非长期挂账，故A。政府督办不替企业整改，企业也不能等被挂牌后才治理自行发现的重大问题。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "535": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "合同安全职责不清和缺少统一协调会让交叉风险无人负责，限期改正、逾期停整是促履责的原制度路径，故A。本句不意味着列举完所有可适用处罚；即使另有罚款，仍需纠正实质管理缺陷。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "536": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错误在“适当免除”。法定事故伤亡责任不能通过与员工订协议打折排除，故B。员工签字、加发风险津贴等不能自动使免责条款有效；合法责任分担与剥夺法定保护须区分。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "537": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错误的强制执行主体是“监理”。监理负责合同及法定工程监督，不具有法院强制执行民事赔偿的权力，故B。权利人需依适用程序申请司法等有权机关处理，负责人逃匿也不能让监理自行扣人扣财替代执行。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "538": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "违法安全义务可能引发行政处理，达到犯罪条件还可追究刑责，题干列的改正、停整和罚款都是行政管理后果，原库A。此句的“有”不应读作“只有”，对受害者的民事赔偿也可能存在；行政、刑事和民事责任需分层判断。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "539": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在把通常法定刑笼统写成十年以下。重大责任事故罪有按后果和情节区分的刑罚档次，不能自创一个统一十年区间，故B。犯罪成立与否还要看行为、责任、严重后果等要件，不是发生事故即一律判刑。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "540": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错误是将重大责任事故罪限定为“直接主管和直接责任人员”这种特定身份主体。原教材将其归一般主体，可涉及实际从事相关生产作业者，故B。一般主体仍要有相应责任行为和因果联系，并非人人对任何事故承担刑责。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "541": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "书面合同用于明确双方劳动条件和权利义务，用工超过法定宽限期仍未签，原题规定以双倍工资督促书面化，故A。一个月至未满一年是本题限定区间，不能由此外推为所有未签情形无限期双倍，实际争议还需核事实及适用规则。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "542": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "桥隧附近挖采、弃土可能削弱基础或改变地形排水，设保护范围及停止违法、罚款用于维护结构安全，原库A。200m、100m、3万元均为旧题所引值，不据此允许在界外不经许可任意挖掘，现场须核路产保护与相关手续。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "543": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "法律责任要有相应法律关系与责任依据，不能对没有义务联系的对象任意追责，原库A。这里不是用“没签合同”排除法定义务主体，主体可能因实际组织、用工、发包等事实产生，不由自己声明决定。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "544": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "故意是明知并追求或放任相应结果，过失涉及应预见未预见或轻信可避免等心理状态，二者统称主观过错，故A。主观过错与损害结果是不同要件，不能只见结果严重就不查行为人当时的认识和注意义务。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "545": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错误在仍需“事先告知”。违章指挥强令冒险直接危及人身时，法定立即解除保护不能被提前通知程序架空，故B。应区分一般辞职通知期和紧急危险下的特殊解除权，不能强迫劳动者等程序走完继续冒险。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "546": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "工程重大安全事故侵害的不只是单个合同利益，还包括不特定人员生命财产的公共安全及工程安全管理秩序，原库A。客体不是实施犯罪的单位或人员，也不是某一块受损材料本身，要与主体和犯罪对象区分。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "547": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "设计决定受力、材料和施工约束，遵法律与强制标准可在源头防止不合理设计埋下事故条件，故A。施工方按图施工不表示设计方永远免责，设计方也不能拿建设方想省钱要求作为违反强标的理由。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "548": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "人员配置涉及建设行业特点及相关部门职责，由建设行政主管部门会同其他有关部门制定统一办法，原库A。具体项目不能因本公司财务预算就自行降到办法以下，制定办法与现场落实配备是不同层次工作。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "549": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在装配式活动房需有“安全许可证”这一证件名称。原题要求对应的是产品合格等质量证明与实际安全使用条件，不能将企业安全生产许可证或其他许可张冠李戴，故B。有证据材料也不替代安装基础、连接和防风防火检查。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "550": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错误在登记期限15日。原题库采用验收合格后30日内办理使用登记的口径，故B；不能将此期限与其他备案报送15日混用。具体设备类别、当前主管和时限应按适用规定核定，登记不替代验收合格。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "551": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错误是把安全“三类人员”考核主体写成劳动行政主管部门。原建设安全管理制度由建设行政或依法负责相关行业的有关主管部门实施相应考核，故B。劳动保障管理与行业安全任职考核职责不能只因都涉及劳动者而混同。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "552": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在“不得委托”。有权主管部门可依法委托建设工程安全监督机构具体实施现场监督检查，故B。具体实施不等于把法定职责完全转移，也不能再由没有条件的任意个人代行，委托范围和程序需合法。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "553": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错误在举报主体“只有涉事者”。事故报告调查违法会影响公共安全和公正处理，任何单位个人均可依法举报，故B。未亲历者可提供真实线索，但不得捏造；受理部门应按权限及时处理。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "554": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错误是道路交通、火灾事故补报窗口写成15日。原条例题对这两类采用发生后7日内伤亡变化及时补报的特殊口径，故B。补报时限与初报时限、一般事故后续变化期限不是同一概念，具体仍须核行为时制度。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "555": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "原组成列举方向可理解，错在检察院“可以邀请”。旧题库所引程序用的是应当邀请，不能把规定参与监督的程序变成任意选项，故B。这里按历史程序措辞解释，不把旧部门机构名称直接当现行调查组配置。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "556": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错误是拘留由安全监管部门决定。限制人身自由的行政拘留有专门法定决定机关，通常由公安依法作出，监管部门不能因负责事故执法就当然拥有拘留权限，故B。罚款、责令整改等权限与拘留权须分别判断。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "557": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在单位所在地政府“不必参加”。发生地负责组织不等于其他有联系地区完全退出，单位所在地按规定参与可提供管理、人员等信息，原库B。调查牵头权与协助参与义务不能混为唯一一方包办。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "558": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错误是工亡补助金乘数写30倍。原题所用全国上年城镇居民人均可支配收入计算口径采用20倍，故B。一次性工亡补助金与丧葬补助、供养亲属抚恤等是不同项目，不能用一个倍数当工亡全部赔偿总额。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "559": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在把事故发生单位人员列为通常调查组成员。调查应保持专业和相对独立，对被调查方有直接利害关系者不宜担任成员，原库B。单位仍需如实提供资料、接受询问，配合调查不是自己作为正式调查者评定自身责任。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "560": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "建筑活动管理不仅为交易秩序，还为了工程质量、安全及行业健康发展，这几项目标互为支撑，原库A。不能因双方合同已签或业主认可，就排除公法对工程质量安全的最低约束。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "561": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "资质准入避免工程交给能力不匹配者，禁止肢解发包防止规避整体管理和责任，违法者改正并受罚，故A。把一个整体工程拆成许多小合同并不能当然绕过资质或总承包组织要求。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "562": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "施工违法后果可按行为情节涉及改正、罚款、停业和资质管理，致损可赔偿，构罪则刑责，原库A。题干是在列可能类型，不是说任何轻微违规都同时适用全部后果，没收所得也要有法定依据。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "563": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在排除“过于自信”。过失既可能未尽注意而未预见，也可能已预见却轻信能避免，原题采用的事故罪过失两者均可能，故B。故意违章不必等于故意希望事故结果发生，行为与结果的心理关系应区分。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "564": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "这段“安全设施或者条件不合规定”的表述与重大劳动安全事故的构成更接近，不能直接用作重大责任事故罪的完整定义，原库B。重大责任事故侧重生产作业违反安全管理规定，罪名近似但行为和责任主体不能互换。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "565": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "题干按原刑法口径将严重设施条件缺陷致事故与相应责任人员及情节分档关联，原库A。三年以下、三至七年是本题历史表述，不是对任何缺陷自动判刑；还要有严重后果、责任及因果，处罚适用应核行为时法律。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "566": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "本题关键是有报告职责者不报或谎报、影响抢救并达到严重情节，并非一般迟到几分钟就自动构罪，原库A。事故已经发生后仍有独立的如实报告义务，不能用“不是我造成事故”免除报告环节责任。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "567": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在“最高要求”。管理规范提供应遵守的基本/底线要求，企业可根据风险提高管理水平，不能达到规范就认为安全投入无需再提升，故B。规范不是竞争排名的上限，也不能以本企业水平较低为由低于强制条件。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "568": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "纵向到底防管理层级断档，横向到边防部门接口遗漏，合理分工和衔接让每项安全工作有人负责且能协同，故A。不是把每件事都分给安全部门，生产、技术、设备等岗位要对本职中的安全负责。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "569": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在“不能委托”。自身不具培训条件者可按要求委托有条件/相应资质机构补足能力，原库B。委托不免除单位对内容适岗、人员参加和培训效果的责任，不能买一张证明代替实际学习。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "570": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "管理者对所管业务也承担其安全管理，业务推进与安全条件应同步考虑，故A。安全不是另一个部门独立包办的附属任务，生产主管不能一面安排进度一面把由此引入的风险全交安全员承担。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "571": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "许可管理按规定层级实施，原题把建筑施工企业许可颁发管理放在省级建设主管部门并接受国家指导监督，A。行业和时期可能有具体权限调整，不能用本句推定所有类型许可证都由同一部门发放。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "572": {"status": "explained", "source": "原有精选精讲", "text": "条例规定颁发管理机关应自收到申请之日起 45 日内审查完毕，符合条件即颁发安全生产许可证，故正确。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "573": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "档案保留许可审核依据，公开许可情况便于社会和交易相对方核实企业安全准入，故A。公布获证不代表企业永久具备条件，后续动态监督、到期及变更信息仍重要，不能只看曾经公示就免审。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "574": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "许可建立在持续具备安全条件的基础上，获证后条件丧失需按规定暂扣或吊销，故A。监管不是发证即结束，企业也不能以证还没到期为由继续在严重不安全条件下生产。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "575": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "本题讲的是监督许可机关及工作人员是否依法履职，防止违法发证、怠于监管等问题，按原监察制度判A。但《行政监察法》及相关机关体系属于历史表述，不能把这道旧题直接当现行监察体制和程序的依据。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "576": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错误是“三名以上”。原特种设备监督检查采用至少两名持有效执法证人员的程序口径，故B。人数和出示证件都用于保证执法规范，更多人员可参与但不能把最低人数随意改成三名才合法。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "577": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在需要变更登记时还说“可以”。达到规定变更条件就应依法办理，不能由使用单位选择办不办，故B。改造修理后继续使用也要满足相应检验与安全确认，登记手续不是对实际设备状态的替代。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "578": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "职业病制度直接关系劳动者健康，听取工会意见使劳动者利益代表参与规则形成，故A。企业可组织技术论证，但不能以技术问题为由完全排除工会监督和意见；听取也不是让任何意见都无需论证直接采纳。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "579": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "职业卫生标准涉及接触限值、诊断防治等专业健康要求，原题由国家卫生行政部门组织制定公布，故A。不能由单个企业自行提高允许暴露限值以适应现有生产；具体部门职能及标准版本须按当期核对。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "580": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "源头减少危害比事后发补助更可靠，遵职业卫生标准并落实工艺、密闭、通风等预防措施，是保护健康的基础，故A。只安排体检或发口罩不等于已控制源头，也不能以职工已签知情同意替代防治。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "581": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "如实申报职业危害让监管掌握暴露源并组织监督，不能等职工诊断患病才承认存在危害，原库A。向原安监部门申报是题中历史职能分工，现行申报主管、程序需另核，不据此指导今天向旧机构办事。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "582": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "本题是旧制度下职业病危害分类管理办法的制定权限，按当时安全监管部门分工判A。分类有助按风险程度配置评价和控制，不能用低风险名称规避实际存在的职业危害；部门职能变化不在此题中已核验。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "583": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "职业病损伤可能长期累积，持续资金用于工程控制、检测和健康管理，挤占会使防护失效，故A。缺钱不是免除法定义务的理由，也不能出事后只说预算由财务控制而完全推卸单位责任。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "584": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "检查机构需要相应医学技术能力，原题采用省级以上卫生部门批准的历史准入口径，故A。不能由不具备条件的普通体检单位随意替代职业健康检查；具体今天是审批还是备案及机构条件，应另按现行制度核定。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "585": {"status": "explained", "source": "原有精选精讲", "text": "依法批准开工报告的建设工程，建设单位应自开工报告批准之日起 15 日内将保证安全施工的措施报送备案，故正确。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "586": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "重大事故影响大，按旧报告层级要逐级上报到国家有关部门，题干A。层级终点不是事故发生单位自己首报必须直接跳到中央，初报、逐级报送与调查组织是不同流程，勿混用。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "587": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "环境、核及国防科研等事故有专门报告调查制度，原条例对其作特别范围安排，所以A。不是这些事故可以不报不查，而是应走相应专门法律程序，不能把不适用某条例理解为无任何监管。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "588": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "负责人获报后若只等待调查而不抢救，会使后果扩大；启动预案或采取有效措施组织抢救体现先控制损害，故A。抢救仍需防次生事故、专业防护，不能强令无装备人员进入有毒或坍塌危险区盲目施救。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "589": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "安全第一确立价值顺序，预防为主把关口前移，综合治理要求多种措施协同，原题把三者用于公路水运安全监管，A。并不是只在监管检查当天执行，建设各方日常组织也应落实。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "590": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "统一监管保证同类工程基本尺度一致，分级负责使国家地方及各管理层按权限落实任务，原库A。统一不是所有事项都报最高层审批，分级也不是层层推诿，职责边界和接口需清楚。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "591": {"status": "explained", "source": "原有精选精讲", "text": "安全费用列入工程造价，竞标时不得删减，列入标外管理，由建设单位在编制招标文件时确定所需费用，故正确。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "592": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "本题按原公路水运“三类人员”管理口径，将经授权组织项目施工管理的经理、副经理、总工纳入项目负责人范围，原库A。该考核范围不应与任何民刑责任案件中谁“全面负责”的事实判断简单等同，具体责任仍看职权和行为。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "593": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "招标阶段就明确安全费用，可避免报价竞争时把必要安全措施挤掉，并为合同支付和实施提供依据，故A。写了金额还需匹配风险、按实际制度投入，不能只在招标文件里列一行而施工时不兑现。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "594": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "勘察掌握地质、水文和灾害条件，对可能引发隐患提出防治建议有助设计施工避险，故A。勘察不能只提交钻孔数据而隐瞒已知不利情况，施工发现新地质异常也应及时反馈，不以已有报告为由忽视变化。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "595": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "供应方提供的是实际进入现场的安全能力，保险限位齐全有效和清楚说明可避免从源头带入缺陷，故A。合格证明不能替代设备实物功能，使用单位也仍需进场验收、维护及按说明操作。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "596": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "信用档案记录从业单位的检查和处理信息，为持续监管、社会评价和准入提供可追溯依据，原库A。记录应真实及时，不应把尚未核实的举报当既定违法，也不能只录获奖不录处罚以粉饰状态。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "597": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "复杂或高危险工程可借专业机构能力进行评价监测，弥补监管技术资源限制，原题A。委托须有相应条件，机构对技术结果负责，监管部门的法定职责不因委托而消失，企业主体责任也不转给监测方。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "598": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "安全生产条件是依法开展建设活动的底线，不应由合同、赶工或个人决定降低，故A。建设、分包、监理等各方各有适用条件，谁提出降低都不能当然使之合法，市场报价不能冲掉强制要求。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "599": {"status": "explained", "source": "原有精选精讲", "text": "各类工程提取标准并不统一：矿山 2.5%，房建、水利水电、电力、铁路、城市轨道交通 2.0%，公路与港口航道 1.5%，故「均为 2.0%」错误。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "600": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "明确提取基数、审批用途、责任权限和核算程序，可以保障资金按风险持续投入且可审计，故A。只设一个安全费科目但不实际提取使用不够，报销票据齐也不说明支出一定属于允许范围。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "601": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在允许其他单位部门随意收取、代管、集中使用。企业安全费应保障本企业安全条件，外部集中拿走会导致责任和资金脱节，原库B。依法监督账目不等于取得对企业资金任意支配权。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "602": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "财政、安全监管及行业主管部门依各自职责检查计提、用途和管理，可防少提、挪用和虚列，原库A。不同部门监督有分工，不能理解为企业在每笔普通合规报销前都需所有部门逐一批准。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "603": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错误是把按管理权限报送的备案等程序写成“审批”。企业年度计划与往年使用信息用于监督，不能据此把所有安全费支出权转给外部部门，故原库B。内部预算审批仍需执行，但与向监管报备是不同流程。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "604": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n同一题拼了“安全费用会计处理”与“城市施工封闭围挡”两道判断，且选项A正确B错误C错误，原答案AB为多选。第一句“各地企业会计制度”亦需对照统一会计要求，第二句应单独判断；不能把AB当作当前单题有效答案。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "605": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "作业者直接面对条件和程序中的风险，可批评、检举、控告并拒绝违章强令，题干A。权利保护不等于可捏造事实或拒绝所有正常作业，单位也不能把真实提出隐患当不服从管理而报复。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "606": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "安全措施法定审查属于主管部门履职，原制度不得向被审单位收取这项审查费，故A。它与企业依法购买具体设计、检测等专业服务的费用不同，不能把行政职能包装成服务后另收费。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "607": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错误在受理主体范围只限省级以上，以及用“可以”弱化法定处理义务。基层有权部门同样应按职责及时受理安全事故隐患线索，原库B。不能让投诉者层层上访到省里才开始处理。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "608": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "原条例这项现场防扩、保护与移物留痕责任的直接表述针对施工单位，题干改为监理单位，属主体错置，原库B。但不意味着监理可以袖手旁观，其发现报告、制止等相应义务仍需履行；两类职责不互相替代。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "609": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在目录由“各地”分别制定。特种设备目录需国家统一确定并按法定程序批准，避免同类设备在不同地方监管身份随意变动，故B。地方依目录实施监管不能等同自己任意增删国家目录。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "610": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错误在等政府审批才召回。生产原因导致同一性安全缺陷时，生产单位应依法主动停止并履行召回责任，不能以未拿到批准为由拖延，原库B。主管部门依法监督或责令与企业主动召回义务是互补关系。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "611": {"status": "explained", "source": "原有精选精讲", "text": "较大事故为造成 3 人以上 10 人以下死亡，或 10 人以上 50 人以下重伤，或 1000 万元以上 5000 万元以下直接经济损失；题干把起点写成 5 人，故错误。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "612": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "原法规定的依法参与事故调查并提出意见的组织主体是工会，题干改为“职工”，原库按主体名称判B。职工仍可报告、作证和依法提出线索，但这与以工会组织身份参与调查的制度职责不同。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "613": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错误在把重大事故上报终点止于省级。按本题旧制度要继续逐级报至国务院有关部门，故B。达到省级不表示无需再报，事故单位初报对象也不是因终点在中央就必须自己逐级跑完。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "614": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在“不必同时报本级政府”。监管部门向上级部门报送事故时仍需让本级政府掌握情况、组织属地资源，故B。纵向业务报告与横向政府报告各有作用，不能二选一。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "615": {"status": "explained", "source": "原有精选精讲", "text": "安全生产监督管理部门逐级上报事故情况，每级上报时间不得超过 2 小时，不是 24 小时；单位负责人接报后 1 小时内上报。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "616": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错误是“所有事故30日”。原制度对道路交通、火灾伤亡变化有特别补报窗口，不能把普通事故口径无条件推广，故B。先辨事故类型再看时限，补报也不意味着初报可等窗口结束才提交。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "617": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "救人、防扩大和疏通交通可能必须改变现场，标志、简图、书面记录和物证保存可在救援与后续查因之间尽量兼顾，故A。不得以保护现场为由拒绝必要救人，也不能借救援无理由破坏重要证据。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "618": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "本题限定没有人员伤亡且属一般事故，原制度允许县级政府在规定条件下委托事故单位调查，故A。是政府依法作出委托，不是企业看损失不大就自行决定不报；存在伤亡或更高等级不能据此照搬。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "619": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "同时报本级政府可形成属地统筹，按部门层级上报可形成专业监管信息链，两者都需落实，故A。不能认为上级部门会转告本级政府而省掉本环节报告，信息时效直接影响救援协调。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "620": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "调查需专业知识识别技术与管理原因，也需避免直接利益关系造成偏袒，两个要求共同保证质量和公正，故A。和单位熟悉不必然不能提供证据，但有直接利害者不能因此作为独立调查成员给自己定责。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "621": {"status": "explained", "source": "原有精选精讲", "text": "《生产安全事故报告和调查处理条例》：调查报告应自事故发生之日起 60 日内提交；特殊情况经批准可延长，延长期限最长不超过 60 日。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "622": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "由负责调查的政府或授权主体统一公布，可确保事实与处理结论准确、可追责，同时保护依法保密信息，故A。统一发布不等于隐瞒应公开内容，参与人员也不能擅自传播未核实的责任结论。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "623": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "紧急时正常内部逐级报告可能延误救援，允许现场有关人员直接向事发地有权部门报告，故A。直接报告用于提高时效，不是鼓励虚报或只发朋友圈；应尽可能提供准确地点、危险及已知伤亡。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "624": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "监理审查施工安全措施、专项方案是否符合强制标准，是对开工和危险作业的重要外部把关，故A。审查通过不免除施工方编制和实施责任，监理也不能仅凭方案上已有技术负责人签字就放弃实质审查。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "625": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "总承包统筹现场工序、各队伍接口和资源，有责任组织统一安全管理并对现场负总责，故A。分包各自仍有安全义务，负总责不等于分包任何失职都无需承担自身责任。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "626": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在分包不服从导致事故仍一概让总包负主要责任。原题口径此种原因下分包应承担主要责任，总包总责及相应失职另行判断，故B。不能把总责、连带责任、主要过错责任三个不同概念混用。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "627": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "通常施工合同关系在施工与建设单位之间，监理按授权发指令，施工方不能一概绕过合同相对方向监理直接索赔，原库B。应按合同程序向有义务主体主张，再处理建设与监理内部责任，特殊侵权等情形另论。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "628": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "原事故调查按等级配置政府层级，较大通常由设区市政府组织或依法授权委托有关部门，故A。主管部门可具体承办不等于该部门随意替政府决定层级，报告终点也不等于调查牵头层级。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "629": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "安全费需可追踪申请、审批、支出和验收，内控制度明确权限、外部监督防挪用，题干A。接受监督不意味着其他部门可把钱直接集中取走，也不能以内部批准替代专款用途限制。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "630": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n后半保险费直接列成本、不挤安全费体现不同费用渠道，但前半对所有列举高危人员一概“应当办理团体/个人意外险”，与同库18、69所强调“鼓励商业意外险”存在适用范围差异。需核当时费用办法是否另有特定强制规定，不能泛化为所有行业现行义务。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "631": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "该定义强调按规定计提、成本列支、专门改善安全条件三个特征，区别于随意福利金或事后罚款准备，故A。安全有关的所有开销并不都自动属于这笔专门费用，具体列支范围仍应按适用办法核定。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "632": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "工程安全由建设、勘察、设计、监理、施工及相关检测评价共同影响，从业单位范围不只现场施工企业，原库A。纳入范围不代表每方责任完全相同，应按各自工作内容和法律义务分工承担。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "633": {"status": "explained", "source": "原有精选精讲", "text": "架桥机、滑模爬模等自升式架设设施使用前，应由施工总承包、分包、出租、安装单位共同验收，监理单位不是验收主体。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "634": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "监理发现隐患应推动整改，严重到不能安全继续时运用暂停等措施并报告，可阻断风险扩大，原库A。何时必须停、向谁报告需按具体严重程度和施工方配合情况执行，不能只发整改通知后长期不跟踪。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "635": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错误是所有专项方案都专家论证。编制是危大工程基础要求，专家论证则按规定规模条件适用，故B。未达到论证条件也要有相应审核批准，不能把“无需论证”变成“无需方案”。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "636": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "本题引用的是建设工程安全管理条例的历史方针表述，按其题面“安全第一、预防为主”判A；同库879按安全生产法/较新综合表述则要求加“综合治理”。要核文件和版本，不能把两个来源不同的原文判断直接当同一句互相推翻。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "637": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "新技术和科学管理可通过减少危险暴露、提高监测和控制能力改善安全，因此国家鼓励研究推广，原库A。先进不等于未经验证就可现场试用，应满足标准、验证和变更管理，不能以创新为由省掉安全论证。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "638": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "施工方掌握现场人员设备，应先防扩大并保护证据；因救援必须移动时留痕便于还原事故过程，故A。不要把“保护现场”误为拒绝救人，也不能借抢险随意清场丢弃关键构件。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "639": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "建设方可能通过采购指定影响现场条件，禁止其明示暗示使用不合格安全设施，可防止成本压力从源头破坏施工保护，故A。即使业主指定，施工方也不能以服从甲方为由明知不合格仍使用。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "640": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "设计的特殊结构、受力转换和危险部位需要让施工者明确，注记并给防范指导可减少误解设计意图造成事故，故A。设计指导不替代施工方根据具体工艺编制安全措施，双方职责应衔接而非互相推给对方。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "641": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "施工前技术交底把方案和危险控制具体传到班组个人，详细说明、双方签认便于确认接收和追溯，故A。签字不是代替解释，班组换人、工艺改变还需相应补充，不能一张全年通用表覆盖所有作业。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "642": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "开挖、振动、吊装等可能损害邻近建筑和地下管线，专项防护针对这些外部受体，故A。施工边界不等于风险边界，不能认为物在围挡外就无需调查、监测和保护。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "643": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "特种设备从设计制造到经营使用均可能形成危险，分类与全过程监管便于按设备特性设置控制，A。监管连续不意味着取代生产使用单位自检保养，设备取得一次检验报告不能永久免除后续检查。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "644": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "新技术与既有安全规范不一致时，需要专业评审说明等效或更好安全性，再按规定批准，避免以新为名突破底线，原库A。专业机构意见不是自行投产许可，批准程序也不能由厂家内部会议替代。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "645": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "安装改造修理会改变设备安全状态，事先书面告知有权地方部门便于安排监督检查，原库A。告知不等于审批部门已经确认工程合格，完工后仍需履行适用检验、验收及资料管理要求。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "646": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "管理、检测、操作各自影响设备安全，按规定具备相应资格是能力准入，故A。资格范围与设备、岗位相匹配，持一种证不能自动做所有工作，现行许可/考核项目变动应另核。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "647": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "设计与合格证明说明产品依据，使用维护说明指导全生命周期，监督检验证明和铭牌警示支持验收与识别，故A。资料随附不等于设备实物状态合格，接收方还应核对一致性并按要求检查。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "648": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在技术资料移交对象写为县级以上政府部门。竣工后相关资料应按规定移交使用单位，供其安全管理维护和追溯，原库B。监管需要的报送/登记与设备使用档案移交是两条不同事项，不能只向部门交件而让使用者无资料。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "649": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "前半不得提不合法要求正确，后半将“不得压缩合同约定工期”替为合同谈判不得压缩招标文件工期，混淆原条文对象和合同形成阶段，原库B。不能由此反推可任意压缩合理工期，实际仍须保障安全条件和依法协商程序。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "650": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "完整案例已写工人缺氧头痛要求通风，却被许诺奖励并以停怠工罚款相逼。拒绝违章指挥和冒险作业受保护，赶工收益不能替代通风生命保障，原判断正确。题引条号是旧版定位，未核验现行编号，不能照旧号宣称现行依据。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "651": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n完整案例确有缺氧未通风、强迫赶工的违法风险，安全员发现隐患应报告、违章应制止的职责原则无误。但原文未交代该专职安全员是否知情、报告或制止，题目直接认定其个人违反规定证据不足；原A保留而个人履责事实待核。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "652": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "事件二原文6人昏倒、4人最终死亡，按死亡3至不足10人档判B较大事故。A一般档被4人突破，C/D更高档无对应证据；不能仅因隧道工程危险大就升档，也不能把2名救活者从已死亡4人中再扣减。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "653": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "B单位负责人接报后1小时内向规定属地部门报告；A立即是现场人员向负责人报告的层次要求，不替换本题明确时限。C/D拖延过久，先与家属私了也不能暂停计时。完整案例公司接报2小时后才报超出本题旧制要求。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "654": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "案例显示材料不符要求、工序失当、质量及各方管理缺陷共同导致桥塌，不是不可避免自然事件，故原库将其认定生产安全责任事故，A。责任事故判断仍需事实调查，不能只因在工地发生就自动认定每个人有同等责任。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "655": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错误是事故负责人首报必须直接省级。一般先按规定向发生地有权县级以上部门等及时报告，再由部门按等级逐级上报，故B。事故严重会影响后续报告终点，但不意味着首报基层程序一律取消，紧急直接报告规则另行适用。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "656": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "完整堤溪桥案例64人死亡，已超过特别重大死亡30人门槛，A。B/C/D较低，即使经济损失3974.7万元落另一档，多个指标应从高认定；不要拿重伤4人较少或仅按经济损失覆盖最高死亡档。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "657": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "D现场知情者立即向本单位负责人报告，保证尽快救援并启动上报链。A一小时是负责人向外报告的另一层时限，B/C延迟更不当。紧急情形依法直接报告不等于可以先等待负责人到场再启动抢救。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "658": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错误是把拆除工程事前报送主体写施工单位。按题库条例口径，这项向建设主管部门报送资料责任在建设单位，故B。施工单位仍要具备相应资格并落实方案，不因报送主体不是自己就可在缺图纸、无方案下开拆。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "659": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错误在施工人员/队伍“不需要相应资质”。拆除是危险性较高且专业性强的工作，相关单位和人员应具备各自所需条件，不能让无条件民工队仅为取钢筋款自行作业，原库B。单位资质与个人特种作业资格也不可混成同一张证。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "660": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "B建设单位在旧题要求施工15日前组织备案，是建设活动组织者责任。C施工单位编制实施拆除方案不等于接手建设方报备义务，A设计、D监理也不能替代。备案材料需说明周边风险和废物处置，不能只交一张资质复印件。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "661": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "该拆厂房案例两人死亡，未提供更高损失指标，原题按一般事故由C县级政府负责调查。A省、B市通常对应更高等级，D乡级不是该法定组织层级；可以授权有关部门具体调查不等于部门天然拥有全部事故调查决定权。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "662": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "案例1死及1946万元直接损失，死亡指标不达重大，损失按原分级达较大而仍未达重大，故题干就“尚不构成重大”判A。不能仅凭1死就一律叫一般，应继续核查重伤和损失等其他指标取较高等级。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "663": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "案例直接损失1946万元已达到原较大事故指标，通常应由设区市政府组织，且“政府组织”不同于县区安监部门自行决定，故B。只按1人死亡下结论会漏掉更高的损失指标。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "664": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "违规分包、违规挖堆土放任施工，引起桩基侧向承载失效及死亡，旧题按B重大责任事故罪的生产管理违章链分析。A渎职需相应特定职务要件，C不是此规范罪名，D设施条件罪侧重不同；倒楼不必然等于降低工程质量罪。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "665": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "1946万元在原制度直接经济损失1000万至不足5000万元档，故B较大。A只看死亡1人漏另一指标，C/D金额档更高；多指标以触及最高档判，而不是把死亡档与损失档平均折中。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "666": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n案例说明善后方案实际统一按每人40万元支付，但“实际安排金额”并不自动证明符合2009全国统一法定标准；死亡赔偿还涉及具体制度、地区及项目构成。原库A缺少比较依据，不把一次地方善后安排推广为当年普遍标准。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "667": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错误是把工亡待遇调整起点一概写2015。原教材所涉全国统一计发口径等重要调整在此前2011前后已实施，不能用新安全生产法生效年份代替工伤保险待遇制度时间，故B。具体案例应按事故及适用制度计算，不凭“标准提高了”推固定金额。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "668": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "完整高架桥拆除案9人死亡，处于3至不足10人档，故B较大。A低估、C重大通常死亡10人起、D特别重大更高；16人受伤未载重伤性质也不应自行按重伤升档，其他指标有证据再比较。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "669": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "挂靠无资质承接拆桥、违规拆除管理导致多人死，B重大责任事故罪侧重违反生产安全管理规定。A降低工程质量有另一要件，C渎职并非普通承包者天然身份，D劳动安全设施缺陷也非本案首要定性；仍保留原案条件限制。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "670": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "制动不良让行驶车辆不能有效减速，制动失效后不当操作又直接作用于车辆稳定、导致侧翻，二者位于事故即时失控链上，故A。无牌等准入问题也违法，但不能仅用车辆牌照替代对机械和操作直接因素的分析。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "671": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "制度未落实使资质、设备和现场行为缺少有效约束，属于促成事故的组织管理层间接原因，故A。间接不等于不重要或责任轻，整改不能只换一辆车或处分司机而不补管理屏障。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "672": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\nB“因自杀不再追究责任”把各种责任一概抹除，范围过大。死亡通常终止对本人刑事追诉，但不当然消灭遗产范围内依法承担的民事赔偿，也不免单位与其他责任者义务；C民事不能被笼统排除，原唯一B须核验。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "673": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n题给28844元可算20倍工亡补助为576880元，丧葬补助另依统筹地区相应月平均工资计算，题未给该基数。A约60万仅可能是近似量级，B/C/D较远，但两项合计不能据现有数字精确推出，待补地方工资与适用年度。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "674": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "支架事故6人死亡，按原死亡指标是较大而不是重大，20名伤者还需看重伤构成但现有数量也未达重大重伤门槛，故题干B。事故名称不用“惨重”程度直觉判断，仍按法定指标与已知事实分级。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "675": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "6死已达到原较大事故，通常由设区市政府组织调查，题干交给县级安监部门既错层级也混牵头主体，故B。政府可依法授权委托具体部门承办，但不能在未给委托事实时任意改成县级自行调查。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "676": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "模板支架基础不实、侧向约束弱仍预压，旧题把组织施工管理违章致6人死归B重大责任事故罪。A渎职有专门主体，C名称不规范，D着重法定劳动安全设施条件，不能只因结构倒塌就机械套用；最终罪名仍依法查证。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "677": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "完整支架预压案6人死亡，处死亡3至不足10人区间，B较大；A一般不足以覆盖，C重大、D特别重大无更高指标依据。20人“受伤”未明确全部重伤，不可自行补成更高等级数字，经济损失也须以调查核定。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "678": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n案例明确腿部失血为主且抢救不及时，医生未抢救与死亡可能有关，但把“误诊”唯一称作直接原因，涉及医疗过错、可救治性及多因一果的专业认定，不能仅凭时间先后确定。原库A保留，需完整鉴定和责任分析，不能据此断言医院承担全部死亡责任。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "679": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n施工涵洞未防护直接造成腿骨折和主要出血，称其“疏忽”为间接原因混合了管理过错与物理致伤环节。与678一起存在多主体、多阶段因果，不能简单把最晚未救助叫直接、先前致命伤叫间接；原库A需核原案例分析定义。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "680": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n原案例法医仅给失血过多、抢救不及时，既有施工洞口致主要腿伤，又有李某阻拦和医生未救治。B医院可能承担诊疗过错责任，但据此直接认定其“主要”赔偿而排A施工方、C职务归责、D初始侵害者，缺责任比例和医疗因果证据，待核。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "681": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A护栏等防护隔绝坠落、B警示提醒危险、C巡查发现破损和误入均属施工期间预防。D保存证据更偏事故后举证调查，不是本题同组主动防险义务，故选D；并非发生事故可销毁资料，证据保护仍应依法履行。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "682": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "D监理负责对施工方组织设计中的安全措施、专项方案作符合强标的审查。B施工方负责编制和落实，A设计方负责设计安全，C建设方负责相应组织保障，不能相互替代。审查通过也不表示监理接管了施工单位的实施责任。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "683": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "题目问不正确，D自制特种防护用品缺少规定性能、质量和适配性验证，不能因戴上看似能挡就用。A过期更换、B使用前检查、C失效报废分别控制老化、当次状态和不合格退出，都是必要的管理环节。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "684": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "原旧条例题的特种设备监管职能由国家质检总局及地方质监部门承担，故B。A公安、D原安监并非该题这项专业监管主管，C过于泛称。机构改革后职能和名称已有变化，此答案用于历史题库，不能当现行办事机构索引。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "685": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n题干只给管架变形和可能柴油泄漏，没有整改难度、能否立即排除、是否需停产或外部协同等判定信息，不能唯一确认“一般”A而排除重大C。较大、特大也非该隐患二分目录的规范等级，但排除这两项仍不能补足A/C的事实条件，原题待核。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "686": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "调查报告集中记录事实经过、原因责任、处理建议和防范整改，是调查成果的完整载体，选B。A措施、C教训、D责任分析均是重要组成内容，而非能覆盖整个调查成果的总文件，不要将报告某一章当整项成果。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "687": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A持相应资格、B按规程、C定期教育直接关系能否安全作业。D是证书复审申请的时间程序，不是与前三者同层次的人员能力条件，且“满前30日内”不能替代适用的提前复审期限，原库选D。具体复审提前量须按该证书制度核对，不随意换写数字。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "688": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "综合治理强调技术、管理、教育、法治等多途径配合，同时处理表面问题与根源，C标本兼治最完整。A抓重点、B落实责任、D执法建规各只覆盖一个侧面，不能代表“综合”的总体含义，也不是说这些措施无需实施。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "689": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "B60人重伤落在原重大事故重伤50至不足100人区间。A31死达到特别重大，C9死通常为较大，D200万元未达较大损失门槛。先分别比较各指标再取较高等级，不能只记死亡人数而不会用重伤或损失分级。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "690": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A违背自然规律的错误行为、B违法、C违章通常存在可归责的行为因素。D真正无法预测防范原因在原分类中可属非责任事故，所以选D。不能由事件罕见就推无法预测；是否可归责仍须调查是否已尽合理识别防范义务。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "691": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "从最高负责人到基层岗位是层级纵向，按生产、技术、设备等部门展开是职能横向，顺序对应C纵向、横向。B把二者反了；A生产管理不是这组空间维度，D直接间接是另一种责任分析口径。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "692": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n题干开头缺少“安全生产管理”等限定，A/B选项首空内容也为空白，已不是完整的双空选择题。D安全监督管理、专职可表达原意，但不能据此宣称已恢复原题所有备选项；题干和残缺选项待核，保留原评分。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "693": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "事故调查要由有权政府统筹，并按事故等级落实不同层级职责，故A统一领导、分级负责。C统一监管是相近监管原则措辞，但不等于本题调查组织原则；B/D弱化政府依法组织调查，不能让被调查企业自行决定责任结论。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "694": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "原条例四级由高到低为特别重大、重大、较大、一般，B准确。A混进轻微，C用大小口语替代正式名称，D重复不同伤亡措辞且缺较大一般。正式名称要与具体指标对应，不能按日常“很严重”的感觉命名。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "695": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "违规提用安全费同时涉及安全保障与财务核算，原职责由C安全监管部门会同财政纠正。A公安、B质监、D工商不是这项费用专项监管组合。部门名称属历史口径，职责分工不等于企业可等监管来查才纠正挪用。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "696": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\nA日常检查与C作业场所检查并不互斥，前者描述频率、后者描述对象，B安全大检查也可能发生在事中。原答案唯一C但题干未给具体监督分类框架，无法从概念排除A/B，需核教材“重点”原文，不把近义层次硬分对错。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "697": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "D把采购验收主体写成安全监管部门等，不应把本单位的技术/安全管理验收责任交给外部监管代办，原库问错误选D。A安全标志、B经营条件、C禁假劣属于当时管理要求，具体许可标志制度现今是否保留须另核，不能直接照旧采购清单办。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "698": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "单位最清楚岗位设备和本场所危险，应组织普通从业人员的培训，选A。B/C地方监管、D煤监依法监督或承担特定考核，并非替每家单位包办一般员工培训。可委托合格机构授课，但单位组织保障责任不转移。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "699": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "项目经理统筹项目资源、工序和现场管理，由其担任安全领导小组组长可使安全与项目决策衔接，B。A公司总工不一定驻本项目，C分管副经理、D项目总工分别有分工职责，不能仅因专业管安全或技术就取代项目整体负责人。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "700": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "原特种作业准入最低年龄为成年18周岁，选B。A16未达该门槛，C25无依据提高最低线，D完全不设年龄限制不符。达到18岁只是必要条件之一，还要适岗健康、培训和相应考核资格，并非成年即可独立上岗。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "701": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "施工技术负责人审核后，监理方由C总监理工程师进行规定审查签字，形成施工内部与监理外部把关。A业主代表、B项目经理、D设计代表不能凭一般职务替代这一指定签字主体；专家论证条件另行判断，不能只凑两个签字。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "702": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "技术交底需把方案中的受力、工序、防护和风险要求解释给作业人员，职责对应B项目技术人员。A项目经理统筹、C总工层级与具体项目安排不同、D安全人员监督均不能代替所规定技术交底职责。实际交底还需具体到班组与岗位而非只念文件。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "703": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "教育培训信息应进入D个人档案，便于在转岗、复训及事故追溯时确认其能力经历。A由培训方存、B仅项目存可作辅助记录，但不能代替随人的培训档案；C业主城建档案不是本项人员培训责任归属。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "704": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "职业病往往长期积累且一旦形成难恢复，先预防又对已发现损害及时诊治，B防治结合完整对应。A/D混入其他安全方针用词，C更像管理原则而非本题方针。预防工程控制不能只靠发现患病后发补偿替代。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "705": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "发现隐患后拖延可能让危险继续发展，因此选B立即向能接续处理的人员报告。A一小时、C24小时、D12小时不是允许从业者等待的统一窗口；单位负责人事故外部初报时限也不能套到这里的隐患内部报告。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "706": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "原特种设备条例题对逾期不改无证上岗情形配套停整及最高2万元罚款，选B。A/C/D不是该题所列上限，罚款也不是交钱就允许继续作业。金额仅沿用旧库，不用于确定当前执法裁量。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "707": {"status": "explained", "source": "原有精选精讲", "text": "按题库口径，国家安全生产事故灾难应急预案的应急领导机构为国务院安全生产监督管理部门。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "708": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A单位概况让接报者知道行业性质、主体及风险背景，是初报基础信息。B间接损失难即时估计且非该项基本要求，C领导到场不是必报要件，D影像可补充但不能代替口头或书面准确初报，不应为拍照延误报告。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "709": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "重大隐患治理涉及停产、技术和资金等重要决策，不能只由内部安全部门独自组织制定而主要负责人不统筹，故D错误。A承包监督、B资金保障、C一般隐患单位整改均体现主体责任，安全部门是具体协调监督力量，不是包揽重大整改的一切权责。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "710": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "事前监管发生在准入和投产等之前，B许可证审批用于先确认安全条件。A运行检查、D现场作业监察偏事中，C事故责任追究落实已在事故之后。应按监管发生时点分类，不是凡有预防作用都叫事前。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "711": {"status": "explained", "source": "原有精选精讲", "text": "3 人死亡属较大事故，由事故发生地设区的市级人民政府负责组织调查；重大由省级、特别重大由国务院组织。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "712": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "原特种劳保“三证”目录为B生产许可证、D产品合格证、A安全鉴定证，分别对应生产、产品和安全性能的历史管理要求，故不属于的是C检验合格证。检验文件现实可能有用，但不能代替本题指定目录；现行标志许可制度须另核。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "713": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n原答案D国家机关，但国家机关公务员、机关事业单位工勤或聘用劳动者的保障适用并不完全相同，题干未分人员身份，一概说整个单位“不属范围”易过度。A合资、B有雇工个体、C外资不会因资本形式免参保；D的排除边界需核原时期规则。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "714": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "C把特定单位安全管理人员任免的告知等程序写成主管部门事先批准，混淆监管信息与企业任用权，故问错误选C。A听取意见、B保护履职、D具备知识能力是合理要求，安全管理人员不应只是挂名或以反映隐患招致报复。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "715": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "可安全处理的明显问题应立即处理，自己不能处理则及时报有权负责人组织解决，D形成行动与报告的闭环。A一律先向外部、B/C一律先内部报告会忽略本可立即消除的风险，不能把逐层等指令变成继续暴露的理由。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "716": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "D协议明确职责和措施并指定人员协调，能控制单位间相互引入的风险。A口头提醒、C各自为政缺共同接口，B让监管部门替企业定生产方案也错置主体职责。签协议仍要实际检查落实，不是签完就无事故责任。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "717": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "查清A原因是制定防范措施及认定性质责任的事实基础；B类型、C影响、D损失均需调查，但不能代替为什么发生的因果分析。先找责任人再挑原因会偏离科学实事求是原则，不能只为结案而停留在表面现象。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "718": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A所列降职撤职、罚款拘留属于题目非刑事处置组合；B/C/D混入拘役，拘役是刑罚，不能放进同一行政等责任清单。具体每种后果需有法定主体程序，安全监管部门并不因此拥有决定全部措施的权力。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "719": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "题目指定危险容器、运输工具及相应特殊设备的旧法安全准入凭证为A安全使用证或安全标志。B检验合格不能随意改其法定凭证名称，C/D把警示标志当作许可证明不妥。贴一张警告图不能证明设备已完成必要检测准入。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "720": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "原法在危险物品相关单位中列生产、经营、储存，D完整；A/B/C将运输或使用替换进这组固定列举，不能代替原目录。目录外单位仍可能受其他条款和行业配置要求约束，不是没选运输使用就无需安全管理。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "721": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "通常现场先立即向A本单位负责人报告，便于启动预案、组织抢救并依法外报。B工会不是一般首报对象，C/D是负责人及法定紧急直报等后续渠道，不能与常规内部报告环节混同；紧急可按规定直接报告不等于日常流程取消。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "722": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "“保命钱”强调用于工程措施、设备和人员能力的C安全投入。A意识、D责任重要但不是资金本身，B产出是结果不是保障前提。资金应真正转化为安全条件，账上列预算却不投入不能实现保护。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "723": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "保护设备、通风、培训和应急物资均需资源，B投入是这些条件的物质基础。A建设、C管理、D制度描述活动或规则，不能代替必要资金和实物。反过来也不能认为花钱多就自然安全，投入需匹配风险并验证效果。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "724": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "负责人首先C组织抢救，阻断损害、保护生命；A调查、B防范、D追责都重要但不能挡在即时救援前。抢救还须评估次生风险、专业防护，不能用先救人为由强令他人无条件冒险。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "725": {"status": "explained", "source": "原有精选精讲", "text": "公路施工企业施工任务书及对应的安全技术交底书由总工程师签发，并对其安全性负责。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "726": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "风险概括为C损失的不确定性，损失大小与发生可能性是评价它的常用维度。A直接说确定性相反；B把损失程度和概率都限定必须不确定，范围不如C概括；D又把程度说死。不同教材定义措辞不同，此处按原题基本概念口径。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "727": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "4E对应法规约束、工程技术、教育能力和经济激励投入，B完整。A是系统要素，C是产品过程，D是事件管理阶段，都不是以E命名的四种干预途径。不要因某组也有四项就当成4E，术语首字所指对象不同。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "728": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "题库按征兆发展阶段将变形快速发展、裂缝明显扩大列为B中期，意味着已超过轻微初兆但未必到不可逆临发。A早期低估发展，C/D不能仅凭这两项就断定已进最后失稳阶段。实际发现快速变形仍应立即停工避险，不因叫中期就继续等。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "729": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "按本题三档后果与概率的风险矩阵，中度后果配中等概率落C中度。A/B偏低、D偏高不符此矩阵对应位置。矩阵分档是评价规则，不是物理定律；实际应使用项目选定且经确认的矩阵，不能脱离规则凭词相加。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "730": {"status": "explained", "source": "原有精选精讲", "text": "第一类危险源是系统中存在、可能发生意外释放的危险或有害物质与能量；「失去控制」描述的是第二类危险源的作用结果。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "731": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A责任制将每级每岗的义务和追责落到人，是其他制度得以执行的基础。B组织、C资金、D培训各控制一个重要方面，但都需有人负责落实，不能取代核心责任体系。核心不意味着只写责任书而不配置资源。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "732": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "责任人明确、措施明确还要C资金到位，才能把计划变成实际防护。A人员、B制度、D技术都重要，但不对应本题资金保障“三到位”的最后项；不能用制度已发、方案已批作为不支付必要投入的借口。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "733": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n题干B只剩“知识和方法”缺少前缀，A工伤保险政策法律也与主要负责人履行安全职责有关，原答案A无法单从“不是培训内容”概念唯一排除。若考某份培训目录应给完整名称，现有残缺选项不宜硬称保险法律不必学习。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "734": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n原答案B“法律法规和实际操作”把安全技术理论缩成法律法规，D“安全技术理论和实际操作”才与通常理论、实操两部分考核概念更完整对应。仅学法规不能替代设备工艺和危险处置知识，原键与选项概念有明显疑点，待核原考核大纲。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "735": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "所有从业者都需按岗位风险培训，A。B相似经验不代表熟悉本场所，C不合格应不得上岗并采取补训等处理，不是一律辞退，D档案不能自行选择是否建。教育重点和深度可因岗不同，但覆盖不能因用工名义或经验而免除。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "736": {"status": "explained", "source": "原有精选精讲", "text": "施工安全「三宝」指安全帽、安全带、安全网，安全手册属于管理资料而非防护用品。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "737": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\nC在“重大事”处中断，D竟独立为“故隐患治理督办制度”，明显是同一选项被误拆成两项；因此现有五项不是完整原题。B要求报告未区分类型和内部记录，可有适用限定，但不能用破损选项证明唯一B，先核版面。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "738": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n题干把“安全检查方法”和“应急预案作用”两题拼接，A至D是检查方法，E却是预案协调表述，原键AD无法对应同一个问题。仪器检查并非显然不是检查方法，不能对这组残缺混题编造一致解析，须回到原文拆题核下标而非本次擅改。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "739": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "B安全投入可体现为设备材料等物质条件，也可支持培训、制度运行等非物质能力，故能保障生产力。A科技、C责任、D法制分别提供技术和制度约束，但不能直接等同全部资源保障；投入仍应有针对性而非只比较金额。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "740": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "亚当斯模型把直接在现场表现出的不安全行为和不安全状态称A现场失误，以区别背后管理决策等深层因素。B操作偏重人的动作，C管理是更深层，D判断是个体认知，均不能完整覆盖题干人和物两项。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "741": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "先A划分作业活动，把评价边界、工序、人员设备和条件明确，才可逐项辨危险。B直接辨识若无边界易遗漏重复，C评价、D可容许判断在识别之后；不要把方法名与其第一项具体准备步骤混同。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "742": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "实施控制后还需D检查风险及措施效果，才能确认风险是否下降并进入下一轮修正。A分析评估、B规划、C实施在此前提供依据和行动，不能到措施下发就结束管理。所谓最后是一个循环中的末环，不表示风险永久不再变化。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "743": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "风险识别要把识别到的危险情景系统汇成A风险清单。B发现某危险源、C发现某隐患是过程或局部结果，D控制规划在之后进行。没有清单就难以逐项评价、分配责任及追踪，不能只凭记忆说都看过。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "744": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "C现场调查最便于日常直接观察工况、操作和环境，原库据常用程度选C。A事故树、D故障树是系统逻辑分析，B任务分析从工作步骤展开，均有适用价值但不因此成为现场人员用得最多的方法。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "745": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "B要素构建时人员、制度、投入等尚在搭建，约束和协同未稳定，原教材将事故持续高发对应此阶段。A内容设计在框架形成，D整合运行重在协同生效，C反馈完善重在运行改进。阶段模型用于分析成熟度，不是预言某阶段必然出事故。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "746": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n原答案B劳工部，而C劳动部可能只是同一美国部门Department of Labor的不同中文译名，两者没有足以唯一选B的实质区分。A运输安全委员会和D安全部不符，但译名重复不能靠死记字面解决，须核是否C原为另一部门而录入有误。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "747": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "原五要素模型以B安全文化作为影响价值取向、态度和自觉行为的“灵魂”。A法制提供约束，C责任明确归属，D科技提供手段，分别有作用但不等于价值导向。该比喻是模型内术语，不表示文化口号可代替硬件和制度。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "748": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "行为本身违反规章标准是B违章作业。A指指挥者发出不安全指令，C/D主动被动还要看意愿和情境，题干未给这些条件。分类先看描述的是实际操作还是上级指令，不要把任何违章都归到指挥。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "749": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "技术负责人A负责把设计方案与风险控制转成技术交底，项目经理B统筹、监理C外部审查、安全人员D监督各有职责。逐级交底要求内容传到实际班组个人，不能以总工签了纸张就认为现场每人都理解。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "750": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "一个违章未及时纠正向周围传递“允许如此”的信号，更多人模仿，正是B破窗理论。A/C/D因果链模型可分析事故深层原因，但不如破窗直接说明环境失序与从众扩散；及时制止教育是在修复规范信号。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "751": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "第一类危险源是能量、危险物质本身，A隔离、B限能、D限量直接减小其释放或暴露。C提高可靠性主要减少约束失效，偏向第二类危险源控制，因此问“不属于”选C。两类措施实际应协同，不是只能选一套治理。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "752": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "本题后果分级用B轻度、中度、重大损失，损失概念可覆盖人身、财产等。A只是大小程度且缺具体后果，C/D偏向伤害口语或另一分档术语，不能替换这套矩阵目录。分级名称与具体判定标准应成套使用。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "753": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "D海因里希较早用连锁关系解释工业事故由前置因素到不安全行为状态再到伤害的演进。A亚当斯、B博德等在后续模型中进一步强调管理等因素，C不是本题该理论命名者。学术史年代不在此额外编造，重点区分理论人物。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "754": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "复杂航空系统需要统筹设计、运行、人机与环境，原教材将安全系统工程早期来源对应A航空。B建筑、C交通是后来广泛应用行业，D国防科研范围虽有交叉但不是该题指定起源部门。应用地点多不等于起源名称可任意替换。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "755": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n题干仅剩“的最高境界”，被评价的管理活动完全缺失，不能把原库A本质安全扩充为任何领域的最高境界。若恢复为安全管理相关教材命题，可再解释源头消除风险与制度、文化的关系；目前先标题干缺失，不伪装原文完整。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "756": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "海因里希链中人的不安全行为、物的不安全状态是可直接干预以中断事故链的关键环节，D。A遗传、B教育、C性格属于前置或局部因素，不能像D同时覆盖现场主要环节。强调D不意味着只纠工人动作、不追更深管理原因。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "757": {"status": "explained", "source": "原有精选精讲", "text": "事故因果连锁理论（多米诺骨牌理论）由海因里希提出，故有「工业安全公理」之称。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "758": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n题干同时问破窗理论提出者与LEC中的E，选项又混人物和事故后果，明显串题。LEC的E应表示暴露频率而非后果，人物B/C组合也不能解释该混题，原键BC保留但须核版面，不能猜测原本两题各选项内容。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "759": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "风险量同时结合后果和概率，C完整。A只看损失会忽略发生可能性，B只看概率会漏掉低频高后果，D评价方法会影响估计方式但不是危险本身的两个基本组成。要在同一规则下综合比较而非任选一维。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "760": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "物质是否足够危险、数量是否达到相应临界组合，共同决定重大危险源辨识，D。A形态可能影响危险性但不替代危险特性，B工艺储型是条件非完整指标，C协调干扰不是此定义判据。辨识重大危险源与发现某个违章隐患不同。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "761": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "安全生产目标是持续控制C事故风险和伤害因素，保护人的生命健康。A把机械本身当风险对象，B把环境全都等同伤害，D同义堆叠风险而漏掉具体伤害因素。管理不是停掉一切生产，而是使危险保持受控且不断改进。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "762": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n题干仅剩“是针对生产过程中的安全问题”，主语缺失；A决策计划组织控制与B/C/D的管理或改进循环均有合理语境。原库A可能对应安全管理定义，但不能由残句唯一判断，需恢复缺失概念后解释其活动范围。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "763": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A现场检查发现风险，B及时报告推动资源处置，C制止违章阻断即时危险，是专职安全人员题定的现场职责，故ABC。D落实法规、E制度更新是更宽的单位管理职能，不能代替本题具体列出的三项直接现场职责，也不表示安全员不能参与制度工作。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "764": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "矿山A、建筑D、烟花爆竹E按原行业性质要求专门管理；发电B450人、制造C280人按原法一般单位超过100人的配置条件也达到，因此全选。不要只看人数而漏高危小单位，也不要只看高危名单而忽略一般单位规模，人数门槛未作现行复核。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "765": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "法定职业病须发生于职业活动A、有相应职业危害暴露B、在国家目录范围C并与法定用工关系D等联系。E接触时间影响发病和诊断，但并非所有法定职业病一律有同一个接触年限门槛，故原库ABCD。诊断仍需结合具体疾病标准，不能仅用职业身份推定。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "766": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "为救援移动现场时，A标志保原位置，B简图、C记录还原空间过程，E保护痕迹物证支持调查，故ABCE。D封闭现场可能是其他安全管理需要，但不能替代这组移动时的证据固定措施，更不能阻断必须进行的抢救。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "767": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\nA实际需要与C技术经济可行性显然应考虑，但E安全隐患问题正是实际需要的来源，题干又没有限定只选一级概括项，不能因与A包含就称不需考虑。原答案AC存在层次重叠导致的漏选疑点，B能力和D编制人虽不是核心原则，也不能解释排E。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "768": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n认证通常含申请、审核准备、审核实施、纠正跟踪及监督，原库ACDE却排除B“审核现场调查”，可能只因它不是正式阶段名称或属于可选初访。没有给程序标准和术语限定，不能误导为体系认证无需现场审核；需核B原文是否被改写。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "769": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A策划确定目标和措施，B实施运行，C检查核效果，D改进纠偏，组成PDCA闭环，故ABCD。E验收只是某项活动的确认节点，不是代替持续改进的第五个循环环节，标准化不是验收发证后就永久完成。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "770": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n作业安全中相关方D和变更E均会影响现场风险，常见标准化框架也包含这两项管理。原答案ABC没有说明采用哪版目录或为何排除D/E，不能解释成外包队伍和工艺变化不属于作业安全，应核对应要素表，避免漏项。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "771": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "原“五到位”含责任、投入、培训、管理、应急等，选项里A投入、B培训、C管理匹配，D考核、E整改不是这组固定名称，故ABC。考核整改现实必要，不等于可替换专门文件的目录条目；不要用安全词语都正确来全选。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "772": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A违章指挥、D违章操作会直接制造危险，安全人员应立即制止。B不听指挥要先看指挥是否合法安全，拒绝强令冒险反而是权利；C详细记录是工作方式，E情况不清需查明，不是题目所列直接制止的违法行为，故AD。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "773": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A检查识别缺陷，B维修恢复功能，D保养降低劣化，配合专人和档案形成设备安全闭环，故ABD。C试用不能代替正式检查验收，E总结可辅助管理却非替代周期维护的行为。达到报废条件不能只靠保养继续用。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "774": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A人的行为、B物的状态、D管理缺陷、E环境因素构成施工风险的不同来源，应相应控制。C安全费用是支持治理的资源，不与上述危险因素同一层次，故ABDE。费用不足可导致管理问题，但不能用一个财务名词替代具体危险情景。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "775": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "新工艺A、新材料B、新设备D、新技术E会使原经验和规程不再充分，需相应培训，故ABDE。C新规范也需依法宣贯，但不是该条规定“四新”的固定成员；未选C不代表更新规范可以不学习。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "776": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\nD只剩“负责施工现场的”，责任对象缺失，且题目要求全选，不能确认原完整义务是什么。A资金、B机构、C制度方案预案、E交底均有合理施工职责依据，但不据此替残缺D补写结论，待核原题后再算完整解析。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "777": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "评分检查表按项目和标准逐项核验，A系统覆盖、C直观呈现、D与责任制衔接是其优点，故ACD。B称难掌握、E一概准确性低并非此工具的固有特点；结果仍受表格适配性和检查者执行质量影响，不能说打分就绝对准确。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "778": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A明确任务责任时限，B依据风险措施和法规，E配资源，三者使方案可实施，故ABE。C外部职能主管部门不是替单位定期评审内部方案的当然主体；D一经确定不得更改违背风险变化时调整改进要求，守方案与依法变更并不矛盾。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "779": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A工程防护、B设备仪器与维护、C安全研究、D教育预案等措施、E劳保均可组成广义安全投入，故全选。题问投入总体，不等同专项提取安全费的每一项都可按相同会计科目列支，制度和预算范围仍需区分。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "780": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n题干限定警告并可并处1万元以下罚款，但A干涉调查、B破坏现场、C虚假陈述又可能触发事故调查条例更重的特定责任，不能不辨条款就唯一选ABE。适用主体、行为及原处罚规则缺失，需核题源，不编造为何C/D当然不罚而A/B恰为此档。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "781": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A企业负责真实申报，B新建验收后30日和C年度申报属原题采用的历史程序；D接收主体用错当时职责，E停产终止也不能一概不报告变化，所以ABC。申报时限与主管已可能调整，本题不作为当前职业病危害申报办事指南。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "782": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n设计制造A、安装使用B、检验修理C无疑覆盖生命周期，但D登记备案、E报废也与全过程安全监察密切相关。若题目要求某旧教材三个主要环节，需说明是目录而非穷尽全部监管事项；不能从原键ABC推导登记和报废不需监管，选项层次待核。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "783": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A制度规程、B培训持证、C职业危害劳保、E安全管理事故处理都直接反映现场安全条件和执行。D党风廉政效能监察是其他监督领域，不能因也叫监察就塞进作业场所安全检查的固定内容，故ABCE。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "784": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "B环境污染、C国防科研、D核设施有专门事故处理制度，是题库条例明定例外。A甲醇泄漏、E工程事故不能仅凭名称排除，若属于生产事故仍适用相应规则，故BCD。某次泄漏可能还造成环境事件，应分别依事实看法律衔接，非一概只适用一种法。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "785": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "调查组A查因、B定性质责任、C提交报告、E总结提出防范建议。D直接作出对责任者处理通常由有权政府、行政司法或单位依职权执行，不是调查组自行拥有所有处罚权，故ABCE。提出处理建议与实际处罚执行不同。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "786": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n主要负责人需组织应急管理和预案，C所列应急编制与处置知识显然与职责相符，原键ABDE将其排除缺乏理由。A经验、B职业危害、D案例、E基础专业知识合理，但不能因此认定C无需培训，需核原培训大纲或原选项录入。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "787": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "原调查组中A安全监管、B公安、C监察、E工会可按规定参与，D人事部门不是该固定列举，故ABCE。旧机构名称不能直接当现在组织表，专业性与无直接利害关系也仍是成员条件，企业不能自选代表替正式调查。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "788": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A通报、B现场处理、C绘图和D原因分析属于事故调查取得保存信息并解释事实的过程。E责任人的具体处分处罚在调查认定建议之后由有权主体处理，不与这些取证查因步骤混作同一调查环节，故ABCD。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "789": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "原危大目录中A基坑支护降水、B达条件土方开挖、D起重吊装、E脚手架均有典型高风险需专项控制。C普通混凝土浇灌本身不因名称就全数列危大，相关高支模等应按其危险条件认定，故ABDE。不是任何浅小开挖也自动达同一门槛。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "790": {"status": "explained", "source": "原有精选精讲", "text": "交底内容包括危险特点与重大危险源、具体预防措施、特殊工序操作规程、事故后自救与紧急救援；安全费用使用情况不属交底内容。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "791": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A滑坡高边坡、C高瓦斯隧道、D爆破、E水下焊接各涉及失稳、有毒爆炸或特殊水下暴露，原库要求专项方案。B普通涵洞基础未给危险规模条件，不因是基础就全数纳入，故ACDE。实际涵洞若有深基坑等风险仍须按相应类别管理。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "792": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "专项方案的施工技术审核需C总包技术负责人及D相关专业承包技术负责人按责任协同，故CD。A建设负责人、B总包经理的组织权不能替代技术审核，E监管也不是替每份方案内部审核的主体；监理审查程序另行落实。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "793": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A安装使用维护说明指导安全用法，B产品合格证明与C设计文件证明产品和设计依据，厂家应提供相应资料，故ABC。D使用故障记录主要由实际使用阶段积累，E商业保险证明不等同设备质量技术档案。旧设备移交时可能还需历史记录，不能混场景。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "794": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\nA使用、C故障事故、D定检都是必要技术档案，但E耗能特种设备能效测试报告在相应设备条件下也可能是应存资料。题干未排除耗能设备，原键ACD漏E有疑点；B台班费用偏财务可区分，却不足以证明E不应入档，需核档案规范版本。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "795": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "预警颜色原库按红、橙、黄、蓝四级组织，高危逐步强化响应，故ABCE。D绿色常表达正常或安全，不在这套四级预警颜色中。此题颜色分级不等于事故法定四等级，也不据“特别重大隐患”措辞重造一套国家隐患分类。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "796": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "排查结果全应登记，但更严重隐患需要向上级报告，以便获取决策、资金和跨部门协调，原题选DE。A一般、B较小、C较大不是本题要求重点升级报告的组合；其中“特别重大隐患”属教材用语，不能替代现行重大隐患认定清单。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "797": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "安全管理兼顾减少事故A、危害B、财产损失C、人身伤害D及相关环境污染E，各目标共同反映后果控制，故全选。目标覆盖广并不让部门权责无限扩张，具体仍需工程、职业卫生和环境管理协同实施，不能只盯亡人数。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "798": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "重大危险源释放后可能影响居民、航空、供水及公共设施和作业人群，A至E都应按风险保持适当隔离，故全选。没有一个统一距离可代替对不同危险物、数量和后果的评估，也不能因为某类设施不常见就免其保护。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "799": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n原键AB把A“不安全状态”列作人的因素，但该模型通常把物的不安全状态归物的系列；B不安全行为属于人。C肇事人、E受害人又都是人的角色，题干未解释为何排除，D起因物是物。系列、状态和角色混层，原组合与常见定义冲突，需核图和选项。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "800": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A不安全状态是危险条件，C起因物启动事故，D致害物直接传递伤害，E伤害方式描述作用路径，均可参与事故机制，故ACDE。B安全法制属于治理制度而非本题列的事故基本构成因素；不能把防事故手段与事故链中的角色混同。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "801": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "ABCDE五个“零”分别面向事故事件、人身损害、伤亡、财产和环境的理想改进方向，原库全选。理想目标不是风险已绝对消失的事实证明，也不能为保零指标而瞒报轻伤未遂，真实信息正是持续改进所需。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "802": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n全过程、全方位、全部风险、全面组织实施与E全员参与均符合全面风险管理语义，原键ABCD排除E缺少目录限定。不能因此说全面管理不需要一线人员识别报告，若考特定教材的“四全”固定名称应补明确切框架，待核原定义。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "803": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\nE末尾串入下一题“安全管理的内容包括ABCDE”，已污染选项。且B设备缺陷属于C物的不安全状态、D违章属于A人的不安全行为，题干问泛指却原键只选概括项ACE，未说明只取一级分类，易漏选。需恢复版面和分类层次，不硬说B/D不属隐患。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "804": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "原公路水运考核范围中A项目经理、B项目副经理、C项目总工属于项目施工管理负责人。D监理是另一参建方，E企业安全总监是企业层级职务，并不因此自动属于某项目负责人，故ABC。任职考核分类与具体事故个人责任仍要分别分析。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "805": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\nB内在防事故、C失误及故障安全、D预防源头含义均对应本质安全，但A描述的是一般“安全”的状态定义，E又缺少“安全管理”等主语。原键全选把一般安全和本质安全混同，不能据此认为任何未出事状态就具备内在防错功能，待核题文。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "806": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\nA/B/C/E强调能量根源与控制失效因素的协同有合理性，然而D把第二类作为第一类导致事故的必要条件，在这类两类危险源模型中也常见。原键排D却未给理论限定，不能为排项断言第一类可在约束全部完好时仍必然出事故，需核原教材模型。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "807": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "负责人应先A组织抢救、B有效控制、C防扩大、D减伤亡财损并及时报告，选ABCD。E善后是随后重要工作，但不在这组即时应急义务的优先行动内，不能先商赔偿、安抚而耽误救援。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "808": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\nE不断发展渗水、涌砂、裂缝、剥落塌方显然是基坑边坡失稳信号，与A连接损伤、B状态骤变、C零部件移位、D异味声响同属可警示危险的现象。原键ABCD排E缺合理限定，可能漏选，不能误导为有涌砂仍可当无征兆。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "809": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "原分类按人A、物C、环境D、管理E四个顶层因素组织，B自然只是环境来源之一，不与完整环境类并列作为第五类，故ACDE。分类应避免上下位重复，不是说自然灾害与生产安全无关。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "810": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n原键BCD排除E死亡，但题干泛问人员伤害，死亡显然是最严重的人身损害，不能从概念上排除。A普通感冒未必职业相关可区分，D精神创伤也需看事故联系；需核原题是否只问非致命伤害或选项误录，不接受漏死亡的普遍定义。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "811": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A环境暗示是破窗核心机理，B及时纠违、C防微杜渐、D防小疏忽累积成祸是管理启示，故ABCD。E人的缺点导致行为更对应其他事故链中个体因素，不是破窗特别强调的环境规范信号，不能用所有事故理论混答。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "812": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n原键ABDE把风险转移与辨识、分析、控制并列成必经步骤，和30同类：转移是风险应对可选策略，不是所有风险都必须经历的顺序环节。C排查与辨识也可能有交叉，需核指定教材流程，不将原组合当普遍方法论。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "813": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n题干的“m级”疑为罗马III乱码，而且没有提供概率—后果矩阵。A小后果高概率、D中等中等、E大后果极低概率在某矩阵可能同级，但不是任意规则必然同级；原键ADE须依原表核定，不能仅凭三个形容词算出唯一数值等级。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "814": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A高血压不适岗、C未成年禁忌岗位、D疲劳、E带病都涉及人员身体适岗状态，所以ACDE。B无证属于资格知识技能准入，并非身体条件，不要因为两者都可能不允许上岗就混成同一分类。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "815": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n与32同类，题干缺具体事故，A高压裸线触电或E超重吊物坠落均可能兼具触发与直接致害作用，原键BCD把物品固定划类缺依据。应在某次事故链中识别起因物与致害物，不能一律排A/E以满足题库组合。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "816": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "B提高安全系数、D提高可靠性、E安全监控减少约束失效或及时发现失控，偏第二类危险源控制。A消源、C限能限物直接作用于第一类根源，故BDE。实际两类治理应配合，不能装监控后就不做隔离限量。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "817": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A设备故障、B操作失误、C管理缺陷从物、人和组织三方面解释诱因，原库ABC。D科技低、E意识弱可能影响这些环节，但不是这组“三大原因”的同层固定名称；不能说提升科技意识无用，而是区分总类与具体成因。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "818": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "B失误安全使人在可预见误操作时仍有防护，D故障安全让设备故障时趋向安全状态，两者是内在防事故设计，故BD。A日常管理、C事后补偿、E事后修复不能替代事故发生前的内生安全功能。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "819": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "海因里希链包括遗传社会环境A、人的缺点、不安全行为物态D、事故C、伤害E，选项有的四项都选。B管理缺陷
