const EXPLANATIONS = {"meta": {"total": 1554, "explained": 1382, "retained_essential": 113, "authored_new": 1269, "review": 172, "pending": 0, "questions_sha256": "9371bc4b9342832ab09f25f90f6779d668b86bd48d23e403c9d3896e7c9ab8e5", "note": "全部题已逐题处理：有正文与待核验互斥统计；待核验不冒充可靠解析，未逐条复核现行法规。"}, "items": {"0": {"status": "explained", "source": "原有精选精讲", "text": "现场调查法直观、简便、可操作性强，是安全生产管理人员辨识危险源使用最多的方法；事故树、故障树多用于系统安全分析。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "本题区分项目最高负责人与分工负责人。项目经理对项目整体生产组织负责，委员会主任与这一统筹职责对应，故选A。B项目副总经理、C安全总监、D技术副总经理分别承担分管、专业监督、技术工作，不因分管安全或技术就自然成为委员会主任。不要把“具体管安全”误当作“全面负责”。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "2": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "要素构建阶段在把制度、人员、投入等基本要素建立起来，约束尚未形成稳定合力，原教材将事故持续高发对应B。A内容设计是设计制度框架，D整合运行是要素协同运转，C反馈完善是依据运行结果改进；题目考阶段特征，不是断言某个现实项目在B阶段必然发生事故。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "3": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "系统安全方法要求在设计、试验、运行各阶段统筹人、机、环境，航空系统的高复杂性和高后果风险是这类方法早期发展的典型背景，原题库对应D航空部门。A经济管理是管理领域，B交通建设和C道路运输是后来广泛应用的行业；应用广泛不等于最早起源。本题为学科史教材口径，并非当代行业排名。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "4": {"status": "explained", "source": "原有精选精讲", "text": "一般中型以上公路水运工程施工单位应当每季度组织一次安全检查；项目部、作业队另有更频繁的周检、日检要求。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "5": {"status": "explained", "source": "原有精选精讲", "text": "应急处置首要目标是控制事态、防止事故扩大并最大限度减少人员伤亡；其余选项属于组织保障或工作要求，不是第一原则。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "6": {"status": "explained", "source": "原有精选精讲", "text": "应急管理依次为预防、准备、响应、恢复四阶段；「接警」「启动」「救援」只是响应阶段内的具体动作。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "7": {"status": "explained", "source": "原有精选精讲", "text": "《公路水运工程「平安工地」考核评价标准（试行）》规定考评等级为达标、不达标、示范三个等级。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "8": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "本题考企业对所承揽项目经理部的定期考核，不是项目经理每天带班频次。按原题库所引暂行制度选A半年；B一年使考核间隔变长，C季度、D月虽更频繁，但不是题目要求的最低制度频次。须区分检查主体与对象，本题旧制度数字未作现行版本核验。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "9": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "题眼是“审查合格后同意开工”，对应施工活动的监理审查，选D。C施工单位负责制定、执行安全技术措施，不能把自行编制等同外部监理审查；A设计单位提供设计成果，B建设单位履行业主组织职责，均非本题这一审查角色。此为原题库职责辨析，具体程序应另核适用规范，不当作已核验现行条款。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "10": {"status": "explained", "source": "原有精选精讲", "text": "安全技术交底实行逐级交底制度，由施工单位项目部技术负责人负责实施，而非班组长或专职安全员。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "11": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "南风不是加大外力，而是改变行人的感受，使其主动脱衣；管理启示是尊重人的需求、激发主动性，选A以人为本。B综合治理强调多种治理手段协同，C预防为主强调事前防控，D本质安全强调消除或控制系统固有危险；都不如A直接对应“感受改变带来主动行为”。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "12": {"status": "explained", "source": "原有精选精讲", "text": "安全生产责任制度把安全责任分解到每个岗位、每个人，是教育培训、检查、奖惩等其他制度的基础与核心。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "13": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "题目把人、物、环境、关系都放进系统，考的是系统管理而非只盯单一元素。选D，协调内外要素的相互作用，才能控制组合后的风险。A只管人、B只管物、C只管环境都割裂系统；例如设备安全仍会受人的操作和现场环境影响。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "14": {"status": "explained", "source": "原有精选精讲", "text": "本质安全通过设计使系统本身具备自动防止事故的能力，即使发生误操作也不致造成伤亡，是安全管理追求的最高境界。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "15": {"status": "explained", "source": "原有精选精讲", "text": "海因里希因果连锁理论最早系统提出事故致因链条，被称为「安全公理」；破窗理论属于管理与犯罪心理学范畴。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "16": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n题干把《公路工程施工安全技术规范》的文件层级列为“部门规章”，选项缺少“行业标准”。技术标准与部门规章并不等同；原库标C，需核对原题、标准编号与文件性质，不能硬解释为现行法律分类。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "17": {"status": "explained", "source": "原有精选精讲", "text": "新增项是「组织制定并实施本单位安全生产教育和培训计划」；建立责任制、如实报告事故、保证安全投入均属原有 6 项职责。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "18": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "可直接根据题干用语判断：工伤保险用“应当依法”描述，而危险作业意外伤害保险用“鼓励”描述，后者在本题中是选择性保险，选B。A法定、C强制均与“鼓励”不一致；D责任保险指以依法承担的赔偿责任为标的，并非这里按投保义务划分的答案。只据所引题干分析，不声称该引文已按现行制度复核。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "19": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "段落先交代用途与危害，随后用“重在预防”转入重点，并列举密闭、检测、通风等操作办法，因此主旨是A避免伤害的方法。B用途广泛只是开头背景，D健康危害是提出问题，C可以避免只概括效果，均未覆盖后半段具体的预防路径。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "20": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "首句提出细颗粒物比沙尘暴危害更大，后文比较粒径正是为这一观点提供机理支持，故选D。A只截取末尾血液影响，B比较不同粒径是论证方式而非重点结论，C把对象扩大为各类灾害天气；都没有紧扣“灰霾细颗粒物危害大”。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "21": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n按通常题意，设甲x、丙z，则x=1.5(56+z)，x+56=5z，解得z=40、x=144，D与计算相符；但原题“甲和乙的销售是丙的销售额的5倍”表述略缺词，建议核对原题。计算只用题给2011销售数据，不涉现行法规。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "22": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "定义要求行为受社会伦理道德引导；D明确“按照法律规定”安排就业，是履行法定义务，不是本定义所强调的自愿伦理响应，故题目问“不属于”选D。A垫付赔偿帮助周边、B主动减尘回应环境需要、C慈善捐赠均可在题设语境下归入社会响应。不要把企业履责的一切行为都混为同一种动机。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "23": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "设G为“小顾通过”、P为“大家都通过”。小王断言P；小张否认自己能过；小李断言G；小顾断言G⇒P。若G假，则小李错且P也假导致小王错，至少两人错，矛盾。因此G真；若P假，小王和小顾又同时错。只能P真，大家都通过，于是只有小张错，选B；A、C、D的陈述均真。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "24": {"status": "explained", "source": "原有精选精讲", "text": "《建设工程安全生产管理条例》首次全面、详细规定建设、勘察、设计、施工、监理等参建单位安全责任及政府监管责任。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "25": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "事故发生单位向事故发生地有关部门初报的时限，不随死伤人数的增加而延长。按题库口径选D的1小时；A5、B7、C9均混淆了初报与后续层级上报的时间。31人死亡用于事故分级，不能把逐级报送耗时叠加后当成事故单位首次报告时限。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "26": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "辨识回答“有哪些风险”，其汇总交付物是风险清单，选A。B确定风险因素是辨识过程中的具体工作，未概括完整成果；C估计概率、D估算损失均进入风险分析/评价阶段。记住“清单列风险，概率与后果评风险”，避免把辨识与分析混在一起。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "27": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n“21次形成习惯”是原题库记忆口径，不能据此声称所有安全行为均经21次重复即可形成。实际形成受行为难度、训练环境和持续性影响，题库标B仅作原题记忆，心理学普遍性断言待核验。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "28": {"status": "explained", "source": "原有精选精讲", "text": "主要负责人对安全生产工作全面负责。董事长、总经理均不在岗时，实际主持日常工作的常务副总经理徐某即为该期间的全面责任人。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "29": {"status": "explained", "source": "原有精选精讲", "text": "《公路水运工程安全生产监督管理办法》明确施工单位是重大隐患排查治理的责任主体。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "30": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n原答案ABCD把“风险转移”列作流程步骤，却排除同属风险应对策略的“风险规避”。辨识、分析、控制是不同工作环节，转移与规避通常都是可选应对方式，未必是每个风险必须依次经过的步骤。原教材分类口径缺失，需核对目录，不能凭题给答案宣称规避不属于风险管理。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "31": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "构成隐患的关键是危险物或设施与不安全条件结合：B有不安全状态，D有不安全行为，C兼有二者，都使起因物具有触发事故的可能，故BCD。A只列致害物、E只列起因物，没有说明其处于何种不安全条件；物体客观存在不等于已经构成某个事故隐患。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "32": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n原答案BCD排除A“架空高压裸线”，但触电情形中该裸线既可能触发事故又直接传递致害电能，题干又未给出接触场景；B“雷击、导电物体”也混合了事件和物体。起因物、致害物须在具体事故链中识别，不能单凭物品名称确定固定集合，原选项与答案待核验。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "33": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "本题“三级”是施工企业内部由公司到项目再到作业班组的逐级教育，故B公司、C项目经理部、D作业队三个层次都应选。A区域级和E国家级是地域或行政层次，不是这三级教育链。原题库培训层级辨析，不由此推导具体学时或现行条文。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "34": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "带班强调负责人到实际作业现场掌握风险：A巡视检查覆盖多点，C蹲点带班盯住重点部位，均是直接现场履职。B例会、D讲座、E经验介绍分别属于会议、教育或交流，不能替代人员到危险作业现场带班，故选AC。这里不由现场例会推定已满足带班要求。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "35": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "系统原理看要素协同，人本原理看人的作用，预防原理看事前控制，强制原理看刚性约束，这四项构成本题教材的基本原理，故A、B、C、D均选。E破窗是从环境失序推导行为影响的具体效应，不能因为能用于安全管理就归入该“基本原理”目录。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "36": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "海因里希连锁中，遗传及社会环境影响人的缺点，进一步形成不安全行为与不安全状态并导致事故伤害，所以B、A、C对应这条经典链。D管理缺陷、E现场失误虽可参与事故分析，但并非本题所列海因里希模型的独立经典环节。注意不要把不同事故模型的术语混用。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "37": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "第一类危险源是可能释放能量或危险物质的根源。A吊重势能、B噪声声能、C机械车辆动能、D高处势能都直接描述能量，故ABCD。E未正确佩戴防护用品削弱防护屏障，属于使控制失效的行为因素，而不是一种能量本身。先问“能量是什么”，再问“防线为何失效”。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "38": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A使用不安全设备、B以手代工具、C冒险进入危险场所、D不安全装束，都是作业者在现场可观察的具体行为，应全部选入。E未贯彻法律法规是组织管理层面的缺陷，虽也可能涉及人的责任，但不属于本题狭义的现场不安全行为分类。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "39": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A事故树用逻辑关系追踪顶事件原因，B检查表逐条对照检查，C危险与可操作性研究用引导词系统分析偏差，三者都是有明确分析结构的危险源辨识方法，故ABC。D“具体实践法”过于笼统；E专家论证是一种论证组织活动，不能直接替代本题列举的规范化辨识工具。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "40": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n原库ACD可分别对应生产协作复杂化、科技变化和生命健康诉求，但B自动化信息化、E生产力提高与A/C有重叠，题干没有给出何谓“主要”的排除标准。不能论证B/E不是安全理念发展的动力；须核对原教材列举范围后再作为固定选择题记忆。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "41": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n原答案ABD排除E“从物本到人本”，而这一表述同样是常见安全理念转变；C财产到生命也与D生命健康主题交叠。若考特定教材的“三大转化”，应给出相应原文范围，目前不足以从概念上唯一排除C/E，不将原库组合硬解释为普遍唯一分类。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "42": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\nB围挡、C用电安全专用开关、D隐患评估均可对应安全措施，但原答案一概排除A购买消防车，消防设施设备是否列支取决于行业、费用办法和资产处理口径，不能仅因它是车辆就排除。E招待费显然不是直接安全措施支出；A的处理需核对原题适用制度。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "43": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "原事故分级以死亡、重伤、直接经济损失任一指标达到较高等级为准：A死亡3至不足10人、C重伤10至不足50人、D直接损失1000万至不足5000万元，对应较大事故；B死亡10至不足30人为重大事故。E只有“恶劣影响”没有给出该数值分级所需指标。区间“以上”含本数，“以下”不含本数，是本题的边界考点。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "44": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n原答案ABCD对应设备出厂技术资料清单，但C已经包括“安装及使用维护保养说明”，E另列“使用说明书”语义重叠。按固定条目名称可以选ABCD，但不能据此断言实际出厂无需使用说明；需核对原题是否要求规范原文的完整条目名称而排除E这一不完整项。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "45": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A底线思维要求预先守住不可突破的最低安全要求；B红线思维强调不能以人的生命换取发展；C人本思维强调人的生命健康优先，三者对应本题安全治理主旨。D效益、E历史是其他分析角度，不是此题所列安全工作三项重点，故原库选ABC；不是否认安全工作需要经济和历史分析。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "46": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "题干比例用于说明不满意信息比满意信息传播更广，不是要求计算事故概率。A加强文化建设改善认同，B提高员工满意度直接回应前半段，C坏影响扩散对应后半段，故ABC。D持续改进、E事故预防虽可能是安全理念，但不能由这一传播比例直接推出。比例只是本题引用的管理比喻，并非已验证的统计定律。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "47": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "原题指定的是安全管理体系的组织性组成：A监督保证负责检查约束，B教育培训提升履职能力，C安全责任明确由谁负责，D组织制度提供执行载体，故ABCD。E技术开发有助于安全改进，但不是题目所引体系目录中与上述四类并列的构成项；要分清“有益措施”和“指定目录成员”。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "48": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "四个检查关口分别是查清原因、处理责任人、教育群众、落实防范措施，故A、B、C、D全部对应。E赔偿资金是否到位涉及救济与赔偿，不在本题“四不放过”的四项表述中。记忆顺序用“查因—追责—教育—防范”，不能只处理人而不堵漏洞。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "49": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "B启动后留痕便于指挥追踪和事后复盘，C定期演练用于检验联络与处置能力，故选BC。A固定为2年不能取代依适用制度和变化情况修订；D把“最有针对性”也给综合预案，忽略专项预案和现场处置方案；E把日常安全委员会直接等同应急指挥机构，不符合应急按预案启动指挥的区分。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "50": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "桥墩损坏可能使整桥失去功能，说明不能仅以损坏构件造价代替事故总损失。A指出间接无形损失，B指出长期全局潜在损失，C要求系统思考，D强调事故前预防，均与这一比喻相符。E直接断言瞒报缺乏主观故意等事实支撑，不能仅凭估损不全面就作法律定性。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "51": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "原档案题中，死亡/重伤或直接损失达到1000万元的事故属于永久保管范围，故A、B、C均选；B“以上”包含C恰好1000万元这一边界。D把较轻事故保存期写成30年，不符原题库采用的期限口径；E又把所有轻微事故也永久保存，范围过宽。本题未核现行档案目录，不据此擅自销毁现实档案。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "52": {"status": "explained", "source": "原有精选精讲", "text": "法定条件含安全投入、管理与人员考核合格、依法安全评价、依法参加工伤保险等；「应具有较高安全技术水平」并非法定条件。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "53": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n题干“安全0标”疑似OCR错误；A称“绝对数表达法”却举0.2%的相对数，D称“远景描述法”却举比率，原库ABD与选项示例存在冲突。请核对原始题干及选项，不把错配示例当定义记忆。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "54": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "重特大事故、连续较大责任事故、举报核实的重大安全问题，都说明原达标结论可能失去基础，对应A/B/C；D主管机关依法判断有必要时也可追加核查。E未持续技术开发不直接等于达标条件失效，不能单凭该事实推出附加考评，故原库ABCD。两次这一数值仅沿用原制度题口径。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "55": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n原答案只选AD诚实信用、公平公正，但B遵纪守法、C廉洁自律也具有跨行业职业道德意义。题干“必须普遍遵循”没有说明是某套国际准则的两条目录，无法从概念上将B/C排除；需核原教材目录或题干是否漏了限定词。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "56": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "按原工作程序，先调查准备，再完成调查并结案，最后进行评估和归档，A/B/C对应正式工作阶段。D反思总结、E整改提高虽有现实必要性，但不能因此自行扩成这份指定程序的并列阶段名称，故选ABC。考的是文件结构，不能把好建议全部当目录条目。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "57": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "3E的对应词是工程技术、教育、执行/强制管理：A技术用工程措施控制危险，B教育改善知识行为，D管理使制度落实，故ABD。C经济是投入或激励手段，不是3E中的Engineering；E行政只是管理执行的一种方式，不能再与D重复列为第四个支柱。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "58": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n题干出现“30公路工程安全生产工作目前面临……”的串题文字，已有明显拼接错误。原答案ABCD排除E“强令工人冒险作业”，但E同样违反安全职业伦理且可能违法，不能因其还违法就不算违德。题干和答案均须核原文，不合理化这一漏项。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "59": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n原题把规范名称写成《公路工程安全施工技术规范》，与通常《公路工程施工安全技术规范》的词序也不同。原库ABC中的C是安全生产方针，而D安全与健康并举、E系统安全也可能属于编制理念；须核前言“三大理念”原文，不能把方针、理念混作已证实的目录。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "60": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "本题所称“四大矛盾”针对旧规程与工程现实脱节：A规模扩大、B空间布局改变、C技术变化、D设备变化均会产生新风险，使原控制要求不足。E总需求与总供给是宏观供求关系，并非本题安全技术规程修订面对的四类技术适应问题，因此原库选ABCD。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "61": {"status": "explained", "source": "原有精选精讲", "text": "消防安全「四个能力」为检查消除火灾隐患、扑救初起火灾、组织疏散逃生、消防宣传教育；「有效处理事故」不在其列。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "62": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "原教材用目标层级区分三境界：A先控制死亡伤害，B再兼顾职业健康并规范行为，C从系统源头消除或降低事故可能性，故ABC。D系统安全是分析治理方法，E科技安全是技术维度，虽可助成这些目标，但不属于本题指定的三个目标层级。所谓“消除可能性”是目标，不能承诺现实绝对零风险。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "63": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "题干用大量未遂、隐患位于重大事故之前来提示发现征兆、尽早干预，对应A原因征兆、B可控、C积累；D说明技术和规章还需有责任心的人执行。E“灵魂”是额外的价值表述，非比例本身推出，故原库ABCD。29/300/1000是题设比喻性经验比例，不能当任何工地都满足的统计定律。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "64": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\nA不要侥幸、D后悔不能挽回生命、E全员参与安全均可作教训，但原答案还选B“安全领域没有亡羊补牢的机会”。事故后仍应整改、防止再发，B若按字面理解过于绝对；只能在“逝去生命不可挽回”的修辞意义下理解，题干缺此限定。C把他人事故仅当故事不正确，原库含B的组合仍须核验。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "65": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A不熟环境容易误入临边洞口，B无防坠防滑用品会削弱防护，C恐高或高血压等不适宜状态可能引起失稳，故ABC直接对应高处作业风险。D基坑通信是另一作业场景；E未开会没有说明是否缺少具体安全交底，不能直接替代本题的高处风险识别。实际仍需综合评价人员适岗条件。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "66": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\nB不能斜拉、C指挥信号明确统一均有直接防止失稳和误操作的作用；A将指挥身份指定为主要负责人不妥，D无条件以5m限吊高也缺依据。但原答案BC排除E“加强安全检查”，该表述明明也是吊装应注意的安全工作；题干缺“专门技术要求”等限定，存在漏选嫌疑。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "67": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A靠近隐蔽设施不用抓斗，可减少误挖断管线；C预留进出撤离条件，D按题设设安全通行跳板，均针对坠落、被困风险，原库ACD。B自下而上会掏空坡脚、诱发坍塌，应按方案分层由上而下；E普通动土并不当然需要供氧，是否涉及有限空间缺氧应另行检测与专项处置，不能一概供氧。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "68": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "断路施工切断或改变原通行路径，A无围挡、B乱堆材料、C夜间无警示、D无现场巡检，都会使车辆人员误入或不能及时发现障碍，故ABCD。E三级教育是人员进场教育制度，题干未证明其与这次道路占用现场的直接控制缺口对应，不能用“所有安全工作都重要”代替特定风险匹配。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "69": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "题干直接写明修改实施日期，故C成立；“应当依法”为职工缴工伤保险费说明D为法定义务。意外伤害险使用“鼓励”，不能选A/E将其也说成强制；B从鼓励商保变为法定工伤保障，并不能推出保障力度降低。此题据所引2011文字分析，不延伸为所有现行业务的保险结论。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "70": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "境外项目可同时受到自然灾害A、东道国主权政策B、社会冲突C、政局变化D与当地法律合规E影响，五类风险来源不同而可并存，故全选。不要把风险只限为施工现场的物理危险；跨境经营还需识别制度环境风险，本题不是说每个项目必然遇到全部风险事件。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "71": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n题问“不属于创新安全管理”，原库选AC，但E“设立安全生产委员会”同样可能是常规组织措施，而非创新。分类边界和原教材上下文缺失，需核对，不能仅为迎合答案排除E。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "72": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n题干把“十八届五中全会”与“提出实施依法治国战略”相连，时间/会议表述应核对。原答案ABCD可作法治教育、法治处理、有法必依与依法履职的分类，但不据此证实题干历史表述。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "73": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "中国精神这组概念的核心组合是改革创新的时代精神A与爱国主义的民族精神C。B探索、D国际主义、E进取虽是正面精神表述，但不是本题要求的两项规范概念组合，故AC。多选不能以“说法积极”代替与题干限定概念的对应。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "74": {"status": "explained", "source": "原有精选精讲", "text": "班前、班后岗位安全检查属于经常性（日常）检查；定期检查是按固定周期统一组织的检查，故错误。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "75": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "重大隐患未排除而继续作业，风险会在整改准备期间持续暴露，所以题干要求停工隔离风险，原库判A；不能只登记后让原危险作业照常进行。注意对象是受重大隐患影响的相关作业和人员，停工、撤人、整改、复查应衔接，不能把停工本身当作治理已经完成。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "76": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在“避免竞争”。团结互助要求合作，但合理、良性的竞争可以推动技能和工作改进，并不必然与合作对立；需要避免的是恶性竞争和损害安全的行为。因此整句为假，选B，而不是A。遇到“合作所以排斥一切竞争”的二分表述，要检查是否过度绝对化。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "77": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "职工在操作、服务、协作中的个体表现共同影响外界对企业的整体认识；企业整体形象也需要个体持续维护，题干强调部分与整体的联系，故选A。B否定这层联系，无从解释为何个人违章或规范操作会影响企业评价。注意整体不等于个体的简单数量相加，本题强调的是相互关联。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "78": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错误词是“就是指”，它把危险驾驶罪穷尽为醉驾一种。醉驾只是该罪的一种典型行为，原题所用制度还包括符合条件的追逐竞驶等情形，因此判B。辨析时是判断列举是否完备，不是否认醉驾可以构成危险驾驶；具体行为构成应依行为时法律核定。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "79": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "同一作业区域多个单位的工序、设备、人员会交叉影响，签订安全管理协议用于明确彼此职责、协调和防护措施，故判A。条件是可能危及对方安全，并不要求事故已经发生；协议也不意味着一方可把自己的法定安全责任转给另一方。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "80": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错误在“必须先报告，而不能停止”。直接危及人身安全时，人员有权停止作业或采取可能的应急措施后撤离，不能强制冒险等待报告程序，故B。撤离避险与及时报告并不矛盾，不能把正常报告义务变成禁止紧急避险的前置许可。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "81": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "把建筑施工企业设置机构、配专职人员的义务加上“超过200人”这一门槛是错项，建筑施工本就是应强化专门安全管理的行业，不能小于该人数就免设，故B。本题不是比较200与另一通用人数阈值，而是区分高风险行业专门要求与一般单位人数分类。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "82": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "特种设备风险从生产环节就形成，经营和使用阶段还会继续变化，故监管既要按设备种类/风险分类，又要覆盖全过程，A正确。只抓制造出厂而不管运行维护、只管使用而不管产品源头都不能构成闭环；“全过程”也不等于每台设备每刻都由监管部门直接看守。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "83": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在“可以适当免除或者减轻”。事故伤亡法定责任不能靠与劳动者私下约定排除，特别不能利用用工地位要求员工自担全部风险，故判B。商业保险、劳保投入也不能成为减免法定责任的当然理由；需把合法风险保障与无效免责约定区分。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "84": {"status": "explained", "source": "原有精选精讲", "text": "《特种设备安全法》确立的原则为安全第一、预防为主、节能环保、综合治理，故正确。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "85": {"status": "explained", "source": "原有精选精讲", "text": "「不得压缩合同约定的工期」指建设单位不得单方面压缩；经协商一致并履行程序调整的不在此限。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "86": {"status": "explained", "source": "原有精选精讲", "text": "《建设工程安全生产管理条例》：建设单位在编制工程概算时应确定建设工程安全作业环境及安全施工措施所需费用。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "87": {"status": "explained", "source": "原有精选精讲", "text": "总承包单位对施工现场安全生产负总责；总分包是对「分包工程」的安全生产承担连带责任，题干扩大到整个施工现场，故错误。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "88": {"status": "explained", "source": "原有精选精讲", "text": "特别重大事故、重大事故应逐级上报至国务院安全生产监督管理部门和负有安全生产监督管理职责的有关部门，故正确。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "89": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错误在将较大事故通常调查组织层级写成省级。按本题原分级，较大事故通常由设区的市级人民政府组织调查，省级对应重大事故，故判B。报告层级与调查组织层级是两条不同流程；依法提级调查另属特殊情况，不能据此认为原句一般规则正确。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "90": {"status": "explained", "source": "原有精选精讲", "text": "办法明确企业应将安全费用优先用于满足安全生产监督管理部门提出的整改措施，或达到安全生产标准所需支出。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "91": {"status": "explained", "source": "原有精选精讲", "text": "职业病防治、工伤保险、医疗保险等费用应按规定另行列支，不得挤占安全费用，故错误。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "92": {"status": "explained", "source": "原有精选精讲", "text": "只有超过一定规模的危险性较大工程才需专家论证审查，一般专项方案经技术负责人和监理工程师审查签字即可实施。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "93": {"status": "explained", "source": "原有精选精讲", "text": "海因里希理论把事故直接原因归结为人的不安全行为和物的不安全状态，故正确。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "94": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "题干把两类危险源的主要作用颠倒了：第一类是能量/危险物质，主要关联后果严重程度；第二类是导致约束、防护失效的人、物、环境等因素，主要关联事故发生可能性。因此选B。并不是说严重程度完全不受控制措施影响，而是在这套分类模型中区分其主要作用。若选A，就接受了题干对两类危险源作用的倒置。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "95": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "起因物参与启动事故过程，致害物直接造成人体伤害，两者可以重合但并非必须相同。例如脚被电缆绊倒后撞上设备，电缆是起因物，碰撞的设备是致害物；题干一概说“相同”不成立，选B。A会把事故启动环节和能量伤害环节强行合并。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "96": {"status": "explained", "source": "原有精选精讲", "text": "轨迹交叉理论认为事故是人的不安全行为与物的不安全状态在时间与空间上交叉的结果，两者同等重要。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "97": {"status": "explained", "source": "原有精选精讲", "text": "待岗、转岗、换岗人员重新上岗前须接受一次安全培训，时间不得少于 20 学时，故正确。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "98": {"status": "explained", "source": "原有精选精讲", "text": "论证会由施工单位组织，题干说由建设单位组织召开，故错误。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "99": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "隐患治理形成闭环，需要完成整改、复查确认达到要求，再办理销号并解除针对该隐患的监控。题干的“按要求治理”应包含验收确认含义，据原题库判A；B会否认整改完成后的闭环处理。不能把“已经安排整改”或仅有口头报告，当作可立即销号的条件。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "100": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在把重特大事故档案期限一概写成70年。原题库所用档案口径要求此类严重事故档案永久保存，目的是保留长期追责和风险防范依据，因此B。不能因调查结案或时间久远就自行销毁；现实处置应另核档案目录及审批程序。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "101": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "“相对主观”强调人们对可接受风险的判断与所掌握信息、评价标准有关，并不是危险客观存在与否全由个人意愿决定；在这一教材语境下判A。系统安全追求把风险降到可接受水平，不承诺绝对无风险，也不能用“我觉得安全”替代检测和规定标准。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "102": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "生产中能量、物质及复杂相互作用不可能全部消失，控制危险性的办法包括减量、隔离、替代、联锁、防护等，故A。这里不是说任何单个危险源都无法消除；某个工序可通过取消而消除危险，但对整个生产系统宣称已消灭一切风险是不成立的。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "103": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n题干“可能性即损失程度的不确定性”疑似把“及”误写为“即”，两者含义不同。安全风险应同时考虑事件发生可能性与后果严重性，不能把发生概率直接等同损失程度。原库A只有在纠正该字并按组合定义理解时才合理，须核对原文。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "104": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "破窗类比强调失序若未及时纠正，会形成“别人也这样做”的行为暗示，使更多人模仿违章，因此A。并非所有不安全行为都只由从众造成，但“往往”保留了其他原因；纠偏要及早修复环境和行为信号，而不是等累计成事故才处理。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "105": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错误在“可结合情况”，把工伤保险义务写成自行选择事项。题库口径下应依法参加并为职工缴费，而不是公司或项目可根据预算决定办不办，故B。与鼓励性商业意外险区分；参加保险也不替代现场防护和事故赔偿责任。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "106": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "完整原文载明猫道侧翻后3人送医均死亡，死亡人数已达较大事故的3人下限，选B。A少于3人档不符，C/D需达到更高指标；不是按当时仍在猫道的人数、17名上工人数或坠落高度确定等级，应按法定伤亡损失指标。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "107": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "原文3人死亡按较大事故，通常由B设区市政府负责调查，A县对应一般，C省对应重大，D国务院对应特别重大。不能由涉事项目部自己替代法定调查，依法提级或授权情形另论；compact背景截断，人数依据已核对同目录完整原文。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "108": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "安全管理制度不完善属于组织管理缺陷，通常是事故的间接原因；直接原因应落在具体人的不安全行为、物的不安全状态等导致事故的环节，故题干错判B。不能因为管理缺陷重要、责任重大，就把“主要责任”与“直接原因”混为一谈；本题未恢复完整案例细节。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "109": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n题目处罚对象写“事故发生单位”，罚款却按“上一年收入40%”计算，混淆单位罚款与主要负责人按个人年收入处罚两类制度。即便40%在旧法对应某等级负责人罚款，也不能直接套到单位；原库判A存在主体矛盾，应核对原题和事故适用年份。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "110": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "已有案例明确鉴定电梯标准节螺栓未按要求安装是直接原因；安装人员无资格是人员准入、组织管理的缺陷，不等同那个直接机械失效环节，故B。无资格仍可追究管理责任；区分原因层次不等于认为这种违法用工无关紧要。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "111": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "现场电梯安装、使用存在高风险，项目部未安排相应安全管理，说明监督链条缺位，题干把它归为管理松懈是恰当的，判A。安全员不是代替所有人承担责任，但完全缺少现场监督会使螺栓安装、验收和使用问题更难被及时发现。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "112": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n案例有18死1重伤，题干只给监理未履旁站、检查义务，原库据此唯一选C行政责任，但刑事或民事责任是否同时成立还需具体职责、因果关系、主观过错与裁判事实。不能凭职业身份排除其他法律责任；若题目意在问某一行政处罚条款，缺少该限定。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "113": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "案例额定荷载9人而实际运送人数严重超限，超载直接增加升降系统受力，属于现场作用于设备运行的直接危险因素，选A。B通常指资质、培训、制度等管理深层缺陷；C次要、D重要是重要程度用语，不能替代直接/间接这种因果层次分类。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "114": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "变更增加路堤高度会提高附加荷载，软土承载和抗滑稳定需重新验算；反压护道可在坡脚提供反向约束，故原库把未增相应稳定措施列作技术原因而判A。这里说明的是荷载改变必须复核设计的机理，不是声称只要设置某尺寸护道就一定不坍塌。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "115": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在“沉降每日必须超过”，沉降监测是控制填筑速率、识别失稳征兆，沉降过快应预警而不是追求一个最低沉降量，故判B。题中2.5cm、1.5cm也不据此改编为可靠阈值；实际限值应由适用规范、设计和监测方案确定。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "116": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "案例核心是软土地基填筑加高后的设计、专项组织和现场监管问题：A方案考虑、B组织设计、C现场指挥都可能对应这一过程。D违反特种设备操作规程没有与题给软基施工事故相连的设备事实，故问“错误”选D。不能把其他作业常见问题无依据搬进本案例。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "117": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A因地制宜设计、B控制填土速率、C监测沉降、D避免盲目施工分别控制承载、固结及实施过程风险，是软基填筑的有效方向。E一概排除专项方案要求，会掩盖高填方或软土等特定危险条件，故原库问错误选E；是否需要及其范围仍须按工程条件与适用制度判定。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "118": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "模板连接螺栓不足或未拧紧，会使连接处受力和整体约束不足，混凝土侧压力增大时可能漏浆、接缝爆裂直至失稳，故原库判A。它属于构件连接的直接失效链，与教育培训不足等间接管理因素不同；应按设计数量、规格和紧固要求复核，不能只看模板外形完整。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "119": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "高墩作业人员位置高、迎风面大，大风既可能使人失稳，也会增加模板及平台摆动，因此在此类施工中把风致高处坠落纳入防范是合理的，判A。案例当天是否有大风与“应防范这种风险”是两回事；不能因事故叙述未提风就排除预防需要。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "120": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\nD未按规定教育通常是间接管理原因，原库选D有分类依据；但C“施工现场管理不到位”同样是宽泛管理缺陷，并非模板或螺栓即时失效，题干未说明为何C算直接原因。A模板质量、B螺栓质量安装则能直接形成失效，C/D不能据现有表述唯一排除，需核原题。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "121": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A纵向开裂、B连接螺栓断裂、D临近浇筑结束，都是对这类模板失效表象或发生阶段的描述；C未建风险清单属于管理程序问题，不是模板爆裂的物理/时间共同表征，故选C。判断“共同特征”时不要把事故表象、管理原因和法定责任混作同一分类。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "122": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "保险要覆盖建设施工危险暴露期，原题取D开工至竣工验收合格。A出险就终止会使后续无保障，B事故后才开始丧失风险预先转移意义，C下达开工令和仅称竣工不等同题定起止节点。保险义务性质还应按适用年份核对。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "123": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "措施必须适应地质、结构、工艺等A工程特点，否则通用方案可能漏掉特有风险。B业主、D主管要求不能替代风险分析，C企业自身特点只影响组织实施，不是决定具体工程危险的主要依据。不能因公司有模板就不作现场适配。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "124": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "D许可条例通过发证前确认条件建立安全准入，属于源头管理。A建筑法、B安全生产法提供基本义务，C建设安全条例针对工程管理，不能把普遍安全责任等同这一专门许可证准入制度；获证后仍须保持条件。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "125": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "人身及财产损害对应向受害者补偿的D赔偿责任，并可经法院执行。A民事责任范围还含其他形式，未如D精确指向损失填补；B刑事、C行政面对国家追责，不等于把罚款交给受害者，几种责任还可能并存。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "126": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A安全生产管理机构是单位内部组织安全管理的载体。B监督机构容易混成外部监管，C实施、D保障都不是原条例指定机构名称；设机构还要配相应人员、权限和资源，不能只挂一块牌子即认为义务落实。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "127": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "D主体结构关系工程整体承载，是总包应自行完成的核心部分。A整体、C所有把允许依法分包的其他工作也囊括，B主要结构不是此项法定术语。自行完成不免除对合法分包现场统一协调管理的责任。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "128": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "许可审查需确认开工已有C安全施工措施，而不是只证明质量或进度安排。A相关技术太泛，B质量、D进度各有作用但不完整对应这一安全材料要求；提交文件也不等于措施已在现场有效落实。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "129": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A责任制明确每级每岗由谁落实安全义务，使检查、培训和治理有人负责。B群防群治、C检查是手段，D追责是事后保障，均不能取代事前职责分配这一核心；只有签名而无权责资源不构成有效责任制。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "130": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "B监管与生命财产保障体现条例公共安全目的。A评分仅是工具，C一味最少投入可能损害必要条件，D条例不是统一司法解释。评价措施应看风险是否受控，而不是有没有满分或把费用压到最低。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "131": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "邻近建筑和管线受施工影响的方式各异，D专项防护强调针对具体受保护对象采取措施。A组织设计、B一般方案是文件载体，C技术措施太宽，不能替代本题专门防护要求；围挡外的设施也不能置之不理。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "132": {"status": "explained", "source": "原有精选精讲", "text": "《建设工程安全生产管理条例》规定安全警示标志必须符合国家标准，不得自行设计或用企业、地方标准替代。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "133": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "C强制标准是必须遵守的底线，业主明示暗示均不能让违反行为合法。A/B分别是国家行业层级并不都全篇强制，D企业标准更不能代替法定底线；不能因甲方签字同意就放弃强标要求。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "134": {"status": "explained", "source": "原有精选精讲", "text": "《安全生产法》规定特种作业人员必须经专门的安全作业培训并取得「特种作业操作资格证书」，方可上岗作业。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "135": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "原报告调查条例施行于C2007年6月1日，这是制度沿革事实，不是可从事故情节算出的日期。A2002容易与安全生产法年代混淆，B2005、D2009非该条例施行年；历史生效时间也不表示条例及机构名称此后从未变动。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "136": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "举报权不受参与工程身份限制，C任何单位最完整。A建设、B监理、D设计只是其中几类，若限于它们会排除工人公众及其他线索提供者；举报应真实、有具体线索，有权部门再依法核查处理。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "137": {"status": "explained", "source": "原有精选精讲", "text": "道路交通事故、火灾事故自发生之日起 7 日内伤亡人数发生变化的应及时补报；其他生产安全事故为 30 日内。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "138": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "原条例这项罚款决定对应D安全生产监管职责，A卫生、B建设、C劳动保障不是该条指定主体。这里区分行政罚款与法院刑罚、公安拘留，不能因参与事故调查就推定每个部门都拥有全部处罚权；部门名称沿用旧题。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "139": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "发生地政府组织调查，C事故单位所在地政府参与有助查管理和用工等信息。A建设、B监理、D设计所在地可能并非事故单位所在地，不能凭参建方身份替换；牵头调查与异地协助不是互相排斥。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "140": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "原许可规则对领证后不及时开工及延期有期限限制，题设无合法延期而满一年才开工，D已作废。A报告、B核验、C再申请延期都不能当然复活失效证件；中止后复工的核验与从未按期开工是不同情形。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "141": {"status": "explained", "source": "原有精选精讲", "text": "《建设工程安全生产管理条例》：施工单位应对管理人员和作业人员每年至少进行一次安全生产教育培训，情况记入个人工作档案。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "142": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "采用国内强标未规定的国际国外标准，按原程序由A建设单位承担向主管备案的组织责任。B施工、C设计参与技术实施不自动取代项目建设方报备，D监督机构不代建设方办手续；采用国外标准也非任意降低本国底线。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "143": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "D行政部门依法作出的停工整改是行政行为，可按条件申请复议。A公司内部管理、B总包处罚、C建设方扣材均非以行政机关职权作出，是否违法走相应其他救济；不服任何决定都叫行政复议是混淆法律关系。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "144": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n题面完整描述“无国家标准、全国某行业需统一技术要求”的行业标准定义，对应C，原键却A规范性文件。规范性文件范围宽不能替代明确标准类型，原键与定义直接冲突；保留评分但必须核对，不编造为何行业标准不算行业标准。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "145": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "原职业病分类管理办法按当时职能由D安全监管部门制定，非A卫生、B建设或C劳动保障在该题所指权限。分类用于按职业危害风险配置管理要求；这是历史部门分工，不能据此指引现在向已撤改的机构申办。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "146": {"status": "explained", "source": "原有精选精讲", "text": "用人单位是职业病防治责任主体，应保障所需资金投入、不得挤占挪用，并对投入不足导致的后果承担责任。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "147": {"status": "explained", "source": "原有精选精讲", "text": "职业健康检查应由省级以上人民政府卫生行政部门批准的医疗卫生机构承担，县级、市级、区级均不符合要求。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "148": {"status": "explained", "source": "原有精选精讲", "text": "《中华人民共和国职业病防治法》于 2001 年 10 月通过，自 2002 年 5 月 1 日起施行。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "149": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "建设工程安全管理条例原施行时间B2004年2月1日，区别于事故报告调查条例2007年6月1日。A2001、C2009、D2015均不是本条例起点；生效日期属于历史知识，不意味着后续法律修改及行业规定无需再核。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "150": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "依法批准开工报告与申领施工许可证是不同开工路径，前者还需在原题B15日内报安全措施备案。A10、C30、D60不符该历史窗口，别把设备使用登记等30日期限套入；备案也不能代替措施编制、审查和现场落实。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "151": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "B强制性标准提供必须满足的设计安全底线。A行业、C地方、D企业是制定层级或范围，不能保证其中所有内容均强制；设计委托合同也不能把违反强标变成可协商事项，设计合理性直接影响后续受力和施工条件。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "152": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "原建设管理条例由B建设主管会同有关部门制定配备办法，便于统一建筑施工的组织要求。A交通对相应行业有职责但不是这里条例指定牵头，C安全、D行业过于泛称；规则制定与项目具体配备落实应分别判断。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "153": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "活动房是产品，B产品合格证明对应其质量依据。A生产许可、C安全许可、D泛称认证不能自动替代该产品合格要求；有证还需正确安装、可靠基础连接和防风防火管理，不能只凭纸面证明忽视现场状态。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "154": {"status": "explained", "source": "原有精选精讲", "text": "《建设工程安全生产管理条例》：自施工起重机械等自升式架设设施验收合格之日起 30 日内，向建设行政主管部门登记。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "155": {"status": "explained", "source": "原有精选精讲", "text": "三类人员（主要负责人、项目负责人、专职安全生产管理人员）须经建设行政主管部门或其他有关部门考核合格后方可任职。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "156": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "技术评审批准后新材料新工艺安全要求纳入A安全技术规范，便于形成统一可执行的后续监管依据。B标准、C要求、D文件不是题引制度所指定载体名称；批准一次也不代表厂家可无限改变关键材料性能。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "157": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "专业检验机构对设计文件进行技术A鉴定，确认与相应规范的符合性，不等同主管机关B/C/D所暗示的一般审核批准动作。机构资格与设计鉴定是两层把关，厂家自行设计完成不能直接等同已通过这项专业程序。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "158": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "B制造单位掌握电梯结构和技术要求，或依法许可的安装改造修理单位可承担维保。A使用方承担管理并不当然具备专业维保能力，C鉴定、D监督不替日常维保；委托专业维保也不免除使用单位检查和停故障梯责任。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "159": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "原执法程序至少B两名持证人员，兼顾监督、证据与程序规范。D一名不足，A三、C五比最低更多但不是题问下限；人数达到也不能省略出示证件或超越检查权限，旧机构名称与现行职能需分开。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "160": {"status": "explained", "source": "原有精选精讲", "text": "特种设备特别重大、重大、较大、一般事故分别由国务院（或授权部门）、国务院特种设备部门、省级、设区的市级部门组织调查。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "161": {"status": "explained", "source": "原有精选精讲", "text": "《安全生产法》确立「民事赔偿优先」：财产不足以同时支付民事赔偿与罚款、罚金时，先承担民事赔偿责任。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "162": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "本题摘取改造修理后设备状态改变需按规定变更登记，D与该动作对应。A报废涉及注销退出，B出租、C转让可能另触发相应登记义务但不是所引句的“改造修理”情形；不能解释成所有权变动永远不需登记。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "163": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "职业卫生基本保护按D国家标准和卫生要求落实，不能企业自己制定较低限值。A行业、C地方可能有适用补充，但不替代本句国家底线；B企业制度尤其不能以成本为由降低。达标还须依现场暴露检测而非只看制度文件。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "164": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "D工会代表劳动者参与职业病制度制定修改，可反映实际暴露和健康诉求。A/B是外部部门，不替代该内部意见程序；C个人职工可提意见，但题定组织性听取主体是工会。听取不免除单位依法采取防护措施。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "165": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "国家职业卫生标准属于健康保护专业规范，原题由B卫生行政组织制定公布。A建设、C劳动保障、D安全监督在各自领域有职责，但不能任意替换这一制定权限；制定国家标准与地方实施监督也应分开。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "166": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "C法律法规确立单位防治义务，职业卫生标准提供技术界值，二者层级不能颠倒。A安全生产、D政策过泛，B卫生标准本身不能替代法定义务依据。控制危害应先源头替代、密闭通风，而非等患病后补偿。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "167": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "原题按当时申报职能选D安全生产监管，申报用于让主管掌握职业危害并监督治理。A卫生等部门不应随意替换该历史指定接收者；机构分工已可能调整，本解释不把旧名称作为今天实际申报的路线。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "168": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "B央企主要负责人可能处于法定处分适用的公职/国企管理责任范围，其他A个体户、C私企主、D农民仅凭这些身份不属于该范围。行政处分针对组织任职纪律关系，不等于行政处罚，普通违法者仍可能被罚款或追刑责。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "169": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "D罚款是行政处罚而非向受害人补偿的民事责任，故问错误选D。A财产为主、B向特定权利人承担、C主要补偿性体现民责特点；刑事罚金又是另一概念。不能把企业向政府交罚款当已赔偿工人。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "170": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "D进场前不查验会使不合格防护设备直接投入现场，符合原条例该档查验义务处罚。A机构、B提供防护、C宿舍混设也违法但对应不同条款程序，不是可不管；10万至30万元只是此旧题指定处罚口径。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "171": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "B检查记录把发现、处置和跟踪形成可追溯证据，是题目比较行业办法时增加的要求。A现场监督、C报告、D制止本已是现场安全职责；不能因它们没被选中便认为不需要。记录不能代替即时制止危险。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "172": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "事故后逃匿阻断组织抢救和配合报告，原题指定暂行办法相应罚款取D上一年收入100%。A/B/C不是该题指定比例，比例针对相应个人收入而非事故单位营业额；不能把交罚款视为免除其他行政刑事责任。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "173": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "单位负责人获报后向发生地有关部门初报，旧题窗口A1小时，保障救援和监管及时介入。B2、C12、D24会延误这一环节，不能套用逐级上报每级时限；现场人员则应立即报单位负责人，紧急直报另论。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "174": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "工程层面的委员会由A建设方统筹各参建方，区别于施工项目部内部小组由项目经理牵头。B施工、C设计、D监理均参与但不因专业职责成为整个建设项目主任单位；同名“项目”要辨清组织层级。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "175": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "B错误在将分包与总包的连带范围扩大为整体工程，原条例针对分包工程相应安全责任。A统一管理、D总包总责、C分包不服从导致事故负主要责任可并存。总责、连带范围与主要过错责任不是一个尺度。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "176": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "C把遗失声明和补办说成同时，原程序应先报告、在公众媒体声明作废后按要求申请补办，防止失证被滥用。A有效3年、B提前3个月延期、D地址变更属于原题规则；这些时限证件手续未独立核现行版本。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "177": {"status": "explained", "source": "原有精选精讲", "text": "需专家论证的专项施工方案，论证、审查工作由施工单位组织召开专家论证会，建设单位、监理单位参与但不组织。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "178": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "C责令停产停业属有权行政机关的管理处罚。A恢复原状、B停止侵害典型民事责任，D有期徒刑属于刑罚，由法院依法判处。名称里都带“责任”不能混用决定主体，单位也不能自行给人判刑。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "179": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A同时包括安全第一、预防为主、节能环保、综合治理，符合原特种设备法原则表述。B/C漏掉该法特有节能环保等要素，D是其他安全管理原则。特种设备运行既涉及事故风险也涉及能效，不能只取通用两句替原文。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "180": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A国务院与地方各级政府构成国家地方领导层级。B原安监是部门，C省级只是地方一层，D企业是责任主体不替政府领导监督；领导并非政府替每台设备操作，具体生产使用安全仍由相应单位落实。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "181": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A任何单位个人举报最完整，可引入社会监督线索。B企业机构、C监管、D个体户只覆盖部分群体，不能把其他职工公众排除；有权部门依法核实，举报权也不等于可以编造事实或自行强制执法。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "182": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "原调查程序邀请A检察院参与体现相应监督。B法院主要依法审判，不是这一邀请主体，C纪委、D反贪局不能替换原规定名称。此处为历史调查制度措辞，机构改革后的组成应核适用规则，不由旧题直接指导。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "183": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A行政处分针对任职纪律关系，如记过降职开除。B行政处罚针对违法行为的公权制裁，C刑罚、D民事补偿又不同；“警告”可在不同制度出现，需看整组措施及作出主体，不能看到一个同名词就混成同类。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "184": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "B拘役是短期剥夺自由的刑罚，题定由公安机关就近执行。A缓刑是有条件暂缓执行的制度，D监外执行是执行方式，C劳教不是这里的刑罚且属历史制度。刑罚决定与执行机关也不能混同。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "185": {"status": "explained", "source": "原有精选精讲", "text": "事故发生后不立即组织抢救的，对主要负责人处上一年年收入 80% 的罚款；迟报、漏报为 40%～60%，擅离职守另有规定。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "186": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "C建设安全管理条例围绕建设、勘察设计、施工、监理与政府监管系统分责，较基础法律作具体展开。A安全生产法是综合基础，B许可条例聚焦准入，D建筑法范围更广；题问第一次详细展开的专项制度而不是哪个法效力最高。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "187": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "31死按原分级需报国家层面，原常规时限估算为单位初报1小时加县、市、省逐级各至多2小时，合计B7小时。A/C/D不符这一路径；它不是允许故意等满时间，情况紧急仍应及时直报并组织救援。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "188": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\nB可对应原规则有效期内守法且无死亡事故时延期免重新审查的条件，但题干写“可以延期的唯一条件”过度。申请、保持条件、原发证机关同意等程序不能被B替代；免重新审查与任何延期许可不是同一命题，需核原题漏词。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "189": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "按题定一次性工亡补助金20倍口径，22458×20=449160元，约45万元，选A。B接近十倍，C/D不符计算。这里只算一次性补助金，不将其误作丧葬、供养亲属等全部工亡待遇总额；实际适用年度要明确。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "190": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "C完整含安全第一、预防为主、综合治理，原行业办法据此形成事故预防与多手段协同。A/D是其他口号，B只两项不完整。不同旧条例原文可能只用两项，须辨文件版本，不把所有措辞题混成一个答案。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "191": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "B按原行业办法考核范围将企业负责安全工作的相应负责人纳入，不应与一般职称是否实际全面负责混淆。A漏项目副职，C把分级负责改统一负责，D否认滑坡高边坡风险，均不符该题定义；具体事故责任仍看实际权责。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "192": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "原罚款暂行办法按事故等级配置处罚权限，特大一档取B国家安监总局。A国务院是政府层级，不等同该项具体罚款决定机关；C/D省政府与发生地单位所在地也不能替换。机构名称历史化，不据此认定当前处罚权限。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "193": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "本题规范JTG F90—2015按原库施行于C2015年5月1日，别与B3月、D4月或A2月混淆。编号中的2015为版本 标准阈值未经现行版本复核，不作为现行作业依据。"}, "204": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "C人身和财产覆盖消防法目的的两类保护对象。A仅生命忽略伤残等人身利益和财产，B只财产，D限公民又漏其他相关人身财产范围。预防与救援均为减少整体火灾后果，不是只保建筑不保人。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "205": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "按原劳动法一般延时规则，每月上限C36小时，A12/B24非该上限，D48超过。上限不是每月当然必须加满，也不替代日延时、协商及特殊情况规则；工资报酬合规不等于可无限安排加班。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "206": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n题干采用“知道或应当知道权利受侵害”起算表述，却给C60日；劳动争议调解仲裁制度通常对应一年，旧劳动法60日又有不同原文背景。不得以2017旧题一概豁免此冲突，需核所引法律及时间，现有选项缺一年。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "207": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\nB把谎报说成仅想法显然错误，实际向外传递虚假报告是行为；但D称损害事实是所有法律责任必要条件也过度，部分行政违法不待实际损害发生。题干泛问法律责任而非特定侵权责任，存在B/D均错疑点，原键不改。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "208": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n题引事故报告调查条例最高限额与安全生产法“情节特别严重”高档罚款不能混用。原键D2000万元需相应特别严重及法律依据，而题只给特别重大一般条件，未说明条款版本。应核出处，不能把所有特别重大都直接套2000万。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "209": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "B建设单位组织掌握场地与周边既有设施资料，并应保证提供信息真实完整。A监理、C设计不能代替这一建设方交付义务，D规划资料也不能自动证明全部地下实况；施工仍需核查未知风险，不能凭一张图盲目开挖。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "210": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "D建设单位在概算阶段确定安全环境措施经费，为招标合同和施工投入留保障。A监理负责监督、B施工实施、C设计提出技术需求，不替项目建设方概算组织责任。前期没列不能成为后期取消必要防护的理由。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "211": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "一般事故按原报告体系向上报到设区市级有关部门，对应A。B较大、C重大、D特大还有更高报送终点；这是上报终点，不等于市政府牵头调查所有一般事故，报告与调查的层级应分开。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "212": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A是条例施行初期已生产企业的过渡办理要求，不是对任何新企业都允许无证先生产一年。B50日、C期满前2个月不符该旧规则，D把免复审误成免申请。过渡历史条款不能外推为当下无证投产许可。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "213": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "C1000万至不足5000万元直接损失是原较大分级一项指标。A死亡不足3、B重伤不足10未达该级，D轻伤数不直接替代分级的重伤指标。边界含上限用语须结合原“以上含本数、以下不含本数”理解。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "214": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "四项中B有期徒刑较A拘役更重且属主刑；C驱逐出境、D罚金不属于这组主刑比较。题问在给定选项中最重，不是整个刑罚体系最高，不能由此否认另有无期徒刑或死刑。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "215": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "原题从民事责任方式总体上选D，可视具体义务分别或依法组合。A/B一概禁止单独或合并过度，C只说单独不完整。但同一违约损失不能因此重复获偿，违约金和损害赔偿衔接、调整仍受具体合同法规则约束。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "216": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "B支付令是依法向法院申请督促清偿金钱债务的特定程序。A援助是获取法律服务，C社会救济不是追付工资的程序名，D泛称制裁不能替代申请事项。存在争议或程序异议时还需按劳动争议等相应途径处理。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "217": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "医疗期保护不能因合同纸面到期自动架空，原题选D续延至医疗期满相应情形消失。B半年、C一年与具体医疗期未必相同，A即时终止不符保护。续延不是无限期保留岗位，后续应按实际劳动能力和法定条件处理。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "218": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "B十五日内办理档案社保转移有助员工顺利衔接就业和待遇。A七日、C一个月、D三个月不是题定窗口；办理转移与结清工资、出具解除终止证明各有要求，不能以存在工资争议扣留档案作要挟。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "219": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "C暴力威胁或非法限制自由直接侵害人身，允许不事先告知立即解除。A/B/D也可能使劳动者依法解除，但不都属于这一无需提前告知的特殊情形。区分解除理由与告知程序，不让正常通知规则强迫人继续受控制。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "220": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "欠薪构成法定解除理由，原分类为C普通性即时解除，不必履行一般辞职预告期。A/B预告不符，D特殊即时多针对暴力、直接危险等不需事先告知情形。即时解除并非所有程序和证据均不需要，应保留欠薪事实与解除通知。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "221": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "B规定医疗期内存在法定保护，不能仅以患病为由按一般非过失规则解除。A试用被证不合录用、C严重违纪、D被追刑责分别可能触发其他解除条件；本题不能扩成医疗期内任何严重违法都绝对不得解除。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "222": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "D不依法缴纳社保可构成员工依法解除理由，原题尾多一字母不改变该含义。A名称法人、B合并分立、C投资人变化一般不当然终止劳动合同；不能把企业股权变化当员工被迫重新签合同的必然依据。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "223": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A工会代表职工一方订集体合同，是代表签约与协商的组织主体。B职代会可参与审议通过，但不等同本题签约代表，C监事会、D股东会站在治理或出资层面。集体合同仍需依法履行讨论和签订程序，非个人私约。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "224": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "B履行已生效集体合同时的权利义务争议，可依法进入仲裁诉讼救济。A/C订立阶段谈判分歧与履约争议程序不同，D检查不是争议对象的同一法定分类。不能把谈不拢任何新条款都直接当已违约执行。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "225": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "C报告书对应环境影响较需系统分析的项目，公众参与让可能受影响者提出风险和诉求。A文件是上位总称，B报告表、D登记表不等同本题特定制度范围。公众意见应真实征集，不是只在内部表格签名。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "226": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "B把生产、销售、转移、使用都纳入，防止淘汰设备换地区继续污染。A/C/D各漏一环节，单禁生产却让库存或转让继续用会破坏淘汰效果。纳入目录及具体时限须依法确认，不由买卖双方自定例外。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "227": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "原消防法题对不履职逾期未改的责任人员取B处分或警告，区别于另有条件的拘留和罚款。A/D将此情形直接升级拘留，C替换处罚种类均不对应指定条款。不是所有消防违法都只警告，须先辨行为和主体。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "228": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "B全国人大常委会可制定修订这部法律，A国务院制定的是相应行政法规而非该法，C全国人大与其常委会是不同立法主体，D军委非本题制定者。立法机关、执法部门和实施救援机关不可混为一谈。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "229": {"status": "explained", "source": "原有精选精讲", "text": "《消防法》第二条：消防工作贯彻预防为主、防消结合的方针，实行消防安全责任制。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "230": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n提出不适当制度后原法路径是向单位提出并协商修改，选项C准确；原键B“宣布废止”赋予单方当然废止权，明显不符。A一概不执行、D直接要求处罚也不是该条表达，须核原键，不能把协商权说成任意宣布制度无效。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "231": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "劳动者组织从属、亲自提供劳动具有人身属性，劳动报酬等体现财产属性，C最完整。A/B各偏一边，D经济关系过宽，不能因发工资就当双方只是买卖服务的平等商事关系，安全保障也不是可任意出售的权利。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "232": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A实际用工是建立劳动关系关键事实，不以B书面签约、C批准设立、D发薪才开始。否则单位可通过拖签拖薪逃避社保和安全义务；没有书面合同仍应结合实际管理、劳动和报酬关系认定。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "233": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "D不得扣押证件或以担保为名收财物，防止单位利用用工地位限制劳动者流动和权益。A/B/C都把禁止项改成许可或义务。核验身份不等于长期扣住原件，工资或工具争议也不使扣证合法化。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "234": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "实际用工后应在B一个月内书面化，确认岗位、报酬和保护条件。A15日、C2月、D3月不是原法宽限期；这不是允许一个月内无需履行劳动保障，劳动关系已从用工开始建立，逾期还有相应责任。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "235": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "C无确定终止时间，而不是A永远不能解除、B不能续订或D不能中止。无固定期限仍可在法定情形依法解除终止，不能被误解为绝对终身合同；反之单位也不能任意单方增加到期日逃避法定保护。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "236": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A劳动报酬直接关系提供劳动的基本对价，属必备内容。B试用、C保密可按条件另约定，D一般福利不等于必须逐项写入的法定基本条款。未约试用不自动有免费试工期，工资仍须依法支付。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "237": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "一年至不足三年合同原法试用最长B二个月。A/C/D是更短期限可能可约但不是题问上限；上限不是必设试用，同一劳动者也不能通过反复续约反复试用，期限还须与合同实际相配。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "238": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "D80%与所在地最低工资构成两条保护约束，不能只满足其中一个。A30/B50/C60均低于题定比例；本题“或”及同岗工资具体适用应看原规则，不能把80%简单套任何一个最低基数来规避更严格保护。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "239": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "C即使合同无效，已经真实提供劳动仍应获得报酬，避免单位用合同瑕疵无偿占有劳动。A可付、B不必、D不得均错误；合同无效原因和其他损害另依法处理，不能混为工资权自动消失。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "240": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "合并分立不应让已建立劳动保障落空，A原合同继续有效并由承继主体依法履行。B自动失效、C全凭情况、D单位自定都会削弱法定承继；具体工作安排可依法协商，但不能仅因公司重组重设试用。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "241": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "B名称、法人、负责人、投资人变化不当然影响既有合同履行，劳动者面对的是用人单位法律主体关系。A/C/D否认或模糊这一持续性；若另有真正法律主体承继、岗位变更，仍应走相应规则，不任意停薪停保。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "242": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "D及时且足额同时要求按期与金额完整，A/C提前不是通常必要条件，B分期可能掩盖拖欠。发了部分或口头答应以后补齐不等于已履行工资义务，经营困难也不能让安全风险津贴替代应得基本工资。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "243": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "B徐某正确：使用单位须将派遣者纳入现场安全管理并提供相应防护。A安某把义务全推派遣方，C万某放弃保护、姚某拒守规均错，D身份不同不豁免。安全权利与守规义务同在，不取决于是否正式员工。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "244": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "B将所有隐患笼统要求报告外部监管，忽略内部治理记录和重大等特定报告规则，原库问错选B。A技术管理消患、C重大督办、D真实记录通报均合理。不能因此误解重大隐患不用报或单位可藏匿事故。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "245": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "D能安全处理即处理、无权无力则及时报有关负责人，兼顾即时防险和资源调度。A一概外报、B/C一概先等负责人会延误本可消除的风险；有紧急危险仍要先保护人员，不能等待层层签字才撤离。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "246": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "B重点行业领域承担高后果、专业性强的救援需求，集中建设相应基地队伍有利于资源匹配。A不分风险全部等量建不现实，C/D单凭经济发展程度也不能决定优先。基层和其他领域仍要具备必要应急准备。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "247": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "B把商业意外险一概强制化，与题库对工伤保险法定义务A的区分不符。C及时报告隐患合理，D高风险单位按条件建救援组织；小规模能否兼职等细则另论。保险转移部分损失，不替代预防和救援责任。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "248": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "B错在“可以”登记建档监控重大危险源，应依法落实而非任意选择。C宿舍隔离、D交叉协议与相应培训考核A均有安全保障意义；考核类型按岗位区分，不能把所有员工都当同一种特种作业证。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "249": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "D紧急停止或采取可能措施后撤离，优先中断人身暴露。A一切手段抢险会强迫无能力者冒险，B仅报告、C静观均不充分。撤离后仍需及时报告协助处置，但不能把先报批当避险前置门槛。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "250": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A书面合同明确岗位、工资和保护条件并便于举证。B口头、C任意口头书面不能替代法定书面义务，D劳务协议未必建立劳动关系。单位没签书面不代表实际用工关系不存在，也不能借改协议名称逃避社保与安全责任。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "251": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "D派遣协议连接派遣公司与用工单位，约定岗位、期限和双方责任；A劳动合同连接派遣公司与劳动者，两条关系不可混。B集体合同、C泛称用工协议不是指定制度名称，用工单位仍承担具体现场安全保护。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "252": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "无工作期间劳动关系未当然消失，派遣方按A所在地最低工资逐月支付，提供基本工资保障。B低保、D失业金属于不同社会保障，C工资指导线不等同法定底线；不能把暂未派到岗位当作可无薪等待。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "253": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "D工作岗位决定技能、报酬与职业风险，是派遣劳动合同需明确的额外信息。A试用、B培训、C保密并不能替代实际去哪、做什么、派多久。派遣合同和现场交底应相互衔接，不能只给一个公司名不明岗位风险。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "254": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A个别合同不得低于集体合同相应底线，防止集体协商成果被逐人压低。C/D必须更高又无依据，等于标准也可符合，B可以低于不对。集体标准也不能突破法律强制性最低保障，层层比较而非任选其一。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "255": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "C工会或职工代表是平等协商的职工方，A董事会、B监事会是公司治理组织不能代员工，D职代会负责前段讨论并非该空代表。程序不只是发通知，直接关系切身利益的规则需依法听取、讨论协商并公示。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "256": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "B起草领导讲话可被工作安排，但不是法定安全职责的替代。A重大危险源措施、C救援演练、D落实整改直接控制风险，均属实质履职。不能用写材料很多证明检查整改已完成，也不能因不属法定清单就随意违抗合法日常安排。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "257": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "D安全设施应随主体同时设计施工投用，防止先生产后补安全。A生产、B公共、C储存描述设施用途，未准确对应“三同时”制度对象。工程竣工验收不等于安全设施可闲置，实际运行仍需保持有效。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "258": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "原公安消防备案制度题的窗口C七个工作日，区别于普通自然日。A/B/D不是指定期限，题中“消防涉及”疑为设计的录入误字但不改原题。该备案主体程序属历史规则，不得据此认定今天仍统一由公安消防按此期限办理。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "259": {"status": "explained", "source": "原有精选精讲", "text": "《公路法》规定改建公路时，施工单位应在施工路段两端设置明显的施工标志和安全标志。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "260": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "原情形首先A责令限期改正，使机构人员尽快落实。B停整、C固定罚款、D吊照各有进一步条件与依据，不能从未设机构就不分情节直接套最重后果；改正也不当然排除依法可同时适用的其他责任。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "261": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A所有从业者接受与岗位相应培训，不因类似经验B免除本场所教育。C培训不合格不得上岗，不能一律直接辞退；D档案须依法建立。培训内容深度可因岗调整，人员覆盖和能力确认不能只凭口头熟练承诺。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "262": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "B协议明确各方责任、措施与协调，弥补交叉作业接口空隙。A请部门不替主体协调，C错时仅是可选措施非完整制度，D推一方管理不免他方义务。签约后还应现场检查，不能把合同当隔离危险的实体屏障。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "263": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "按本题区分，意外商业险采取可依法办理A而非一概B/C强制；D“不必”会误导不重视风险保障。它不同于法定工伤保险，具体行业安责险等其他强制制度另核，不能把一道旧商业险题解释成所有保险都自愿。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "264": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "C工程重大安全事故罪着重相关工程单位违反规定降低工程质量标准并造成严重后果，题目倒塌链与此对应。A一般生产违章、B设施条件缺陷各有其他要件，D非此规范罪名。现实定罪仍须查主体、过错和后果，不是所有倒塌一律同罪。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "265": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "原较大事故负责人相应受刑罚撤职后任职限制取C5年，A/B较短、D10不是题定期限。起算点是执行完毕或处分之日，不能从事故日算完；与更严重事故的本行业终身禁任条件也须分开。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "266": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n同一下标拼入“消防材料防火性能标准”和“安全设施投资纳入什么”两道题，选项A国际/B行业/D国家/E保障费混杂。前题通常国家或行业标准而非AD，后题概算选项缺失；不能从当前拼接文本确认评分AD的含义，待核对原页。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "267": {"status": "explained", "source": "原有精选精讲", "text": "从业人员享有紧急撤离权，单位不得因此降低工资、福利或解除劳动合同，故应允许该行为。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "268": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "C安全管理人员违反管理规定并致数人死亡对应重大责任事故分析。B强迫违章有另专门罪名条件，A行窃失足不因发生在工地就构成本罪，D扎伤是否达严重后果不能只数人数。行为故意与事故结果的主观罪过也不等同。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "269": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "道路运输是原法列举的应强化专门管理行业，98人也不因此免除配置，C。A企业自主可不设、B只兼职、D任意专兼职都忽略行业专门要求；不能把一般单位人数门槛套到列举高风险单位。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "270": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "D具备安全条件是允许组织生产的总前提，A制度、B资金、C机构是实现它的不同部分。只有其中某项纸面齐全不能证明整体达标，前提强调先有可控条件再生产，而非出事故后再补足各类文件。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "271": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "D劳动安全更精确指向此罪保护的生产劳动安全秩序，C公共安全是更上位范畴。A主管、B责任人员是可能犯罪主体而非客体；主体是谁、客体保护什么要分开，不能看见责任人就把其本人当受侵害的法律关系。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "272": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "栈桥板严重腐烂使劳动安全设施不合要求，经理获多次报告仍不改，原题取B重大劳动安全事故罪。A侧重作业违章，C侧重降低工程质量，D需事故后隐瞒谎报行为。重要事实是已知设施缺陷和后果因果，不只经理职称。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "273": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "D吊销执照针对单位许可经营资格，属行政处罚，不是对任职人员的纪律处分。A警告、B记过、C开除可属处分序列；同名警告在不同制度也可能是处罚，需结合对象与整组措施判断，而非只按一个词分类。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "274": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A取证、B现场依法处理、C按条件查扣可属于法定监督检查权。D替企业审批所有安全方案不由检查权当然推出，方案编审有专门责任主体，故选D。机关只能依权限履职，专业指导不能随意变成收费许可。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "275": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "D公安消防机构是旧备案抽查制度的指定接收方，A上级、B监理、C笼统县政府不对应程序。取得施工许可不意味消防设计可免报或免符合技术标准；本题历史机构和七工作日未当现行业务流程核验。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "276": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "C建设单位组织项目消防设计报送，A设计方负责文件专业质量、B监理审查监督、D施工按设计落实，不能因文件出自设计院就转移报送组织责任。原公安消防审查路径属旧题，具体当期审验程序需另核。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "277": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A管制不关押但限制一定自由，是本组最轻主刑。C拘役、B有期徒刑剥夺自由，D剥夺政治权利属附加刑不在主刑比较内；轻不等于不必执行，刑罚也不能由单位内部处分替代。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "278": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "事故后负责人逃匿会严重影响抢救和报告，原题按拘留法定上限取C15日。A/B不是所问上限，D30不符旧口径；题干省略“以下”不应被理解为所有逃匿一律固定15日，个案仍须有权机关依法决定。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "279": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "C公安机关按法定治安程序决定行政拘留，安全监管部门不能因查事故就自行拘人。A县级以下泛错、B政府、D监管都未对应专门权限。题引旧“条例”名称应按历史理解，刑事拘留与行政拘留又是不同措施。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "280": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "免责协议无效并不止于道歉，对相应负责人投资人可依法D罚款。A/B/C是单位生产或整改方面措施，未对应此处针对个人的处罚种类。缴罚不能使协议重新有效，更不代替对受害者依法赔偿。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "281": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "原企业管理题把D法定代表人作为企业层面总责对应，B项目经理仅统筹项目，A技术、C安全专职有分工。不能据此把责任机械限于挂名法人，真实事故中主要负责人、实际控制职权及具体失职仍须依法查明。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "282": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A把安全价值优先、事前预防和多手段协同结合，完整对应题定方针。B只事中事后漏预防，C效益优先、D只技术先进不能替代组织和法治。技术进步有益也不是允许人员在未控风险下冒险赶工的理由。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "283": {"status": "explained", "source": "原有精选精讲", "text": "主要负责人法定职责是「组织制定并实施本单位的生产安全事故应急救援预案」，亲自为职工授课并非法定职责。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "284": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "协会可A提供信息、B培训、D自律，发挥社会服务作用；C直接加强企业内部管理若理解为替企业行使行政或经营管理权，就超出这组职责，故问错选C。服务指导不免企业主体责任，协会也不能自行设处罚许可。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "285": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "C可拒绝违章指挥与冒险命令，保护不是无条件服从。A拒绝所有交底不当，B/D擅改方案工艺会引新风险，变更需按程序审批。发现交底不安全应提出并报告，不是自己随手改工艺后继续施工。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "286": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "D决策机构、主要负责人或个人投资人掌握资源并担资金保障责任。A政府、B监管监督不代投入，C财务执行核算不拥有全部安全资源决策。预算不足导致事故不能只推给会计未付款，应查谁未作必要保障。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "287": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "C已有直接坍塌危险而停工，是紧急避险；A知情、D检举属于信息权，B拒绝多指不接受违章指令，未精准对应自主停止暴露。停工后应及时报告并控制误入，不能等架体真正倒塌才认定可避险。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "288": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\nA厨房近可燃仓、B未合格培训焊接、C非专业维修灭火器均有问题，但D把消防培训考核不合格一概直接辞退也不当然合法，与同库261/735对“应予辞退”排除有冲突。培训考核应有、辞退须另有法定条件，原唯一D不能全盘认可。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "289": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A二倍工资针对用工超一月未满一年仍未签书面的情形，督促单位履行书面化义务。B/C/D不是本题倍数；不等于从入职第一天到任意多年都一直翻倍，适用期间、工资基数及其他后果须分开确定。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "290": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "D有关单位依国家规定提取使用，不由单位自选。B自主取舍、C安全好就免提均把法定义务任意化，A所有单位一概相同也忽视适用范围。专门提取制度之外，任何单位都不能以不属提取对象拒绝必要安全投入。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "291": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\nB将重大危险源必须登记管理写成“可以”确属错误，但A把所有普通从业人员也列为必须取得考核合格证书同样过宽；普通岗培训考核合格与特定岗位法定证书不是一回事。单选唯一B不能消除A的并列缺陷。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "292": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "本题旧刑法表述A五年以下或拘役，特别恶劣五年以上，体现强令他人冒险较重责任。B三年分界混入其他事故罪，C/D也不匹配题引版本；是否构罪还须重大伤亡等要件，不能只凭口头命令不看具体危险后果。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "293": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "C把特定工程主体违法降低质量标准、重大事故后果串成构成链。A一般生产违章和B劳动设施安全各有不同侧重，D“工程安全罪”非所问罪名。质量缺陷与事故间因果仍须查明，工程相关不等于任何事故都按此罪。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "294": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "B强调违法导致应承担的不利法律后果，A未限定不利会把奖励等后果混入。C刑事、D行政都只是责任类型之一，还可能有民事赔偿；一种责任成立并不必然排除其他责任依法并行。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "295": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n题目定义核心对应B管制，A缓刑是刑罚暂缓执行制度、D监外执行是执行方式，不是并列刑种。但“由公安机关执行和群众监督改造”是过时表述，管制的社区矫正执行体系不能据此照用；原定义须核对版本后使用。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "296": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "按旧题法定处罚序列可先A限改，逾期条件下B停整并按相应幅度C罚款，D一万元以下非所问规定。不能把100人当免考理由，建筑业负责人考核义务取决行业岗位；原罚款区间不作为现行金额依据。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "297": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A管制是主刑，依法独立适用，不能挂在另一主刑之后当附加刑。B剥夺政治权利、C罚金、D没收财产属于可依法附加的种类；其中可独立适用不意味着变成主刑，分类看刑法属性不是处罚轻重。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "298": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A1998年指建筑法最初施行年份，B1997是通过公布与施行时间易混点，C/D ed", "source": "逐题概念/题干推导补充", "text": "A批评针对问题、B检举反映违规事实、C控告寻求有权机关处理，均属受保护监督途径。D嘉奖、E报酬并非指出安全问题这一权利的组成；提出意见应基于事实，但不能仅因意见刺耳就打击报复。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "309": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\nAB属于法定保护，但C紧急危险时依法停工撤离也不得被降薪或解除劳动合同，原答案漏C。D未及时听号令、E无故离岗不能一概保护，要与真实紧急避险区分。保持原AB评分，需核对漏选而非教人危险时必须留岗。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "310": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A监督三同时，B要求纠正侵权，C对隐患违章建议并获答复，D危急建议撤离均体现工会监督。E前半依法参加调查可以，后半自行行政拘留越权，整项不能选。工会督促并不取代企业组织整改救援。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "311": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "B科学严谨确保技术证据可信，C依法依规确保程序权限，D实事求是避免先定责任后找证据，E注重实效推动整改。A廉洁高效虽有价值，不是题定四项调查原则中的措辞；责任结论不能只凭领导印象。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "312": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "AB隐瞒拖延、C谎报妨碍及时救援调查，D故意破坏现场消灭证据，均禁止。E“任何措施”包括抢救防扩，反而是应积极实施的行为，不能选。为救人确需移物应标记记录，并非机械守现场不施救。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "313": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "CD供电和民爆供应是原法明确的强制履行途径，须现实危险、批准并保证安全，不能随意扩大为A水、B暖、E所有原料。断供前应评估停电引起的次生危险，执法目的不是惩罚性任意停公共服务。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "314": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "AB行业与投资、C国土、D证券监管接收严重违法信息，形成跨部门约束。E工商并非本题旧条文所列这一通报名单，不能因也是行政部门就勾选。通报不等于这些机关可不依各自职权另行随意处罚。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "315": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "AB是原条文列举的街道与开发区属地协助监管组织，C安监站不能替代题定列举，DE居村委为基层群众自治组织非政府派出机关。理解重在职责内检查和协助，不据本题把各种开发区的组织法性质一律认定相同。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "316": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "ABCD对应新闻出版广播电影等传播单位，兼有公益宣传义务和舆论监督权。E学校有自身教育安全职责，但不在该句媒体传播单位列举中。监督曝光须尊重事实，不以舆论报道替代有权机关调查结论。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "317": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "AC国家或行业标准是题引安全生产法明确的保障安全标准层次，B地方、D企业、E国际不能替代必须遵守的法定底线。地方或企业提出更严要求是否适用另论，选AC不代表可以违反实际有效的其他强制规范。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "318": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A法律、C行政法规、B国家或行业标准共同确定本题基本安全条件。D地方、E企业标准不能用来降低或代替上述底线；有设备不等于具备安全条件，人员资质、场所、制度与操作防护也需满足相应要求。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "319": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\nC服从管理通常属义务、E放弃安全保障不是任意免责权，AB建议批评明确受保护。但D报告不能笼统排成“非权利”：发现隐患及时报告是义务，同时任何单位个人依法享有向监管部门报告举报权；原CDE混淆报告场景，待核。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "320": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A管理、B技术、C工人和D临聘，只要在本单位从事生产活动都应纳入安全教育保护范围。E地方官员仅因地域身份不当然成为该单位从业人员。不能用临时工、劳务人员的称呼排除现场防护、培训和风险告知。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "321": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A遵章服管、B正确用防护、C培训掌握技能、D及时报隐患，是岗位从业者履责链。E组织制定单位制度属于主要负责人等相应管理职责，不是每名普通工人的同一法定任务；有建议权也不等于替单位审批规则。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "322": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A责任制规则、B培训资金、C督检查隐患、D预案报告构成负责人管理闭环，均须组织落实。E发展战略是经营职责但非题列安全法定职责，不因不选就否认其经营作用；其他人员执行也不能架空总责。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "323": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A依法记入信息库、B严重违法公告、D向所列监管金融部门通报构成旧制度。C强令负责人主流媒体作检查、E任意替换通报名单并非该条内容。信用信息需如实记录，不能凭未经查实的传闻直接公示处罚。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "324": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "C设计、D施工、E投入使用三个“同时”防止安全设施滞后主体工程，工会可监督提出意见。A进度、B质量并非这个制度的三个时间节点，虽然与工程有关也不能替代三同时。主体完工不意味着安全设施可延后启用。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "325": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "BC责任制解决谁负责，规章制度解决如何开展和约束行为，正是该句基础管理体系。A培训、D检查、E预案均重要但属于具体制度措施，不能把题定两个总括项漏掉。建立文本后仍须执行考核，不能只装订归档。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "326": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "B检测掌握参数、D评估辨识风险水平、E监控持续跟踪，配合建档和预案控制重大危险源。A整改针对发现的不符合，C检查是常用管理动作但非题句三个并列术语；登记不代表风险自然消失，异 现行作业依据。"}, "354": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "ACD覆盖危险是什么、如何防、出事如何处置，是安全告知核心。B经营计划、E薪酬可在其他合同信息中告知，却不能替代岗位风险说明；新设备工艺或岗位变化引起风险改变时，不应只沿用一份入职口头交代。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "355": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "ABD罚金、剥夺政治权利、没收财产为附加刑，可依法独立或附加适用。C记过属处分，E责令改正属行政管理纠错措施，不是刑罚。刑事罚金与行政罚款名称相近但性质程序不同，不能把单位缴罚款当已受刑罚。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "356": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A免责减责协议无效，B原题对应个人罚款区间，保护不能由双方签字任意放弃。C拘留、D撤职、E刑事追责各需另具条件，不能仅签了这种协议就一律认定。罚款金额按旧题口径，赔偿等义务不因受罚而免除。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "357": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "B设计先配置安全技术方案、C施工同步实现、E投用时有效运行，三个同时构成闭环。A决策、D付款并非三同时所列节点，付款同步也不能代替设备实际建成。不得先投产挣钱再逐步补安全设施。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "358": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "原题取A死亡1人、C重伤3人、E直接经济损失50万元这一组旧追诉门槛，强调三类严重后果可分别触发，而非都发生才追究。B/D10人把最低门槛抬高；数额和适用版本未作现行法核验，现实办案不能照旧数机械套用。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "359": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A安全技术设施防急性伤害，B劳动卫生设施控制粉尘毒物等，C相关生产辅助设施保障劳动卫生条件，按原分类均包括。D一般环保、E泛称安全辅助不是该教材三分类；同一设施可有多种作用，不能仅靠名称忽视实际保护功能。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "360": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "ABCD工资工时休息和劳动安全直接影响劳动者切身利益，需依法讨论和平等协商。E纯经营策略不当然进入同一民主程序，但若具体涉及裁员薪酬等仍要看实质。征求意见不是事后贴一张已经生效的决定即可。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "361": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n原ACE却漏B实际负责的分包人、D违章作业人员，两者也可能成为生产作业中重大责任事故主体。是否有证并非排他标准，须有生产职责任务、违规与严重后果的关联；原选项重叠且唯一ACE无法说明为什么普通作业人员被排除。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "362": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\nBCD限改停整罚款可属于行政责任，但E关闭在安全生产法中也有法定适用情形，不应笼统排除。A赔偿通常属民事可排；若题意专问某一违法条款应补具体行为条件，当前问全体行政责任而漏E，原BCD待核。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "363": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A先限改、C停整与B吊证/E降资质是依情节和逾期等条件递进的可能行政后果，D还需构罪才刑责，故这组列可能责任均选。不是每次委托无资质都同时吊证和降级，也不是缴款后即准无资质者继续安装自升设施。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "364": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "BCD使污染防治设施从设计到施工到投产均与主体配套，避免先排污后治理。A筹资、E竣工不是题定三同时术语；仅设备到货或竣工纸面验收不能代替运行时稳定有效，环保设施闲置仍可能违法排放。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "365": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "原题按未履责但未给事故后果的阶段取A限改、逾期B罚款并C停整，逼其恢复管理。DE撤职刑责需相应事故及责任条件，不能在本题事实外直接添加；也不表示出事故后负责人永不担这些责任，题中旧罚额不作现行指南。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "366": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A参与拟定制度预案、B培训记录、C重大危险源措施、D演练均属安全管理岗位的组织监督职责。E建立健全单位责任制主要由负责人组织承担，安全员可参与不等于接走总责。发现问题后应督促闭环，不能只发通知不查整改。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "367": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\nB责任制、C教育及E环保有相应义务，A许可通常建设方办理。但D商业意外险被列成施工企业当然职责，与同库263选“可以”而非“应当”的口径冲突；工伤保险强制与商业意外险不可混同，原BCDE的D须核对建筑法版本及措辞。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "368": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "ABCD改正罚款、停整、降吊资质、没收违法所得均是建筑法中可依法适用的行政后果。E刑责由刑事制度处理不属行政处罚。责令改正在法律分类上不必等同独立处罚种类，本题合并措辞不代表所有违法均可任意并处全部措施。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "369": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\nA一般生产违章对应重大责任事故，CE设施或条件不合规定对应重大劳动安全事故，D质量标准另有工程事故罪。B强令违章冒险在同库268/292已按专门罪情形区分，本题又把AB合称同一罪，存在命名版本混用，原AB需核题源。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "370": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "CE劳动安全设施或条件不合规定是本罪着眼的客观缺陷，须进一步有严重事故和责任人员关联。A一般违章、B强令冒险、D降低工程质量另有不同犯罪构成侧重；同一事故事实可能交叉，不能只因有一台设备就当然按本罪。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "371": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A遵章守纪、B学习掌握安全知识、C发现危险及时报告是从业者应尽义务。D合理化建议属于参与权利不宜一概强制每人必须提出，E提升学历也不是履行岗位安全义务的前提。服从管理不包括必须服从违章冒险命令。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "372": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "ABCD是本题限定的建设设计施工监理工程主体范围，E泛称责任人员未体现特定主体身份。实际刑事责任还须落到相关直接责任人，不能看见某单位参与就处罚其所有员工；亦不能因此把负有特定责任的自然人排除在追责外。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "373": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "BC工作内容地点决定岗位条件，D职业危害关系生命健康，E劳动报酬关系合同利益，应如实告知。A公司所有债务不属题列普遍入职告知清单。危害告知不是让劳动者签“自愿承受一切伤害”，防治保护义务仍在。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "374": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n原ACDE包含主体过错行为损害，但把损害事实作为所有安全法律责任的一般必要条件过宽：不少安全行政违法未出事故仍须担责。若问侵权损害赔偿还应说明因果关系；当前混合各类责任构成，不能以无损害为不培训等违法免责。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "375": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "ACE管制拘役有期徒刑在本组属主刑，按判决执行相应自由限制。BD没收财产和罚金属附加刑，即使可独立适用也不因此成为主刑。企业内部罚款、行政没收与刑事财产刑还需区分，不能仅看动作相似。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "376": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A“个人原因一律免责”协议无效，C负责人或个人投资人依法可罚，不允许用合同预先排掉法定工伤责任。B停整、D刑责另有要件，E有效错误。员工违规可能影响具体责任判断，但不使全盘免责条款合法。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "377": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "ACE批评检举控告是对危险条件程序方式的监督途径，B教育他人、D泛称使用要求不是该句列举权利。提出问题与依法拒绝冒险相配套，不能用“影响工期”压制；也不能借监督名义自行擅改已批准安全方案。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "378": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n承租机械使用前共同验收的法定参与通常涉及总包、分包、出租、安装等相应单位，题原ACD却纳监理A、漏总包B和安装E。需区分租赁进场验收与安装后验收，并补具体情形，不能据原ACD认定总包或安装方可完全不参加。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "379": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "AB管理技术、C总工、D临聘都可属于本施工企业从业者，不因职位高低或用工短而免培训防护。E监理通常受聘于独立监理单位，不天然属于施工企业；其也有自身职业保护和监理职责，不选不是把其排除于安全体系外。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "380": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "AB守法受训、C正确使用防护、E及时报隐患是个人可执行的安全义务。D保险不应一律自费转嫁职工，法定单位缴费责任不能靠合同免除。发现险情应报告并依法避险，而非认为买过保险就可接受无防护作业。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "381": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\nA交通运输主管符合公路行业监管，但C“交通安全生产监督管理部门”与A是否同一机关、是否指法定授权机构未明确。B铁路D水利非该高速公路通常主管，E建设行政另有综合职责边界；原AC应核查法定行业主管与授权监督机构的准确名称。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "382": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "C任压工期损害合理施工条件，D未验收擅用、E不办质量监督手续均有相应行政后果。A拖欠价款可涉合同和支付法律责任，但不当然套题列建设质量处罚；B设计缺陷要查设计主体及建设方具体违法，不能直接按给定短句处罚建设方。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "383": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\nACD教育检查、落实法规、更新制度属于机构职责。B配置专职人员涉及企业组织资源决定可区分，但E“落实安全生产管理责任”也是机构履责基本要求，表述无从排除；若题拟指负责人建立责任制应明写，原ACD与E界限不清。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "384": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "BCD滥发资质许可和发现违法不查直接侵犯监管职责。A施工方案审查、E隐患责令施工整改的这组措辞主要出自监理职责，不能把不同主体条款直接互换；监管本身仍有检查处置权，选BCD不等于机关见险可以不管。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "385": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "ABD深基坑降水、脚手架和土方开挖达到规定规模须专项方案，重点防坍塌失稳。C一般楼地面、E一般屋面不是仅靠名称就列危大工程；其附带高支模高处等风险仍按实质识别，不能因项目叫屋面就免专项管理。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "386": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\nAE董事长总经理在具体组织可属主要负责人，但D安全总监不因该职称自动承担全面经营决策总责，B副总经理也可能依实际职权是主要负责人。原ADE按称谓机械归类，与本库305强调“主要负责人”的实质标准不符，待核适用企业制度。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "387": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\nABCE知情建议避险拒绝均为权利，但D危险报告既可作为向监管报告举报权，也可能是发现隐患及时报告义务。题未限定内部报告与外部举报，原排D有歧义；不能以本题告诉职工没有报告危险的权利。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "388": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "AB建立责任制规程、D组织培训、E保证投入属于负责人组织决策职责。C专项方案具体编制有相应专业岗位和审批程序，不是每名企业主要负责人亲自编写；负责人仍应组织保障合格技术力量，不能因不亲编就对方案失管免责。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "389": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "ABCDE驻地、作业面、危险品、预制加工、非标设备组装均为工程安全链条，风险不限主体桥隧。A生活驻地可能火灾，C爆炸，DE设备加工缺陷会传到现场，因此全部纳监督范围；不能 复核，不作为现行作业依据。"}, "399": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\nB现场纠违、D紧急避险属典型现场处理，A调查取证、C查扣通常在安全监管职权中另分类，E依法处罚也可能由特定现场简易程序实施。题问狭义“现场处理权”却原选ABCD混合不同分类，需补分类教材或法律定义，不能简单以场所区分全部权限。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "400": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A资质证明谁可拆，BC对象与毗邻风险说明会影响谁，D方案说明如何安全拆，E废物清运防止后续危害，全是备案风险闭环。报备者为建设单位，提供施工方案的施工方不因此承接全部报备责任，备案也非风险已被消除。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "401": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "AB基坑土方、C模板、D吊装、E脚手架达到规模均可能群死群伤，须专项方案及安全验算、审批和现场监督。技术负责人总监签字不是形式担保，现场条件或工法变更应复核，不能沿用不适合的旧方案冒险实施。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "402": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "AB用火用电是点火源，CD易燃易爆物是燃料与爆炸源，需制度规程管控，故全选前四。E供水非题句这一组列项，但消防水源仍必须保障；不选供水绝不意味着现场可缺水或堵消防通道。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "403": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "ABC主要负责人、项目负责人、专职安全员对应建设施工安全管理考核，合格后任职。D临聘身份不能直接决定证书种类，E监理不属施工单位同组人员。临聘若实际承担特定持证岗位，仍应按岗位而非合同期限满足资格。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "404": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "AB违规发证许可、C违法不查、D其他监管失职都可追究相应处分，构罪再刑责。E学历造假可能另涉纪律，但不是这组建设安全监管行为的具体构成。处分不能替代撤销违法许可和控制项目现实风险。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "405": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A缺机构监督、B未训或不合格上岗、C缺警示消防、D无个人防护、E设施验后未登记均列违法，覆盖人员场所设备。限改逾期再停整罚款，构罪条件另判；不能把没出事故当作这些基础义务可长期不落实。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "406": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A单位、B时地现场、C经过帮助锁定事故，D伤亡含失联及估损衡量救援需求，E已采取措施避免重复或遗漏，全部应报。初报不掌握的须如实说明并续报，不能为凑一份“完整”材料故意拖过时限。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "407": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "AB单位与经过救援提供事实，C损失量化，D原因性质解释事故链，E责任建议及整改形成闭环。报告不只罗列伤亡或只找一个工人顶责，证据与原因措施要对应，处理建议也不等于未经法定程序即完成处罚。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "408": {"status": "explai 把其中所有特设一概排除此法。判断具体设备适用须看法定对象与专门监管条款；不是在路边使用的锅炉就不受特设约束。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "427": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "ABC是题列企业事业及个体经济用工组织，关键疾病来自职业活动中法定有害因素接触。D村民小组、E街道社区不是仅靠名称就属于此句类别；是否有真实用工接触关系要查实，不能把日常一般疾病都算职业病。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "428": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A暴露达标、B有效防护、C有害无害分开、D生活卫生设施、E工具符合生理心理，均从源头和环境保障健康。C防污染扩散，D防把污染带回生活区，不能只给口罩而缺工程控制，也不能仅一次检测合格就永久免测。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "429": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "ABCD是题引优先选用的四种技术载体，前提是有利防病而非只要新就安全。E“新方法”泛称不在该句列举；应用前仍须识别替代物的新毒性与工艺风险，不能用技术更新名义跳过防护评价和岗位教育。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "430": {"status": "explained", "source": "原有精选精讲", "text": "《职业病防治法》规定警示说明应载明危害种类、后果、预防措施和应急救治措施；「效果」不在法定内容中。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "431": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "B60重伤在50至不足100人档，C20死在10至不足30人档，E6000万元在5000万至不足1亿元档，均重大。A35死已特别重大，D15重伤属较大；多指标达到不同档时从高，不把严重程度平均计算。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "432": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "BCD简经过、伤亡与初估损失是及时初报核心。E责任者处理需调查后决定，不能初报就先定罪；A发生地概况不等于法定“事故单位概况”项，故原选AE。仍须报准确时间地点现场，不可借A未选省掉定位信息。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "433": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "AB先保安全并重预防，C节能环保关注设备效率和环境，D综合治理协调生产使用检验监管，组成法定原则。E经济耐用可属选型考虑但不抵安全，便宜耐用也不能让缺保护或已报废设备继续运行。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "434": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "AB设计及合格证明明确技术和质量，C安装维保说明指导安全使用，D监督检验证明提供规定检验依据，均应按规范随附。E买卖合同只是交易凭证，不能代替技术文件；缺资料应核实补齐而非凭发票直接投入使用。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "435": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A铭牌让现场识别设备身份参数，C警示说明提醒操作危险，要求在显著部位设置。B合格证、D检验证、E设计文件主要随附归档，不等同都贴到机身。铭牌清晰也不能替代档案和定检，防护装置仍须保持有效。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "436": {"status": "explained", "source": "原有精选精讲", "text": "平安工地创建达标单位包括建设单位、施工单位、监理单位和分包单位，材料供应单位不属于考核评价对象。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "437": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n原ABCD把技术主管也纳项目负责人，E安全总监却排除，但题未说明D是否就是项目技术负责人、E实际职责为何。与447按项目经理副经理总工的界定范围不一致；须核对暂行制度原定义及岗位对应，不能把所有技术主管自动视作带班项目负责人。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "438": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "B业主组织统筹隐患排查督办，D施工治理落实具体措施，C监理核实整改真实有效，形成闭环。A设计、E工会可参与监督建议但不替代三方机制。销号不应只凭施工一张自报表，更不能整改未完就撤监控。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "439": {"status": "explained", "source": "原有精选精讲", "text": "依《公路水运工程安全生产监督管理办法》，滑坡和高边坡处理、高瓦斯隧道、爆破工程、水下焊接需编专项方案；一般涵洞基础不在其列。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "440": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\nAD升降机电梯可按相应目录范围识别，C0.5吨普通起重机与升降机门槛不能混用，E一般道路农用车非场内专用车辆。但B承压蒸汽锅炉仅给容积35L，缺压力等目录条件，原ABD不足完整判定，须补参数和目录版本。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "441": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "AB单位时地现场、C经过、D措施均初报必要内容，E责任认定必须调查取证，初报不应强求。已知事实及时如实报告，不明确可标估计再续报；不允许为等出最终责任人而延迟救援上报。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "442": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "ABC政府、安全监管、监察等依法组成调查力量，E检察机关按旧制度受邀参加，D事故单位是被调查对象不能自己担任公正调查主体。参与方可提供专业证据但不能据身份预定责任；机关改革后组织名称与程序需核现行规定。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "443": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A防护设施、B救援演练、D风险隐患评估治理、E检验均直接提升安全条件，属原专门费用范围。C专职人员日常工资按题引办法不在同组专门开支，应按普通人工等适当科目处理；不得借安全费重复列支或替代工资支付。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "444": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A防护、B车辆船舶定位识别、C安全检查评价咨询、D安全技术推广服务运输风险控制。E人员劳动保险属相应保险保障支出，不在原题安全专项同组；项目新改扩安全评价等例外要按适用办法分清，不能所有叫安全的支出都随意列。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "445": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "B违章指挥、D违章操作、E违反劳动纪律构成现场
