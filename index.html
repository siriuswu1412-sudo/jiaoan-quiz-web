更是后续模型特别突出环节，不应混入这条经典五因素名称；缺失的人的缺点不影响识别已有四项。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "820": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\nA现场调查、B任务分析、C检查表、E故障树均有明确方法含义，但D“危险性树分析法”与故障树、事件树等名称的关系未说明，原键全选不能证明它是另一套独立标准方法。应核原词是否“事件树”或另一译名，不编造其步骤来凑解析。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "821": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "提供合适防护用品控制人身暴露，书面告知危险操作规程和违章危害则让人员知道如何使用及何种行为不可做，两个环节缺一不可，故A。仅发衣帽而不告知危险、只让工人签字却不实际交底，都不能达到题干要求的保护效果。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "822": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "治理隐患期间设备可能拆开、防护可能临时失效，整改过程本身也会有危险，因此要同步采取安全措施。无法保证安全时先撤出危险区并疏散可能受影响者，故A。不能因为是在“消除隐患”就容许人员无防护暴露到整改结束。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "823": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "现场作业人员最接近不安全状态，及时报告能让有权限者组织处置而非任由风险扩大，原库A。应报告给现场安全管理或本单位负责人等能接续处理的人，不能只告诉无关同事就认为义务结束；若已直接危及人身，还应依法避险，不必冒险等指令。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "824": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "专项安全费需对应实际符合用途的投入和核验记录，少投入的差额不应以安全费名义套取，原库按投入支付原则判A。其目的不是允许为了少付款而减少必要安全投入；若安全措施不足，仍需补足并按合同、适用计量制度处理。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "825": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "专项费用不可在竞价中削减，使必要的安全投入有独立预算和支付保障，原库将“不低于1.5%”视为对应公路水运旧标准，故A。比例来自原题而非计算推导，不可外推到现行所有工程和年度；实际计取基数和费率需另核适用制度。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "826": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "新工艺、新方法、新措施往往超出人员已有经验，若仍只讲旧做法容易在关键步骤失控，所以交底优先突出变化点与相应控制，A。优先并非只交代新技术，常规风险、岗位职责和应急要求仍应完整交底。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "827": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "把安全费用列入造价并排除竞争性削减，是让投标价格竞争不以牺牲必要安全投入为代价，原库A。“标外管理”在这里指安全费用的专门核算管理口径，不能理解为不在工程造价中体现；具体概算有特别规定的仍须遵从。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "828": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "态度影响是否愿意守规，知识技能影响是否会做，健康与劳动条件影响能否持续正确操作，多种因素都可能表现为不安全行为，故A。不能把所有违章简单归因于“工人不小心”，整改应同时考虑培训、适岗和作业环境。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "829": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "安全费应随分包承担的安全工作合理拨付，并由总包监督专款使用；同一工程成本若总分包重复提取会造成重复计费，故原库A。不再重复提取并非分包不必投入安全，而是使用已按制度分配的安全费用履行自己的措施责任。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "830": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "安全投入需预先与风险、施工计划和现金流匹配，年度提取使用计划进入预算可避免临时无钱治理隐患，故A。预算并不允许把未用余额转成一般利润，发生新风险时也应依法调整投入，而非以“年初没列”为由拒绝必要安全措施。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "831": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "特种作业须具备专门知识和操作资格，单位安排无培训、无相应资格者上岗，属于选人用人和现场管理缺陷，造成事故可追究有关人员责任，故A。不能把责任全推给实际操作者，也不能用普通入场教育替代特种作业培训资格。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "832": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "书面记录与双方签字可固定检查时间、问题、处理意见和责任人，便于复查追责，原库判A。签字是过程留痕而非安全保证；若负责人拒签也不能让已发现问题无记录无处置，应按相应程序记明情况，不能只为签名走形式。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "833": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在“短期可以”。承包、租赁对象是否具备条件及资质是安全准入要求，不因合同只有几天就豁免，故B。短期作业同样可能出重大事故，发包方也不能用期限短、按临时工处理来规避审查和协调责任。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "834": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "发生火灾、坍塌等紧急情况时，出口标志让人员找得到，畅通和不锁堵让人员出得去，所以A。平时方便防盗、管理出入不能成为封堵逃生出口的理由；出口数量、宽度等还须符合实际疏散要求，而非只挂标识即可。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "835": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "先明确审什么范围、由谁审、怎样安排以及用哪些文件作依据，才能使审核有一致标准和证据链，故A。这些属于实施前策划准备，不是审核发现形成后的整改验证；不能用临场随意查看替代计划性审核。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "836": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "重大应急行动可能同时涉及救援、医疗、交通、信息等部门，先明确组织与职责可减少多头指挥、任务无人承担，故A。事故现场还需统一协调和动态分工，预案写有机构名称并不自动保证各方知道联络和接口。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "837": {"status": "explained", "source": "原有精选精讲", "text": "安全检查既查软件（思想、管理、制度、整改与事故处理）又查硬件（设备、防护设施），「五查」表述正确。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "838": {"status": "explained", "source": "原有精选精讲", "text": "后勤保障组织的职责正是提供救援所需设备、设施、物资以及生活、医药等保障，故正确。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "839": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "监管提出的整改或达到基本安全标准的缺口，涉及现实而非可选的安全需求，应优先安排资金，原库A。优先不是只有接到监管指令才可以使用安全费，单位对自行发现隐患也有持续投入治理责任。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "840": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "专门制度将“谁能申请、谁审批、如何核算监督”明确化，可减少挪用和无效投入，外部监督提供进一步约束，故A。安全部门签字不能替代财务合规审查，财务入账也不能证明措施在现场已有效实施。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "841": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "原题库采用的一般事故单位罚款区间不是10万至20万元，故B；该数值混入了其他时期或条款的口径。处罚须先分清单位与个人、事故等级和适用法的时间，不能用本题旧金额给现实案件确定罚款，未核现行区间不另编金额。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "842": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "按本题所采用的旧法单位事故罚款口径，较大事故对应50万至100万元，故原库A。这是在区分事故等级和处罚主体，并非按死亡人数逐人乘单价；金额可能随法律修订变化，不能当作2026现行罚款依据。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "843": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "责任制把岗位、职责和相应责任落到人，使培训、检查、投入等其他制度有人组织有人落实，所以称基本制度，A。它不是只写一份总经理责任书；只有职责清晰且可考核，其他安全制度才不易成为无人执行的文件。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "844": {"status": "explained", "source": "原有精选精讲", "text": "生产经营单位应将本单位重大危险源及有关安全措施、应急措施报当地负责安全生产监督管理的部门备案。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "845": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "拆除会改变原结构受力路径，资质、技术及组织能力不足可能导致失控坍塌，建设单位选择具备相应资质等级者是把住发包准入，原库A。对方愿意低价承接或有一般劳务经验，不能代替与拆除工程适配的资格和方案能力。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "846": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错误在“可以挪作他用”。已计入概算的安全作业环境和措施费有指定用途，转去一般经营或其他支出会使必要措施落空，故B。资金暂时结余也不当然改变用途，应按制度、合同及结算要求处理，不能由项目自行改科目套走。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "847": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "职业暴露可通过吸入、接触、能量作用等途径损害健康，达到相应强度、浓度及持续条件可能引发职业性疾病，故原库A。题干的“危害程度”隐含剂量和时间，不是任何一次接触必患病；职业病认定还需职业史、诊断等程序。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "848": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在“不必培训”。被派遣人员同样进入使用单位岗位并面对现场风险，不能因劳动合同与派遣单位签订就省略岗位操作规程和技能培训，故B。派遣单位的教育也不能自动替代使用单位对具体设备、工序和环境的交底。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "849": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "参加工伤保险并缴费是依法保障从业人员事故及职业伤害救济的责任，故A。它与自愿商业意外险不同，也不等于出了事故就只由保险负责、单位无需承担自身法定责任；保险是保障机制而非风险控制替代品。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "850": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在以现金或其他物品替代合适劳保。单位应保障人员实际获得符合岗位风险和适用要求的防护用品，发钱不能确保买到、会用或及时更换，故B。职工愿意折现也不能使必要防护消失，防护用品发放还需使用指导和检查。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "851": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "安全管理机构和人员熟悉风险、制度及监督要求，组织或参与培训是使这些要求转化为岗位能力的重要职责，故原库A。可以由专业讲师授课，但机构不能因此完全退出培训策划、适岗性检查和效果跟踪。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "852": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "题干用重大后果潜力区分重大隐患与一般问题：违法违规造成的人或物的不安全条件，可能导致重大以上事故或严重经济社会影响，应重点排查治理，原库A。这是旧文件表述，实际认定还需匹配适用重大事故隐患清单，不能仅凭个人感觉把任何小问题任意升级。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "853": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "国家交通运输主管部门监督指导地方同行政主管部门开展督办，体现纵向行业监管的层级分工，原库A。督办是督促责任主体落实治理，并不把施工单位的排查整改责任转成主管部门亲自施工整改。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "854": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "原桥隧施工风险分级依次为低、中、高、极高，随等级上升应配置更严格的控制与管理，故A。罗马数字表示等级，不是事故已经发生后的伤亡分级；风险评价要看发生可能性和后果，不能只看项目规模。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "855": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "该表述把全国指导及特定重大项目结果汇总、分析、公示、抽查放在部级层面，体现统一标准和分级考评结合，原库A。不是交通运输部替代所有项目日常自查，企业、项目、监理及地方部门仍各有职责；文件适用范围沿用原题口径。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "856": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错误在“因而单位不是主体”。从业人员参与发现、报告和整改不免除生产经营单位对整体排查治理防控的主体责任，故B。单位需组织、投入并形成闭环，不能把隐患没被某个工人发现当成自己免责的理由。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "857": {"status": "explained", "source": "原有精选精讲", "text": "《安全生产事故隐患排查治理暂行规定》：生产经营单位主要负责人对本单位事故隐患排查治理工作全面负责。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "858": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "隐患涉及公共和从业人员安全，报告权不应只限企业内部人员，允许任何单位个人报告有助于补足监督盲区，故A。报告应尽量提供真实位置、情况和风险线索，不是可以随意捏造事实；举报权也不代替单位自身治理责任。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "859": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在一概“必须专家论证”。危大工程应按要求编专项方案，其中达到规定规模或条件的才需专家论证，不能把编制与论证两层要求等同，故B。无需专家论证的方案也要走审核审批流程，并非可以无方案施工。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "860": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "排查需有工程技术等相关能力支撑，发现后按等级建档、分工、监控和治理，才能追踪到闭环，故A。只统计问题数量不明确责任和措施，会让隐患长期挂账；等级用于确定治理重点，不是低等级就可不管。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "861": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在把职业病防治、工伤医疗保险等依法应另行承担的支出，一概挤进安全费用专门列支范围，原库B。支出与职工安全健康有关不等于会计用途可以混用，需按所适用费用管理办法分类，不能用安全费冲抵其他法定义务。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "862": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n题干含“（____）会。（____）”串字，且把审核批准链写为项目监理工程师→项目经理，明显混淆施工单位技术负责人审核与总监理工程师审查等职责。原库B方向可理解，但应先核对适用年份的方案审批原文和完整题干，不把本句当可执行流程。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "863": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "隐患按要求整改并经复查确认消除后，应销号以使台账状态与现场一致，原库A。销号不是把问题资料全部删除；治理依据、验收结果仍要留存，也不能仅收到口头“已整改”就提前解除必要监控。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "864": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "重大隐患暂时无法立即消除时，继续相关危险作业会把人员暴露于已知高风险，停工用于先切断暴露，故A。停工后还需落实治理、隔离和复查，不是停下生产就自然变为安全，也不是所有无关区域均无条件永久停工。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "865": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "过去事故暴露既有缺陷，现在状态提示当前风险，将来变更会引入新危险；正常、异常、紧急状态的危险也不同，三时态三状态一起考虑可减少遗漏，所以A。不能只看检查当天设备正正常常就断言所有运行情形都安全。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "866": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "企业负责从生产成本中按制度提取，政府依法监督，资金要满足安全需要并规范用途，这四方面共同防止少提、乱用和无效投入，原库A。政府监管不是政府替企业出安全费，企业提取也不是可自行决定是否执行。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "867": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错误是把“工业安全公理”的称呼套给博德理论。原题库将这一称呼对应海因里希因果连锁，博德更强调管理控制等深层环节，故B。两种理论都属事故因果分析，不等于历史称谓可互换。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "868": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "人机轨迹交叉强调人的不安全行为与物的不安全状态在一定时空交汇促成事故，不能只治理其中一边，因此同等关注两类因素，A。不是说每起事故中双方责任或贡献恰好各占一半，而是模型不预设人一定比物重要。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "869": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在把“衡量风险量”定义为辨识。辨识先确认有哪些危险和风险，之后评价才结合发生可能性与后果估量风险水平，故B。工作流程关联但任务不同，列出危险清单不等于已经完成了定量评价。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "870": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "故障树从设定顶事件如爆炸、失效出发，用逻辑关系向下追找造成它的事件组合，属于演绎分析，所以A。它与从初始事件向后推后果的事件树方向不同；不能只按时间先后列事就认为已建立故障树。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "871": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "原题库工作格局分别强调政府统筹、部门监管、企业主体、群众监督与社会支持，各方作用互补，因此A。不能因政府领导就减轻企业全面负责，也不能用群众发现问题代替单位的主动排查；该句是旧教材治理格局表述。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "872": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "事故不仅指死亡，也包括受伤、职业性健康损害以及财产等损失的非预期事件，故A。日常只统计亡人数会遗漏大量风险信号；未造成损失的未遂事件虽需管理，但与题干列出的有损失事故在统计口径上应区分。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "873": {"status": "explained", "source": "原有精选精讲", "text": "施工安全「三宝」是安全帽、安全带、安全网，不含安全鞋，故错误。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "874": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "能量和危险物质的约束可能因人员错误行为、物的失效状态或组织管理缺陷而被破坏，题干从这些路径概括失控，原库A。三者可相互作用，不能发现操作违章后就停止追查设备和管理条件，也不表示环境因素无需考虑。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "875": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n原库将“人的因素比物更重要”判A，但868和原精选96都说明人机轨迹交叉理论强调两者同等重要。该句把并重改成预设主次，和同库模型定义直接冲突，原评分键保留但必须待核验，不能编理由让两种相反命题同时成立。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "876": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在把危险与可操作性研究当现场管理人员“主要方法”。原教材主要对应现场调查；HAZOP是针对工艺偏差的系统化分析，需要相应团队和引导词，故B。方法高级或详细不代表在所有现场最常用，应按分析对象选择。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "877": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "海因里希链条把人的不安全行为和物的不安全状态视为事故发生的关键环节，控制这些环节可中断事故发展，因此A。模型还涉及前置的环境和人的缺点等因素，不能把题干的概括理解为所有原因只有现场两项。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "878": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "主动性绩效测量在事故前监视管理方案、运行准则和法规要求是否落实，用预防性指标检查屏障有效性，故A。事故率、伤亡数等是结果性/被动性信息，不能只等它们变差才判断体系运行是否正常。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "879": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在方针表述不完整。原题库使用“安全第一、预防为主、综合治理”，少了综合治理，故B。这里考原定表述完整性，不是说前两项本身错误；防控需要技术、管理、教育等多方面协同，不能只用单一手段。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "880": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "脚手架依靠节点和连接件传递荷载，出现变形、松脱、裂损等迹象说明受力路径可能劣化，可先于整体失稳出现，所以A。发现征兆应及时停止相关作业、隔离并由专业人员处理，不能等待整架明显倾斜才撤人。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "881": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "治理隐患针对尚未释放的危险条件，发现征兆则提示事故链可能已在发展，及时控制或撤离可降低后果，故A。不能因有征兆观察手段就容许已知隐患长期存在，预防与应急撤离应是层层防线而非二选一。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "882": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错误包括把专家论证泛化为所有危大方案、用内部工程师及部门会议代替应有的专家程序，以及论证后审批链表述不完整，故B。专家范围和审核主体各有条件，内部讨论或一份纪要不能自动替代规定程序，也不能一概认为总工程师最后签字就够了。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "883": {"status": "explained", "source": "原有精选精讲", "text": "已批准的专项施工方案不得随意变动，修改须重新履行审批；方案所需安全技术措施经费不得挪作他用。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "884": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "时间、内容、人员和考核结果共同证明谁在何时学过什么、是否具备基本能力，利于补训和岗位安排，所以A。只有签到或一张合影不能证明教育内容与岗位匹配，更不能倒填、代签形成虚假培训档案。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "885": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在用内部工作分工把全面负责缩成部分负责。主要负责人可分派具体任务，但对本单位安全工作的总体组织保障责任不能因此转移，故B。职责分工明确与最高负责人的全面责任并不矛盾，不能靠授权书当然免责。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "886": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "面对直接危及人身的紧急危险，先停止暴露、采取可能措施后撤离是避险权，题干A。它不等于可以在任何普通分歧时随意离岗，也不要求为保设备而冒生命危险；安全避险后应及时报告和配合处置。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "887": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "破窗情境使失序得到默许，人会受到从众和规范弱化影响，即使原来守规的人也可能被环境带偏，原库A。题干中的“会”应作理论警示而不是断言每个好员工必然违章；关键是及时纠偏、维护一致的规则信号。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "888": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "在同一风险评价口径下，发生概率高且后果大，两维都不利会形成较高风险水平，A。不是只看概率或只看损失；即使低概率事件，若后果极严重也需要重点控制，题干只是同时增大时的方向关系。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "889": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "起因物引发事故过程，致害物直接传递伤害，两者是事故链中的角色而非固定物品类别，同一物可能兼任、也可由不同物承担，所以A。例如绊倒物与随后碰撞的设备可以不同；不能只认物品名字就确定角色。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "890": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "按题中能量交换模型，中毒可阻碍机体正常代谢、供氧和能量交换，归入影响正常能量交换的第二类伤害，原库A。第一类则着重过量能量直接超过组织损伤阈值；不能把所有伤害都理解为撞击或灼烧这种能量过量。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "891": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在“越短越严重”。其他条件相同时，作用时间延长通常会增加接受能量和组织损伤，缩短暴露一般有利于减轻伤害，故B。具体仍受能量种类、强度和人体部位影响，不能反过来认为极短的高能冲击一定无害。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "892": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "B安全第一强调人的安全在生产决策中优先。A把方针固定表述改成以人为本，C只谈事故后防扩大而未讲预防发生，D把以人为本曲解成任个人意志，均不符合定义。管理重视人不等于不需规则和工程约束。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "893": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A厂可由相互作用的人员、设备、流程组成系统。B班组、C生产工艺、D工艺一部分也都可能依分析边界构成子系统，因此绝对否认的说法错误。系统不取决于规模大，而取决于能否识别要素及相互作用与边界。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "894": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "余热锅炉涉及较高压力温度，若连接用波纹金属软管有质量缺陷，可能导致介质泄漏、喷出等直接失效，因此题干的“可能”按原库可判A。现有页面案例截断，不能据此认定调查已证明该软管确有缺陷或它是唯一原因，应区分可能机制与事实结论。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "895": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n题目指定“市级人社部门应为调查组组成”，但页面案例在事故伤亡结果前截断，事故等级与调查组织条件不全；原一般事故调查组成也不能据此必然推出市级人社部门。原库B可保留评分，但缺少完整案例与适用组织规则，不编确定成员清单作事实解析。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "896": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n页面案例在负责人向上报告处截断，未显示死亡、重伤或直接损失结果，无法据现有事实验证B较大。不能把锅炉压力、蒸发量或巨响声当事故等级指标，须恢复完整伤亡损失数据，不编造数字使原键成立。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "897": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "题给主要现象是高温蒸汽大量喷出，热介质造成的灼烫归B灼伤，不能仅因听到巨响就改叫D容器爆炸。A物打需有物体撞击机理，C火灾需燃烧事实。现有案例不完整，具体伤害鉴定仍应对照完整事故经过，而非凭设备名断类。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "898": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "案例17人死亡，在原分级死亡指标中为重大而非特别重大；直接损失1900万元也未把它提高到特别重大，故题干B。按已给事实取较高等级，不能把“严重事故”修辞直接等同“特别重大”这个法定分级术语。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "899": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n选项A责任事故罪、B劳动事故罪、C工程重大事故罪、D危险事故罪多为不完整简称，缺少“重大责任”等规范罪名要素。案例违章致17死可涉及刑责，但具体罪名要看行为与职责，不把“事故严重”直接等同某一简写罪名，原题选项待核。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "900": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "事故初报要求初步估计直接经济损失，间接损失通常难以及时核算且不在这项初报内容的同一要求内；题干把两者捆成必报项，原库B。后续调查或管理分析仍可评估间接损失，不代表可以隐瞒已知直接损失。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "901": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "发生单位的行业、位置、业务等概况有助于接报部门判断风险性质并组织资源，是原题库事故报告信息的一部分，因此A。报告不能只有伤亡数字而没有事发单位与地点，也不应为了等全部资料齐备而延误初报。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "902": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错在仅因死亡未满30人就认定重大。案例还有105人急性中毒，按原题库把急性工业中毒纳入重伤指标的口径，达到100人这一更高等级界点，需按较高指标判级，故B。多个指标不是主次参考关系，不能只盯13名死者。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "903": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "硫化氢具有毒性，井喷释放并向人员扩散会造成中毒，其危险物质本身属于可能造成损害的根源，故A。浓度、风向、暴露时间影响后果，不能因气体看不见或一时未闻到气味就认为不构成危险源。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "904": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "13死本身未达特别重大，但105人急性中毒按原工业中毒纳重伤的规则达到100人门槛，应取更高A。B只盯死亡指标会漏掉中毒人数，C/D更低均不符。这种题务必逐一比较死亡、重伤和损失，不以死亡为唯一尺度。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "905": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "上一案例按105人急性工业中毒达到原特别重大标准，组织调查通常对应A国务院层级。B省、C市、D县与较低事故调查层级相应，不能因事故只发生在一个县就按县负责。组织层级与最初报告地点是两套问题。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "906": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "错误在“主要看死亡、同时参考其他”。原事故分级的死亡、重伤、直接经济损失均有独立门槛，任一达到更高等级都应按较高等级判，故B。该电击案例6死可判较大，不代表其他案例也能忽略大量重伤或巨额损失。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "907": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "无人指挥下自行下放钢筋笼，未防止其磨破带电电缆并使笼体带电，不能说操作人员完全没有违规或不安全行为，故B。负责人、安全员等不在场也有管理责任，但这些间接缺陷不能否定现场作业行为本身的风险。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "908": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "该触电案例6死达到原较大事故死亡指标，3重伤和约100万损失未提高等级，所以C。A/B过高，D仅看经济损失会低估死亡指标。调查分级按任一更高指标，不把3重伤、5轻伤合并当重伤门槛使用。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "909": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "C符合题库采用的旧调查组组成与检察参与程序。A把依法政府组织简化为专家负责，B把提出防范措施与直接负责落实混同，D事故单位技术人员有利害关系不能当然作为正式独立成员。旧机关名称不代表现行机构配置已经核验。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "910": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "梁是楼板的重要承重支承，先拆梁而保留板会破坏支承路径，使板失稳塌落；案例确已发生这一过程，故A。拆除应依据结构和方案安排顺序，不得把构件哪个看着好拆当先后依据，无方案无监护还会进一步放大风险。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "911": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "大型拆除涉及承重体系逐步改变及坠落、坍塌风险，需要先通过方案明确顺序、支撑和防护；达到相应危险条件时论证，故A。题干“必要情况下”保留适用条件，不是断言所有拆除均以同一专家程序处理。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "912": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "拆除资质应与具体工程相匹配，D最准确。A总包、B专业承包是承包组织形式，名称本身不证明具有该拆除能力；C劳务队也不能因能出人就承担需相应资质的整体拆除。合同给钱方式不改变准入条件。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "913": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "拆除方案涉及结构受力和工序安全，按原审批责任由C企业技术负责人把技术关。A安全员监督、B项目经理组织、D项目技术负责人参与编审不能替代规定的企业级批准。还需按条件履行监理审查、论证等程序，不是一个签字包全部。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "914": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "高压线与作业建筑之间空间不足，使长钢管在拆除运动中容易触及导线，属于现场布置/设计形成的物的不安全条件，原库A。将其列为物的状态不等于免除管理层采取停电、迁改、隔离或调整作业组织的责任。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "915": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "安全交底要求立杆向下放，工人却向上并斜拉，使钢管一端接近甚至触及高压线，这是一项具体、可观察的错误操作，归人的不安全行为，故A。下雨、线路过近是共同条件，但不能使违背既定安全操作的方法变成正确。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "916": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "该分类题把“钢管距高压线过近而未隔离”当作现场直接存在的危险状态，原库主要归为物的不安全状态而判B。管理缺陷应进一步问为何未安排隔离、谁未落实方案；同一事实有多层原因，不能把物理状态与组织失职术语简单互换。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "917": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "“不具备知识和能力”描述人员能力条件/缺陷，不是一个已经发生的具体操作行为，所以在本题分类中判B。往斜上方拉钢管才是可观察行为；培训不足可以解释行为成因，但能力不足本身不等于已完成某项违章动作。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "918": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "LEC方法用事故可能性L、暴露频率E、后果C等因素组合评价作业条件风险，原库将其称作格雷厄姆—金尼方法，A。它是半定量分级工具，分值并非精确事故概率；分类结果仍需结合现场条件和控制措施复核。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "919": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n题干已算3×6×15=270，常用LEC分档中270属于高度危险、立即整改方向，对应B而非原键D一般。背景又写L=30而算式用3，若按30算更是2700，不会降为一般；数值录入和评分键均存在明确冲突，保持原键但警示不可照用。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "920": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n若按919的L=3、C=15，将E改10应得450，按该常用LEC表属极其危险A，不是原键C显著。若背景L真为30则4500更高，同样不支持C；需连同919恢复L值并核分档表，不能为迎合C随意改算法。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "921": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n按919算式L=3、E=6，将C改40应得720，常用LEC分档应属极其危险A而非原键B；若L=30结果更大。题库三道连题内部数据及等级不一致，必须核评分表和原始小数点，不能用“旧口径”掩盖算术矛盾。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "922": {"status": "explained", "source": "原有精选精讲", "text": "隧道施工规范规定作业环境空气中氧气含量不得低于 19.5%（体积比），低于此值须加强通风。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "923": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "D每人每分钟3立方米是原题人员新风最低口径，A/B/C不能满足该值。人数只是通风计算一项，还需考虑爆破废气、柴油污染和粉尘，取能满足各项要求的风量；不能人数少就不检测，也不能把旧数当所有海拔工况通用设计值。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "924": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A一榀钢架间距限制无支护暴露长度，偏压会使靠山侧受力不均，更需短进尺及时成环。B/C/D扩大暴露加大失稳风险；原“棉”属榀的录入误字，施工还须按监测地质调整，不是挖到一个间距就可延迟支护。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "925": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A全断面一次暴露大，浅埋围岩成拱条件差，易沉陷贯通地表，故不宜。B台阶、C核心土、D双侧导坑以分部开挖降低扰动，但也需依据地质专项设计，不能把分部法当不需预支护和地表监测的保证。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "926": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "D把洞内存放易燃易爆物说成只需防火措施即可，混淆现场限量领用与设库存放。A禁汽油机械、B配消防、C禁明火取暖分别控可燃蒸气和点火源；不得因装了灭火器就在洞内长期堆汽柴油雷管炸药。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "927": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A钢筋加工不应凭加防护就普遍放洞内，原题要求宜按洞外加工等工序组织，减少占道烟尘火源。B支撑防倒、C焊接挡板保护防水板、D仰拱短段整幅闭合均针对结构和火灾风险；防护不能替代工序场地合理分离。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "928": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "D50米和1000米是原题爆破器材加工场所条件组合，A/B/C混淆洞口防护距离与长隧道运输条件。加工房不是炸药库，洞内例外还须符合选址隔离专项安全条件；不能仅掘进够长就自行在掌子面附近存药加工。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "929": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\nD“喷嘴可对人”明显错误，余压砂浆可射伤。但C突发大量突泥涌水时说“集中全力及时注浆封堵”未先撤人停工评估，可能诱导人员留险区；应先保证撤离和应急控制，不能无条件全员封堵，原唯一D不足。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "930": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "B规定一律干喷不当，干喷粉尘回弹大，应按工艺要求优选湿喷等降尘方式。A清危石防坠、C喷嘴不对人防高压伤、D看异常裂缝识别围岩和支护变形均有必要；湿喷也仍需个人防护和通风。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "931": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "B水准仪测高程差可跟踪拱顶沉降，电子水平尺辅助水平高差测量。A经纬仪更偏角度，C测斜仪测倾斜、D收敛计测两点距离变化，不替代本题高程量测。应固定基准并校核稳定性，否则基准移动会把真沉降抵消。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "932": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A20至50米与本库934给的原试掘进50至100米不符。试段用来校准推进、出土、注浆等参数；B避免久停、C稳定地层换刀、D必要地层加固或竖井检修均防失稳。具体试掘段仍须按工程专项方案，不由旧题直接决定。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "933": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "D临边坑洞不能只设警示不设实体防护，标志不能阻止失足。A通风专项、B通畅排水、C检测有害气体分别预防窒息淹溺中毒；装上护栏也须留合规通行及应急疏散，不得用一根警戒带替牢固防护。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "934": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "D50至100米按原盾构试掘进口径，使参数有足够行程验证后再正常推进。A/B/C过短未对应题值，不能把试段终点当自动合格；还要检验土压出土、姿态、地层沉降与注浆稳定，异常应调整论证。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "935": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "C贯通前10环设纵向拉紧，洞门约束变化时避免管片接缝张开失稳。A/B/D混淆环数，不是越靠末一环才临时想起加固；贯通后快速有序顶推拼装须满足洞口稳定密封条件，不能为快而省检验。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "936": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "C前10环加强注浆，针对临洞口地层与管片约束减弱、防空隙渗水，盾尾出洞及时封缝。A/B/D不是本题环数；注得多不一定安全，压力和量应受控防隆起或跑浆，不能把“加强”理解为无上限加压。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "937": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "B干式钻孔易产尘发热与摩擦火花，瓦斯环境应按防爆要求采取湿式等措施。A双电源保证通风连续，C母线短接绝缘防杂散电，D按规定方向接网并控制起爆端，均为防误爆措施；还须持续检测瓦斯而非只班前测一次。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "938": {"status": "explained", "source": "原有精选精讲", "text": "隧道逃生通道（逃生管道）距开挖掌子面不得大于 20m，以保证突发坍塌时人员能迅速撤离。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "939": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "C超前水平钻孔直接取到前方岩芯、出水等信息，直观验证地层，故最直接。A地质法综合推断，B声波测井、D反射波依物性间接解释，可能多解；钻孔也非无风险，遇高压水瓦斯须有止水控压与预案。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "940": {"status": "explained", "source": "原有精选精讲", "text": "爆破后必须经不少于 15min 通风排烟，确认无盲炮及有害气体超限等异常后，检查人员方可进入工作面。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "941": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A高压在上低压在下、干线在上支线在下便于保持电气间距和规范层次。B/C/D颠倒其中一组，不符题定布置；符合上下顺序仍需满足净距、绝缘和机械强度，不可仅靠挂高一点解决交叉触电风险。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "942": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "D弱爆破短进尺强支护降低扰动与裸露时间，配合预报加固、早封闭、勤测快衬。A强爆、B长进尺、C弱支护分别破坏控制链，是关键干扰点。快衬不意味支护未稳就盲目赶工，异常量测应先停查。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "943": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "原题长度1公里以上洞内起爆站距离取D300米，A/B/C未达题值。距离用于控制飞石冲击波等暴露，但弯道遮挡、通风炮烟、贯通两端警戒还须专门核定；“以h”录入异常按上下文识别，不作为现行爆破距离设计依据。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "944": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "AⅣ级上台阶循环不超过两榀间距，防一次暴露过长而初支跟不上。B/C/D逐步放大不符原限值；钢架间距本身由围岩设计决定，不能把“两榀”硬换成固定米数，地质变差应及时调整而非用旧围岩等级续挖。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "945": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "DⅣ级90米、Ⅴ级及以上70米为原题二衬与掌子面最大距离，围岩越弱要求闭合越及时。A/B/C均较长不符题值；这些是上限而非必须等到该处才衬，出现变形加速应按监测和方案提前处理。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "946": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A按字面只需排水量10%的泵能力，明显不能排走同等涌水，应至少覆盖预计涌水并留规定安全余量与备用能力。B断面足够、C松软地层防冲刷、D突增撤离均合理；不把该10%修饰误读成允许泵能力远小于涌水。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "947": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A无条件先挖后支会失去洞口浅埋破碎围岩约束，应落实预加固并随挖及时支护。B自上而下分层、C禁掏底、D禁上下重叠防边坡坍塌和物体打击；“随挖随支”不等于任何地层都可先大面积裸露。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "948": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "B明洞自下向上挖会掏空上部导致滑坍，应自上而下按方案分层。A先截排水减软化，C松软边坡及时支护，D避雨天开槽均减少失稳。明挖不意味着可不监测周边或在坡脚堆载停机。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "949": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "B洞口侧面50米以外是原短隧道起爆站口径，侧面选位避正向冲击飞石。A较短、C/D不对应题值；不能认为够50米就能无遮挡站立，还须按爆破设计确定掩体与警戒，洞内外所有受影响人员均撤安全区。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "950": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A两开挖面接近15至30米改单向，避免对向爆破互伤并集中控制最后贯通。B/C/D较远非本题转换范围；临贯通仍需准确测量、两端统一指挥和撤人，不能因停了一端施工就允许其人员留在危险洞段。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "951": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "AⅤⅥ级每循环不超一榀间距，较差围岩承载和自稳差，需更短暴露。B/C/D延长进尺不符原口径；“梳/端”是榀的录入问题，实际长度由钢架设计间距给出，不可把两种围岩不同限值互换。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "952": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "D下台阶一次开挖原限1.5米并与上部循环协调，限制拱脚被一次挖空的长度。A/B/C大于题值可能加大支护失稳风险；左右错开和及时封闭等还按方案执行，不能靠上台阶已架好就随意长距离掏底。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "953": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "AⅣ级二衬距掌子面不大于90米，控制初支长期独立承载变形。B/C/D均较远；同题库Ⅴ级70米更严，不能把围岩类别和相应距离对调，距离满足也仍需观察开裂沉降，不是免巡查条件。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "954": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\nD烘烤防水板易燃且损坏材料，不能仅靠“采取措施”允许。但B“防水安全警示标志”疑把防火误写为防水，缺关键火灾警示；A配消防、C灯距控热风险。原唯一D应核原件，不擅改B措辞或假定所有选项无误。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "955": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "D独头超过150米按原题应机械通风，天然换气难满足掌子面新风与污染排出。A/B/C非题定门槛；未到150米也不等于任何工况可免机械通风，炮烟、缺氧和有害气体实测不合格时必须治理后进入。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "956": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "C每月至少取样分析是原题矽尘场所检测周期，ABD非题定频次。矽尘长期吸入可致尘肺，须湿作业通风和呼吸防护；月度取样不替代日常异常监控，地质工艺改变或通风失效不能等到月末再查。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "957": {"status": "explained", "source": "原有精选精讲", "text": "瓦斯隧道瓦斯浓度超过 0.5% 时必须立即加强通风、随时检测并按预案处置，不能按固定时间间隔巡检。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "958": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "D3000米是原高海拔作业特别要求起点，低氧可降低体能判断并加重心肺负荷。A/B/C非题库门槛；低于3000米出现不适仍应评估救治，不能因没达旧数字就拒绝供氧休息，施工前还须健康适应与应急安排。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "959": {"status": "explained", "source": "原有精选精讲", "text": "沙漠等荒漠地区外出作业风险高，每组不得少于 3 人并配备通信设备，故正确。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "960": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n题问接地电阻数值，原答案B却只有“欧姆”无数字，A3、C5、D6不能反推缺失值。不同接地系统与设备适用限值也须区分，不能据常见数值擅补并当已核验；保留原题评分，待对照原页恢复B数字。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "961": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A围栏不小于1.2米是原吊篮平台防坠要求，B/C/D不是题值。高度只是防护一项，还需足够强度、可靠连接、挡脚与安全出入口，不能用达到高度但松动的一根绳代替围栏，安全带生命线亦应独立可靠。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "962": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A每分钟0.1米是原挂篮行走速度上限，慢移便于观察同步、轨道与后锚受力。B/C/D更快增加冲击失稳风险；缓慢不等于可取消保险和指挥，卡阻应停机查因，不得强拉或让人员站在失稳方向助推。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "963": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "B组拼后静载检验承载能力和变形，核对计算与连接是否可靠。A动态运行并不能替代悬浇静载验证，C单个构件拉力不代表整体、D破断会破坏设备。试验按批准分级加载监测，卸载后也要检查残余变形。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "964": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "C“不应收紧承重索”错误，拆前须按方案调整和收紧保持体系受控，防突然松弛侧翻。A清下方障碍、B避免翼缘板妨碍下放、D按既定方向拆面层底梁均控制路径受力；不得先卸关键受力件再临时找约束。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "965": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "D高耸塔体和金属构筑顶部设有效避雷装置，减少雷击传入作业区。A停机臂向不是一律逆风，须按设备顺风自由回转等规定；B通道应有防护不能只说无任何架空物，C把设置升降设施门槛写50米不符原要求，不能等爬高困难才补。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "966": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "D拆滑模警戒距建筑边至少10米按旧题口径控制坠物波及，A/B/C未达题值。实际警戒还看高度、构件长度和风，不能把10米外当绝对安全；统一指挥分步拆并防高空抛物，地面隔离与人员系挂相互补充。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "967": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "B先有水平限位防主桁在悬挂底模时侧移失稳，再按序安装斜拉带。A吊带起升是动作非限位保障，C保险绳、D泛限位不能替代明确的水平约束。每步临时固定和验收要随安装跟进，未形成稳定体系不加后续荷载。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "968": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "D一般至少露出1米按原浮运干舷口径保留储备浮力，A/B/C较低易受波浪进水。不是只看顶面露高，还应验算重心稳性、流速风浪、航道与拖带，偏载或漏水可在干舷尚有时就导致倾覆。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "969": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "原题选C强调行走浇筑工况须验算安全裕度，不是仅厂家合格即能施工D。A加雨棚改变风荷载不能按方便任加，B锚固未可靠不准上篮作业。题给大于1.5为旧题口径，各构件与抗倾覆等不同系数仍须按批准设计逐项核对。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "970": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n原答案B左右两侧严禁站人，与预应力张拉通常重点禁止千斤顶轴线对面及后方站人不符；D“对面及后面”反而更吻合锚具钢束弹射风险。应查原题和设备布置，保留B评分但不能教人员站到轴线弹射区，侧边也须在防护外作业。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "971": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "C动载预压非该悬浇前静载试验要求，不能靠晃动冲击试验代替承载验证。A静载预压、B变形监测、D全面检查共同验证挂篮组装和挠度。预压应按批准加载程序，不能为了加速测变形让人员留在加载危险区。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "972": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "D2米是原110伏以下洞内线路架设净高，A/B/C较低易人车碰挂损伤。低电压仍可能触电短路，不等于随地拖线可用；过车道、与其他线路间距及防潮保护仍另按工况核定，不能只满足一个高度。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "973": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A预裂爆破先形成轮廓裂缝，控制对保留岩体的扰动与超挖。B深眼大爆、C集中药包冲击大不利边仰坡稳定，D长距离并非有效开挖方法名。预裂也须设计孔网装药与防飞石，不能把控制爆破当无需警戒。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "974": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "B反光背心让车辆灯光下人员更易被识别，适应改扩建与社会交通交叉风险。A普通背心、C一般工服不保证可视，D警示套装泛称未体现题定反光。反光衣不能代替交通隔离、导行和限速，人员不得凭显眼就在车道任意行走。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "975": {"status": "explained", "source": "原有精选精讲", "text": "基坑支撑拆除应与回填土进程配合，严禁站在正在拆除的支撑上作业；D 项做法危险且错误。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "976": {"status": "explained", "source": "原有精选精讲", "text": "钢板桩围堰应从上游开始、依次对称向下游插打，以利合龙并减小水流冲击影响。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "977": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "C钻机高耸导电，不能一概不设防雷，应按设备场地要求配置。A就位全面检查防基础连接故障，B停钻妥善安置钻具防落物，D禁人下孔排障防坍塌窒息。停钻还需防误启动，绝不能以经验熟练替代机械锁定。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "978": {"status": "explained", "source": "原有精选精讲", "text": "六级及以上大风和大雨、大雪、大雾等恶劣天气下，应停止高处露天、缆索吊装及大型构件起重吊装等作业。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "979": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "D护圈高出0.30米按原题防雨水杂物流落孔内，A/B米数离谱、C不符题值。护圈不等同防坠护栏，仍需栏杆盖板和口边清杂；孔口周边堆土起吊还会增加坠物和塌壁风险，应 现行作业依据。"}, "1008": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\nD把批量民爆运输押运一律交公安部门，与公安审批运输和企业配置合格押运人员的职责有混淆。ABC也不是规范押运人员选项，当前无清楚合格答案；保留原D，需核原题与适用运输制度，不能当作公安必须随车押运的依据。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1009": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "D垂直边坡深度一般不超2米为原大型推土机旧题值，超过要放安全边坡。A/B/C非题值；任何深度遇松软浸水裂缝都须评估坍塌，不能把2米理解成无支护必安全，机械距边也须保持设计距离。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1010": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "C用适合的木质炮棍可减少金属碰击摩擦火花风险。A铝、B铜、D不锈钢都不能仅因看似不锈不铁就拿来捣药。装药按专业规程轻推，禁止冲击挤压雷管，材料选对也不能容许非爆破人员自行处理装药。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1011": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "D坡道纵队至少20米按旧题留制动和防溜车余地，A/B/C较短。坡道制动距离受坡度湿滑重量影响，20米不是任何条件都足够；上下坡禁空挡滑行换挡失控，视距不足应加大间隔并统一指挥。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1012": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A一次侧15米过长，焊机电源一次线应按相应规范更短布置，常用本题体系5米上限，降低机械损伤触电风险。B二次软缆30米、C接线罩、D防雨潮为旧题正确项；两侧线路功能不同不能套同一长度。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1013": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n原A电阻“40”缺单位，可能是4Ω被识成40，也可能真写40，无法确认合格限值。B用结构管轨搭焊接回路、C取消一次漏保、D气瓶电源放密闭空间均有风险；当前正确项关键数字损坏，待核原页，不能默默把40解释成4欧。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1014": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "D穿雨衣不能使雨天露天电焊安全，潮湿增加触电，应停止不具防护条件的露天作业。A密闭场所通风绝缘救援、B监护及安全照明、C高处火花下方防火均必要；监护人不得无防护入内施救造成连续窒息。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1015": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "C警戒区不得“大于”危险范围方向反了，应至少覆盖坠落摆动影响并留安全余量。AB个体防护、D吊前全面检查控制人员与设备风险；边线应依据实际吊运路径设置，不能只围起吊起点而让吊物越过未隔离通道。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1016": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "D直接捆绑吊索安全系数不小于6按原题口径，接触弯折和受力不均需足够裕度。A/B数值不足，C棱角加护垫确属正确措施但不回答所问系数。具体吊索规格、夹角与结索方式还影响允许载荷，不能只按6倍拉断力选绳。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1017": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "B按允许工况充分打开并可靠支承支腿，扩大稳定支承范围。C/D只开一端容易侧翻，A地面平也不代表承载足够，需合适垫板分压。若设备允许部分伸出工况，必须严格采用其专门载荷表，不能按全伸能力起吊。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1018": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A双机抬吊各机不能仅压到各自额定能力，还需按规范折减留协调偏载裕度。B性能匹配合理分荷、C新重构件先试吊、D溜绳控摆均必要。不能把两机额定吨位简单相加，也不能让一台突然卸载把重量转给另一台。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1019": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "D即便不携物也不能徒手攀塔，应走合格爬梯电梯并落实防坠。A主缆B缆风验算保证承力，C塔顶防雷针对高耸金属风险。题中系数按原口径识别，实际应按系统设计各工况校核，不把某根绳系数当全机安全证明。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1020": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "C把“起重臂下旋转范围外”写入一律禁行，关键危险区域应为旋转范围内及吊物下方，方向写反。A禁斜拉、B禁超载、D不吊不明重量和埋地粘连物均防额外载荷。范围外仍须看吊物摆动和坠落波及，不等于可紧贴边界站人。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1021": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\nBCD通道体检警戒合理，A“上下交叉作业时应设好防护”也不当然错误：应避免交叉，确需时须可靠隔离并论证。题未写无防护或允许任意交叉，原唯一A不足；不能把A判错解释成上下交叉无需隔离防护。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1022": {"status": "explained", "source": "原有精选精讲", "text": "临边防护栏杆应由上、下两道横杆及栏杆柱组成并满足承载力要求；「下方不得有人通行」并非规范规定。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1023": {"status": "explained", "source": "原有精选精讲", "text": "安全带应高挂低用并扣牢在牢固物体上；低挂高用会增大坠落距离与冲击力，是错误做法。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1024": {"status": "explained", "source": "原有精选精讲", "text": "在宽阔水道、船舶往来频繁水域施工必须安排专人值守与警戒，「不需安排人员值守」错误。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1025": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "B吊环不得用冷拉钢筋，其塑性韧性与焊接等性能不宜按普通吊环使用。A一概禁热轧不对，C连接不得随意限定必须焊，D允许应力应控制上限不是要求不小于。吊环材料尺寸锚固均按设计，不能用现成细筋弯一个代替。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1026": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "D把模板和脚手架连整体会把浇筑荷载或模板变形传到人员作业架，应按设计独立稳定。A查吊点、B未固定不续工、C节点牢固防吊装失稳。模板有临时支撑也须确认可承担下一步荷载，不能凭吊钩还挂着就上人。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1027": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A先拆承重会让未稳结构突然失去支承，通常先非承重后承重并满足强度和卸载程序。B上而下分段、C横向同时纵向对称均衡、D安全登高防护符合原题。拆一半暂停应消除悬挂松动件，不准留下临时不稳结构。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1028": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "D稳固登高工具与防护适用于拆模全过程。A把原横向同时纵向对称顺序对调，B梁从支座向跨中、C悬臂从固定端都可能使不利内力突增，应按设计从跨中或悬臂自由端等合理卸载。复杂连续体系必须专门验算不能机械套一般顺序。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1029": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "B直靠其他模板构件会相互牵连倒塌，应A专架或稳妥平放。C清理刷油先支稳、D留通道防挤伤。临时“有人扶着”不能代可靠支撑，取放一片前应确保不会把邻片带倒，风大更需加固停相关吊运。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1030": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "C冷拉区应有防护隔离，防钢筋断裂回弹、夹具飞出伤人，不能反写不装。A传动罩、B避弯曲扫掠范围、D卷扬机良好视线且锚固均防机械伤害。围挡设置后仍禁人员站冷拉轴线或跨越受拉钢筋。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1031": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A并列对焊机仅1米不符，已核JTG F90—2015第5.3.4为至少3米，控制相互闪光飞溅并留通行空间。B室内或防雨、C可靠接地接零、D闪光区挡板均正确。布置够间距仍须防火绝缘，不能让堆料堵掉间隔通道。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1032": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "C检修清理更须可靠保护联锁隔离，不能不设。B切电封下料门、A禁合闸牌、D专人看守共同防误启动和落料掩埋；仅按停机按钮不算能量隔离，进入前确认无残料滑落及运动，作业完清点人员再恢复。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1033": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A袋装水泥最多10袋是原仓储堆高口径，交错码放提高稳定，B/C/D超过题值。地面干燥坚实和通道留距同样重要，袋破或受潮结块不能靠加高堆码解决；取袋从上逐层防倒垛并用适当防尘防护。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1034": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "B管道主要验证承压与连接密封，不是以抗扭试验替代泵送前安全检查。A查泵布料、C软管受控且臂下禁站、D拆管先卸余压均防爆管甩管。堵管不可带压拆接头或朝人排放，清管也要隔离出口危险区。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1035": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "D有人监护也不能带电检修振捣器，应断电隔离确认后处理。A停机切电、B不拉电缆软管搬吊防损伤、C固定模板牢固均合理。湿混凝土环境漏电风险高，漏保、绝缘和个人防护须有效，不能凭设备还能转判断安全。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1036": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "B仅项目部教育不替代热切割等特种作业法定培训资格，须满足对应岗位要求再上岗。A专业培训资格、CD正确防护均必要。持证也不免进场岗位教育和动火审批，培训签到不能代替对危险环境和火灾隔离的确认。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1037": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "D氧乙炔瓶间不少5米按旧题要求隔离，C把瓶至动火点仅说大于5米不足本题体系要求。A氧气接触油脂可剧烈燃烧，B安全附件须按要求检验；还应稳放防晒防倒，不能为够间距把瓶移到疏散通道或热源旁。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1038": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\nA禁超载明确，BD技术负责人未必就是合格起重指挥、缆风绳也不得随意绑电杆脚手架。但C说作业后严格检查设备也合理，除非原意是“仅作业后检查”或应问吊前必要程序；当前未写“只”，唯一A存在并列正确歧义。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1039": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "D驾驶室不存易燃品并配灭火器控制燃油电气火灾。A允许回转范围有固定高度障碍仍会碰臂，B一般不宜吊重行走、C不得将普通吊机用于吊人。特殊允许带载移动需按设备专门工况执行，不能用一般选项授权。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1040": {"status": "explained", "source": "原有精选精讲", "text": "国家标准规定：凡在坠落高度基准面 2m 及以上有可能坠落的高处进行的作业，均称为高处作业。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1041": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "C四级风在原题列项中不属于雷电暴雨大雾这种应停露天高处的恶劣天。A/B/D分别雷击湿滑和视线丧失风险。可作业不是无条件，仍看高处位置、构件迎风面积和设备限值，阵风或局部风速超限须停。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1042": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A模板支撑钉脚手架会使承载与作业防护相互牵连，应按设计独立可靠支撑。B临时撑、C按序拆不留松件、D禁双层拆除防坠物均正确。不能因脚手架看着牢就把混凝土侧压力和模板荷载传给未经此工况设计的杆件。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1043": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "D铁丝绑水平剪力撑不能替代设计规定节点连接，体系难可靠传递侧向力。A专人指挥、B整排组织、C先稳一排再下一排控制安装过渡态风险。最终形成整体前必须保持临时支撑，不能为方便通行提前拆掉。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1044": {"status": "explained", "source": "原有精选精讲", "text": "作业高度为桥墩 20m + 箱梁 4m = 24m，落在 15～30m 区间，属于三级高处作业。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1045": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "D使用合格扶梯等专用通道提供稳定踏步与扶握，防滑坠。A立杆、B栏杆只承担相应结构防护，C绳索无合格攀登系统不许当通道。通道应固定防滑，携带工具用工具袋或提升，不得一手抱材料一手冒险攀架。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1046": {"status": "explained", "source": "原有精选精讲", "text": "乙炔为易燃气体、氧气为强助燃气体，同车运输一旦泄漏极易形成爆炸性混合物，故严禁混装运输。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1047": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A仅班组长验收不足，基础是承重体系关键，应按方案由相应责任人员验收合格后搭架。B荷载高度地质验算、C排水、D防冻胀均控制不均匀沉降。外观平整不能证明地基承载合格，支架搭好再补验会把危险带入上部。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1048": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "D1.05至1.10倍全部荷载为原支架预压口径，检验承载并消除非弹性沉陷。A/B不足设计荷载、C范围下限不足且不符题值；加载须分级对称监测，卸载后区分弹性与永久变形，不能以一次压完无倒塌就免复查。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1049": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "B纵梁之间横向可靠连接可形成稳定整体，防侧翻和独梁失稳。A钢管内灌沥青不是通用加固方法，C/D跨航道道路不必无条件永久封闭，应按审批导行净空和防护安排。是否临时封航封路须与管理部门及专项方案协调。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1050": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "C堆放不宜超2米按原题控制倾覆及取放难度。A钢木同场增加焊火引燃木屑风险，B焚烧清屑带来火灾污染，D宽3米不是该项限值。模板平整码放加垫稳定，清屑应及时安全收集而非现场点燃。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1051": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "C六级及以上大风按原爬模题禁止提升移动，模板迎风面大易失稳。A/B/D不是题定等级；低于六级也要看阵风与设备更严限值，已安装模板仍须按设计加固，不能等停升后才临时寻找锚固点。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1052": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A防砸还须抗冲击，落物动能可能远高于同重物静放，棚体应按相应工况设计。B防电、C防水、D美观不能替代承受落物能力；棚顶铺薄板遮雨并不等于合格防护棚，立柱基础和净空也须保证。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1053": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "C爆前按批准导行方案临时中断受影响交通，防车辆进入飞石冲击波区。A开放、D穿插仍让车辆暴露，B仅引导未清空不足。公告、警戒、确认清场及爆后检查解除是连续程序，不能起爆后再拦车。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1054": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A反光工服在车灯照射下增强可见，减少运营交通与施工作业相互侵入。B彩色不等于夜间反光，C绝缘用于电气特定防护，D化纤还可能遇火熔融。衣服醒目不代替车道隔离和安全通行路线。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1055": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "B实体等符合方案的隔离把施工区和车流分开，降低车辆冲入与人员误穿。A供电、C作业、D行走设施不回答两区分界防护。隔离须连续醒目并适配车速冲击风险，不能只随手摆几只锥筒就让重型作业紧贴高速车流。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1056": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "D按最不利荷载组合验算临时支架，兼顾原结构削弱、施工荷载及转移顺序。A经济、C最小会低估受力，B一般使用荷载可能漏施工不利工况。卸载限载和支撑应先落实，不能先切割再等待支架安装。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1057": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "C停止并安全隔离后加油清扫，防卷入夹伤。A站弯曲半径会被扫打，B低速仍不得换转盘方向，D安全帽不能让不停机换芯销调速变安全。调试需按设备程序确认人员撤出，不能一人检修一人随手试开。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1058": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "B不应笼统尽量交流焊机，交流焊接触电风险需二次降压等防护，应按工况合理选型。A完整外壳、C雨天不露焊、D防触电中毒火灾均必要；选直流也不自动免漏保接地与焊接回路线绝缘要求。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1059": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "C作业区应适当围护隔离，防无关人员进入切割吊运等危险范围。A作业棚、B防火通道、D避高压线分别控制天气、救援和触电风险。围栏不能堵消防疏散，简易棚也要有稳定防风措施而非随意搭几块板。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1060": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "D禁止硬砸强撬造成冲击坍塌和材料飞落，应按批准措施有序卸载。A班组长不能代规定技术审批，B左右顺序不看受力，C机械大面积拉倒即有人配合也不安全。未达拆模强度不得凭工期紧张提前拆承重构件。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1061": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "C小弧抛掷仍是抛物，人员无法可靠预判弹跳落点，禁止。A稳妥溜槽、B系牢绳放、D机械吊运有专人指挥可受控传料。坑内先清危险区，零散工具装容器，不能以物件小或戴安全帽当抛掷许可。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1062": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "B与便桥脚手架随意连结会传入未经设计的荷载振动，支架应按设计自稳。A整排组织、C溜绳控摆、D浇前预压消非弹性变形合理。临时连接若确需采用必须有专项验算，不能靠多绑几根杆冒充整体安全。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1063": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "B预压检验基础承载稳性并测变形，消除非弹性沉降、松弛等。A/C/D说消除弹性不对，弹性变形卸载可恢复，是需测量用于预拱度等计算而非预压后永远消失。监测反常要停查，不能继续加到倒塌前才判不合格。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1064": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A周边警戒防无关人员受坠物打击，按自上向下逐层拆。B从下拆破坏支承，C观察后抛掷仍禁止，D上下双层有人指挥也不能安全化。拆下件应受控传递堆放，连墙件等稳定构件按拆除顺序同步保留。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1065": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A安全例会为管理活动，不是设备本班交接的具体状态内容。B油料、C问题故障、D原始记录帮助接班者知道能否安全运行。交班不能只口头说“一切正常”，未排故障和停用限制必须明确，记录签认不替实际核查。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1066": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A对准液体表面火焰根部扫射，覆盖燃烧区域抑制反应，不能只追B/C/D上方火苗。应从安全上风侧保持合适距离，防高压射流冲溅燃液；火势大、泄漏未控或退路不明时先撤报警，不为灭火把自己困住。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1067": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A安全技术档案汇总身份、维护、检验、故障等生命周期信息便于追溯。B说明书、C指南、D程序只是文件类别，不能代整套档案。维修更换关键件和事故异常须更新，不能买来建一册后多年不补记录。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1068": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "B证件核对合格、检验及所需许可等身份能力，再查实物性能状态。A出厂时间、C产地、D尺寸不能单独证明安全，进口名牌也可能故障或超期。证件还需与机号一致，借别台合格证明不能让设备合法进场。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1069": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A车身反光警示使夜间会车倒车更易识别轮廓，减少碰撞。B彩旗不稳定且夜间不反光，C/D泛称标记未体现此要求。标志清晰不代制动灯光维护，倒车仍要查盲区并按现场路线限速通行。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1070": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "C有效期由产品与规范要求确定，过期、受冲击或异常不得继续佩戴，不能以“买来没怎么用”延长。A使用期B预定期D计算期不对应合格时限。每年检查是原题周期，日常使用前仍应检查帽壳帽衬带扣，受撞未裂也须评估报废。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1071": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A看织带割伤磨损烧灼、缝线、金属连接及绳体等外观异常，频繁使用应经常检查。B数目、C颜色、D重量不能代表承载可靠。外观无异常也不免规定检验和寿命管理，经坠落冲击的用品不得凭看着完好继续用。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1072": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "D棉质是原现场工装要求，较化纤遇热不易熔融粘肤，衣着应适岗防卷挂。A新、B轻、C皮革都不是各工种统一材质答案。特种工况还需阻燃防静电等经确认专用服，普通棉服不能替焊接高热或化学防护。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1073": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "B绝缘鞋按额定电压等级和适用环境使用，超过绝缘耐压范围可能击穿。A电阻、C电流、D电极不能替代产品规定电压等级选型。鞋湿破、被金属穿刺或超检期应停用，穿绝缘鞋也不能容许无证带电作业。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1074": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "B电绝缘性能决定防触电保护，按周期试验，不合格即停用。A力学C耐久D使用为其他或泛化性能，不回答本题电的属性。手套有孔湿污都会降低绝缘，使用前外观查和规定电气试验缺一不可，不能戴普通橡胶家务手套代替。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1075": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "B防电护网针对高压线邻近架桥机大金属构件的接近触电风险。A限电C减压D限高不是本题设施名。设置护网须由有权专业方按方案实施，不能靠一张网侵入法定净距；优先停电迁改及隔离监护，保持设备各姿态安全距离。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1076": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A平台楼梯周边护栏阻挡人员失足，密目网作为补充不能代牢固栏杆。B防电C防风D防砸不是所问临边防护功能。通道开口须有合适防护门，禁止随意拆栏吊料后不恢复，油污积水也应及时清理防滑。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1077": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "D码头本就服务按规定靠泊施工船，不能一概禁止船靠。A专管、B禁非施工车、C禁无关人降低超载碰撞误入。允许靠泊仍须按承载系泊与防撞方案，不得船舶任意冲靠或超核定数量集中停泊。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1078": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "D1.2米是原栈桥码头栏高下限，ABC较低不符题值。临水还须栏杆牢固、挡脚与适用救生设备，出入口开启有控制。高度达标但节点锈断或大开口仍可能人坠水，不可只量一处高度就验收。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1079": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A防雷可能在适用设备场所有要求，但不是该临电“三基本原则”之一。BCD三级配电、TN-S保护、两级漏保分别控制分级供电和触电风险。选择A不表示工地可无防雷，应按实际高耸设备、地区雷暴及规范另核。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1080": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "BCD总配电箱到分配电箱再到开关箱是三级结构。A用电设备是末端负载，不是第四级配电箱，也不能拿设备自带按钮代独立开关保护。层级正确还须一机一闸等相应要求，不能多个大设备随意共一只末级开关。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1081": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "C绿黄双色专作PE保护线，便于识别防接错，AB/D颜色不符。题干括号位置有录入错但空义明确。PE与工作零线N功能不同，不能颜色方便就互换或在末端混接，黄绿线更不得拿来作相线送电。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1082": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "D直埋至少70厘米按原题保护深度，ABC浅易被车辆和开挖损伤。还需规定的砂层保护、硬质覆盖和路径标识，过路处另有防护。深度符合也须回避排水和腐蚀风险，不能无图盲挖既有埋地电缆。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1083": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "D设备5台及以上按原临电组织设计门槛，ABC未对应题值。数量不是唯一触发条件，总容量达到相应门槛也可能须设计；不能用拆成几个班组各不足5台规避统一计算和审批，用电变化后设计也应复核。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1084": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "D总容量50千瓦及以上按原临电题须组织设计，ABC不是题定门槛。与设备5台条件是分别判断而非两者同时满足；负荷计算、配电保护和线路布置需统一考虑，不能只把铭牌功率相加就省掉启动电流和同时使用工况校核。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1085": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\n题中电压“35-ll.kV”范围上限损坏，疑原为35至110千伏，原D8米需在该范围成立才可判。AC等安全距离随电压类别而变，不能猜成11千伏仍套8米；保留原分数，待原页确认电压区间，不据残缺字串作带电净距设计。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1086": {"status": "explained", "source": "原有精选精讲", "text": "「一机一闸一漏一箱」要求每台用电设备必须设置独立开关箱，不得多台设备共用一个开关箱。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1087": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "B末级开关箱应一机专用，不应设分路再带多设备。A每台独立开关箱、C隔离、D短路过载漏电保护分别保障检修隔离和故障切断。隔离开关只隔离不等于全套保护，漏保也不能替代过载短路保护。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1088": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\nAB活动连接插头供配电箱进线不当，C隔离开关应有。但D开关箱不得设置分路同样符合一机专箱原则，与本库1087将“必须分路”判错相印证。当前单选原C漏并列正确D，需核题源而不能教开关箱可随意分路供多设备。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1089": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "B定人定机定岗位落实谁使用维护、用哪台、承担什么职责，减少无证乱用和交接遗漏。A/C/D强调时间费用人数等不是机械三定原义。固定操作人也要培训资格合格，人员换班或设备故障仍须正式交接和停用管理。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1090": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "D警示灯在夜间让临边坑沟可见，配合实体栏盖防失足。A信号B应急C指示名称不特指危险警告功能。亮灯不代表可撤围挡，断电和恶劣天气要检查灯及防护有效性，不能只白天围一圈就无人维护。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1091": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "B使用登记把设备实际使用责任与检验状态纳监管，试验A或通知C不能替代。D操作证是人员资格非设备登记；生产许可、检验和使用登记各管不同环节，不能用操作者有证证明机器可用，也不能有登记却超检运行。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1092": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "D地质良好减少滑坡崩塌沉陷基础失稳，选址还须避洪和落石等风险。A坡地B背风C无水单独不能代表安全，背风低洼还可能汇集气体或洪水。驻地不能图离掌子面近而放在边坡脚、沟口等明显灾害通道。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1093": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A材质检验确认周转构件强度性能与损伤是否适用于受力，旧件可能腐蚀疲劳变形。B用途C品质D性质过泛非指定检验项。原来用过无事故不证明本次合格，尺寸壁厚、连接和实际承载仍按设计及相应检验要求判定。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1094": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "D生产区距集中爆破区至少500米为原题选址口径，ABC较近不符。该值不代爆破设计具体飞石振动空气冲击波范围，地形装药等使影响增大时须更远或另防护；不能在500米线外就无视警戒公告。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1095": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "D生活区与集中爆破区原取至少500米，保护休息人员免突发飞石冲击。ABC小于题值，不能因睡觉时不生产就降低隔离。驻地还须避开危岩洪沟，距离够也不能使不安全地形变合格，应综合核定。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1096": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "D办公区距集中爆破区不小于500米按原题，避免管理人员和访客处在危险区。ABC较小不符题值。办公室墙体不等于爆破掩体，选址与每次爆破警戒两项都需落实，临时搬进施工区开会不能当作无关例外。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1097": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "C封闭管理控制无关人员进入加工机械吊运区，明确出入口和安全路线。A自动化不能免隔离、B所有人禁入不现实、D任意开放增误入。封闭不是堵消防疏散，持证人员操作也须防机械卷入与火灾。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1098": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "C木架棚可燃且连接承力不能一概满足加工场防火防护，应按设计采用合适结构。A警示B封闭D排水分别防误入与场地湿滑积水。棚体还应考虑当地风雨荷载和动火隔离，不能只凭遮雨就验收。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1099": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "C普通水龙射流不能作为油火适用灭火手段，会使浮油流散扩大火面，应配匹配油类火灾器材。A遮阳减暴晒，B防静电、D禁烟火控火源。油罐冷却的专业水系统与拿水柱冲油面不是一回事，不可混同。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1100": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "C沙土可在适用小泄漏小油火中覆盖隔绝，需配相应合格灭火器材。A防坠棚不是题定遮阳等要求，B无静电措施危险，D电阻“不小于100欧”既方向又数值不合安全接地控制。大火优先撤离报警，不可徒手靠罐扑救。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1101": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A禁止烟火明确控制储油区主要点火源，B雨水C入内D车辆不是该专项标识的内容。挂标牌不代动火审批、防静电防雷和消防配置，管理人员也不能以“只点一根烟”越过禁令，泄漏先隔离火源并安全处置。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1102": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A4.5米是原单车道便道宽度口径，BCD不是题值。单车道仍需按长度视距设会车条件，车辆不能为抢道压近临边；雨季排水、坡道防滑与软基承载也应控制，宽度够不意味着满载车可任意高速通行。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1103": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "B所有车辆不得进入不符栈桥施工通行功能，允许符合承载交通组织的施工车。A专人管理、C禁无关人、D禁非施工船控误入碰撞。题中“找桥”疑为栈桥识别误字，不能因可通车就让超重混凝土车不查荷载直接上桥。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1104": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A工程货运车车厢缺核定乘员防护，颠簸甩落、挤压和翻车伤亡风险高，严禁当接送车。B适合C有需求D一般批准均不能改变车辆用途与安全条件。应配合法合规人员接送方案，不能用工地内部路短为货厢载人理由。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1105": {"status": "explained", "source": "原有精选精讲", "text": "六级及以上大风和大雨、大雪、大雾等恶劣天气下，不得进行满堂支架搭设等露天高处作业；室内试验不受此限。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1106": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "ABC预报识别前方异常、预加固改善承载、弱爆破减少扰动，互相配合。D长进尺使裸露过大，E弱支护不能抑制变形，应短进尺强支护及时闭合。早预报不是报告归档，应据结果及时调整工法和防护。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1107": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "ABCDE燃油与雷管炸药都不准把施工洞内当库房存放，避免火灾爆炸及有毒烟气在有限空间蔓延。A汽油蒸发尤其易燃，DE还须专门领退与隔离管理；实际施工限量使用须按制度，不可用“等会要用”掩饰长期囤放。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1108": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A炸药雷管分车降低殉爆，B间距护送、C警示、D排气防火防运输碰撞火源，按原题均选。分车也不能与钻杆工具人员混载，标红旗不代表可无许可运输。题给50米是旧口径，实际运输应遵当期许可和专车规范。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1109": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A看不清易误装，B破碎未支护、C流沙泥、D高压水均危及现场稳定，E未警戒会伤无关人，均严禁直接装爆。不能把爆破当解决未查明水泥涌出的万能方法，须先停工治理评估，条件恢复经确认再作业。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1110": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A井盖B防雨防落人和灌水，D井架避雷、E提升规程防坠落碰撞，均必要。C围栏0.8米不足原要求，不能因有安全门就降低围栏。吊桶人员材料运行应按专项系统控制，井底人员不得在悬吊物下方停留。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1111": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A中隔墙刚浇完就开上拱会在强度不足时受冲击，需达到设计条件。B不把中导洞作爆破临空面、C先行衬砌达强后后行、D错开面、E监测中墙均减少相邻施工干扰。既有一洞成形也不意味着可大装药爆破另一洞。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1112": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\nC跳板也是易雨湿打滑的作业面，应防滑，原ABDE漏C。E“徵台”疑是平台误字，须核原件；ABDE相关面防滑不应拿来排除跳板。保持原评分，不能将本题当作雨季脚手跳板无需防滑的依据。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1113": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "ABCDE道路平台坡道脚手板船甲板均可能结冰湿滑，及时除冰并按工况防滑。D狭窄脚手板、E随船晃动甲板尤其不能忽略。铺防滑物不应遮住孔洞或堵排水，除冰还应防人员滑到临边落水。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1114": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "ABCDE船机、设备、机具防护、消防救生均需检修保养防冻，保证生产和紧急时都能使用。D水系统冻结会失效，E救生用品也可能硬化损坏；防冻不能随意明火烘瓶罐阀管，应按制造说明采取安全方法。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1115": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A反坡按距离水量选泵，C顺坡沟过水足够，D软弱地层防冲刷软化，E突增即撤，均正确。B把排水能力写只大于涌水10%不足覆盖来水，应有充分排量及规定裕度备用。泵有两台也须核总能力、电源和停泵应急。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1116": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "BCDE分台阶、留核心、中隔壁、双侧导坑都可减少浅埋一次暴露，保留支承。A全断面通常不宜，地表拱效应差易沉陷。适宜不等于任选四种都安全，应根据地质埋深地表建筑设计开挖顺序、预支护和监测。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1117": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A托架刚强稳、B观察姿态、C同步升、D慢平移牢牵引、E断能可靠支撑，覆盖搬移拆解过渡态。C不能一边先顶到位导致倾斜，E也非只关总开关就可拆，液压等残余能量须按方案释放，人员避受力绳回弹区。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1118": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "AB机械与监测利于发现险情和打通通道，C交通D医疗E生活物资保障撤离救治被困人员。配备不等于只列采购清单，须位置可达、状态有效、人员会用；医疗药品不可代替通风检测后再进入，防盲救扩大伤亡。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1119": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A工程条件交代风险背景，B目的C项目E方法保证测什么为何测怎样测，D机构落实谁做谁报，均应明确。计划还需数据反馈与异常处置，不能测完只画图不给施工决策，报警阈值也要结合设计和现场校核。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1120": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A先查工作面、B支架安稳、C绝缘良好、D危险工作面不现场拆修钻具，控制坠石机械触电。E残眼可能有残药，不能凭“相应措施”继续钻，应禁止在残眼续钻。孔位不明先标识排查，由爆破专业处理。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1121": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A仰拱短段整幅闭合、B按围岩控落后距离、C硬岩弱扰动处理、D立即初支、E栈桥验算均在原题安全链。C不能为赶底板强爆，E不能靠架一块钢板就让重车越过开挖槽；数字按旧题口径，围岩异常时还应更严控制。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1122": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "AB稳基础连整体，D及时接长且不左右同挖，E不脱空泡水，保钢架传力。C相邻钢架不得同时更换，写“采取措施”不能普遍解除禁止，否则连续失去支承。扭曲应逐榀按加固替换方案处理并持续监测。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1123": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\nACD专管通风、备用风机电源、故障保护可成立，E警示间距需按规范核。但B风速单位写“6mA”为电流单位，不是米每秒，原ABCD把损坏单位列为正确有问题；须核原文恢复单位，不能以6毫安当风速参数。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1124": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "AB年代成因有助识别结构与湿陷，C含水率影响软化，D强度决定自稳和支护，按原题为前置调查。E各向异性不在题定四项但实际不能无视节理方向性；调查要落实针对性工法，不能仅因同叫黄土就套一组参数。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1125": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A试段调参数，B土压平衡核土仓与出土维持面稳定，C避免久停，D稳定地层换刀、E加固或竖井保障维修，均正确。保持土仓满不等于过高土压，必须结合地层沉降和开挖量监控，防超挖塌陷或顶隆地面。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1126": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A负环拆前注浆、C地层加固、D交叉口管片和背土加固稳住转换部位，B专项组织、E平台与机车留距防碰。拆负环不能破坏尚需传力的支撑，联络通道还需查水压地质，不能只凭主隧道成环就认旁通道无风险。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1127": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "AB周边位移和拱顶下沉是原题基本必测变形项，直接反映净空收敛与下沉趋势。C钢架内力、D围岩压力、E锚杆轴力为按条件布置的其他项目，不是一概免测。必要时设计要求其必测，应服从实际方案不能用本题排除。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1128": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A禁汽油设备减可燃蒸气，B备通风排水保连续，CD消防禁明火，E预报监测纳工序，均防洞内灾害。安全设备备着还要能及时切换，不能主机坏后才发现备用未接电；预报报警后要处置，不是记录数字即可。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1129": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "ABCDE坍塌突水触电火灾爆炸均会在隧道封闭通道下迅速扩大，应有针对性预案。B先撤与防盲堵，C先断电安全救援，不能所有险情套“冲进去救人”。预案要结合撤离路线、通讯和演练验证，物资人员同步落实。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1130": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "ABCDE是题引瓦斯压力、综合指标、钻屑、涌出初速、R值等预测检测方法，通过不同响应识别煤瓦斯危险。C不只是看粉尘颜色，D也非普通风速。它们不替代洞内实时瓦斯浓度监测，应按适用地质组合互证，异常立即处置。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1131": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A保留中岩土、B错面、D后行前加固中墙减少相邻扰动。C仅一倍开挖宽不符原要求，E高威力高爆速与低扰动控制相悖。采用控制爆破仍须核药量、振动及先行洞支护，不能把保留中墙当天然永久安全屏障。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1132": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "ABCDE冻结储气罐气瓶阀胶管均禁明火烤或开水直接加热，温差压力变化可致爆裂泄漏回火。处理按设备介质规定的安全解冻方式，由合格人员隔离火源操作。瓶身看不见火花不代表受热后不超压，不能用棉布包着烧来规避。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1133": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "ABCDE支架架体、吊机、临电、房屋基础都可能雨冲松动风倾，复工前须检查。D电设施还需防漏电绝缘受潮，E住宿地基异常可危及夜间人员。巡看一眼不能代必要测量试验，裂缝沉陷未处置不得急复工。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1134": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "ABCDE在建结构设备临设住办公房均受台风荷载，提前加固疏排水。A未成体系结构尤其脆弱，BC应收臂落钩固定等按设备方案。不能只加固办公室而把高耸机械留迎风自由摆，达到停工撤人条件按应急安排执行。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1135": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "AB通风排水、C气体检测、D防爆设备构成洞内生命保障。E坑洞临边“不设防护栏”错误，警示不能阻止坠落，须按风险设置实体防护。气体合格也不免防坠，防爆铭牌也不代表损坏线路可继续使用。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1136": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A反力架验算、C开门后刀盘及时靠面、D基座稳不扭、E顶力均匀确保始发约束。B洞门整体一拆可能突然失土涌水，应按设计受控分步拆。始发前还需确认地层加固止水有效，不能以盾构马上靠上为由取消检查。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1137": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "C岩性D规模E吸水性决定膨胀潜势和影响范围，遇水体积变化会挤压支护并破坏净空。A年代B成因不如这组直接控制膨胀施工参数。调查后需排防水及支护预留等专项措施，不能因岩体暂时干燥就判无膨胀危险。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1138": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "AB双电源和消防保通风防火，D母线短接绝缘防误爆，E接网按规定方向控制起爆端。C干式钻孔产尘发热易诱发瓦斯风险，应按要求湿式等控制。防爆电气、连续检测与通风同等关键，不能有双电源就容许停风继续掘进。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1139": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\nBCDE断面变化、上部、台 责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1167": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "BCD天侧排水沟及时砌筑防渗，避免膨胀岩土吸水胀软。A蒸发池E渗井会向不利地层蓄渗水，不能当统一排水措施。沟有裂漏要修，雨水不应只从路面引到坡脚集中冲刷，排出口须安全导排。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1168": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "C结膜炎D皮肤病E过敏者易受沥青烟气接触加重，按原岗位禁忌判断不宜。AB心脏病高压也应个体健康评估，但不是题定三项职业接触禁忌。防护用品集中保管清洁，不能把污染工服带回宿舍家庭造成二次接触。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1169": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\nBCD守岗、停机换挡、弯道留距可成立，A脚踏板需按安全通行设计而非任意小于机宽。但E点火前启动鼓风机在相应燃烧系统有吹扫防爆意义，原排E需核具体摊铺机燃烧器说明，不能据本题普遍教先点火再送风。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1170": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\nBD操作牌和水泥不超10袋正确，A架空线下设站与E电焊工代电工引拆电不当。但C禁止非作业者进入储料及卸料危险区本身也正确，不能因作业者也受限制就排除该禁令；原BD漏C，待核是否题句有漏字。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1171": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "B能组拼C能分解保证构件组织和周转，D注水下沉E排水上浮提供可控浮力变化，按原双壁套箱要求均选。A非对称沉浮会扭曲失稳不是优点。沉浮还要连续监测吃水倾斜和压差，不能只看是否最终到标高。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1172": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "AB涌流沙水、D涌沙、E坡不稳都反映承载和渗透失控，应停险采取加固防护。C普通积水未必已失稳但也需排查排除，不能置之不理。加固须先保证人员撤安全区，禁止派人站塌口下清水直到防护完成。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1173": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\nABDE过变形冲击振动应力均应防止，但C过大扭转同样会导致挂篮连接与整体失稳，不能从严格控荷中排除。若题只要某教材四词应说明逐字填空范围，当前问应防的物理危险而漏C，原答案待核，不教可容许过度扭转。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1174": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "AB剧烈表振漏油、C电机异声、D断丝滑丝均提示液压或锚固异常，应立即停机排查。E轻微脉动未必等同故障但需关注，不得把异常抖动忽略。停机后先安全卸压隔离，禁止带压拧油管或站锚具轴线检查。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1175": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "ABCDE塔架地锚扣架滑车钢丝绳组成承载传力链，任一失效都可能坠落或整体倒塌。B地下锚固看不见更需核承载与连接，D滑轮转动和绳槽也要查。检查覆盖组装、使用前和异常后，不能只验吊钩就宣布全系统合格。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1176": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "AB过电线和交叉道存在净空触电、视线与通行冲突，须专人指挥按路线通行。CDE日常遇人车房仍应避让评估，但不是一概每遇一人就必须另配指挥的同类条件。靠线特别注意臂杆各姿态与电压安全距离。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1177": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\nAD临时排水和自上开挖正确，BC上下同挖与掏底不安全。但E及时排地表水同样是路堑开挖防软化冲刷的必要措施，原AD漏E，不能据此理解开挖时雨水可留在坡顶坡脚。需核选项或原答案漏录。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1178": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A爆前警戒、C边坡控制爆破减扰动、E及时排水防冲刷软化合理。B远边坡也不能一概宜用大能量硐室爆破，要看设计，D坡度不能按方便随定。爆后及时检查危石裂隙，不能只靠边坡轮廓平整判断稳性。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1179": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A故障停机查、B管接牢支稳、D停歇喷嘴不对人均防高压料喷射伤害。C先空转再加浆可能干摩损坏，需按设备润滑引料顺序，E3米不能让对人喷射安全化。堵管先卸压，禁止带压拆管或用手堵喷嘴。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1180": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "C警戒D清松石E整坡面保证砌筑锚固作业面安全。A65%不是原回填强度要求，B仅墙背0.5米限制重振压范围过窄，须按设计规范留足。墙未具回填受力条件不得抢压，回填应分层均衡并避免设备撞墙。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1181": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A驾驶室前护网挡飞石，D先提锤0.5米查稳性再正式夯击，按原强夯条文。B/C个人镜带使用还看驾驶室设备具体要求，不能替代两项专门检查，E1米不是试提升值。夯区应清场，失稳异响立即停，不在悬锤下观察。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1182": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "AB平整畅排、CD无冲刷阻水让水走设计通道，避免侵蚀基础和倒灌。E沟身可“露水”若意为漏水同样不合，沟底沟身都应按设计防渗。不能只把现场水排到边坡下方未防护土上造成新的滑塌。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1183": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "AC生产生活设施、DE堆机具停车会把人员财产长期暴露在滑坡影响区，均禁止布置。B围挡可用于标危隔离，不属于应禁的人员聚集荷载设施。围挡不能挡住应急撤离路线，影响范围依据调查而非只看已滑部分。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1184": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A分段跳槽、C随挖砌填密实、D先桩后墙逐步稳定滑体，避免一次失去抗力。B大段拉槽、E从主轴向两端先扰最敏感区不当，应按原两端向主轴。任何顺序均须先控水和监测，变形加速先撤再处置。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1185": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "AD上下坡沿允许直线坡向行驶降低侧翻趋势，B横向C斜向易使重心越支承边。E用绳拖不是一般上下坡安全方法，还会引绳断回弹。应低速适挡、不空挡滑行，坡度须在机型限值内，不能直上就无视陡坡。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1186": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A外高内低让车辆趋向内侧减少驶出边缘，C纵向平顺减颠簸失控。B外低使车向坡外滑，D/E不体现横向向内安全坡度要求。填土边缘土体不稳还要留安全距离与专人指挥，坡度安排不代承载检查。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1187": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "ABCD在桥上突然变速制动停车增加冲击或集中荷载，宜桥前选好挡、桥上低速均匀通过。E匀速正是控制目标，不选。不是危险出现也不能制动，而是不应无故急停急加；先核桥涵承载，超限不得上桥。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1188": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A低能见按规定信号、B大风避风、C上下倒运有可靠跳板扶手安全网均合理。D超员不是报告就许可，应不超核定，E锚链滚滑和回弹区不得站人指挥。船间通道要适应潮位摆动，不得拿松动木板一搭就通行。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1189": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "AC熟方案信号、确认吊升俯仰制动良好是起重船作业要求。B反了指导关系，应起重船指导驳船选锚系缆；D只说醒目不保证安全装置有效，E末了应退离安装位并封钩，而非仅入停泊位检查。船位变化还需查缆系稳性。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1190": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "BC桩架活动件系牢、平台护栏防滑防坠物跌落。A打桩作业应统一施工指挥不能仅以船长替代，D绞缆应慢控非快速，E5米不足原规范两侧10米危险范围。航行船长职责仍在，施工统一指挥与航行安全需协调不是相互免除。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1191": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A靠泊及上下通道、C网和救生圈、D航行警示、E密集通航警戒拖轮均防落水碰撞并保救援。B0.8米栏高不足，已核JTG F90—2015为1.2米。救生圈需可取可用，挂在被材料遮住处不能满足紧急救助。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1192": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "BC先依法审批批准再实施。A只项目培训不替专业资格，D当天才公告过迟，E只贴项目部不能让受影响公众知晓，应在规定作业区域显著告知。审批公告警戒各独立，拿到批文不能省清场确认。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1193": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "BC专业安全评估监理、E爆破时限配工程和建设设计施工信息，使公众知晓谁负责、何时影响。A笼统监督单位D班组长不是该句列项，也不能用一个班长电话代法定责任单位。公告应按时提前发布，变更时段及时依规处理。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1194": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A地震效应B空气或水冲击E飞散物是爆炸对外伤害关键，分别计算并综合取足安全范围。CD辐射电磁不是该普通工程爆破保护距离的三类同组效应。地形和覆盖会改变飞石方向，不能简单把距离画圆而不查实际受影响对象。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1195": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A拉稳提绳受控送药、C起爆药包入后禁冲挤、D爆前清船出警戒区均防误爆伤人。B卡药不得用短杆猛处理而应按规程安全处理，E只说服从指挥却仍滞危险区不够，应撤安全位置。装药故障由合格爆破人员处理。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1196": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "B电起爆盲炮先断源、E水下线路有防水绝缘强度与低阻要求。A雷暴暴雪应停非有指挥就可爆，C不能短路反了防杂散电措施，D强电场强用电雷管易误爆。断电后也不得立即近盲炮，须按规定等待和方案处理。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1197": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "AB警戒且不堵涵口、DE不在桥台墩和暗河口弃土，防附加载荷与壅水灾害。C边弃边支会让先期土体处无防护，应先有合格支挡排水再弃。弃土也须分层稳定和监测，不能以离主体工程远忽略场外居民风险。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1198": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A预留宽度B临时排水C边缘警示D位移监测共同防高填方沉降滑移与车辆坠落。E平整度是质量指标不能代监控稳性，未列不是不需质量检验。边缘裂缝或位移加速应暂停查明，不能只重新刮平掩盖异常。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1199": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\nABD专人指挥、清障、踏勘平实路线正确，C所有机械一律专挂车太绝对。但E沿途桥涵承载满足调运荷载是必需，原ABD漏E。若无承载资料应先核定不能赌能通过，不能把不选E理解为调运无需查桥涵。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1200": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A受力主绳固定把力传给可靠支点，C装拆防坠、D无临边防护按条件挂平网、E控制落差，均原题要求。B仅系网格细绳会撕裂脱落。平网仍需合格锚点与净空，网内碎料及时清理，不准在网下面再堆尖锐钢筋。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1201": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A定检和用前检查、B绳不打结挂钩、D不乱拆换、E控制有效绳长，均防承力下降或自由坠落增大。C应高挂低用而非反向，且锚点可靠。连接器扣闭和缓冲器适配同样重要，不把带扣上了就视为已防坠。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1202": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "CD替换绳符合性能并有保护、上下选合格梯塔等通道，保持独立可靠防坠。A安全绳不能改作悬吊承重，B与悬吊绳共连接器失去独立冗余，E绳梯30米非一般安全通道。负责人同意不能把禁用连接方式合法化。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1203": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "BD扶手0.9米、梯宽0.6至1.1米按JTG F90—2015，保障扶握通行。A长度应不宜超5米非15，C踏步应不宜超0.2米非1.2，E超5米应设平台分段非长到15才连续。尺寸记忆须与上下梯稳定、防滑固定一起理解。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1204": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "ABC按旧规范直梯攀高不宜超8米、棍距0.3米梯宽0.6至1.1米、2米以上设护笼。D护笼间距应0.5米且纵向连接，不是1.5米横向；E15米以上还应每5米设平台，不能只在15米放一处。护笼不替必要防坠系统。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1205": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A平台防滑护栏、B螺栓防退、E通道侧网防坠均正确。C塔高超过5米即按旧规范设连墙件，不能等10米；D线路不宜附塔，确需时必须绝缘隔离。塔基稳固与构件验算并重，连墙不能随意锚到未达强度结构。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1206": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "AD脚手架按施工荷载验算，计算依据抽测壁厚与材料性能，避免锈蚀薄管被当足壁。B运营期间不是临时脚手架预定工况，C12米非原抽检门槛，E只管径和力学漏关键壁厚。材料新旧都查，外径一样不能证明承载相同。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1207": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "BCD从下拆、上下同时、连墙提前全拆都会提前破坏稳性或形成坠物交叉，应禁。A上而下逐层、E连墙随层拆是正确保稳顺序。拆到收尾也需可靠临时约束，不能因架子只剩几根就允许多人一起拉倒。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1208": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "AB资质与个体防护、C清固定可坠物、E雨雪防滑均必要。D工具物料应工具袋等受控携带，手提占用扶握且易落物，虽禁止上抛的后半正确整项仍不取。高处通行与作业都需有保护，不能只上到位置才系带。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1209": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A掌握气水文地质、C办相应许可、E穿合格救生衣属作业基础。B作业安全区应在开工前落实而非开后随进度补，D航行通告不一概禁航，应由有权部门按方案发布。许可不代现场避风避浪，超船舶能力及时停止撤离。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1210": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "A船检有效、C消防救生堵漏防污齐备、D定位通信正常，保障船体和应急协同。B船员应持对应船员适任等资格，非拿施工安全考核证替代；E甲板通道主要需防滑等措施，防水防冻泛称不回答规定的作业面保护。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1211": {"status": "review", "source": "人工疑点标记", "text": "【待核验：保留原题与原答案，不更改评分键】\nA核定水域作业正确；C超性能才作业、D宽水道仅白天值守、E施工一概封航均不当。但B按规定显示号灯号型也是正确要求，与同库1188及规范一致，原错误项BCDE多选了B，应核原题是否漏“不”字。\n【口径说明】沿用原2017题库口径；法规、责任、数字和标准阈值未经现行版本复核，不作为现行作业依据。"}, "1212": {"status": "explained", "source": "逐题概念/题干推导补充", "text": "BCD接头密牢、仪表异常停查、拆管先卸压防爆管和高压喷射。A耐拉不代输送系统承压试验；E清管须设足额出口危险区，但20米不是该条原定数值，具体以设计规范核定。清管出
