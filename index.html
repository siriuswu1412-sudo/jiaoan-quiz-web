s":"法律法规及规章规范","t":"单选题","q":"警告、记过、降级、降职、撤职、开除等属于（____）。","a":"A","o":{"A":"行政处分","B":"行政处罚","C":"刑事责任","D":"民事责任"}},{"s":"法律法规及规章规范","t":"单选题","q":"（____）是公安机关就近执行的，短期剥夺犯罪分子人身自由的刑罚方法。","a":"B","o":{"A":"缓刑","B":"拘役","C":"劳动教养","D":"监外执行"}},{"s":"法律法规及规章规范","t":"单选题","q":"事故发生单位主要负责人在事故发生后（____）的，处上一年年收入80%的罚款。","a":"A","o":{"A":"不立即组织事故抢救","B":"迟报事故","C":"漏报事故","D":"擅离职守"}},{"s":"法律法规及规章规范","t":"单选题","q":"下列法律法规中，第一次详细规定各参建单位的安全责任以及政府部门监管责任的是（____）。","a":"C","o":{"A":"《安全生产法》","B":"《安全生产许可证条例》","C":"《建设工程安全生产管理条例》","D":"《建筑法》"}},{"s":"法律法规及规章规范","t":"单选题","q":"2008年3月5日下午某时，某在建地铁发生坍塌事故，死亡31人，重伤55人，直接经济损失4900多万元。请问该事故层层上报至国务院最多需要（____）小时。","a":"B","o":{"A":"5","B":"7","C":"9","D":"11"}},{"s":"法律法规及规章规范","t":"单选题","q":"企业安全生产许可证可以延期的唯一条件是（____）。","a":"B","o":{"A":"原来有效期满","B":"原有效期内，企业严格遵守有关安全生产的法律法规，未发生死亡事故","C":"原有效期内，企业严格遵守有关安全生产的法律法规，未发生伤亡事故","D":"原安全生产许可证颁发机关审查同意"}},{"s":"法律法规及规章规范","t":"单选题","q":"2012年5月10日，某施工单位发生一起生产安全事故，1人因公死亡，如果2011年全国城镇居民人均可支配收人为22458元，根据2010年《国务院关于进一步加强企业安全生产工作的通知》，应该发放的工亡补助金大约为（____）。","a":"A","o":{"A":"45万元","B":"22万元","C":"30万元","D":"60万元"}},{"s":"法律法规及规章规范","t":"单选题","q":"《公路水运工程安全生产监督管理办法》规定的安全生产方针是（____）。","a":"C","o":{"A":"生产必须安全，安全为了生产","B":"安全第一，预防为主","C":"安全第一，预防为主，综合治理","D":"安全责任，重于泰山"}},{"s":"法律法规及规章规范","t":"单选题","q":"根据《公路水运工程安全生产监督管理办法》规定，下例说法正确的是（____）。","a":"B","o":{"A":"项目副总经理不属于项目负责人","B":"企业安全生产工作的负责人属于施工单位主要负责人","C":"公路水运工程安全生产管理实行统一监管，统一负责","D":"滑坡和高边坡处理不属于危险性较大的工程"}},{"s":"法律法规及规章规范","t":"单选题","q":"根据《〈生产安全事故报告和调查处理条例〉罚款处罚暂行办法》规定，对发生特大事故的单位及其责任人员处以罚款的行政处罚由（____）决定。","a":"B","o":{"A":"国务院","B":"国家安监总局","C":"事故发生地省级人民政府","D":"事故发生单位所在地省级人民政府"}},{"s":"法律法规及规章规范","t":"单选题","q":"《公路工程施工安全技术规范》（JTGF90—2015）自（____）起施行。","a":"C","o":{"A":"2015年2月1日","B":"2015年3月1日","C":"2015年5月1日","D":"2015年4月1日"}},{"s":"法律法规及规章规范","t":"单选题","q":"下列刑罚中，不是附加刑的是（____）。","a":"A","o":{"A":"无期徒刑","B":"剥夺政治权利","C":"罚金","D":"没收财产"}},{"s":"法律法规及规章规范","t":"单选题","q":"下列关于数罪并罚的表述，错误的是（____）。","a":"D","o":{"A":"“数罪”是指判决宣告以前一人犯数罪","B":"判决宣告以后刑罚执行完毕以前，发现犯罪分子还有“漏罪”","C":"判决宣告以后刑罚执行完毕以前，犯罪分子又犯新罪","D":"数罪并罚是指对数罪所判刑罚的代数相加"}},{"s":"法律法规及规章规范","t":"单选题","q":"较大安全事故发生单位主要负责人受到刑事处罚或者撤职处分的，自刑罚执行完毕或者受处分之日起，（____）不得担任本行业企业的主要负责人。","a":"C","o":{"A":"1年内","B":"2年内","C":"5年内","D":"终身"}},{"s":"法律法规及规章规范","t":"单选题","q":"建设单位应当在拆除工程施工前（____）日前，将有关资料报送建管部门备案。","a":"D","o":{"A":"3","B":"5","C":"10","D":"15"}},{"s":"法律法规及规章规范","t":"单选题","q":"安全生产许可证有效期满需要延期的，企业应当于期满前（____）向原颁证机关办理延期手续。","a":"C","o":{"A":"—个月","B":"两个月","C":"三个月","D":"六个月"}},{"s":"法律法规及规章规范","t":"单选题","q":"对因生产安全事故造成的职工死亡，一次性工亡补助金按全国上一年度城镇居民人均可支配收人的（____）倍计算。","a":"D","o":{"A":"5","B":"10","C":"15","D":"20"}},{"s":"法律法规及规章规范","t":"单选题","q":"意外伤害保险费应由施工单位支付，实行施工总承包的，由（____）单位支付意外伤害保险费。","a":"A","o":{"A":"总包","B":"分包","C":"建设","D":"实际施工"}},{"s":"法律法规及规章规范","t":"单选题","q":"根据《企业安全生产费用提取和使用管理办法》规定,港口与航道、公路工程类别安全费用提取标准为（____）。","a":"B","o":{"A":"10%","B":"1.5%","C":"15%","D":"1%"}},{"s":"法律法规及规章规范","t":"单选题","q":"对重大、特别重大及以上事故并负有主要责任的企业，其企业主要负责人，（____）不得担任本行业企业的负责人。","a":"D","o":{"A":"三年内","B":"五年内","C":"十年内","D":"终身"}},{"s":"法律法规及规章规范","t":"单选题","q":"在修建道路以及停电、停水、截断通信线路时有可能影响消防队灭火救援的，有关单位（____）当地公安机关消防机构。","a":"A","o":{"A":"必须事先通知","B":"应当事后通知","C":"可以事先通知","D":"根据情况通知"}},{"s":"法律法规及规章规范","t":"单选题","q":"《中华人民共和国消防法》的立法宗旨是为了预防火灾和减少火灾危害，加强应急救援工作，保护（____）安全，维护公共安全。","a":"C","o":{"A":"生命","B":"财产","C":"人身、财产","D":"公民人身"}},{"s":"法律法规及规章规范","t":"单选题","q":"《中华人民共和国劳动法》规定，延长工作时间每月最长的时限是（____）小时。","a":"C","o":{"A":"12","B":"24","C":"36","D":"48"}},{"s":"法律法规及规章规范","t":"单选题","q":"当事人申请劳动争议仲裁的时效，是从知道或应当知道权利受侵害之日起（____）。","a":"C","o":{"A":"15日内","B":"30日内","C":"60日内","D":"90日内"}},{"s":"法律法规及规章规范","t":"单选题","q":"下列关于法律责任，说法错误的是（____）。","a":"B","o":{"A":"有行为才有责任","B":"谎报事故只是表达一种想法，不是行为，不需要承担法律责任","C":"安全生产的违法行为包括积极行为和消极行为","D":"损害事实是法律责任的必要条件"}},{"s":"法律法规及规章规范","t":"单选题","q":"根据《生产安全事故报告和调查处理条例》规定，对于发生特别重大事故的单位，给予罚款的最高限额为（____）。","a":"D","o":{"A":"500万元","B":"1000万元","C":"1500万元","D":"2000万元"}},{"s":"法律法规及规章规范","t":"单选题","q":"根据《建设工程安全生产管理条例》的规定，（____）应当向施工单位提供施工现场及毗邻区域内供水、排水、供电、供气。供热、通信、广播电视等地下管线资料，并保证资料的真实、准确、完整。","a":"B","o":{"A":"监理单位","B":"建设单位","C":"设计单位","D":"规划部门"}},{"s":"法律法规及规章规范","t":"单选题","q":"根据《建设工程安全生产管理条例》的规定，（____）在编制工程概算时，应当确定建设工程安全作业环境及安全施工措施所需费用。","a":"D","o":{"A":"工程监理企业","B":"施工单位","C":"设计单位","D":"建设单位"}},{"s":"法律法规及规章规范","t":"单选题","q":"《生产安全事故报告和调查处理条例》规定，（____）上报至设区的市级人民政府安全生产监督管理部门和负有安全生产监督管理职责的有关部门。","a":"A","o":{"A":"—般事故","B":"较大事故","C":"重大事故","D":"特大事故"}},{"s":"法律法规及规章规范","t":"单选题","q":"根据《安全生产许可证条例》相关规定，下述中正确的是（____）。","a":"A","o":{"A":"已经进行生产的企业，在《安全生产许可证条例》施行之日起1年内向颁发管理机关申请办理","B":"安全生产许可证颁发管理机关完成审查扣发证工作的时限是自收到申请之日起50日之内","C":"安全生产许可证有效期为3年，企业应当于期满前2个月内向原颁发管理机关办理延期手续","D":"安全生产状况良好、没有发生死亡事故的企业予以免审延期，不需在有效期满前向原颁发管理机关提出延期申请"}},{"s":"法律法规及规章规范","t":"单选题","q":"下列属于较大事故的是（____）。","a":"C","o":{"A":"3人以下死亡","B":"10人以下重伤","C":"1000万元以上5000万元以下直接经济损失","D":"20人以下轻伤事故"}},{"s":"法律法规及规章规范","t":"单选题","q":"下列刑罚中最重的主刑是（____）。","a":"B","o":{"A":"拘役","B":"有期徒刑","C":"驱逐出境","D":"罚金"}},{"s":"法律法规及规章规范","t":"单选题","q":"赔偿损失与支付违约金两种承担民事责任的方式（____）。","a":"D","o":{"A":"不能单独适用","B":"不能合并使用","C":"可以单独使用","D":"可以单独适用也可以合并适用"}},{"s":"法律法规及规章规范","t":"单选题","q":"用人单位拖欠或者未足额支付劳动报酬的，劳动者可以依法向当地人民法院申请（____）。","a":"B","o":{"A":"法律援助","B":"支付令","C":"社会救济","D":"依法制裁用人单位"}},{"s":"法律法规及规章规范","t":"单选题","q":"职工患病，在规定的医疗期内劳动合同期满时，劳动合同（____）。","a":"D","o":{"A":"即时终止","B":"续延半年后终止","C":"续延一年后终止","D":"续延到医疗期满时终止"}},{"s":"法律法规及规章规范","t":"单选题","q":"劳动合同终止后，用人单位应当在（____）内为劳动者办理档案和社会保险关系转移手续。","a":"B","o":{"A":"七日","B":"十五日","C":"一个月","D":"三个月"}},{"s":"法律法规及规章规范","t":"单选题","q":"用人单位（____），劳动者可以立即解除劳动合同，不需事先告知用人单位。","a":"C","o":{"A":"未按照劳动合同约定提供劳动保护或者劳动条件的","B":"未及时足额支付劳动报酬的","C":"以暴力、威胁或者非法限制人身自由的手段强迫劳动者劳动的","D":"规章制度违反法律、法规的规定，损害劳动者权益的"}},{"s":"法律法规及规章规范","t":"单选题","q":"用人单位未足额向劳动者支付劳动报酬的，劳动者可以因此解除劳动合同，这种解除属于（____）。","a":"C","o":{"A":"普通性预告解除","B":"特殊性预告解除","C":"普通性即时解除","D":"特殊性即时解除"}},{"s":"法律法规及规章规范","t":"单选题","q":"劳动者（____），用人单位不可以解除劳动合同。","a":"B","o":{"A":"在试用期间被证明不符合录用条件的","B":"患病或非因工负伤，在规定的医疗期内的","C":"严重违反用人单位的规章制度的","D":"被依法追究刑事责任的"}},{"s":"法律法规及规章规范","t":"单选题","q":"劳动者可以随时解除劳动合同的法定情形是用人单位（____）。","a":"D","o":{"A":"变更名称、法定代表人、主要负责人","B":"发生合并或者分立","C":"变更投资人","D":"未依法为劳动者缴纳社会保险费D"}},{"s":"法律法规及规章规范","t":"单选题","q":"集体合同由（____）代表企业职工一方与用人单位订立。","a":"A","o":{"A":"工会","B":"职工代表大会","C":"监事会","D":"股东代表大会"}},{"s":"法律法规及规章规范","t":"单选题","q":"因（____）集体合同发生争议，经协商解决不成的，工会可以依法申请仲裁、提起诉讼。","a":"B","o":{"A":"签订","B":"履行","C":"订立","D":"检查"}},{"s":"法律法规及规章规范","t":"单选题","q":"对依法应当编制（____）的建设项目，建设单位应当在编制时向可能受影响的公众说明情况，充分征求意见。","a":"C","o":{"A":"环境影响评价文件","B":"环境影响报告表","C":"环境影响报告书","D":"环境影响登记表"}},{"s":"法律法规及规章规范","t":"单选题","q":"国家对严重污染环境的工艺、设备和产品实行淘汰制度。任何单位和个人不得（____）严重污染环境的工艺、设备和产品。","a":"B","o":{"A":"生产、销售","B":"生产、销售或者转移、使用","C":"生产、销售、使用","D":"生产、转移、使用"}},{"s":"法律法规及规章规范","t":"单选题","q":"机关、团体、企业、事业单位违反《消防法》的规定，未履行消防安全职责的，责令限期改正；逾期不改正的，对其直接负责的主管人员和其他直接责任人员可依法给予（____）。","a":"B","o":{"A":"行政拘留","B":"处分或者警告处罚","C":"警告或罚款","D":"十五日以下拘留"}},{"s":"法律法规及规章规范","t":"单选题","q":"《中华人民共和_消防法》是由（____）审议通过的。","a":"B","o":{"A":"国务院","B":"全国人民代表大会常务委员会","C":"全国人民代表大会","D":"中央军委"}},{"s":"法律法规及规章规范","t":"单选题","q":"根据《消防法》规定，消防工作贯彻（____）的方针。","a":"B","o":{"A":"谁主管,谁负责","B":"预防为主，防消结合","C":"专门机关与群众相结合","D":"遏制重特大火灾"}},{"s":"法律法规及规章规范","t":"单选题","q":"直接涉及劳动者切身利益的规章制度和重大事项决定在实施过程中，工会或者职工认为不适当的，有权（____）。","a":"B","o":{"A":"不遵照执行","B":"宣布废止","C":"向用人单位提出，通过协商予以修改完善","D":"请求劳动行政部门给予用人单位处罚"}},{"s":"法律法规及规章规范","t":"单选题","q":"《劳动合同法》调整的劳动关系是一种（____）。","a":"C","o":{"A":"人身关系","B":"财产关系","C":"人身关系和财产关系相结合的社会关系","D":"经济关系"}},{"s":"法律法规及规章规范","t":"单选题","q":"用人单位自（____）起即与劳动者建立劳动关系。","a":"A","o":{"A":"用工之日","B":"签订合同之日","C":"上级批准设立之日","D":"劳动者领取工资之日"}},{"s":"法律法规及规章规范","t":"单选题","q":"用人单位招用劳动者，（____）扣押劳动者的居民身份证和其他证件，不得要求劳动者提供担保或者以其他名义向劳动者收取财物。","a":"D","o":{"A":"可以","B":"必须","C":"应当","D":"不得"}},{"s":"法律法规及规章规范","t":"单选题","q":"已经建立劳动关系，未同时订立书面劳动合同的，应当自用工之日起（____）内订立书面劳动合同。","a":"B","o":{"A":"十五日","B":"—个月","C":"二个月","D":"三个月"}},{"s":"法律法规及规章规范","t":"单选题","q":"无固定期限劳动合同，是指用人单位与劳动者约定无确定（____）时间的劳动合同。","a":"C","o":{"A":"解除","B":"续订","C":"终止","D":"中止"}},{"s":"法律法规及规章规范","t":"单选题","q":"以下属于劳动合同必备条款的是（____）。","a":"A","o":{"A":"劳动报酬","B":"试用期","C":"保守商业秘密","D":"福利待遇"}},{"s":"法律法规及规章规范","t":"单选题","q":"劳动合同期限一年以上不满三年的，试用期不得超过（____）。","a":"B","o":{"A":"一个月","B":"二个月","C":"半个月","D":"—个半月"}},{"s":"法律法规及规章规范","t":"单选题","q":"劳动者在试用期的工资不得低于本单位相同岗位最低档工资或者劳动合同约定工资的（____），并不得低于用人单位所在地的最低工资标准。","a":"D","o":{"A":"百分之三十","B":"百分之五十","C":"百分之六十","D":"百分之八十"}},{"s":"法律法规及规章规范","t":"单选题","q":"劳动合同被确认无效，劳动者已付出劳动的，用人单位（____）向劳动者支付劳动报酬。","a":"C","o":{"A":"可以","B":"不必","C":"应当","D":"不得"}},{"s":"法律法规及规章规范","t":"单选题","q":"用人单位发生合并或者分立等情况，原劳动合同（____）。","a":"A","o":{"A":"继续有效","B":"失去效力","C":"效力视情况而定","D":"由用人单位决定是否有效"}},{"s":"法律法规及规章规范","t":"单选题","q":"用人单位变更名称、法定代表人、主要负责人或者投资人等事项，（____）劳动合同的履行。","a":"B","o":{"A":"影响","B":"不影响","C":"不一定影响","D":"法律未规定是否影响"}},{"s":"法律法规及规章规范","t":"单选题","q":"用人单位应当按照劳动合同约定和国家规定，向劳动者（____）支付劳动报酬。","a":"D","o":{"A":"提前","B":"及时分期","C":"提前足额","D":"及时足额"}},{"s":"法律法规及规章规范","t":"单选题","q":"万某、叶某、姚某、徐某4人被某劳务派遣公司派遣到一家公司工作。一天公司为从业人员发放劳动防护用品，但没有给他们4人发。公司负责人安某告诉他们说，由于你们和公司没有建立劳动关系，不是正式员工，按照国家规定由劳务派遣单位为你们提供劳动防护用品。徐某和他辩论说，不对，你们应当把我们和其他人一样对待，提供劳动防护用品。见两人争执不下，万某劝徐某说，算了，咱就是个临时工，不给咱发也说得过去。叶某说，咱们和人家身份不一样，就别争了。姚某说，不给咱发也行，咱就干活儿拿钱，他们那些规章制度咱也不用听。以上说法正确的是（____）。","a":"B","o":{"A":"安某","B":"徐某","C":"万某和姚某","D":"叶某"}},{"s":"法律法规及规章规范","t":"单选题","q":"关于事故隐患排查治理制度，以下表述错误的是（____）。","a":"B","o":{"A":"生产经营单位应当采取技术、管理措施，及时发现并消除事故隐患","B":"事故隐患应当报告主管的负有安全生产监督管理职责的部门","C":"县级以上地方各级人民政府负有安全生产监督管理职责的部门应当建立健全重大事故隐患治理督办制度","D":"事故隐患排查治理情况应当如实记录，并向从业人员通报"}},{"s":"法律法规及规章规范","t":"单选题","q":"生产经营单位的安全生产管理人员在对本单位安全生产状况进行检查时，对发现的安全问题，正确的处理方式是（____）。","a":"D","o":{"A":"应当立即报告主管的负有安全生产监督管理职责的部门","B":"应当首先报告本单位主要负责人","C":"应当首先报告本单位有关负责人","D":"应当立即处理；不能处理的，应当及时报告本单位有关负责人"}},{"s":"法律法规及规章规范","t":"单选题","q":"国家加强生产安全事故应急能力建设，在建立应急救援基地和应急救援队伍时，应该选择（____）。","a":"B","o":{"A":"所有行业、领域","B":"重点行业、领域","C":"经济发达地区","D":"经济欠发达地区"}},{"s":"法律法规及规章规范","t":"单选题","q":"根据《安全生产法》的规定，下列说法错误的是（____）。","a":"B","o":{"A":"生产经营单位必须依法参加工伤保险","B":"生产经营单位必须依法参加意外伤害保险，为从业人员缴纳保费","C":"从业人员发现事故隐患或其他不安全因素时，应当立即向现场安全管理人员报告","D":"危险物品的生产、经营、储存单位以及矿山、建筑施工单位应当建立应急救援组织"}},{"s":"法律法规及规章规范","t":"单选题","q":"下列说法不符合《安全生产法》规定的是（____）。","a":"B","o":{"A":"建筑施工企业的主要负责人、安全生产管理人员、从业人员以及特种作业人员必须取得考核合格","B":"生产经营单位对重大危险源可以登记建档，进行定期检测、评估、监控，并制订应急预案","C":"生产、经营、储存、使用危险物品的车间、商店、仓库不得与员工宿舍在同一建筑物内","D":"两个以上施工企业在同一作业区域内进行施工，可能危及对方生产安全的，应当签订安全生产管理协议"}},{"s":"法律法规及规章规范","t":"单选题","q":"依据《安全生产法》的规定，从业人员发现直接危及自身安全的紧急情况时，（____）。","a":"D","o":{"A":"应采取一切技术手段抢险救灾","B":"要立即向现场安全管理人员报告","C":"应在采取必要的个人防护措施后，在现场静观事态变化","D":"有权停止作业或在采取可能的应急措施后撤离作业现场"}},{"s":"法律法规及规章规范","t":"单选题","q":"根据《劳动合同法》第十条第一款的规定，建立劳动关系，应当订立（____）。","a":"A","o":{"A":"书面劳动合同","B":"口头劳动合同","C":"书面或者口头劳动合同","D":"劳务协议"}},{"s":"法律法规及规章规范","t":"单选题","q":"劳务派遣单位派遣劳动者应当与接受以劳务派遣形式用工的单位订立（____）。","a":"D","o":{"A":"劳动合同","B":"集体合同","C":"用工协议","D":"劳务派遣协议"}},{"s":"法律法规及规章规范","t":"单选题","q":"被派遣劳动者在无工作期间，劳务派遣单位应当按照所在地人民政府规定的（____），向其按月支付报酬。","a":"A","o":{"A":"最低工资标准","B":"最低生活保障标准","C":"行业工资指导线","D":"失业保险金领取标准"}},{"s":"法律法规及规章规范","t":"单选题","q":"劳务派遣单位与被派遣劳动者订立的劳动合同，除应当载明《劳动合同法》第十七条规定的事项外，还应当载明被派遣劳动者的用工单位以及派遣期限、（____）等情况。","a":"D","o":{"A":"试用期","B":"培训","C":"保守秘密","D":"工作岗位"}},{"s":"法律法规及规章规范","t":"单选题","q":"用人单位与劳动者订立的劳动合同中劳动报酬和劳动条件等标准（____）集体合同规定的标准。","a":"A","o":{"A":"不得低于","B":"可以低于","C":"必须高于","D":"应当高于"}},{"s":"法律法规及规章规范","t":"单选题","q":"用人单位在制定、修改或者决定有关劳动报酬、工作时间、休息休假、劳动安全卫生、保险福利、职工培训、劳动纪律以及劳动定额管理等直接涉及劳动者切身利益的规章制度或者重大事项时，应当经职工代表大会或者全体职工讨论，提出方案和意见，与（____）或者职工代表平等协商确定。","a":"C","o":{"A":"董事会","B":"监事会","C":"工会","D":"职工代表大会"}},{"s":"法律法规及规章规范","t":"单选题","q":"下列表述中，不属于生产经营单位安全生产管理人员法定职责的是（____）。","a":"B","o":{"A":"落实本单位重大危险源的安全管理措施","B":"为本单位主要负责人起草有关安全生产管理的讲话材料","C":"组织或者参与本单位应急救援演练","D":"落实本单位安全生产整改措施"}},{"s":"法律法规及规章规范","t":"单选题","q":"为保证生产安全，根据《安全生产法》规定，生产经营单位新建、改建、扩建工程项目的（____）设施必须与主体工程同时设计、同时施工、同时投入生产和使用。","a":"D","o":{"A":"生产","B":"公共","C":"储存","D":"安全"}},{"s":"法律法规及规章规范","t":"单选题","q":"为保证生产安全，根据《消防法》规定，按照国家工程建设消防技术标准需要进行消防涉及的建设工程，建设单位应当自依法取得施工许可证之日起（____）个工作日内，将消防涉及文件报公安机关消防机构备案，公安机关消防机构应当进行抽查。","a":"C","o":{"A":"8","B":"6","C":"7","D":"9"}},{"s":"法律法规及规章规范","t":"单选题","q":"为保证生产安全，根据《公路法》规定，改建公路时，施工单位应当在施工路段两端设置明I的施工标志、（____）标志。","a":"B","o":{"A":"防尘","B":"安全","C":"防盗","D":"防火"}},{"s":"法律法规及规章规范","t":"单选题","q":"对未按照规定设立安全生产管理机构或者配备安全生产管理人员的生产经营单位可以依农（____）。","a":"A","o":{"A":"责令限期改正","B":"责令停业整顿","C":"罚款5万元","D":"吊销营业执照"}},{"s":"法律法规及规章规范","t":"单选题","q":"关于生产经营单位对从业人员进行安全生产教育和培训的说法，正确的是（____）。","a":"A","o":{"A":"对所有从业人员都应.当进行安全生产教育和培训","B":"对有过相似工作经验的从业人员可以不进行安全生产教育和培训","C":"从业人员培训不合格的应予以辞退","D":"可以根据情况决定是否建立安全生产教育和培训档案"}},{"s":"法律法规及规章规范","t":"单选题","q":"两个以上的生产经营单位在同一作业区域内进行生产经营活动，可能危及对方安全的，应当（____）。","a":"B","o":{"A":"请有关部门进行协调","B":"签订安全生产管理协议","C":"错开生产经营活动的时间","D":"由其中的一个单位负责安全管理"}},{"s":"法律法规及规章规范","t":"单选题","q":"公路施工企业（____）为从事危险作业的职工办理意外伤害保险，支付保险费。","a":"A","o":{"A":"可以","B":"应当","C":"必须","D":"不必"}},{"s":"法律法规及规章规范","t":"单选题","q":"由于施工单位降低工程质量标准，造成工程倒塌。该行为构成（____）。","a":"C","o":{"A":"重大责任事故罪","B":"重大劳动安全事故罪","C":"工程重大安全事故罪","D":"重大质量安全事故罪"}},{"s":"法律法规及规章规范","t":"单选题","q":"因发生较大生产安全事故单位主要负责人受到刑事处罚或者撤职处分的，自刑罚执行乘或者受处分之日起，（____）年内不得担任任何生产经营单位的主要负责人。","a":"C","o":{"A":"1","B":"2","C":"5","D":"10"}},{"s":"法律法规及规章规范","t":"多选题","q":"根据《消防法》规定，建筑构件、建筑材料和室内装修、装饰材料的防火性能必须符合（____）。147我国《安全生产法》规定，生产经营单位建设项目的安全设施投资应当纳人（____）。","a":"AD","o":{"A":"国际标准","B":"行业标准","C":"欧盟标准","D":"国家标准","E":"建设项目保障费"}},{"s":"法律法规及规章规范","t":"单选题","q":"我国《安全生产法》规定，从业人员发现直接危及人身安全的紧急情况而停止作业，生产经营单位应当（____）。","a":"C","o":{"A":"降低其工资","B":"解除与其订立的劳动合同关系","C":"允许该行为","D":"对其给予警告处分"}},{"s":"法律法规及规章规范","t":"单选题","q":"下列行为中，构成重大责任事故罪的是（____）。","a":"C","o":{"A":"某人到建筑工地行窃，因夜黑风高，不慎失足从10层高的楼上跌落死亡","B":"某包工头素来与某工人不和，明知某行为违反安全管理的规定，可能会发生重大伤亡事故，仍然强迫该工人实施这一行为，导致该工人死亡","C":"某安全生产管理人员，因为怕麻烦，没有严格执行工人进工地必须戴安全帽的安全规定，结果因为砖墙倒塌，砸死工人数名","D":"某工地施工人员不按安全生产规定，擅自将废弃的建筑用的钉子，扔到周围的地上造成15人被扎伤"}},{"s":"法律法规及规章规范","t":"单选题","q":"某道路运输企业共有基层员工83人，管理人员15人。依据《安全生产法》的规定，下列关于该企业安全生产管理机构设置和安全生产管理人员配备的说法，正确的是（____）。","a":"C","o":{"A":"该企业可根据需要，自主决定是否设置安全生产管理机构、配备安全生产管理人员，这是其经营自主权范围内的事","B":"该企业规模较小，配备兼职安全生产管理人员就可以","C":"该企业应当设置安全生产管理机构或者配备专职安全生产管理人员","D":"该企业应当配备专职或者兼职的安全生产管理人员"}},{"s":"法律法规及规章规范","t":"单选题","q":"生产经营单位预防和减少安全事故的前提是（____）。","a":"D","o":{"A":"建立安全生产的规章制度","B":"安全生产的资金保证","C":"建立安全生产管理的机构","D":"具备安全生产条件"}},{"s":"法律法规及规章规范","t":"单选题","q":"根据《刑法》规定，重大劳动安全事故罪的犯罪客体是（____）。","a":"D","o":{"A":"直接负责的主管人员","B":"其他直接责任人员","C":"公共安全","D":"劳动安全"}},{"s":"法律法规及规章规范","t":"单选题","q":"某桥梁施工现场栈桥所用木板因雨水浸泡，局部出现严重腐烂，存在较大安全隐患，现场专职管理人员多次提出更换建议但均不为项目经理采纳，后因此而导致职工运料经过时坠亡，项目经理涉嫌（____）。","a":"B","o":{"A":"重大责任事故罪","B":"重大劳动安全事故罪","C":"工程重大安全事故罪","D":"谎报瞒报事故罪"}},{"s":"法律法规及规章规范","t":"单选题","q":"《安全生产法》规定的行政处分不包括（____）。","a":"D","o":{"A":"警告","B":"记过","C":"开除","D":"吊销执照"}},{"s":"法律法规及规章规范","t":"单选题","q":"根据《安全生产法》规定，负有安全生产监督管理职责的部门依法对生产经营单位执行有关安全生产的法律、法规和国家标准或行业标准的情况进行监督检查，其职权不包括（____）。","a":"D","o":{"A":"现场调查取证权","B":"现场处理权","C":"查封、扣押行政强制措施权","D":"安全方案审批权"}},{"s":"法律法规及规章规范","t":"单选题","q":"按照国家工程建设消防技术标准需要进行消防设计的建设工程，建设单位应当自依法取得施工许可之日起七个工作日内，将消防设计文件报（____）备案并抽查。","a":"D","o":{"A":"上级主管单位","B":"监理单位","C":"县级以上人民政府","D":"公安机关消防机构"}},{"s":"法律法规及规章规范","t":"单选题","q":"将建筑工程的消防设计图纸及有关资料报送公安消防机构审核的单位是（____）。","a":"C","o":{"A":"设计单位","B":"监理单位","C":"建设单位","D":"施工单位"}},{"s":"法律法规及规章规范","t":"单选题","q":"刑罚中最轻的主刑是（____）。","a":"A","o":{"A":"管制","B":"有期徒刑","C":"拘役","D":"剥夺政治权利"}},{"s":"法律法规及规章规范","t":"单选题","q":"某生产经营单位主要负责人张某在本单位发生生产安全事故后逃匿，根据《安全生产法》的有关规定，应当处以拘留（____）。","a":"C","o":{"A":"5日","B":"10日","C":"15日","D":"30日"}},{"s":"法律法规及规章规范","t":"单选题","q":"根据《安全生产法》规定，给予拘留的行政处罚由（____）决定。","a":"C","o":{"A":"负责安全生产监督管理的部门报请县级以下人民政府按照国务院规定的权限","B":"县级以上人民政府","C":"公安机关依照治安管理处罚条例的规定","D":"负责安全生产监督管理的部门"}},{"s":"法律法规及规章规范","t":"单选题","q":"根据《安全生产法》规定，生产经营单位与从业人员订立协议，免除或者减轻其对从业人员因生产安全事故伤亡依法应承担的责任的，该协议无效；对生产经营单位的主要负责人、个人经营的投资人给予（____）。","a":"D","o":{"A":"责令停止生产","B":"责令停产整顿","C":"责令限期改正","D":"罚款处罚"}},{"s":"法律法规及规章规范","t":"单选题","q":"施工企业的（____）对本企业的安全生产负总责。","a":"D","o":{"A":"技术人员","B":"项目经理","C":"专职安全生产管理人员","D":"法定代表人"}},{"s":"法律法规及规章规范","t":"单选题","q":"我国现阶段建设工程安全生产管理必须坚持（____）的方针。","a":"A","o":{"A":"安全第一、预防为主、综合治理","B":"事中控制与事后控制相结合","C":"经济效益第一","D":"技术先进"}},{"s":"法律法规及规章规范","t":"单选题","q":"王某为某国有矿山的主要负责人，下列关于王某在安全生产方面的职责的表述，不正确的是（____）。","a":"C","o":{"A":"组织制定本单位的安全生产规章制度","B":"组织制定本单位的事故应急救援预案","C":"亲自为职工讲授安全生产培训课程","D":"保证本单位安全生产投人的有效实施"}},{"s":"法律法规及规章规范","t":"单选题","q":"关于安全生产领域有关协会组织发挥的作用，表述错误的是（____）。","a":"C","o":{"A":"为生产经营单位提供安全生产方面的信息服务","B":"为生产经营单位提供安全生产方面的培训服务","C":"加强对生产经营单位的安全生产管理","D":"发挥自律作用"}},{"s":"法律法规及规章规范","t":"单选题","q":"根据《安全生产法》规定，公路等施工企业作业人员有权（____）。","a":"C","o":{"A":"拒绝接受施工交底","B":"修改施工交底和施工方案","C":"拒绝违章指挥和强令冒险作业","D":"修改工艺规格"}},{"s":"法律法规及规章规范","t":"单选题","q":"保证生产经营单位应当具备的安全生产条件所必需的资金投人的主体是（____）。","a":"D","o":{"A":"当地县级以上人民政府","B":"主管的负有安全生产监管职责的部门","C":"生产经营单位的财务部门","D":"生产经营单位的决策机构、主要负责人或者个人经营的投资人"}},{"s":"法律法规及规章规范","t":"单选题","q":"张某在脚手架上施工时，发现部分扣件松动而可能倒塌，所以停止了作业。这属于从业人员在行使（____）。","a":"C","o":{"A":"知情权","B":"拒绝权","C":"紧急避险权","D":"检举权"}},{"s":"法律法规及规章规范","t":"单选题","q":"在某工程项目建设过程中，发生了下列事件，其中符合《消防法》规定的是（____）。","a":"D","o":{"A":"将工地食堂建在木模板仓库的一个角落里","B":"因工期紧张，让从未接触过电焊工作的王某与其他工人一起焊接钢梁","C":"组织防火检查时，指派维修工李某更换灭火器中的化学药品","D":"对工人进行消防安全知识培训和考核，并将考核不合格的工人赵某辞退"}},{"s":"法律法规及规章规范","t":"单选题","q":"根据《劳动合同法》规定，用人单位自用工之日起超过一个月不满一年未与劳动者订立书面劳动合同的，应当向劳动者每月支付（____）倍的工资。","a":"A","o":{"A":"2","B":"3","C":"4","D":"5"}},{"s":"法律法规及规章规范","t":"单选题","q":"关于生产经营单位提取和使用安全生产费用，正确的说法是（____）。","a":"D","o":{"A":"所有生产经营单位都可以提取安全生产费用","B":"生产经营单位可以根据本单位情况，自行决定是否提取安全生产费用","C":"安全生产工作经费较为充足，或者安全生产状况较好的生产经营单位，可以不提取安全生产费用","D":"有关生产经营单位应当按照国家有关规定提取和使用安全生产费用"}},{"s":"法律法规及规章规范","t":"单选题","q":"下列说法不符合《安全生产法》规定的是（____）。物内","a":"B","o":{"A":"建筑施工企业的主要负责人、安全生产管理人员、从业人员以及特种作业人员必须取得考核合格证书","B":"生产经营单位对重大危险源可以登记建档，进行定期检测、评估、监控，并制订应急预案","C":"生产、经营、储存、使用危险物品的车间、商店、仓库不得与员工宿舍在同一建筑","D":"两个以上施工企业在同一作业区域内进行施工，可能危及对方生产安全的，应当签订安全生产管理协议"}},{"s":"法律法规及规章规范","t":"单选题","q":"根据《刑法修正案（六）》规定，强令他人违章胃险作业，因而发生重大伤亡事故或者造成其他严重后果的，处（____）年以下有期徒刑或者拘役；情节特别恶劣的，处（____）年以上有期徒刑。","a":"A","o":{"A":"5；5","B":"3；3","C":"3；7","D":"10；10"}},{"s":"法律法规及规章规范","t":"单选题","q":"根据《刑法》规定，建设单位、设计单位、施工单位、工程监理单位违反国家规定，降低工程质量标准，造成重大安全事故，属于（____）。","a":"C","o":{"A":"重大责任事故罪","B":"重大劳动安全事故罪","C":"工程重大安全事故罪","D":"工程安全罪"}},{"s":"法律法规及规章规范","t":"单选题","q":"安全生产法律责任是指（____）。","a":"B","o":{"A":"由于违反安全生产法律规定所引起的法律后果","B":"由于违反安全生产法律规定所引起的不利法律后果","C":"由于违反安全生产法律规定所引起的刑事责任后果","D":"由于违反安全生产法律规定所引起的行政责任后果"}},{"s":"法律法规及规章规范","t":"单选题","q":"（____）是对罪犯不予关押，但限制其一定自由，由公安机关执行和群众监督改造的刑罚方法。","a":"B","o":{"A":"缓刑","B":"管制","C":"劳动教养","D":"监外执行"}},{"s":"法律法规及规章规范","t":"单选题","q":"某建筑施工企业有从业人员100人，自成立以来其主要负责人从未参加过任何形式的安全生产管理考核，根据《安全生产法》的相关规定，行政执法机关可以对该企业进行的处罚不包括（____）。","a":"D","o":{"A":"责令限期改正","B":"责令停业整顿","C":"处2万元以上5万元以下罚款","D":"处1万元以下罚款"}},{"s":"法律法规及规章规范","t":"单选题","q":"下列刑罚中不可附加使用的是（____）。","a":"A","o":{"A":"管制","B":"剥夺政治权利","C":"罚金","D":"没收财产"}},{"s":"法律法规及规章规范","t":"单选题","q":"现行《建筑法》施行的时间是（____）。","a":"A","o":{"A":"1998年","B":"1997年","C":"2000年","D":"2001年"}},{"s":"法律法规及规章规范","t":"单选题","q":"《公路法》规定，在大中型公路桥梁和渡口周围（____）范围内，不得挖砂、采石、取土、倾倒废弃物，不得进行爆破作业。","a":"B","o":{"A":"100m","B":"200m","C":"300m","D":"500m"}},{"s":"法律法规及规章规范","t":"单选题","q":"2014年12月1日经修订后开始实施的《安全生产法》规定我国的安全生产工作方针是（____）。","a":"C","o":{"A":"以人为本、安全第一、预防为主","B":"安全第一、预防为主、政府监管","C":"安全第一、预防为主、综合治理","D":"安全第一、预防为主、群防群治"}},{"s":"法律法规及规章规范","t":"单选题","q":"强令他人违章冒险作业，因而发生重大伤亡事故或者造成其他严重后果的，情节特别恶劣的，处（____）有期徒刑。","a":"D","o":{"A":"三年以下","B":"三年以上七年以下","C":"七年以下","D":"五年以上"}},{"s":"法律法规及规章规范","t":"单选题","q":"下列关于《安全生产法》适用范围的理解，正确的是（____）。","a":"B","o":{"A":"生产经营单位的安全生产适用本法，但消防安全和道路交通安全、铁路交通安全、水上交通安全、民用航空安全以及核与辐射安全、特种设备安全除外","B":"生产经营单位的安全生产，适用本法；有关法律、行政法规对消防安全和道路交通安全、铁路交通安全、水上交通安全、民用航空安全以及核与辐射安全、特种设备安全另有规定的，适用其规定","C":"生产经营单位的安全生产，适用本法；消防安全和道路交通安全、铁路交通安全、水上交通安全、民用航空安全以及核与辐射安全、特种设备安全，参照本法有关规定","D":"生产经营单位的安全生产，适用本法；消防安全和道路交通安全、铁路交通安全、水上交通安全、民用航空安全以及核与辐射安全、特种设备安全，适用其他有关法律、行政法规的规定"}},{"s":"法律法规及规章规范","t":"单选题","q":"根据《安全生产法》，国家对严重危及施工安全的工艺、设备实行（____）制度。","a":"C","o":{"A":"禁止生产","B":"销毁","C":"淘汰","D":"限制使用"}},{"s":"法律法规及规章规范","t":"单选题","q":"关于安全生产法的理解，错误的是（____）。","a":"B","o":{"A":"安全生产法有广义和狭义上的理解","B":"安全生产法具有广泛的社会性、一般的科技性","C":"安全生产法是调整安全生产中的人身关系、安全生产财产关系以及安全管理关系等","D":"社会关系的法律法规的总和安全生产法是保护劳动者在劳动过程中安全与健康和国家及人民财产安全的法律规定"}},{"s":"法律法规及规章规范","t":"单选题","q":"根据《安全生产法》规定，生产经营单位的（____）对本单位的安全生产工作全面负责。","a":"D","o":{"A":"董事长","B":"总经理","C":"安全总监","D":"主要负责人"}},{"s":"法律法规及规章规范","t":"单选题","q":"根据《安全生产法》规定，生产经营单位主要负责人具有的安全责任不包括（____）。","a":"B","o":{"A":"建立健全本单位安全生产责任制","B":"落实本单位安全生产规章制度和操作规程","C":"及时如实报告事故","D":"发生重大生产安全事故时立即组织抢救，不得在调查处理期间擅离职守"}},{"s":"法律法规及规章规范","t":"单选题","q":"根据2014年新修订的《安全生产法》，矿山、金属冶炼、建筑施工、道路运输单位和危险物品之外的其他生产、经营、储存单位，从业人员超过（____）人的，应当设置安全生产管理机构或配备专职安全生产管理人员。","a":"A","o":{"A":"100","B":"200","C":"300","D":"400"}},{"s":"法律法规及规章规范","t":"多选题","q":"根据《安全生产法》的规定，从业人员有权对本单位安全生产工作存在的问题提出（____）。","a":"ABC","o":{"A":"批评","B":"检举","C":"控告","D":"嘉奖","E":"报酬"}},{"s":"法律法规及规章规范","t":"多选题","q":"从业人员有权（____），生产经营单位不得降低其工资、福利等待遇或者解除与其订立的劳动合同。","a":"AB","o":{"A":"对本单位安全生产工作中存在的问题提出批评、检举、控告或者拒绝违章指挥、强令冒险作业","B":"对本单位的安全生产工作提出建议","C":"在紧急情况下停止作业或者采取紧急撤离措施","D":"没有及时听从指挥号令","E":"无故撤离作业现场"}},{"s":"法律法规及规章规范","t":"多选题","q":"根据《安全生产法》规定，生产经营单位的工会有权（____）。","a":"ABCD","o":{"A":"对建设项目的安全设施与主体工程同时设计、同时施工、同时投人生产和使用进行监督，提出意见","B":"对生产经营单位违反安全生产法律、法规，侵犯从业人员合法权益的行为，要求纠正","C":"发现生产经营单位违章指挥、强令冒险作业或者发现事故隐患时，提出解决的建议，生产经营单位应当及时研究答复","D":"发现危及从业人员生命安全的情况时，向生产经营单位建议组织从业人员撤离危险场所，生产经营单位必须立即做出处理","E":"依法参加事故调查，必要时对有关人员采取行政拘留"}},{"s":"法律法规及规章规范","t":"多选题","q":"事故调查应当按照（____）的原则，及时、准确地查清事故原因，查明事故性质和责任，总结事故教训，提出整改措施，并对事故责任者提出处理意见。","a":"BCDE","o":{"A":"廉洁高效","B":"科学严谨","C":"依法依规","D":"实事求是","E":"注重实效"}},{"s":"法律法规及规章规范","t":"多选题","q":"单位负责人接到事故报告后，应当迅速采取有效措施，组织抢救，防止事故扩大，减少人员伤亡和财产损失，并按照国家有关规定立即如实报告当地负有安全生产监督管理职责的部门，不得（____）。","a":"ABCD","o":{"A":"隐瞒不报","B":"迟报","C":"谎报","D":"故意破坏事故现场","E":"采取任何措施"}},{"s":"法律法规及规章规范","t":"多选题","q":"生产经营单位拒不执行负有安全生产监督管理职责的部门执法决定，有发生生产安全事故现实危险的，在保证安全的前提下，经本部门主要负责人批准，负有安全生产监督管理职责的部门可以采取通知有关单位（____）等措施，强制生产经营单位履行决定。","a":"CD","o":{"A":"停止供水","B":"停止供暖","C":"停止供电","D":"停止供应民用爆炸物品","E":"停止供应原料"}},{"s":"法律法规及规章规范","t":"多选题","q":"对违法行为情节严重的生产经营单位，应当向社会公告，并通报（____）。","a":"ABCD","o":{"A":"行业主管部门","B":"投资主管部门","C":"国土资源主管部门","D":"证券监督管理机构","E":"工商管理部门"}},{"s":"法律法规及规章规范","t":"多选题","q":"乡、镇人民政府以及（____）等地方人民政府的派出机关应当按照职责，加强对本行政区域内生产经营单位安全生产状况的监督检查，协助上级人民政府有关部门依法履行安全生产监督管理职责。","a":"AB","o":{"A":"街道办事处","B":"开发区管理机构","C":"安监站","D":"居民委员会","E":"村民委员会"}},{"s":"法律法规及规章规范","t":"多选题","q":"（____）等单位有进行安全生产公益宣传教育的义务，有对违反安全生产法律法规的行为进行舆论监督的权利。","a":"ABCD","o":{"A":"新闻","B":"出版","C":"广播","D":"电影","E":"学校"}},{"s":"法律法规及规章规范","t":"多选题","q":"生产经营单位必须执行依法制定的保障安全生产的（____）标准。","a":"AC","o":{"A":"国家","B":"地方","C":"行业","D":"企业","E":"国际"}},{"s":"法律法规及规章规范","t":"多选题","q":"根据《安全生产法》规定，生产经营单位应当具备（____）规定的安全生产条件。","a":"ABC","o":{"A":"安全生产法和有关法律","B":"国家标准或者行业标准","C":"行政法规","D":"地方标准","E":"企业标准"}},{"s":"法律法规及规章规范","t":"多选题","q":"下列不属于《安全生产法》明确赋予从业人员的权利的有（____）。","a":"CDE","o":{"A":"建议权","B":"批评权","C":"服从管理权","D":"报告权","E":"放弃权"}},{"s":"法律法规及规章规范","t":"多选题","q":"生产经营单位的从业人员是指该单位从事生产经营活动各项工作的所有人员，包括（____）.","a":"ABCD","o":{"A":"管理人员","B":"技术人员","D":"临时聘用的人员","E":"地方官员","C":"各岗位的工人"}},{"s":"法律法规及规章规范","t":"多选题","q":"2014年修订后的《安全生产法》规定的从业人员安全生产义务主要有（____）。","a":"ABCD","o":{"A":"遵章守规，服从管理","B":"佩戴和使用劳动防护用品","C":"接受培训，掌握安全生产技能","D":"发现事故隐患及时报告","E":"组织制定规章制度"}},{"s":"法律法规及规章规范","t":"多选题","q":"生产经营单位的主要负责人对本单位安全生产工作负有（____）职责。","a":"ABCD","o":{"A":"建立、健全本单位安全生产责任制；组织制订本单位安全生产规章制度和操作规程","B":"组织制订并实施本单位安全生产教育和培训计划；保证本单位安全生产投人的有效实施","C":"督促、检查本单位的安全生产工作，及时消除生产安全事故隐患","D":"组织制订并实施本单位的生产安全事故应急救援预案；及时、如实报告生产安全事故","E":"组织制订单位发展战略目标"}},{"s":"法律法规及规章规范","t":"多选题","q":"新《安全生产法》建立了严重违法行为公示和通报制度，以下表述正确的有（____）。","a":"ABD","o":{"A":"要求负有安全生产监督管理职责的部门建立安全生产违法行为信息库，如实记录生产经营单位的安全生产违法行为信息","B":"对违法行为情节严重的生产经营单位，应当向社会公告","C":"生产经营单位负责人必须在主流媒体公开做出检查","D":"通报行业主管部门、投资主管部门、同土资源主管部门、证券监督管理部门和有关金融机构","E":"通报新闻媒体和工商部门"}},{"s":"法律法规及规章规范","t":"多选题","q":"工会有权对建设项目的安全设施与主体工程（____）进行监督，提出意见。","a":"CDE","o":{"A":"工程进度","B":"工程质量","C":"同时设计","D":"同时施工","E":"同时投入生产和使用"}},{"s":"法律法规及规章规范","t":"多选题","q":"生产经营单位应建立健全（____），改善安全生产条件，推进安全生产标准化建设，提高安全生产水平，确保安全生产。","a":"BC","o":{"A":"作业人员岗前培训制度","B":"安全生产责任制","C":"安全生产规章制度","D":"安全检查机制","E":"应急预案"}},{"s":"法律法规及规章规范","t":"多选题","q":"生产经营单位对重大危险源应当登记建档，进行定期（____）并制订应急预案，告知从业人员和相关人员在紧急情况下应当采取的应急措施。","a":"BDE","o":{"A":"整改","B":"检测","C":"检查","D":"评估","E":"监控"}},{"s":"法律法规及规章规范","t":"多选题","q":"生产经营单位的从业人员有依法获得安全生产保障的（____），并应当依法履行安全生产方面的（____）。","a":"CE","o":{"A":"责任","B":"权力","C":"权利","D":"规定","E":"义务"}},{"s":"法律法规及规章规范","t":"多选题","q":"根据《安全生产法》规定，生产经营单位的安全生产责任制应当明确各岗位的（____）等内容。","a":"ABD","o":{"A":"责任人员","B":"责任范围","C":"考核范围","D":"考核标准","E":"责任时限"}},{"s":"法律法规及规章规范","t":"多选题","q":"根据《安全生产法》规定，生产经营单位做出涉及安全生产的经营决策，应当听取（____）的意见。","a":"BD","o":{"A":"分管安全生产的负责人","B":"安全生产管理机构","C":"当地安全监管部门","D":"安全生产管理人员","E":"专业咨询机构"}},{"s":"法律法规及规章规范","t":"多选题","q":"根据《安全生产法》规定，生产经营单位的从业人员有权了解其作业场所和工作岗位存在的（____）。","a":"BCD","o":{"A":"技术要求","B":"危险因素","C":"防范措施","D":"事故应急措施","E":"环境评估"}},{"s":"法律法规及规章规范","t":"多选题","q":"（____）在有关环境服务活动中弄虚作假，对造成的环境污染和生态破坏负有责任的，除依照有关法律法规规定予以处罚外，还应当与造成环境污染和生态破坏的其他责任者承担连带责任","a":"ABC","o":{"A":"环境影响评价机构","B":"环境监测机构","C":"从事环境监测设备和防治污染设施维护、运营的机构","D":"从事环境保护产业的单位","E":"环保组织"}},{"s":"法律法规及规章规范","t":"多选题","q":"任何单位和个人不得（____）严重污染环境的工艺、设备和产品。","a":"ABCD","o":{"A":"生产","B":"销售","C":"转移","D":"使用","E":"淘汰"}},{"s":"法律法规及规章规范","t":"多选题","q":"公民、法人和其他组织发现（____）等主管部门不依法履行职责的，有权向其上级机关或者监察机关举报。","a":"ABC","o":{"A":"地方各级人民政府","B":"县级以上人民政府环境保护主管部门","C":"县级以上人民政府其他负有环境保护监督管理职责的部门","D":"国有企业单位","E":"国有事业单位"}},{"s":"法律法规及规章规范","t":"多选题","q":"企业事业单位和其他生产经营者超过污染物排放标准或者超过重点污染物排放总量控制指标排放污染物的，县级以上人民政府环境保护主管部门可以责令其采取（____）等措施；情节严重的，报经有批准权的人民政府批准，责令停业、关闭。","a":"AB","o":{"A":"限制生产","B":"停产整治","C":"停止排污","D":"限期转产","E":"吊销执照"}},{"s":"法律法规及规章规范","t":"多选题","q":"根据《劳动合同法》规定，确认劳动合同无效的机构有（____）。","a":"CD","o":{"A":"工商管理部门","B":"劳动行政部门","C":"劳动争议仲裁委员会","D":"人民法院","E":"县级人民政府"}},{"s":"法律法规及规章规范","t":"多选题","q":"劳动者可以随时通知用人单位解除劳动合同的情形有（____）。","a":"ABC","o":{"A":"未依法为劳动者缴纳社会保险费的","B":"用人单位强迫劳动的","C":"用人单位未按照劳动合同约定支付劳动报酬的","D":"用人单位未提供符合国家标准的劳动条件的","E":"奖金不满意的"}},{"s":"法律法规及规章规范","t":"多选题","q":"在下列情况下，用人单位不得解除劳动合同的有（____）。","a":"ACE","o":{"A":"职工张某因工负伤并被确认丧失劳动能力","B":"职工宋某因盗窃被判刑","C":"职工李某因与他人同居而怀孕","D":"职工王某被派往境外逾期未归","E":"职工刘某因工伤住院"}},{"s":"法律法规及规章规范","t":"多选题","q":"我国的安全生产工作，强化和落实生产经营单位的主体责任，建立（____）和社会监督的机制。","a":"ABCD","o":{"A":"生产经营单位负责","B":"职工参与","C":"政府监管","D":"行业自律","E":"党委指导"}},{"s":"法律法规及规章规范","t":"多选题","q":"（____）和危险物品的生产、经营、储存单位，应当设置安全生产管理机构或者配备专职安全生产管理人员。","a":"ABCD","o":{"A":"矿山","B":"金属冶炼","C":"建筑施工","D":"道路运输单位","E":"餐饮"}},{"s":"法律法规及规章规范","t":"多选题","q":"生产经营项目、场所有多个承包单位、承租单位的，生产经营单位应当（____）。","a":"ABCD","o":{"A":"与承包、承租单位签订专门的安全生产管理协议","B":"对承包单位、承租单位的安全生产工作统一协调、管理","C":"要求承包单位、承租单位与员工订立劳动合同","D":"要求承包单位、承租单位支付安全生产管理费用","E":"要求承包单位、承租单位支付安全生产管理保证金"}},{"s":"法律法规及规章规范","t":"多选题","q":"负有安全生产监督管理职责的部门依法对存在重大事故隐患的生产经营单位作出（____）的决定，生产经营单位应当依法执行，及时消除事故隐患。","a":"ABCD","o":{"A":"停产停业","B":"停止施工","C":"停止使用相关设施或者设备","D":"停止建设","E":"吊销执照"}},{"s":"法律法规及规章规范","t":"多选题","q":"安全生产监督检查人员应当将检查的（____）做出书面记录，并由检查人员和被检查单位的负责人签字。","a":"AB","o":{"A":"时间、地点、内容","B":"发现的问题及其处理情况","C":"现场人数","D":"周边环境","E":"工程质量"}},{"s":"法律法规及规章规范","t":"多选题","q":"根据《劳动合同法》规定，劳动合同分为（____）。","a":"ABC","o":{"A":"固定期限劳动合同","B":"无固定期限劳动合同","C":"以完成一定工作任务为期限的劳动合同","D":"劳动保险合同","E":"劳务分包合同"}},{"s":"法律法规及规章规范","t":"多选题","q":"在中华人民共和国领域内从事生产经营活动的单位的安全生产，适用《安全生产法》；有关法律、行政法规对（____）另有规定的，适用其规定。","a":"ABDE","o":{"A":"消防安全","B":"铁路交通安全","C":"公路建设安全","D":"民用航空安全","E":"水上交通安全"}},{"s":"法律法规及规章规范","t":"多选题","q":"生产经营单位有（____）行为之一的，责令限期改正，可以处五万元以下的罚款；逾期未改正的，责令停产停业整顿，并处五万元以上十万元以下的罚款，对其直接负责的主管人员和其他直接责任人员处一万元以上二万元以下的罚款。","a":"ABCD","o":{"A":"未按照规定设置安全生产管理机构或者配备安全生产管理人员的","B":"未按照规定对从业人员、被派遣劳动者、实习学生进行安全生产教育和培训，或者未按照规定如实告知有关的安全生产事项的","C":"未如实记录安全生产教育和培训情况的","D":"未将事故隐患排查治理情况如实记录或者未向从业人员通报的","E":"未配备安全防护用品的"}},{"s":"法律法规及规章规范","t":"多选题","q":"根据《安全生产法》规定，生产经营单位（____）工程项目的安全设施，必须与主体工程同时设计、同时施工、同时投人生产或者使用。","a":"ACD","o":{"A":"新建","B":"引进","C":"扩建","D":"改建","E":"装修"}},{"s":"法律法规及规章规范","t":"多选题","q":"机关、团体、企业、事业单位应当履行的消防安全职责有（____）。","a":"ADE","o":{"A":"制订消防安全制度、消防安全操作规程","B":"对社会进行消防宣传教育","C":"建立防火组织，及时处理火灾隐患","D":"配置消防设施和器材","E":"确保消防设施和器材完好、有效"}},{"s":"法律法规及规章规范","t":"多选题","q":"根据《安全生产法》规定，（____）应当设置安全生产管理机构或者配备专职安全生产管理人员。","a":"ABE","o":{"A":"矿山","B":"建筑施工单位","C":"建筑设计单位","D":"监理单位","E":"危险物品的生产、经营、储存单位"}},{"s":"法律法规及规章规范","t":"多选题","q":"根据《消防法》规定，消防产品必须符合（____）。","a":"BC","o":{"A":"国际标准","B":"国家标准","C":"行业标准","D":"地方标准","E":"企业标准"}},{"s":"法律法规及规章规范","t":"多选题","q":"根据《刑法》规定，（____）可以作为工程重大安全事故罪的主体。","a":"AB","o":{"A":"建设单位","B":"施工单位","C":"安全生产监督部门","D":"建设行政主管部门","E":"招标代理机构"}},{"s":"法律法规及规章规范","t":"多选题","q":"建筑施工企业必须经建设主管部门或者其他有关部门考核合格方可任职的人员有（____）。","a":"ABD","o":{"A":"主要负责人","B":"安全管理人员","C":"生产管理人员","D":"项目负责人","E":"生产作业人员"}},{"s":"法律法规及规章规范","t":"多选题","q":"总承包单位将其承揽的工程依法分包给专业承包单位。工程主体结构施工过程中发生了生产安全事故，专业承包单位由此开始质疑总承包单位的管理能力，并一再违反总承包单位的安全管理指令，导致发生重大生产安全事故。关于本工程的安全生产管理，下列说法中正确的有（____）。","a":"ABDE","o":{"A":"总承包单位对施工现场的安全生产负总责","B":"专业承包单位应服从总承包单位的安全生产管理","C":"总承包单位与专业承包单位对全部生产安全事故承担连带责任","D":"专业承包单位对该重大生产安全事故承担主要责任","E":"分包合同中应明确双方安全生产方面的权利与义务"}},{"s":"法律法规及规章规范","t":"多选题","q":"企业业单位和其他生产经营者有下列（____）行为之一，尚不构成犯罪的，除依照有关法律法规规定予以处罚外，由县级以上人民政府环境保护主管部门或者其他有关部门将案件移送公安机关，对其直接负责的主管人员和其他直接责任人员，处十日以上十五日以下拘留；情节较轻的，处五日以上十日以下拘留。","a":"ABCD","o":{"A":"建设项目未依法进行环境影响评价，被责令停止建设，拒不执行的","B":"违反法律规定，未取得排污许可证排放污染物，被责令停止排污，拒不执行的","C":"通过暗管、渗井、渗坑、灌注或者篡改、伪造监测数据，或者不正常运行防治污染设施等逃避监管的方式违法排放污染物的","D":"生产、使用国家明令禁止生产、使用的农药，被责令改正，拒不改正的","E":"不按时缴纳员工养老保险的"}},{"s":"法律法规及规章规范","t":"多选题","q":"根据《安全生产法》规定，生产经营单位应当告知从业人员的事项包括（____）。","a":"ACD","o":{"A":"作业场所和工作岗位危险因素","B":"生产经营计划","C":"事故应急措施","D":"安全防范措施","E":"工资待遇"}},{"s":"法律法规及规章规范","t":"多选题","q":"刑法的附加刑包括（____）。","a":"ABD","o":{"A":"罚金","B":"剥夺政治权利","C":"记过","D":"没收财产","E":"责令改正"}},{"s":"法律法规及规章规范","t":"多选题","q":"根据《安全生产法》规定，生产经营单位与从业人员订立协议，免除或者减轻其对从业人员因生产安全事故伤亡依法应承担的责任的，则（____）。","a":"AB","o":{"A":"该协议无效","B":"对生产经营单位的主要负责人、个人经营的投资人处2万〜10万元的罚款","C":"拘留","D":"撤职","E":"追究刑事责任"}},{"s":"法律法规及规章规范","t":"多选题","q":"生产经营单位新建、改建、扩建工程项目的安全设施，必须与主体工程同时（____）。","a":"BCE","o":{"A":"决策","B":"设计","C":"施工","D":"支付费用","E":"投入生产和使用"}},{"s":"法律法规及规章规范","t":"多选题","q":"《刑法》及《刑法修正案（六）》对重大责任事故罪规定了具体的刑罚条款。构成重大责任事故罪立案追诉的标准是（____）。","a":"ACE","o":{"A":"死亡1人以上","B":"死亡10人以上","C":"重伤3人以上","D":"重伤10人以上","E":"直接经济损失50万元以上"}},{"s":"法律法规及规章规范","t":"多选题","q":"为保证生产安全，根据《劳动法》规定，职业安全卫生设施是指（____）。","a":"ABC","o":{"A":"安全技术方面的设施","B":"劳动卫生方面的设施","C":"生产性辅助设施","D":"环保性辅助设施","E":"安全性辅助设施"}},{"s":"法律法规及规章规范","t":"多选题","q":"为保证生产安全，根据《劳动合同法》规定，用人单位在制订、修改或者决定有关（____）等直接涉及劳动者切身利益的规章制度或者重大事项时，应当经职工代表大会或者全体职工讨论，提出方案和意见，与工会或者职工代表平等协商确定。","a":"ABCD","o":{"A":"劳动报酬","B":"工作时间","C":"休息休假","D":"劳动安全卫生","E":"单位经营策略"}},{"s":"法律法规及规章规范","t":"多选题","q":"根据《刑法》规定，重大责任事故罪主体一般包括（____）。","a":"ACE","o":{"A":"建筑企业的安全生产从业人员","B":"建筑企业的分包责任人","C":"建筑企业的安全生产管理人员","D":"建筑企业的作业人员","E":"对安全事故负有责任的无证从事生产的人员"}},{"s":"法律法规及规章规范","t":"多选题","q":"根据《安全生产法》规定，施工企业对安全生产承担的行政责任包括（____）。","a":"BCD","o":{"A":"赔偿损失","B":"停产停业整顿","C":"限期改正","D":"罚款","E":"关闭"}},{"s":"法律法规及规章规范","t":"多选题","q":"委托不具有相应资质的单位承担施工现场安装、拆卸施工起重机械和整体提升脚手架、模板等自升式架设设施的，所应承担的法律责任有（____）。","a":"ABCDE","o":{"A":"责令限期改正","B":"吊销资质证书","C":"责令停业整顿","D":"追究刑事责任","E":"情节严重的，降低资质等级"}},{"s":"法律法规及规章规范","t":"多选题","q":"建设项目中防治污染的措施，必须与主体工程（____）。","a":"BCD","o":{"A":"同时筹资","B":"同时设计","C":"同时施工","D":"同时投产使用","E":"同时竣工"}},{"s":"法律法规及规章规范","t":"多选题","q":"生产经营单位的主要负责人未履行《安全生产法》规定的安全生产管理职责的，追究安全生产违法行为法律责任的形式有（____）。","a":"ABC","o":{"A":"责令限期改正","B":"逾期未改正的，处二万元以上五万元以下的罚款","C":"责令生产经营单位停产停业整顿","D":"撤职","E":"追究刑事责任"}},{"s":"法律法规及规章规范","t":"多选题","q":"生产经营单位的安全生产管理机构以及安全生产管理人员履行的职责除了制止和纠正违章指挥、强令冒险作业、违反操作规程的行为，督促落实本单位安全生产整改措施外，还包括（____）。","a":"ABCD","o":{"A":"组织或者参与拟定本单位安全生产规章制度、操作规程和生产安全事故应急救援预案","B":"组织或者参与本单位安全生产教育和培训，如实记录安全生产教育和培训情况","C":"督促落实本单位重大危险源的安全管理措施","D":"组织或者参与本单位应急救援演练","E":"建立健全本单位安全生产责任制"}},{"s":"法律法规及规章规范","t":"多选题","q":"《建筑法》对建筑施工企业的安全生产职责进行了比较全面的规定，其职责包括（____）。","a":"BCDE","o":{"A":"办理施工许可证","B":"建立健全企业安全生产责任制","C":"建立健全劳动安全生产教育培训制度","D":"为从事危险作业的职工办理意外伤害保险","E":"环境保护职责"}},{"s":"法律法规及规章规范","t":"多选题","q":"根据《建筑法》规定，对施工单位的行政处罚包括（____）。","a":"ABCD","o":{"A":"责令改正，并处罚款","B":"责令停业整顿","C":"降低资质等级或者吊销资质证","D":"没收违法所得","E":"追究刑事责任"}},{"s":"法律法规及规章规范","t":"多选题","q":"重大责任事故罪，是指在生产、作业中（____），因而发生重大伤亡事故或者造成其他严重后果的行为。","a":"AB","o":{"A":"违反有关安全管理的规定","B":"强令他人违章冒险作业","C":"安全生产设施不符合国家规定","D":"降低工程质量标准","E":"安全生产条件不符合国家规定"}},{"s":"法律法规及规章规范","t":"多选题","q":"重大劳动安全事故罪，是指（____），因而发生重大伤亡事故或者造成其他严重后果的行为。","a":"CE","o":{"A":"违反有关安全管理的规定","B":"强令他人违章冒险作业","C":"安全生产设施不符合国家规定","D":"降低工程质量标准","E":"安全生产条件不符合国家规定"}},{"s":"法律法规及规章规范","t":"多选题","q":"《安全生产法》规定的从业人员的主要义务有（____）。","a":"ABC","o":{"A":"遵章守纪","B":"自觉学习安全生产知识","C":"危险报告","D":"积极提出合理化建议","E":"提高学历水平"}},{"s":"法律法规及规章规范","t":"多选题","q":"工程重大安全事故罪的犯罪主体是特殊主体，仅限于（____）。","a":"ABCD","o":{"A":"建设单位","B":"设计单位","C":"施工单位","D":"工程监理单位","E":"责任人员"}},{"s":"法律法规及规章规范","t":"多选题","q":"根据《劳动合同法》规定，用人单位招用劳动者时，应当如实告知劳动者的内容包括（____）。","a":"BCDE","o":{"A":"公司债务状况","B":"工作内容","C":"工作地点","D":"职业危害","E":"劳动报酬"}},{"s":"法律法规及规章规范","t":"多选题","q":"根据违法行为的一般特点，可以把安全生产法律责任的构成要件概括为（____）。","a":"ACDE","o":{"A":"主体","B":"客体","C":"行为人主观上有过错","D":"违法行为","E":"损害事实"}},{"s":"法律法规及规章规范","t":"多选题","q":"根据《刑法》规定，刑罚的主刑包括（____）。","a":"ACE","o":{"A":"管制","B":"没收财产","C":"拘役","D":"罚金","E":"有期徒刑"}},{"s":"法律法规及规章规范","t":"多选题","q":"某企业与从业人员订立的协议中规定，“如因员工个人原因造成工伤事故，本厂不承担任何责任”。该企业因此而承担的违反《安全生产法》的法律责任是（____）。","a":"AC","o":{"A":"协议无效","B":"责令停业整顿","C":"对生产经营单位的主要负责人、个人经营的投资人处以罚款","D":"对生产经营单位的主要负责人给予刑事处分","E":"协议有效"}},{"s":"法律法规及规章规范","t":"多选题","q":"公路施工企业作业人员有权对施工现场的作业条件、作业程序和作业方式存在的安全问题提出（____），有权拒绝违章指挥和强令冒险作业。","a":"ACE","o":{"A":"批评","B":"教育","C":"检举","D":"使用要求","E":"控告"}},{"s":"法律法规及规章规范","t":"多选题","q":"公路工程中使用承租的机械设备和施工机具及配件，由（____）共同进行验收，验收合格的方可投入使用。","a":"ACD","o":{"A":"监理单位","B":"施工总承包单位","C":"分包单位","D":"出租单位","E":"安装单位"}},{"s":"法律法规及规章规范","t":"多选题","q":"公路施工企业等生产经营单位的从业人员，包括（____）。","a":"ABCD","o":{"A":"管理人员","B":"技术人员","C":"总工程师","D":"临时聘用人员","E":"监理人员"}},{"s":"法律法规及规章规范","t":"多选题","q":"公路施工企业的从业人员在安全生产方面应履行的义务包括（____）。","a":"ABCE","o":{"A":"遵守有关安全生产的法律法规","B":"自觉接受安全教育和培训","C":"正确使用劳动保护用品","D":"自觉自费购买保险","E":"发现安全隐患及时报告"}},{"s":"法律法规及规章规范","t":"多选题","q":"根据《建设工程安全生产管理条例》规定，负责高速公路工程建设安全生产监督管理的部门包括（____）。","a":"AC","o":{"A":"交通运输主管部门","B":"铁路安全生产监督管理部门","C":"交通安全生产监督管理部门","D":"水利安全生产监督管理部门","E":"建设行政主管部门"}},{"s":"法律法规及规章规范","t":"多选题","q":"建设行政主管部门对建设单位的下列（____）行为，可处以罚款。","a":"CDE","o":{"A":"拖延支付工程价款的","B":"提供的设计有缺陷的","C":"任意压缩工期的","D":"未组织竣工验收，擅自交付使用的","E":"未按照国家规定办理工程质量监督手续的"}},{"s":"法律法规及规章规范","t":"多选题","q":"公路水运施工企业安全生产管理机构的职责主要包括（____）。","a":"ACD","o":{"A":"组织开展全员安全教育培训及安全检查等活动","B":"配备专职安全生产管理人员","C":"落实国家有关安全生产法律法规和标准","D":"编制并适时更新安全生产管理制度","E":"落实安全生产管理责任"}},{"s":"法律法规及规章规范","t":"多选题","q":"县级以上人民政府建设行政主管部门的工作人员，有下列（____）行为的，将受到降级或撤职的处分。","a":"BCD","o":{"A":"未对施工组织设计中的安全技术措施或专项施工方案进行审查的","B":"对不具备安全生产条件的施工单位颁发资质证书的","C":"对没有安全施工措施的建设工程颁发施工许可证的","D":"发现违法行为不予查处的","E":"发现安全事故隐患未及时要求施工单位整改或暂时停止施工的"}},{"s":"法律法规及规章规范","t":"多选题","q":"根据《建设工程安全生产管理条例》规定，对下列达到一定规模的危险性较大的（____）分部分项工程，应编制专项施工方案。","a":"ABD","o":{"A":"基坑支护与降水工程","B":"脚手架工程","C":"楼地面工程","D":"土方开挖工程","E":"屋面工程"}},{"s":"法律法规及规章规范","t":"多选题","q":"《安全生产法》明确规定生产经营单位主要负责人对本单位的安全生产工作全面负责。”生产经营单位主要负责人对于公路水运工程施工企业来说，主要是指（____）。","a":"ADE","o":{"A":"董事长","B":"副总经理","C":"安全副总监","D":"安全总监","E":"总经理"}},{"s":"法律法规及规章规范","t":"多选题","q":"《安全生产法》明确规定的从业人员的权利包括（____）。","a":"ABCE","o":{"A":"知情权","B":"建议权","C":"紧急避险权","D":"危险报告权","E":"拒绝权"}},{"s":"法律法规及规章规范","t":"多选题","q":"生产经营单位的主要负责人对本单位的安全生产工作负有的职责包括（____）。","a":"ABDE","o":{"A":"建立健全本单位安全生产责任制","B":"组织制订本单位安全生产规章制度和操作规程","C":"编制专项施工方案","D":"组织制订并实施本单位安全生产教育和培训计划","E":"保证本单位安全生产投人的有效实施"}},{"s":"法律法规及规章规范","t":"多选题","q":"公路水运工程安全生产监督管理部门应当对公路水运工程下列（____）施工现场的安全生产情况进行监督检查。","a":"ABCDE","o":{"A":"现场驻地","B":"施工作业点（面）","C":"危险品存放地","D":"预制厂、半成品加工厂","E":"非标施工设备组装厂"}},{"s":"法律法规及规章规范","t":"多选题","q":"根据《安全生产许可证条例》规定，安全生产许可证颁发管理机关工作人员有下列（____）行为之一的，给予降级或者撤职的行政处分；构成犯罪的，依法追究刑事责任。","a":"ABCDE","o":{"A":"向不符合本条例规定的安全生产条件的企业颁发安全生产许可证的","B":"发现企业未依法取得安全生产许可证擅自从事生产活动，不依法处理的","C":"发现取得安全生产许可证的企业不再具备本条例规定的安全生产条件，不依法处理的","D":"接到对违反本条例规定行为的举报后，不及时处理的","E":"在安全生产许可证颁发、管理和监督检查工作中，索取或者接受企业的财物，或者谋取其他利益的"}},{"s":"法律法规及规章规范","t":"多选题","q":"国家对（____）实行安全生产许可制度。企业未取得安全生产许可证的，不得从事生产活动。","a":"ABCDE","o":{"A":"矿山企业","B":"建筑施工企业","C":"危险化学品生产企业","D":"烟花爆竹生产企业","E":"民用爆炸物品生产企业"}},{"s":"法律法规及规章规范","t":"多选题","q":"施工单位应当对（____）进行安全生产教育培训。","a":"ABCD","o":{"A":"现场的作业人员","B":"新录用的作业人员","C":"使用新设备时的作业人员","D":"使用新材料时的作业人员","E":"监理单位人员"}},{"s":"法律法规及规章规范","t":"多选题","q":"施工企业取得安全生产许可证，应当具备下列（____）的安全生产条件。","a":"ABCDE","o":{"A":"建立健全安全生产责任制，制订完备的安全生产规章制度和操作规程","B":"安全投人符合安全生产要求","C":"设置安全生产管理机构，配备专职安全生产管理人员","D":"主要负责人和安全生产管理人员经考核合格","E":"特种作业人员经有关业务主管部门考核合格，取得特种作业操作资格证书"}},{"s":"法律法规及规章规范","t":"多选题","q":"根据《建设工程安全生产管理条例》，下列采用（____）的建设工程，设计单位应当在设计中提出保障施工作业人员安全和预防生产安全事故的措施建议。","a":"ABCE","o":{"A":"新结构","B":"新材料","C":"特殊结构","D":"新设备","E":"新工艺"}},{"s":"法律法规及规章规范","t":"多选题","q":"公路工程施工企业安全教育培训的目的包括（____）。","a":"ABCE","o":{"A":"提高对安全生产方针的认识","B":"对安全生产实行科学管理","C":"提高从业人员的技术知识水平","D":"扩大企业影响","E":"增强企业竞争能力"}},{"s":"法律法规及规章规范","t":"多选题","q":"根据《建设工程安全生产管理条例》规定，下列说法正确的是（____）。","a":"ACE","o":{"A":"意外伤害保险费由施工单位支付","B":"意外伤害保险费由建设单位支付","C":"意外伤害保险期限自建设工程开工之日起至竣工验收合格止","D":"意外伤害保险期限自建设工程开工之日起至竣工结算时止","E":"实行施工总承包的，由总承包单位支付意外伤害保险费"}},{"s":"法律法规及规章规范","t":"多选题","q":"根据《建设工程安全生产管理条例》规定，下列说法正确的是（____）。","a":"AC","o":{"A":"设计单位应当考虑施工安全操作和防护的需要，对涉及施工安全的重点部位和环节在设计文件中注明，并对防范生产安全事故提出指导意见","B":"采用新结构、新材料、新工艺的建设工程和特殊结构的建设工程，监理单位应当在设计中提出保障施工作业人员安全和预防生产安全事故的措施建议","C":"工程监理单位应当审查施工组织设计中的安全技术措施或者专项施工方案是否符合工程建设强制性标准","D":"工程设计单位应当审查施工组织设计中的安全技术措施或者专项施工方案是否符合工程建设强制性标准","E":"监理单位应当考虑施工安全操作和防护的需要，对涉及施工安全的重点部位和环节在设计文件中注明，并对防范生产安全事故提出指导意见"}},{"s":"法律法规及规章规范","t":"多选题","q":"根据《建设工程安全生产管理条例》规定，施工单位发生生产安全事故后（____）。","a":"ABCD","o":{"A":"应立即停工","B":"应当采取措施防止事故扩大","C":"需要移动现场物品时，应当做出标记和书面记录，妥善保管有关证物","D":"应保护事故现场","E":"不许采取任何措施"}},{"s":"法律法规及规章规范","t":"多选题","q":"安全生产监督检查人员的现场处理权包括（____）。","a":"ABCD","o":{"A":"调查取证权","B":"对安全生产违法作业当场纠正权","C":"查封、扣押行政强制措施权","D":"责令紧急避险权","E":"依法行政处罚权"}},{"s":"法律法规及规章规范","t":"多选题","q":"建设单位应当在拆除工程施工15日前，将下列（____）资料报送建设工程所在地的县级以上地方人民政府建设行政主管部门或者其他有关部门备案。","a":"ABCDE","o":{"A":"施工单位资质等级证明","B":"拟拆除建筑物、构筑物","C":"可能危及毗邻建筑的说明","D":"拆除施工组织方案","E":"堆放、清除废弃物的措施"}},{"s":"法律法规及规章规范","t":"多选题","q":"施工单位应当在施工组织设计中编制安全技术措施和施工现场临时用电方案，对下列达到一定规模的危险性较大的（____）分部分项工程编制专项施工方案，并附具安全验算结果，经施工单位技术负责人、总监理工程师签字后实施，由专职安全生产管理人员进行现场监督。","a":"ABCDE","o":{"A":"基坑支护与降水工程","B":"土方开挖工程","C":"模板工程","D":"起重吊装工程","E":"脚手架工程"}},{"s":"法律法规及规章规范","t":"多选题","q":"施工单位应当在施工现场建立消防安全责任制度，确定消防安全责任人，制订（____）等各项消防安全管理制度和操作规程。","a":"ABCD","o":{"A":"用火","B":"用电","C":"使用易燃材料","D":"使用易爆材料","E":"供水"}},{"s":"法律法规及规章规范","t":"多选题","q":"施工单位的（____）应当经建设行政主管部门或者其他有关部门考核合格后方可任职。","a":"ABC","o":{"A":"主要负责人","B":"项目负责人","C":"专职安全生产管理人员","D":"临时聘用人员","E":"监理人员"}},{"s":"法律法规及规章规范","t":"多选题","q":"县级以上人民政府建设行政主管部门或者其他有关行政管理部门的工作人员，有下列（____）行为之一的，给予降级或者撤职的行政处分；构成犯罪的，依照刑法有关规定追究刑事责任。","a":"ABCD","o":{"A":"对不具备安全生产条件的施工单位颁发资质证书的","B":"对没有安全施工措施的建设工程颁发施工许可证的","C":"发现违法行为不予查处的","D":"不依法履行监督管理职责的其他行为","E":"伪造学历的"}},{"s":"法律法规及规章规范","t":"多选题","q":"施工单位有下列（____）行为之一的，责令限期改正；逾期未改正的，责令停业整顿，依照有关规定处以罚款；造成重大安全事故，构成犯罪的，对直接责任人员，依照刑法有关规定追究刑事责任。","a":"ABCDE","o":{"A":"未设立安全生产管理机构、配备专职安全生产管理人员或者分部分项工程施工时无专职安全生产管理人员现场监督的","B":"施工单位的主要负责人、项目负责人、专职安全生产管理人员、作业人员或者特种作业人员，未经安全教育培训或者经考核不合格即从事相关工作的","C":"未在施工现场的危险部位设置明显的安全警示标志，或者未按照国家有关规定在施工现场设置消防通道、消防水源、配备消防设施和灭火器材的","D":"未向作业人员提供安全防护用具和安全防护服装的","E":"未按照规定在施工起重机械和整体提升脚手架、模板等自升式架设设施验收合格后登记的"}},{"s":"法律法规及规章规范","t":"多选题","q":"公路施工企业报告生产安全事故时，应当包括下列（____）内容。","a":"ABCDE","o":{"A":"事故发生单位概况","B":"事故发生的时间、地点以及事故现场情况","C":"事故的简要经过","D":"已经造成或者可能造成的伤亡人数（包括下落不明的人数）和初步估计的直接经济损失","E":"已经采取的措施"}},{"s":"法律法规及规章规范","t":"多选题","q":"生产安全事故调查报告应当包括下列（____）内容。","a":"ABCDE","o":{"A":"事故发生单位概况","B":"事故发生经过和事故救援情况","C":"事故造成的人员伤亡和直接经济损失","D":"事故发生的原因和事故性质","E":"事故责任的认定以及对事故责任者的处理建议，事故防范和整改措施"}},{"s":"法律法规及规章规范","t":"多选题","q":"事故发生单位及其有关人员有下列（____）行为之一的，对主要负责人、直接负责的主管人员和其他直接责任人员处上一年年收人60%至100%的罚款。","a":"ABCDE","o":{"A":"谎报或者瞒报事故的","B":"伪造或者故意破坏事故现场的","C":"转移、隐匿资金、财产，或者销毁有关证据、资料的","D":"拒绝接受调查或者拒绝提供有关情况和资料的","E":"在事故调查中作伪证或者指使他人作伪证的"}},{"s":"法律法规及规章规范","t":"多选题","q":"施工单位对下列（____）危险性较大工程应当编制专项施工方案，并附安全验算结果，经施工单位技术负责人、监理工程师审查同意签字后实施，由专职安全生产管理人员进行现场监督。","a":"ABCDE","o":{"A":"不良地质条件下有潜在危险性的土方、石方开挖","B":"滑坡和高边坡处理","C":"桩基础、挡墙基础、深水基础及围堰工程","D":"桥梁工程中的梁、拱、柱等构件施工","E":"隧道工程中的不良地质隧道、高瓦斯隧道、水底海底隧道"}},{"s":"法律法规及规章规范","t":"多选题","q":"任何单位和个人不得（____）国家明令禁止使用的可能产生职业病危害的设备或者材料。","a":"ABCD","o":{"A":"生产","B":"经营","C":"进口","D":"使用","E":"销毁"}},{"s":"法律法规及规章规范","t":"多选题","q":"承担职业病诊断的医疗卫生机构应当具备下列（____）条件。","a":"ABCD","o":{"A":"持有《医疗机构执业许可证》","B":"具有与幵展职业病诊断相适应的医疗卫生技术人员","C":"具有与开展职业病诊断相适应的仪器、设备","D":"具有健全的职业病诊断质量管理制度","E":"持有安全许可证"}},{"s":"法律法规及规章规范","t":"多选题","q":"安全生产监督管理部门履行职业病防治监督检查职责时，有权采取下列（____）措施。","a":"ABCDE","o":{"A":"进入被检查单位和职业病危害现场","B":"了解情况","C":"调查取证","D":"查阅或者复制与违反职业病防治法律、法规的行为有关的资料和采集样品","E":"责令违反职业病防治法律、法规的单位和个人停止违法行为"}},{"s":"法律法规及规章规范","t":"多选题","q":"安全生产监督管理部门及其职业卫生监督执法人员履行职责时，不得有下列（____）行为。生产、经营或者进口国家明令禁止使用的可能产生职业病危害的设备或者材料的，依照107.有关（____）的规定给予处罚。","a":"ABCDE","o":{"A":"对不符合法定条件的，发给建设项目有关证明文件、资质证明文件","B":"对已经取得有关证明文件的，不履行监督检查职责","C":"发现用人单位存在职业病危害，可能造成职业病危害事故的，不及时依法采取控制措施","D":"其他违反《职业病防治法》的行为","E":"对不符合法定条件的，予以批准"}},{"s":"法律法规及规章规范","t":"多选题","q":"职业病危害因素包括职业活动中存在的各种有害的（____）因素以及在作业过程中产生的其他职业有害因素。<","a":"ABC","o":{"A":"化学","B":"物理","C":"生物","D":"地域","E":"环境"}},{"s":"法律法规及规章规范","t":"多选题","q":"国务院（____）依照《职业病防治法》和国务院确定的职责，负责全国职业病防治的监督管理工作。","a":"ABC","o":{"A":"安全生产监督管理部门","B":"卫生行政部门","C":"劳动保障行政部门","D":"建设行政部门","E":"交通行政部门"}},{"s":"法律法规及规章规范","t":"多选题","q":"国家对从事（____）等作业实行特殊管理，具体管理办法由国务院制定。","a":"ABC","o":{"A":"放射性","B":"高毒","C":"高危粉尘","D":"道路施工","E":"外墙"}},{"s":"法律法规及规章规范","t":"多选题","q":"产生职业病危害的用人单位，应当在醒目位置设置公告栏，公布有关职业病防治的（____）。","a":"ABCD","o":{"A":"规章制度","B":"操作规程","C":"职业病危害事故应急救援措施","D":"工作场所职业病危害因素检测结果","E":"法律责任"}},{"s":"法律法规及规章规范","t":"多选题","q":"劳动者可以在（____）依法在承担职业病诊断的医疗卫生机构进行职业病诊断。","a":"ABC","o":{"A":"用人单位所在地","B":"本人户籍所在地","C":"经常居住地","D":"疾病突发地","E":"纠纷发生地"}},{"s":"法律法规及规章规范","t":"多选题","q":"（____）及其他与建设工程安全生产有关的单位，必须遵守安全生产法律、法规的规定，保证建设工程安全生产，依法承担建设工程安全生产责任。","a":"ABCDE","o":{"A":"建设单位","B":"勘察单位","C":"设计单位","D":"施工单位","E":"工程监理单位"}},{"s":"法律法规及规章规范","t":"多选题","q":"建设单位应当向施工单位提供施工现场及毗邻区域内（____）等地下管线资料。","a":"ABCDE","o":{"A":"供电","B":"供气","C":"供热","D":"通信","E":"广播电视"}},{"s":"法律法规及规章规范","t":"多选题","q":"特种设备生产单位应当具备（____）条件，并经负责特种设备安全监督管理的部门许可，方可从事生产活动。","a":"ABC","o":{"A":"有与生产相适应的专业技术人员","B":"有与生产相适应的设备、设施和工作场所","C":"有健全的质量保证、安全管理和岗位责任等制度","D":"有特种设备的定期检验和定期自行检查记录","E":"有特种设备的日常使用状况记录"}},{"s":"法律法规及规章规范","t":"多选题","q":"特种设备使用单位应当建立特种设备安全技术档案。安全技术档案应当包括以下（____）内容。","a":"ABCDE","o":{"A":"特种设备的设计文件、产品质量合格证明、安装及使用维护保养说明、监督检验证明等相关技术资料和文件","B":"特种设备的定期检验和定期自行检查记录","C":"特种设备的日常使用状况记录","D":"特种设备及其附属仪器仪表的维护保养记录","E":"特种设备的运行故障和事故记录"}},{"s":"法律法规及规章规范","t":"多选题","q":"负责特种设备安全监督管理的部门应当对（____）等公众聚集场所的特种设备，实施重点安全监督检查。","a":"ABCDE","o":{"A":"学校","B":"幼儿园","C":"医院","D":"车站","E":"客运码头"}},{"s":"法律法规及规章规范","t":"多选题","q":"负责特种设备安全监督管理的部门在依法履行监督检查职责时，可以行使下列（____）职权。","a":"ABCDE","o":{"A":"查阅、复制特种设备生产、经营、使用单位和检验、检测机构的有关合同、发票、账簿以及其他有关资料","B":"对有证据表明不符合安全技术规范要求或者存在严重事故隐患的特种设备实施查封、扣押","C":"对流人市场的达到报废条件或者已经报废的特种设备实施查封、扣押","D":"对违反本法规定的行为做出行政处罚决定","E":"进人现场进行检查，向特种设备生产、经营、使用单位和检验、检测机构的主要负责人和其他有关人员调查、了解有关情况"}},{"s":"法律法规及规章规范","t":"多选题","q":"特种设备使用单位有下列（____）行为之一的，责令限期改正；逾期未改正的，责令停止使用有关特种设备，处一万元以上十万元以下罚款。","a":"ABCDE","o":{"A":"使用特种设备未按照规定办理使用登记的","B":"未建立特种设备安全技术档案或者安全技术档案不符合规定要求的","C":"未对其使用的特种设备进行经常性维护保养和定期自行检查的","D":"未按照安全技术规范的要求及时申报并接受检验的","E":"未按照安全技术规范的要求进行锅炉水（介）质处理的"}},{"s":"法律法规及规章规范","t":"多选题","q":"（____）使用的特种设备安全的监督管理不适用《特种设备安全法》。","a":"ABC","o":{"A":"军事装备","B":"核设施","C":"航空航天器","D":"铁路","E":"公路"}},{"s":"法律法规及规章规范","t":"多选题","q":"职业病是指（____）等用人单位的劳动者在职业活动中，因接触粉尘、放射性物质和其他有毒、有害因素而引起的疾病。","a":"ABC","o":{"A":"企业","B":"事业单位","C":"个体经济组织","D":"村民小组","E":"街道社区"}},{"s":"法律法规及规章规范","t":"多选题","q":"产生职业病危害的用人单位的设立除应当符合法律、行政法规规定的设立条件外，其工作场所还应当符合下列（____）职业卫生要求。","a":"ABCDE","o":{"A":"职业病危害因素的强度或者浓度符合国家职业卫生标准","B":"有与职业病危害防护相适应的设施","C":"生产布局合理，符合有害与无害作业分开的原则","D":"有配套的更衣间、洗浴间、孕妇休息间等卫生设施","E":"设备、工具、用具等设施符合保护劳动者生理、心理健康的要求"}},{"s":"法律法规及规章规范","t":"多选题","q":"用人单位应当优先采用有利于防治职业病和保护劳动者健康的（____）。","a":"ABCD","o":{"A":"新技术","B":"新工艺","C":"新设备","D":"新材料","E":"新方法"}},{"s":"法律法规及规章规范","t":"多选题","q":"对产生严重职业病危害的作业岗位，应当在其醒目位置，设置警示标志和中文警示说明。警示说明应当载明产生职业病危害的（____）等内容。","a":"ABCD","o":{"A":"种类","B":"后果","C":"预防","D":"应急救治措施","E":"效果"}},{"s":"法律法规及规章规范","t":"多选题","q":"根据《生产安全事故报告和调查处理条例》规定，以下属于重大事故的有（____）。","a":"BCE","o":{"A":"致35人死亡的事故","B":"致60人重伤的事故","C":"致20人死亡的事故","D":"致15人重伤的事故","E":"致6000万元直接经济损失的事故"}},{"s":"法律法规及规章规范","t":"多选题","q":"事故发生后，施工单位应及时向有关部门报告，报告的主要内容不包括（____）。","a":"AE","o":{"A":"事故发生地的概况","B":"事故的简要经过","C":"事故已经造成的伤亡人数","D":"初步估计的直接经济损失","E":"事故责任人的处理情况"}},{"s":"法律法规及规章规范","t":"多选题","q":"特种设备安全工作应当坚持（____）的原则。","a":"ABCD","o":{"A":"安全第一","B":"预防为主","C":"节能环保","D":"综合治理","E":"经济耐用"}},{"s":"法律法规及规章规范","t":"多选题","q":"特种设备出厂时，应—当随附安全技术规范要求的（____）等相关技术资料和文件，并在设备显著位置设置产品铭牌、安全警示标志及其说明。","a":"ABCD","o":{"A":"设计文件","B":"产品质量合格证明","C":"安装及使用维护保养说明","D":"监督检验证明","E":"购买合同"}},{"s":"法律法规及规章规范","t":"多选题","q":"特种设备出厂时，应当随附安全技术规范要求的相关技术资料和文件，并在特种设备显著位置设置（____）。","a":"AC","o":{"A":"产品铭牌","B":"产品质量合格证明","C":"安全警示标志及其说明","D":"监督检验证明","E":"设计文件"}},{"s":"法律法规及规章规范","t":"多选题","q":"公路水运工程平安工地考核评价的创建达标单位包括（____）。","a":"ABCE","o":{"A":"建设单位","B":"分包单位","C":"施工单位","D":"材料供应单位","E":"监理单位"}},{"s":"法律法规及规章规范","t":"多选题","q":"《公路水运工程施工企业项目负责人施工现场带班生产制度（暂行）》所称的公路水运工程施工企业项目负责人，包括施工合同段的（____）。","a":"ABCD","o":{"A":"项目经理","B":"项目副经理","C":"项目总工","D":"技术主管","E":"安全总监"}},{"s":"法律法规及规章规范","t":"多选题","q":"《公路水运工程生产安全重大事故隐患挂牌督办制度（暂行）》中要求公路水运建设项目重大隐患排查治理实行（____）的工作机制。","a":"BCD","o":{"A":"设计监督","B":"业主组织","C":"监理核实","D":"施工治理","E":"工会监督"}},{"s":"法律法规及规章规范","t":"多选题","q":"根据《公路水运工程安全生产监督管理办法》规定，危险性较大、应当编制专项施工方案的工程包括（____）。","a":"ACDE","o":{"A":"滑坡和高边坡处理","B":"涵洞基础","C":"高瓦斯隧道","D":"爆破工程","E":"水下焊接"}},{"s":"法律法规及规章规范","t":"多选题","q":"下列设备中属于特种设备的是（____）。","a":"ABD","o":{"A":"额定起重量等于0.5t的升降机","B":"容积等于35L的承压蒸汽锅炉","C":"额定起重量等于0.5t的起重机","D":"载人（货）电梯","E":"道路交通、农用车辆"}},{"s":"法律法规及规章规范","t":"多选题","q":"根据《生产安全事故报告和调查处理条例》规定，事故发生单位报告的事故内容包括（____）。","a":"ABCD","o":{"A":"事故发生单位概况","B":"事故发生的时间、地点以及事故现场情况","C":"事故的简要经过","D":"已经采取的措施","E":"事故的责任认定"}},{"s":"法律法规及规章规范","t":"多选题","q":"生产安全事故调查组的成员通常包括（____）。","a":"ABCE","o":{"A":"人民政府","B":"安全生产监管部门","C":"监察机关","D":"事故发生单位","E":"人民检察院"}},{"s":"法律法规及规章规范","t":"多选题","q":"根据《企业安全生产费用提取和使用管理办法》规定，下列属于建设工程施工企业安全费用使用范围的有（____）。","a":"ABDE","o":{"A":"完善、改造和维护安全防护设施设备的支出","B":"配备、维护、保养应急救援器材、设备的支出和应急演练支出","C":"现场专职安全人员的工资支出","D":"开展重大危险源和事故隐患评估、监控和整改的支出","E":"安全设施及特种设备检测检验支出"}},{"s":"法律法规及规章规范","t":"多选题","q":"根据《企业安全生产费用提取和使用管理办法》规定，下列属于交通运输企业安全费用使用范围的有（____）。","a":"ABCD","o":{"A":"宂善、改造和维护安全防护设施设备的支出","B":"购置、安装和使用具有行驶记录功能的车辆卫星定位装置、船舶通信导航定位和自动识别系统、电子海图等的支出","C":"安全生产检查、评价（不包括新建、改建、扩建项目安全评价）、咨询及标准化建设的支出","D":"安全生产适用的新技术、新标准、新工艺、新装备的推广应用支出","E":"运输人员的劳动保险支出"}},{"s":"法律法规及规章规范","t":"多选题","q":"专职安全生产管理人员负责对安全生产进行现场监督检查，并做好检查记录，发现生产安全事故隐患，应当及时向项目负责人和安全生产管理机构报告；对（____）的，应当立即制止。","a":"BDE","o":{"A":"违反合同规定","B":"违章指挥","C":"违章设计","D":"违章操作","E":"违反劳动纪律"}},{"s":"法律法规及规章规范","t":"多选题","q":"企业主要负责人，是指对本企业日常生产经营活动和安全生产工作（____）的人员，包括企业生产经营工作负责人、企业安全生产工作负责人等。","a":"CE","o":{"A":"组织领导","B":"全面规划","C":"全面负责","D":"规范管理","E":"有生产经营决策权"}},{"s":"法律法规及规章规范","t":"多选题","q":"公路施工企业项目负责人，包括（____）。","a":"ABC","o":{"A":"项目经理","B":"项目副经理","C":"项目总工","D":"作业队长","E":"专职安全员"}},{"s":"法律法规及规章规范","t":"多选题","q":"公路水运工程安全生产监督管理部门对从业单位安全生产监督检查的内容主要有（____）。","a":"ABDE","o":{"A":"从业单位安全生产条件的符合情况","B":"从业单位执行安全生产法律、法规、规章和工程建设强制性标准的情况","C":"安全专项费用的落实情况","D":"从业单位对各项应急预案的建立和落实情况","E":"员工的安全教育培训情况"}},{"s":"法律法规及规章规范","t":"多选题","q":"建设单位在公路水运工程施工招标文件中，应当按照法律、法规的规定对施工单位的（____）等提出明确要求。","a":"BCD","o":{"A":"应急预案演练情况","B":"安全生产条件","C":"安全生产信用情况","D":"安全生产保障措施","E":"安全生产费用使用程序"}},{"s":"法律法规及规章规范","t":"多选题","q":"根据《公路水运工程安全生产监督管理办法》规定，施工单位主要负责人的职责包括（____）。","a":"ACE","o":{"A":"制订安全生产规章制度和操作规程","B":"根据工程特点组织制订安全施工措施","C":"保证本单位安全生产条件所需资金的投人","D":"对安全生产进行现场监督检查","E":"对所承担的公路水运工程进行定期和专项安全检查"}},{"s":"法律法规及规章规范","t":"多选题","q":"根据《建设工程安全生产管理条例》规定，专职安全生产管理人员的安全职责主要包括（____）。","a":"ABC","o":{"A":"现场检查","B":"隐患报告","C":"违章制止","D":"落实法律法规","E":"编制并更新管理制度"}},{"s":"法律法规及规章规范","t":"多选题","q":"建设单位应当在拆除工程施工15日前，将（____）报送建设工程所在地的县级以上地方人民政府建设行政主管部门或者其他有关部门备案。","a":"ABCD","o":{"A":"施工单位资质等级证明","B":"拟拆除建筑物、构筑物及可能危及毗邻建筑的说明","C":"拆除施工组织方案","D":"堆放、清除废弃物的措施","E":"拆除工程预算费用明细表"}},{"s":"法律法规及规章规范","t":"多选题","q":"《生产安全事故报告和调查处理条例》规定的事故分级要素包括（____）。","a":"BCDE","o":{"A":"人员轻伤的数量","B":"人员重伤的数量","C":"人员死亡","D":"直接经济损失的数量","E":"社会影响"}},{"s":"法律法规及规章规范","t":"多选题","q":"以下属于较大生产安全事故的是（____）。","a":"ACD","o":{"A":"造成3人以上10人以下死亡的事故","B":"造成10人以上30人以下死亡的事故","C":"造成10人以上50人以下重伤的事故","D":"造成1000万元以上5000万元以下直接经济损失的事故","E":"造成1000万元以下直接经济损失的事故"}},{"s":"法律法规及规章规范","t":"判断题","q":"新《安全生产法》大幅提高了对事故责任单位的罚款金额，一般事故罚款为50万元至100万元。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"新《安全生产法》规定，特别重大事故的情节特别严重的，罚款1000万元至2000万元。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"从业人员在紧急情况下停止作业或采取紧急撤离措施导致企业损失，可通过从业人员降低工资、福利等方式弥补。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"因生产安全事故受到损害的从业人员，除依法享有工伤保险外，无权再向单位提出赔偿要求。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"承担安全评价、认证、检测、检验的机构应当具备国家规定的资质条件，并对其做出的安全评价、认证、检测、检验结果负责。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"《安全生产法》不仅适用于生产经营单位，同时也适用于国家安全和社会治安方面的管理。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"《安全生产法》规定，在中华人民共和国领域内从事生产经营活动的单位的安全生产适用本法。这里所指的生产经营单位包括国有企业事业单位、集体所有制企业事业单位、合伙企业、个人独资企业，但不包括中外合资经营企业、中外合作经营企业、外资企业。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"把作业场所和工作岗位存在的危险因素如实告知从业人员，会有负面影响，引起恐慌，增加思想负担，不利于安全生产。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"安全生产监督管理部门和其他负有安全生产监督管理职责的部门对企业执行有关安全生产的法律、法规和国家标准或者行业标准的情况进行监督检查时，生产经营单位可以以技术保密、业务保密等理由拒绝检查。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"国务院安全生产监督管理部门和其他负有安全生产监督管理职责的部门应当根据各自的职责分工，制订相关行业、领域重大事故隐患的判定标准。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"工会不能对建设项目的安全设施与主体工程同时设计、同时施工、同时投入生产和使用进行监督。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"生产经营单位不得因安全生产管理人员依法履行职责而降低其工资、福利等待遇或者解除与其订立的劳动合同。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"劳务派遣单位应当对被派遣劳动者进行必要的安全生产教育和培训。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"负有安全生产监督管理职责的部门对检查中发现的事故隐患，应当责令立即排除。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"予以关闭的行政处罚由负有安全生产监督管理职责的部门报请县级以上人民政府按照国务院规定的权限决定。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"安全“三同时”初期投人的安全设施支出属于安全费用。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"与事故无关的单位或个人不用配合事故抢救。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"生产经营单位与从业人员订立协议，免除或者减轻其对从业人员因生产安全事故伤亡依法应承担的责任的，该协议无效；对生产经营单位的主要负责人、个人经营的投资人处二万元以上五万元以下的罚款。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"生产经营单位委托合法的相关机构提供安全生产技术、管理服务的，保证安全生产的责任由委托单位负责。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"居民委员会、村民委员会发现其所在区域内的生产经营单位存在事故隐患或者安全生产违法行为时，有权向当地人民政府或有关部门报告。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"生产经营单位做出涉及安全生产的经营决策，只需听取单位主要负责人的意（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"有关生产经营单位应当按照规定提取和使用安全生产费用，专门用于安全教育和培（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"国务院有关部门应依法在各自职责范围内对有关行业、领域的安全生产实施监督管（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"生产经营单位的主要负责人应组织制订并实施本单位安全生产教育和培训计划。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"未经安全生产教育和培训的从业人员，不得上岗作业。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"负有安全生产监督管理职责的部门对其主管的危险物品的生产、经营、储存单位以及矿山、金属冶炼、建筑施工、道路运输单位的主要负责人和安全生产管理人员进行安全生产知识和管理能力考核，可以收费。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"省、自治区、直辖市人民政府可以根据本地区实际情况对国家规定以外的危及生产安全的工艺、设备进行公布淘汰。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"生产、经营、储存、使用危险物品的车间、商店、仓库可以与员工宿舍在统一建筑物内，但要保持安全距离。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"生产经营单位对承包单位、承租单位的安全生产工作统一协调、管理，定期进行安全检查，发现安全问题的，应及时督促整改。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"生产经营单位可以在从业人员自愿的情况下与其订立协议，免除或减轻其对从业人员因生产安全事故伤亡依法应承担的责任。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"因生产安全事故受到损害的从业人员，除依法享有工伤保险外，依照有关民事法律尚有获得赔偿的权利的，有权向本单位提出赔偿要求。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"生产经营单位使用被派遣劳动者的，被派遣劳动者享有新《安全生产法》规定的从业人员的权利，并应当履行从业人员的义务。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"承担安全评价、认证、检测、检验工作的机构，出具虚假证明的，给他人造成损害的，在缴纳罚款后，不需再与生产经营单位承担连带赔偿责任。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"《环境保护法》规定:一切部门和个人都有保护环境的义务。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"国家支持环境保护科学技术研究、开发和应用，鼓励环境保护产业发展，促进环境保护信息化建设，提高环境保护科学技术水平。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"各级人民政府应当加大保护和改善环境、防治污染和其他公害的财政投人，提高财政资金的使用效率。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"《环境保护法》规定:对保护和改善环境有显著成绩的单位和个人，由环境保护主管部门给予奖励。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"省、自治区、直辖市人民政府环境保护主管部门对国家污染物排放标准中未作规定的项目，可以制定地方污染物排放标准；对国家污染物排放标准中已作规定的项目，可以制定严于国家污染物排放标准的地方污染物排放标准。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"《环境保护法》规定:未依法进行环境影响评价的开发利用规划，不得组织实施；未依法进行环境影响评价的建设项目，不得开工建设。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"企业事业单位和其他生产经营者，在污染物排放符合法定要求的基础上，进一步减少污染物排放的，人民政府应当依法采取财政、税收、价格、政府采购等方面的政策和措施予以鼓励和支持。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"企业事业单位和其他生产经营者，为改善环境，依照有关规定转产、搬迁、关闭的，人民政府应当予以支持。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"建设项目中防治污染的设施，应当与主体工程同时设计、同时施工、同时投产使用。防治污染的设施应当符合经批准的环境影响评价文件的要求，不得擅自拆除或者闲置。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"负责审批建设项目环境影响评价文件的部门在收到建设项目环境影响报告书后，除涉及国家秘密和商业秘密的事项外，应当全文公开；发现建设项目未充分征求公众意见的，应当责成建设单位征求公众意见。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"建设单位未依法提交建设项目环境影响评价文件或者环境影响评价文件未经批准，擅自开工建设的，由负有环境保护监督管理职责的部门责令停止建设，处以罚款，并可以责令恢复原状。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"环境影响评价机构、环境监测机构以及从事环境监测设备和防治污染设施维护、运营的机构，在有关环境服务活动中弄虚作假，对造成的环境污染和生态破坏负有责任的，除依照有关法律法规规定予以处罚外，还应当与造成环境污染和生态破坏的其他责任者承担连带责任。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"违反《环境保护法》规定，构成犯罪的，依法追究刑事责任和行政责任。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"生产经营单位的从业人员有依法获得安全生产保障的权利，并应当依法履行安全生产方面的义务。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"乡、镇人民政府以及街道办事处、开发区管理机构等地方人民政府的派出机关无权对本行政区域内生产经营单位安全生产状况进行监督检查。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"生产经营单位委托具有相关资质的机构提供安全生产技术、管理服务的，保证安全生产的责任由服务的相关机构负责。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"生产经营单位的主要负责人和安全生产管理人员必须具备与本单位所从事的生产经营活动相应的安全生产知识和管理能力，应当由主管的负有安全生产监督管理职责的部门对其安全生产知识和管理能力考核合格。考核可以收费。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"生产经营单位应当对从业人员进行安全生产教育和培训，保证从业人员具备必要的安全生产知识，熟悉有关的安全生产规章制度和安全操作规程，掌握本岗位的安全操作技能，了解事故应急处理措施，知悉自身在安全生产方面的权利和义务。经安全生产教育和培训合格的从业人员，不得上岗作业。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"危险化学品生产的建设项目，应当进行安全评价和安全设施设计。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"重大责任事故罪主体是一般主体，包括建筑企业的安全生产从业人员、安全生产管理人员以及对安全事故负有责任的包工头、无证从事生产、作业的人员等。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"重大责任事故罪侵犯的主体是工厂、矿山、林场、建筑企业或者其他企业、事业单位的生产安全。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"工程重大安全事故罪的犯罪主体是特殊主体，仅限于建设单位、设计单位、施工单位、工程监理单位及其责任人员。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"《劳动法》第五十三条规定的“职业安全卫生设施”是指安全技术方面的设施、劳动卫生方面的设施，但不包括生产性辅助设施（如女工卫生室、更衣室、饮水设施等）。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"劳动者拒绝用人单位管理人员违章指挥、强令冒险作业的，不视为违反劳动合同。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"建设单位提供的资料将成为施工单位后续工作的主要参考依据。这些资料如果不真实、准确、完整，并因此导致了施工单位的损失，施工单位不能就此向建设单位要求赔偿。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"工程重大安全事故罪是指安全生产设施或者安全生产条件不符合国家规定，因而发生重大伤亡事故或者造成其他严重后果的行为。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"生产经营单位的从业人员是指该单位从事生产经营活动各项工作的所有人员，包括管理人员、技术人员和各岗位的工人，但不包括临时聘用的人员。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"我国第一部全面规范安全生产的专门法律是《安全生产法》。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"非高危行业也应按照从业人员的数量，配置安全生产管理机构或者安全生产管理人员。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"公路养护车辆进行作业时，在不影响过往车辆通告的前提下，其行驶路线和方向不受公路标志、标线限制。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"《安全生产法》没有规定重大危险源的备案制度。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"公路养护人员进行养护作业时，应当穿着统一的安全标志服。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"《安全生产法》规定的生产安全事故类型的划分标准由国家安全监督管理总局规定。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"《环境保护法》中规定加强企业管理，实行文明施工，对于污染环境的废气、废水、废渣，要综合利用、化害为利；需要排放的，必须遵循国家规定的标准；一时达不到国家标准的要限制企业的生产规模，预期达不到国家标准的要限期治理。”（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"施工企业的从业人员均负有危险报告义务。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"《环境保护法》的立法目的是:保护和改善环境，防治污染和其他公害，保障公众健康，推进生态文明建设，促进经济社会可持续发展。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"保护环境是国家的基本国策。国家采取有利于节约和循环利用资源、保护和改善环境、促进人与自然和谐的经济、技术政策和措施，使经济社会发展与环境保护相协调。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"环境保护坚持“预防为主、综合治理、公众参与、损害担责”的原则。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"《安全生产法》明确规定生产经营单位主要负责人对本单位的安全生产工作全面负责。”对于公路水运工程施工企业来说，主要负责人主要指董事长、总经理、安全总监等。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"两个以上生产经营单位在同一作业区域内进行生产经营活动，可能危及对方生产安全的，应当签订安全生产管理协议。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"生产经营单位可结合公司和项目情况为职工办理工伤社会保险。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"《安全生产法》制定的目的是为了加强安全生产工作，防止和减少生产安全事故，保障人民群众生命和财产安全，促进经济社会持续健康发展。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"安全生产工作应当以人为本，坚持安全发展，坚持安全第一、预防为主、综合治理的方针，强化和落实生产经营单位的主体责任，建立生产经营单位负责、职工参与、政府监管、行业自律和社会监督的机制。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"工会依法对安全生产工作进行技术指导。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"建筑施工从业人员超过200人的才需要设置安全生产管理机构或者配备专职安全生产管理人员。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"生产经营单位使用被派遣劳动者的，应当将被派遣劳动者纳入本单位从业人员统一管理，对被派遣劳动者进行岗位安全操作规程和安全操作技能的教育和培训。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"县级以上地方各级人民政府负有安全生产监督管理职责的部门应当建立健全重大事故隐患治理督办制度，督促生产经营单位消除重大事故隐患。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"生产经营单位未与承包单位、承租单位签订专门的安全生产管理协议或者未在承包合同、租赁合同中明确各自的安全生产管理职责，或者未对承包单位、承租单位的安全生产统一协调、管理的，责令限期改正；逾期未改正的，责令停产停业整顿。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"生产经营单位与从业人员订立的协议，可以适当免除或者减轻其对从业人员因生产安全事故伤亡依法应承担的责任。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"生产经营单位发生生产安全事故造成人员伤亡、他人财产损失的，应当依法承担赔偿责任；拒不承担或者其负责人逃匿的，由监理强制执行。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"施工单位对安全生产承担的法律责任有行政责任和刑事责任。行政责任包括限期改正、停产停业整顿、罚款。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"在生产、作业中违反有关安全管理的规定，因而发生重大伤亡事故或者造成其他严重后果的，处十年以下有期徒刑或者拘役。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"重大责任事故罪的主体是特殊主体，即直接负责的主管人员和其他直接责任人员。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"用人单位自用工之日起超过一个月不满一年未与劳动者订立书面劳动合同的，应当向劳动者每月支付两倍的工资。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"在大中型公路桥梁和渡口周围两百米、公路隧道上方和洞口外一百米范围内，以及在公路两侧一定距离内，挖砂、采石、取土、倾倒废弃物的由交通主管部门责令停止违法行为，可以处三万元以下的罚款。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"根据《安全生产法》的规定，不是安全生产法律关系的主体不承担安全生产责任。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"构成法律责任要件的心理状态，是指行为主体的主观故意和主观过失，通称主观过错。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"用人单位违章指挥，强令冒险作业危及劳动者人身安全的，劳动者可以立即解除劳动合同，但需要事先告知用人单位。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"工程重大安全事故罪的客体是公共安全和国家有关安全管理的法律制度。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"设计单位应当按照法律、法规和工程建设强制性标准进行设计，防止因设计不合理导致生产安全事故的发生。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"专职安全生产管理人员的配备办法由国务院建设行政主管部门会同国务院其他有关部门制定。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"施工现场临时搭建的建筑物应当符合安全使用要求；施工现场使用的装配式活动房屋应当具有安全许可证。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"施工单位应当自施工起重机械和整体提升脚手架、模板等自升式架设设施验收合格之日起15日内，向建设行政主管部门或者其他有关部门登记。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"施工单位的主要负责人、项目负责人、专职安全生产管理人员应当经劳动行政主管部门或者其他有关部门考核合格后方可任职。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"建设行政主管部门或者其他有关部门不得将施工现场的监督检查委托给建设工程安全监督机构具体实施。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"对事故报告和调查处理中的违法行为，只有涉事的单位和个人有权向安全生产监督管理部门、监察机关或者其他有关部门举报，接到举报的部门应当依法及时处理。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"道路交通事故、火灾事故自发生之日起15日内，事故造成的伤亡人数发生变化的，应当及时补报。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"根据事故的具体情况,事故调查组由有关人民政府、安全生产监督管理部门、负有安全生产监督管理职责的有关部门、监察机关、公安机关以及工会派人组成，并可以邀请人民检察院派人参加。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"《生产安全事故报告和调查处理条例》规定，拘留的行政处罚，由安全生产监督管理部门决定。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"特别重大事故以下等级事故，事故发生地与事故发生单位不在同一个县级以上行政区域的，由事故发生地人民政府负责调查，事故发生单位所在地人民政府不必派人参加。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"对因生产安全事故造成的职工死亡，一次性工亡补助金调整为按全国上一年度城镇居民人均可支配收入的30倍计算。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"生产安全事故调查组的成员通常包括人民政府、安全生产监管部门、事故发生单位的人员。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"《建筑法》的立法目的在于加强对建筑活动的监督管理，维护建筑市场秩序，保证建筑工程的质量和安全，促进建筑业的健康发展。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"发包单位将工程发包给不具有相应资质条件的承包单位的，或者违反《建筑法》规定将建筑工程肢解发包的，责令改正，处以罚款。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"在《建筑法》中，对施工单位的处罚包括:责令改正、并处罚款；责令停业整顿，降低资质等级或者吊销资质证；赔偿损失；追究刑事责任。在经济处罚方面还有没收非法所得。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"重大责任事故罪的过失可以为疏忽大意的过失，但不包括过于自信的过失。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"重大责任事故罪是指安全生产设施或者安全生产条件不符合国家规定，因而发生重大伤亡事故或者造成其他严重后果的行为。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"安全生产设施或者安全生产条件不符合国家规定，因而发生重大伤亡事故或者造成其他严重后果的，对直接负责的主管人员和其他直接责任人员，处三年以下有期徒刑或者拘役；情节特别恶劣的，处三年以上七年以下有期徒刑。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"谎报瞒报事故罪的客观方面是安全事故发生以后，负有报告职责的人员不报或谎报事故情况，贻误事故抢救，并且具有严重情节的行为。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"《施工企业安全生产管理规范》（GB50656—2011）是对建筑施工企业安全管理行为提出的最高要求，是建筑施工企业安全管理的行为规范。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"建筑施工企业应按照“纵向到底、横向到边、合理分工，互相衔接”的原则，落实各管理层与职能部门、岗位的安全生产管理责任，实施安全生产体系化管理。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"不具备安全生产教育培训条件的企业，不能委托具有相应资质的安全培训机构，对从业人员进行安全培训。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"对于各层次的管理者，除负责各自管理范围内的生产经营管理职责外，还应负责其运行范围内的安全生产管理，确保管理范围内的安全生产管理体系正常运行和安全业绩的持续改进。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"省、自治区、直辖市人民政府建设主管部门负责建筑施工企业安全生产许可证的颁发和管理，并接受国务院建设主管部门的指导和监督。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"安全生产许可证颁发管理机关应当自收到申请之日起45日内审查完毕，经审查符合《安全生产许可证条例》规定的安全生产条件的，颁发安全生产许可证。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"安全生产许可证颁发管理机关应当建立、健全安全生产许可证档案管理制度，并定期向社会公布企业取得安全生产许可证的情况。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"安全生产许可证颁发管理机关应当加强对取得安全生产许可证的企业的监督检查，发现其不再具备《安全生产许可证条例》规定的安全生产条件的，应当暂扣或者吊销安全生产许可证。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"监察机关依照《中华人民共和国行政监察法》的规定，对安全生产许可证颁发管理机关及其工作人员履行《安全生产许可证条例》规定的职责实施监察。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"负责特种设备安全监督管理的部门实施安全监督检查时，应当有三名以上特种设备安全监察人员参加，并出示有效的特种设备安全行政执法证件。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"特种设备进行改造、修理，按照规定需要变更使用登记的，可以办理变更登记，变更后可继续使用。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"用人单位制定或者修改有关职业病防治的规章制度，应当听取工会组织的意见。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"有关防治职业病的国家职业卫生标准，由国务院卫生行政部门组织制定并公布。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"用人单位应当依照法律、法规要求，严格遵守国家职业卫生标准，落实职业病预防措施，从源头上控制和消除职业病危害。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"用人单位工作场所存在职业病目录所列职业病的危害因素的，应当及时、如实地向所在地安全生产监督管理部门申报危害项目，接受监督。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"建设项目职业病危害分类管理办法由国务院安全生产监督管理部门制定。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"用人单位应当保障职业病防治所需的资金投入，不得挤占、挪用，并对因资金投人不足导致的后果承担责任。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"职业健康检查应当由省级以上人民政府卫生行政部门批准的医疗卫生机构承担。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"依法批准开工报告的建设工程，建设单位应当自开工报告批准之日起15日内，将保证安全施工的措施报送建设工程所在地的县级以上地方人民政府建设行政主管部门或者其他有关部门备案。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"重大事故逐级上报至国务院安全生产监督管理部门和负有安全生产监督管理职责的有关部门。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"环境污染事故、核设施事故、国防科研生产事故的报告和调查处理不适用《生产安全事故报告和调查处理条例》。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"事故发生单位负责人接到事故报告后，应当立即启动事故相应应急预案，或者采取有效措施，组织抢救，防止事故扩大，减少人员伤亡和财产损失。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"公路水运工程安全生产监督管理应当坚持安全第一、预防为主、综合治理的方针。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"公路水运工程安全生产监督管理实行统一监管、分级负责。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"建设工程施工企业提取的安全费用列人工程造价，在竞标时，不得删减，列人标外管理。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"项目负责人是指由企业法定代表人授权，负责公路水运工程项目施工管理的负责人，包括项目经理、项目副经理和项目总工。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"建设单位在编制工程招标文件时，应当确定公路水运工程项目安全作业环境及安全施工措施所需的安全生产费用。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"勘察单位应当对有可能引发公路水运工程安全隐患的地质灾害提出防治建议。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"为公路水运工程提供施工机械设备、设施和产品的单位，应确保配备齐全有效的保险、限位等安全装置，提供有关安全操作的说明，保证其提供的机械设备和设施等产品的质量和安全性能达到国家有关标准。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"公路水运工程安全生产监督管理部门应当建立从业单位信用档案，并将监督检查情况和处理结果及时登录在安全生产信用管理系统中。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"公路水运工程安全生产监督管理部门可委托具备国家规定资质条件的机构，对容易发生重特大生产安全事故的工程项目和危险性较大的工程施工进行安全评价及监测。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"从业单位从事公路水运工程建设活动，应当具备法律、行政法规规定的安全生产条件。任何单位和个人不得降低安全生产条件。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"矿山、房屋建筑工程、水利水电工程、电力工程、铁路工程、城市轨道交通工程安全费用提取标准均为工程造价的为2.0%。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"企业应当建立健全内部安全费用管理制度，明确安全费用提取和使用的程序、职责及权限，按规定提取和使用安全费用。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"企业提取的安全费用属于企业自提自用资金，其他单位和部门可以采取收取、代管等形式对其进行集中管理和使用。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"各级财政部门、安全生产监督管理部门、煤矿安全监察机构和有关行业主管部门依法对企业安全费用提取、使用和管理进行监督检查。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"企业年度安仝费用使用计划和上一年安全费用的提取、使用情况按照管理权限报同级财政部门、安全生产监督管理部门和行业主管部门审批。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"多选题","q":"企业安全费用的会计处理，应当符合各地企业会计制度的规定。（____）151在城市市区内的建设工程，施工单位应当对施工现场实行封闭围挡。（____）","a":"AB","o":{"A":"正确","B":"错误","C":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"作业人员有权对施工现场的作业条件、作业程序和作业方式中存在的安全问题提出批评、检举和控告，有权拒绝违章指挥和强令冒险作业。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"建设行政主管部门或者其他有关部门对建设工程是否有安全施工措施进行审查时，不得收取费用。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"省级以上人民政府建设行政主管部门和其他有关部门可以及时受理对建设工程生产安全事故及安全事故隐患的检举、控告和投诉。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"发生生产安全事故后，监理单位应当采取措施防止事故扩大，保护事故现场。需要移动现场物品时，应当做出标记和书面记录，妥善保管有关证物。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"国家对特种设备实行目录管理。特种设备目录由各地负责特种设备安全监督管理的部门制定，报国务院批准后执行。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"国家建立缺陷特种设备召回制度。因生产原因造成特种设备存在危及安全的同一性缺陷的，特种设备生产单位应当立即停止生产，经政府审批后召回。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"较大事故是指造成5人以上10人以下死亡，或者10人以上50人以下重伤，或者1000万元以上5000万元以下直接经济损失的事故。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"职工依法参加事故调查处理，有权向有关部门提出处理意见。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"重大事故逐级上报至省、自治区、直辖市人民政府安全生产监督管理部门和负有安全生产监督管理职责的有关部门。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"安全生产监督管理部门和负有安全生产监督管理职责的有关部门依照规定上报事故情况，不必同时报告本级人民政府。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"安全生产监督管理部门和负有安全生产监督管理职责的有关部门逐级上报事故情况，每级上报的时间不得超过24小时。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"所有事故发生之日起30日内，事故造成的伤亡人数发生变化的，应当及时补报。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"因抢救人员、防止事故扩大以及疏通交通等原因，需要移动事故现场物件的，应当做出标志，绘制现场简图并做出书面记录，妥善保存现场重要痕迹、物证。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"未造成人员伤亡的一般事故，县级人民政府也可以委托事故发生单位组织事故调查组进行调查。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"安全生产监督管理部门和负有安全生产监督管理职责的有关部门依照规定上报事故情况，应当同时报告本级人民政府。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"事故调查组成员应当具备事故调查所需要的知识和专长，并与所调查的事故没有直接利害关系。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"事故调查组应当自事故发生之日起60日内提交事故调查报告；特殊情况下，经负责事故调查的人民政府批准，提交事故调查报告的期限可以适当延长，但延长的期限最长不超过60日。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"事故处理的情况由负责事故调查的人民政府或者其授权的有关部门、机构向社会公布，依法应当保密的除外。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"情况紧急时，事故现场有关人员可以直接向事故发生地县级以上人民政府安全生产监督管理部门和负有安全生产监督管理职责的有关部门报告。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"根据《建设工程安全生产管理条例》，工程监理单位应当审查施工组织设计中的安全技术措施或者专项施工方案是否符合工程建设强制性标准。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"建设工程实行施工总承包的，由总承包单位对施工现场的安全生产负总责。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"分包单位应当服从总承包单位的安全生产管理，分包单位不服从管理导致生产安全事故的，由总包单位承担主要责任。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"由于监理工程师指令有误而导致施工现场停止施工的，施工单位可以就此直接向监理单位索赔。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"较大事故由设区的市级人民政府直接组织事故调查组或授权或委托有关部门调查。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"企业应当建立健全内部安全费用管理制度，明确安全费用使用和管理的程序、职责及权限，接受安全生产监督管理部门和财政部门的监督。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"企业应当为从事高空、高压、易燃、易爆、剧毒、放射性、高速运输、野外、矿井等高危作业的人员办理团体人身意外伤害保险或个人意外伤害保险。所需保险费用直接列人成本（费用），不在安全费用中列支。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"安全生产费用是指企业按照规定标准提取，在成本中列支，专门用于完善和改进企业安全生产条件的资金。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"《公路水运工程安全生产监督管理办法》所称从业单位，是指从事公路水运工程建设、勘察、设计、监理、施工、检验检测、安全评价等工作的单位。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"施工单位在工程中使用施工起重机械和整体提升式脚手架、滑模爬模、架桥机等自行式架设设施前，必须由监理单位进行验收。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"监理单位在实施监理过程中，发现存在安全事故隐患的，应.当要求施工单位整改，必要时，可下达施工暂停指令并向建设单位和有关部门报告。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"施工单位对编制的专项施工方案必须组织专家进行论证、审查。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"建设工程安全生产管理，坚持安全第一、预防为主的方针。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"国家鼓励建设工程安全生产的科学技术研究和先进技术的推广应用，推进建设工程安全生产的科学管理。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"发生生产安全事故后，施工单位应当采取措施防止事故扩大，保护事故现场。需要移动现场物品时，应当作出标记和书面记录，妥善保管有关证物。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"建设单位不得明示或者暗示施工单位购买、租赁、使用不符合安全施工要求的安全防护用具、机械设备、施工机具及配件、消防设施和器材。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"设计单位应当考虑施工安全操作和防护的需要，对涉及施工安全的重点部位和环节在设计文件中注明，并对防范生产安全事故提出指导意见。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"建设工程施工前，施工单位负责项目管理的技术人员应当对有关安全施工的技术要求向施工作业班组、作业人员作出详细说明，并由双方签字确认。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"施工单位对因建设工程施工可能造成损害的毗邻建筑物、构筑物和地下管线等，应当采取专项防护措施。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"国家对特种设备的生产、经营、使用，实施分类的、全过程的安全监督管理。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"特种设备采用新材料、新技术、新工艺，与安全技术规范的要求不一致时，由相关专业机构进行技术评审，评审结果经国务院负责特种设备安全监督管理部门批准后，方可投人生产、使用。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"特种设备安装、改造、修理的施工单位，应当在施工前将拟进行的特种设备安装、改造、修理情况书面告知直辖市或者设区的市级人民政府负责特种设备安全监督管理的部门。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"特种设备安全管理人员、检测人员和作业人员应当按照国家有关规定取得相应资格，方可从事相关工作。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"特种设备出厂时，应当随附安全技术规范要求的设计文件、产品质量合格证明、安装及使用维护保养说明、监督检验证明等相关技术资料和文件，并在特种设备显著位置设置产品铭牌、安全警示标志及其说明。（____）","a":"A","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"特种设备安装、改造、修理竣工后，安装、改造、修理的施工单位应当在验收后三十日内将相关技术资料和文件移交县级以上人民政府相关部门。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"建设单位不得对勘察、设计、施工、工程监理等单位提出不符合建设工程安全生产法律、法规和强制性标准规定的要求，合同谈判时不得压缩招标文件中的工期。（____）","a":"B","o":{"A":"正确","B":"错误"}},{"s":"法律法规及规章规范","t":"判断题","q":"施工单位违反了《安全生产法》第五十一条从业人员的拒绝权利和强令员工冒险作业的规定。（____）","a":"A","o":{"A":"正确","B":"错误"},"bg":"某公路隧道是单洞双车道形式，开挖的单圆半径R=5.6m，直立边墙高为3m，要求采用新奥法施工，进行喷锚等形式的初期支护。现有两座位于紧靠乌江一侧的高山隧道工程，1号隧道里程是K5+100〜K6+320,2号隧道里程是K6+400〜K6+750。1号隧道的进口处K5+100可以进洞施工，有工作面。1号隧道的出口处和2号隧道的进口处无法专门修建临时道路形成工作面进洞，必须从2号隧道的出口处K6+750进洞施工，打通2号隧道后，出了2号隧道的进口，再从1弓隧道的出口处K6+320进洞施工。工程开工时间为施工当年的5月15日。某国有公路工程公司中标，负责该工程的施工。公路工程公司规定在第二年的3月15","cn":1},{"s":"法律法规及规章规范","t":"判断题","q":"现场专职安全员违反了《建设工程安全管理条例》第二十三条“发现安全事故隐患，应当及时向项目负责人和安全生产管理机构报告；对违章指挥、违章操作的，应当立即制止”的规定。（____）","a":"A","o":{"A":"正确","B":"错误"},"bg":"某公路隧道是单洞双车道形式，开挖的单圆半径R=5.6m，直立边墙高为3m，要求采用新奥法施工，进 度包括（____）等环节的监察。","a":"ABC","o":{"A":"设计和制造","B":"安装和使用","C":"检验和修理","D":"登记和备案","E":"回收和报废"}},{"s":"安全生产管理","t":"多选题","q":"作业场所监督检查是安全生产监督管理的一种重要形式，作业场所监督检查的内容一般包括（____）。","a":"ABCE","o":{"A":"规章制度和操作规程","B":"安全培训和持证上岗","C":"职业危害和劳动保护","D":"党风廉政和效能监察","E":"安全管理和事故处理"}},{"s":"安全生产管理","t":"多选题","q":"下列选项中，不适用于《生产安全事故报告和调查处理条例》的有（____）。","a":"BCD","o":{"A":"甲醇泄漏事故","B":"环境污染事故","C":"国防科研生产事故","D":"核设施事故","E":"工程事故"}},{"s":"安全生产管理","t":"多选题","q":"根据《生产安全事故报告和调查处理条例》（国务院令第493号）规定，事故调查组由有关人民政府、安全生产监督管理部门、负有安全生产监督管理职责的有关部门、监察机关、公安机关以及工会派人组成。事故调查组的主要职责有（____）。","a":"ABCE","o":{"A":"查明事故发生的经过和原因","B":"认定事故的性质和事故责任","C":"提交事故调查报告","D":"对事故责任者进行处理","E":"总结事故教训，提出防范和整改措施"}},{"s":"安全生产管理","t":"多选题","q":"对企业主要负责人的初次安全生产教育培训的内容，包括（____）。","a":"ABDE","o":{"A":"国内外先进的经验","B":"职业危害及其预防措施","C":"应急管理、应急预案编制以及应急处置的内容和要求","D":"典型事故和应急救援案例分析","E":"基本知识、安全生产技术、安全生产专业知识"}},{"s":"安全生产管理","t":"多选题","q":"生产安全事故调查组由（____）的人员和有关专家组成。","a":"ABCE","o":{"A":"安全生产监督管理部门","B":"公安部门","C":"行政监察部门","D":"人事部门","E":"工会组织"}},{"s":"安全生产管理","t":"多选题","q":"国家有关法规关于事故调查的基本程序（步骤）包括（____）。","a":"ABCD","o":{"A":"事故的通报","B":"事故现场处理","C":"事故图（表）的绘制","D":"事故原因的分析","E":"事故责任人的处理"}},{"s":"安全生产管理","t":"多选题","q":"施工单位应当对以下（____）危险性较大的分部分项工程编制专项施工方案。","a":"ABDE","o":{"A":"基坑支护与降水工程","B":"土方开挖工程","C":"浇灌混凝土工程","D":"起吊工程","E":"脚手架工程"}},{"s":"安全生产管理","t":"多选题","q":"安全技术交底的主要内容包括（____）。","a":"ABDE","o":{"A":"告知施工过程中的作业危险特点、重大危险源及危害因素","B":"针对危险点和重大危险源制订具体预防措施","C":"安全生产费用的使用情况","D":"特殊工序的操作方法和相应的安全操作规程和标准要求","E":"发生安全生产事故后应该采取的自救方法、紧急避险和紧急救援措施"}},{"s":"安全生产管理","t":"多选题","q":"根据《公路水运工程安全生产监督管理办法》的规定，危险性较大、应当编制专项施工方案的工程包括（____）。","a":"ACDE","o":{"A":"滑坡和高边坡处理","B":"涵洞基础","C":"高瓦斯隧道","D":"爆破工程","E":"水下焊接"}},{"s":"安全生产管理","t":"多选题","q":"实行施工总承包的、危险性较大的工程，其专项施工方案应当由（____）审核。","a":"CD","o":{"A":"建设单位项目负责人","B":"总包单位项目经理","C":"总包单位技术负责人","D":"相关专业承包单位技术负责人","E":"安全生产监督部门"}},{"s":"安全生产管理","t":"多选题","q":"特种设备使用单位检查验收时，应要求厂家提供设备的（____）等文件。","a":"ABC","o":{"A":"安装调试及使用维修保养说明","B":"产品质量合格证明","C":"设计文件","D":"特种设备运行故障和事故记录","E":"保险购买证明"}
